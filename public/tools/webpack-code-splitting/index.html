<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Code Splitting</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
    .seg button { font-family: inherit; font-size: 0.78rem; padding: 0.45rem 0.9rem; background: var(--bg); color: var(--text-muted); border: none; border-right: 1px solid var(--border); cursor: pointer; }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--accent); color: #000; font-weight: 600; }

    .chunks { display: flex; flex-direction: column; gap: 0.5rem; }
    .chunk { border: 1px solid var(--border); border-radius: 6px; padding: 0.5rem 0.7rem; transition: all 0.25s; }
    .chunk .top { display: flex; justify-content: space-between; font-size: 0.78rem; }
    .chunk .nm { color: var(--text); }
    .chunk .sz { color: var(--text-muted); }
    .chunk .bar { height: 8px; border-radius: 4px; margin-top: 0.4rem; background: var(--surface-2); overflow: hidden; }
    .chunk .bar i { display: block; height: 100%; background: var(--blue); transition: width 0.4s; }
    .chunk.initial .bar i { background: var(--accent); }
    .chunk.vendor .bar i { background: var(--violet); }
    .chunk.lazy { opacity: 0.5; border-style: dashed; }
    .chunk.lazy.loaded { opacity: 1; border-style: solid; }
    .chunk .tag { font-size: 0.62rem; padding: 0.05rem 0.35rem; border-radius: 4px; border: 1px solid var(--border); color: var(--text-subtle); margin-left: 0.4rem; }
    .chunk.lazy .tag { border-color: var(--amber); color: var(--amber); }

    .metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; margin: 1rem 0; }
    .metric { border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; text-align: center; }
    .metric .v { font-size: 1.05rem; font-weight: 600; color: var(--accent); }
    .metric .l { font-size: 0.66rem; color: var(--text-subtle); text-transform: uppercase; }

    .routes { display: flex; gap: 0.5rem; flex-wrap: wrap; }
    .routes button { font-family: inherit; font-size: 0.76rem; padding: 0.45rem 0.8rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); cursor: pointer; }
    .routes button:hover { border-color: var(--accent); color: var(--accent); }
    .log { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.6rem; min-height: 22px; }
    .log b { color: var(--accent); }
    pre.code { font-size: 0.74rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; overflow-x: auto; line-height: 1.6; white-space: pre-wrap; margin-top: 1rem; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .f { color: var(--amber); }
  </style>
</head>
<body>
  <h1>Webpack Code Splitting</h1>
  <p class="subtitle">
    Shipping one giant bundle means users download code for pages they may never visit. Compare a monolith
    with a split build, then lazy-load routes on demand.
  </p>

  <section>
    <h2>1 · Bundle strategy</h2>
    <div class="seg" id="mode">
      <button data-v="mono" class="on">One bundle</button>
      <button data-v="split">splitChunks + lazy</button>
    </div>

    <div class="chunks" id="chunks"></div>

    <div class="metrics" id="metrics"></div>

    <h2 style="margin-top:0.5rem;">2 · Navigate (split mode lazy-loads)</h2>
    <div class="routes">
      <button data-r="home">/ home</button>
      <button data-r="dashboard">/dashboard</button>
      <button data-r="editor">/editor (heavy)</button>
      <button data-r="settings">/settings</button>
    </div>
    <div class="log" id="log">Pick a strategy, then navigate.</div>

    <pre class="code" id="code"></pre>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    let mode = 'mono';
    const loaded = new Set(['home']); // initial route always loaded

    // route chunk sizes (kb)
    const ROUTES = { home: 30, dashboard: 80, editor: 220, settings: 40 };
    const VENDOR = 130;

    function renderChunks() {
      const box = $('#chunks'); box.innerHTML = '';
      const max = mode === 'mono' ? VENDOR + Object.values(ROUTES).reduce((a, b) => a + b, 0) : VENDOR + ROUTES.editor;
      if (mode === 'mono') {
        const total = VENDOR + Object.values(ROUTES).reduce((a, b) => a + b, 0);
        addChunk(box, 'main.js', total, max, 'initial', 'everything in one file', true);
      } else {
        addChunk(box, 'runtime.js', 2, max, 'initial', 'webpack runtime', true);
        addChunk(box, 'vendors.js', VENDOR, max, 'vendor', 'node_modules (cached long-term)', true);
        addChunk(box, 'main.js (home)', ROUTES.home, max, 'initial', 'initial route', true);
        Object.entries(ROUTES).forEach(([r, kb]) => {
          if (r === 'home') return;
          addChunk(box, r + '.[hash].js', kb, max, 'lazy', 'loaded on /' + r, loaded.has(r));
        });
      }
      renderMetrics();
    }

    function addChunk(box, name, kb, max, cls, sub, on) {
      const el = document.createElement('div');
      el.className = 'chunk ' + cls + (cls === 'lazy' && on ? ' loaded' : '');
      el.innerHTML = `<div class="top"><span class="nm">${name}${cls === 'lazy' ? `<span class="tag">${on ? 'loaded' : 'not yet'}</span>` : ''}</span><span class="sz">${kb} kb</span></div>` +
        `<div class="bar"><i style="width:${Math.max(4, (kb / max) * 100)}%"></i></div>` +
        `<div style="font-size:0.66rem;color:var(--text-subtle);margin-top:0.2rem;">${sub}</div>`;
      box.appendChild(el);
    }

    function renderMetrics() {
      let initial, total;
      if (mode === 'mono') {
        initial = VENDOR + Object.values(ROUTES).reduce((a, b) => a + b, 0);
        total = initial;
      } else {
        initial = 2 + VENDOR + ROUTES.home;
        total = 2 + VENDOR + [...loaded].reduce((s, r) => s + ROUTES[r], 0);
      }
      $('#metrics').innerHTML = `
        <div class="metric"><div class="v">${initial} kb</div><div class="l">initial download (first paint)</div></div>
        <div class="metric"><div class="v">${total} kb</div><div class="l">downloaded so far</div></div>`;
    }

    function code() {
      $('#code').innerHTML = mode === 'mono'
        ? `<span class="c">// everything imported statically → one bundle</span>\n<span class="k">import</span> Dashboard <span class="k">from</span> <span class="s">"./Dashboard"</span>;\n<span class="k">import</span> Editor <span class="k">from</span> <span class="s">"./Editor"</span>;`
        : `<span class="c">// dynamic import() → its own chunk, loaded on demand</span>\n<span class="k">const</span> Editor = () => <span class="f">import</span>(\n  <span class="c">/* webpackChunkName: "editor" */</span> <span class="s">"./Editor"</span>\n);\n\n<span class="c">// webpack.config.js</span>\noptimization: {\n  <span class="k">splitChunks</span>: { chunks: <span class="s">"all"</span> },\n  <span class="k">runtimeChunk</span>: <span class="s">"single"</span>,\n}`;
    }

    $('#mode').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#mode button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on'); mode = b.dataset.v;
      loaded.clear(); loaded.add('home');
      renderChunks(); code();
      $('#log').textContent = mode === 'mono' ? 'Monolith: the whole app downloads up front.' : 'Split: only home + vendors load initially.';
    });

    $('.routes').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      const r = b.dataset.r;
      if (mode === 'mono') {
        $('#log').innerHTML = `Navigated to <b>/${r}</b> — no new download, it was all in main.js already.`;
      } else {
        if (loaded.has(r)) { $('#log').innerHTML = `<b>/${r}</b> already loaded — served from cache.`; }
        else { loaded.add(r); $('#log').innerHTML = `⬇ Lazy-loaded <b>${r}.[hash].js</b> (${ROUTES[r]} kb) on first visit to /${r}.`; }
        renderChunks();
      }
    });

    renderChunks(); code();
  </script>
</body>
</html>
