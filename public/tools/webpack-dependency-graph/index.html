<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Dependency Graph</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.86rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

    .graph { position: relative; min-height: 300px; }
    .node { position: absolute; border: 1px solid var(--border); border-radius: 8px; padding: 0.4rem 0.6rem; font-size: 0.74rem; background: var(--bg); transition: all 0.25s; white-space: nowrap; }
    .node.entry { border-color: var(--accent); color: var(--accent); }
    .node.css { border-color: var(--blue); color: var(--blue); }
    .node.json { border-color: var(--amber); color: var(--amber); }
    .node.visited { box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 28%, transparent); }
    .node.dim { opacity: 0.25; }
    svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
    svg.edges line { stroke: var(--border); stroke-width: 1.5; transition: stroke 0.25s; }
    svg.edges line.lit { stroke: var(--accent); }

    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 0.5rem; }
    .controls button { font-family: inherit; font-size: 0.78rem; padding: 0.5rem 0.9rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); cursor: pointer; }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }

    pre.code { font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; overflow-x: auto; line-height: 1.6; white-space: pre-wrap; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .f { color: var(--amber); }
    .files { font-size: 0.74rem; }
    .files .fl { padding: 0.25rem 0; color: var(--text-muted); cursor: pointer; border-bottom: 1px solid var(--border); }
    .files .fl.active { color: var(--accent); }

    .bundle { margin-top: 1rem; }
    .bundlebar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--border); }
    .bundlebar span { display: flex; align-items: center; justify-content: center; font-size: 0.66rem; color: #000; transition: flex 0.4s; overflow: hidden; }
    .log { margin-top: 0.7rem; font-size: 0.74rem; color: var(--text-muted); min-height: 22px; }
    .log b { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Webpack Dependency Graph</h1>
  <p class="subtitle">
    Webpack starts at one <b>entry</b> and follows every <code>import</code> to build a graph of modules,
    then packs them into a <b>bundle</b>. Press play to watch it walk the graph.
  </p>

  <section>
    <h2>1 · From entry to bundle</h2>
    <div class="layout">
      <div>
        <div class="graph" id="graph">
          <svg class="edges" id="edges"></svg>
        </div>
        <div class="controls">
          <button id="play">▶ Build (walk the graph)</button>
          <button id="reset">↺ Reset</button>
        </div>
        <div class="log" id="log">Click build to start at the entry.</div>
      </div>
      <div>
        <div class="files" id="files"></div>
        <pre class="code" id="code"></pre>
      </div>
    </div>

    <div class="bundle">
      <h2 style="margin-bottom:0.4rem;">2 · Output bundle (main.js)</h2>
      <div class="bundlebar" id="bundlebar"></div>
    </div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    // module graph: id, label, type, deps, position {x%, y%}, size(kb), color
    const MODS = {
      'index.js':   { label: 'index.js', type: 'entry', deps: ['app.js', 'styles.css'], x: 4, y: 40, kb: 2, color: 'var(--accent)' },
      'app.js':     { label: 'app.js', type: 'js', deps: ['math.js', 'data.json'], x: 38, y: 15, kb: 4, color: 'var(--text)' },
      'styles.css': { label: 'styles.css', type: 'css', deps: [], x: 38, y: 70, kb: 3, color: 'var(--blue)' },
      'math.js':    { label: 'math.js', type: 'js', deps: ['utils.js'], x: 70, y: 8, kb: 2, color: 'var(--text)' },
      'data.json':  { label: 'data.json', type: 'json', deps: [], x: 72, y: 40, kb: 1, color: 'var(--amber)' },
      'utils.js':   { label: 'utils.js', type: 'js', deps: [], x: 90, y: 8, kb: 1, color: 'var(--text)' },
    };
    const CODE = {
      'index.js': `<span class="c">// the single entry point</span>\n<span class="k">import</span> { start } <span class="k">from</span> <span class="s">"./app.js"</span>;\n<span class="k">import</span> <span class="s">"./styles.css"</span>;\nstart();`,
      'app.js': `<span class="k">import</span> { add } <span class="k">from</span> <span class="s">"./math.js"</span>;\n<span class="k">import</span> data <span class="k">from</span> <span class="s">"./data.json"</span>;\n<span class="k">export</span> <span class="k">function</span> <span class="f">start</span>() { /* ... */ }`,
      'styles.css': `<span class="c">/* imported like a module! */</span>\n.app { color: <span class="s">#c8ff00</span>; }`,
      'math.js': `<span class="k">import</span> { clamp } <span class="k">from</span> <span class="s">"./utils.js"</span>;\n<span class="k">export</span> <span class="k">const</span> <span class="f">add</span> = (a, b) => a + b;`,
      'data.json': `{ <span class="s">"items"</span>: [1, 2, 3] }`,
      'utils.js': `<span class="k">export</span> <span class="k">const</span> <span class="f">clamp</span> = (n) => Math.max(0, n);`,
    };

    const graph = $('#graph'), edges = $('#edges'), files = $('#files');
    const nodeEls = {};

    function build() {
      // render nodes
      Object.entries(MODS).forEach(([id, m]) => {
        const el = document.createElement('div');
        el.className = 'node ' + (m.type === 'entry' ? 'entry' : m.type === 'css' ? 'css' : m.type === 'json' ? 'json' : '');
        el.style.left = m.x + '%'; el.style.top = m.y + '%';
        el.textContent = m.label;
        el.dataset.id = id;
        graph.appendChild(el); nodeEls[id] = el;
        el.addEventListener('click', () => showCode(id));
      });
      // file list
      files.innerHTML = '';
      Object.keys(MODS).forEach((id) => {
        const f = document.createElement('div'); f.className = 'fl'; f.textContent = id; f.dataset.id = id;
        f.addEventListener('click', () => showCode(id)); files.appendChild(f);
      });
      drawEdges();
      showCode('index.js');
    }

    function center(el) {
      const g = graph.getBoundingClientRect(); const r = el.getBoundingClientRect();
      return { x: r.left - g.left + r.width / 2, y: r.top - g.top + r.height / 2 };
    }
    function drawEdges() {
      edges.innerHTML = '';
      Object.entries(MODS).forEach(([id, m]) => {
        m.deps.forEach((d) => {
          const a = center(nodeEls[id]), b = center(nodeEls[d]);
          const ln = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          ln.setAttribute('x1', a.x); ln.setAttribute('y1', a.y); ln.setAttribute('x2', b.x); ln.setAttribute('y2', b.y);
          ln.dataset.edge = id + '>' + d; edges.appendChild(ln);
        });
      });
    }

    function showCode(id) {
      $('#code').innerHTML = CODE[id] || '';
      document.querySelectorAll('.fl').forEach((f) => f.classList.toggle('active', f.dataset.id === id));
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let running = false;

    async function walk() {
      if (running) return; running = true;
      reset(true);
      const order = []; const seen = new Set();
      // BFS from entry following deps
      const queue = ['index.js'];
      while (queue.length) {
        const id = queue.shift(); if (seen.has(id)) continue; seen.add(id); order.push(id);
        MODS[id].deps.forEach((d) => queue.push(d));
      }
      const bar = $('#bundlebar'); bar.innerHTML = '';
      for (const id of order) {
        const m = MODS[id];
        nodeEls[id].classList.add('visited');
        showCode(id);
        // light edges into this node's deps
        m.deps.forEach((d) => {
          const e = edges.querySelector(`[data-edge="${id}>${d}"]`); if (e) e.classList.add('lit');
        });
        $('#log').innerHTML = `Resolving <b>${id}</b> → found ${m.deps.length} import(s): ${m.deps.join(', ') || '(none)'}`;
        // add to bundle
        const seg = document.createElement('span');
        seg.style.background = m.color; seg.style.flex = m.kb;
        seg.title = `${id} (${m.kb}kb)`; seg.textContent = id.replace(/\..*/, '');
        bar.appendChild(seg);
        await wait(750);
      }
      const total = order.reduce((s, id) => s + MODS[id].kb, 0);
      $('#log').innerHTML = `✓ Graph complete — <b>${order.length} modules</b> packed into main.js (~${total}kb).`;
      running = false;
    }

    function reset(keepNodes) {
      running = false;
      Object.values(nodeEls).forEach((el) => el.classList.remove('visited', 'dim'));
      edges.querySelectorAll('line').forEach((l) => l.classList.remove('lit'));
      $('#bundlebar').innerHTML = '';
      if (!keepNodes) $('#log').textContent = 'Click build to start at the entry.';
    }

    $('#play').addEventListener('click', walk);
    $('#reset').addEventListener('click', () => reset(false));
    window.addEventListener('resize', drawEdges);
    build();
  </script>
</body>
</html>
