<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite CSS Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.9rem; }

    .tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 1rem; flex-wrap: wrap; }
    .tabs button { flex: 1; min-width: 120px; font-family: inherit; font-size: 0.74rem; padding: 0.5rem; background: var(--bg); color: var(--text-muted); border: none; border-right: 1px solid var(--border); cursor: pointer; }
    .tabs button:last-child { border-right: none; }
    .tabs button.on { background: var(--accent); color: #000; font-weight: 600; }

    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
    .col h3 { font-size: 0.7rem; color: var(--text-subtle); text-transform: uppercase; margin-bottom: 0.4rem; }
    pre.code { font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; white-space: pre-wrap; line-height: 1.55; overflow-x: auto; min-height: 200px; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .sel { color: var(--amber); } pre.code .hash { color: var(--accent); }
    .note { font-size: 0.76rem; color: var(--text-muted); margin-top: 0.8rem; line-height: 1.7; padding: 0.7rem; background: var(--surface-2); border-radius: 6px; border: 1px solid var(--border); }
    .note b { color: var(--text); }
  </style>
</head>
<body>
  <h1>Vite CSS Pipeline</h1>
  <p class="subtitle">
    Vite understands CSS out of the box — plain, Modules, preprocessors, and query suffixes. Pick a style and
    see what you import on the left and what Vite produces on the right.
  </p>

  <section>
    <div class="tabs" id="tabs">
      <button data-t="plain" class="on">Plain CSS</button>
      <button data-t="modules">CSS Modules</button>
      <button data-t="scss">Sass / SCSS</button>
      <button data-t="inline">?inline</button>
      <button data-t="postcss">PostCSS</button>
    </div>
    <div class="grid">
      <div class="col">
        <h3>What you write / import</h3>
        <pre class="code" id="src"></pre>
      </div>
      <div class="col">
        <h3>What Vite does</h3>
        <pre class="code" id="out"></pre>
      </div>
    </div>
    <div class="note" id="note"></div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    const DATA = {
      plain: {
        src: `<span class="c">/* button.css */</span>
<span class="sel">.btn</span> { background: #c8ff00; color: #000; }

<span class="c">// component.ts — side-effect import</span>
<span class="k">import</span> <span class="s">"./button.css"</span>;`,
        out: `<span class="c">// dev: injected into a &lt;style&gt; tag, HMR-swappable</span>
<span class="c">// build: extracted to dist/assets/button-[hash].css</span>
<span class="k">&lt;link</span> rel=<span class="s">"stylesheet"</span> href=<span class="s">"/assets/button-a1b2.css"</span><span class="k">&gt;</span>

<span class="c">// the class name is GLOBAL — collisions are on you</span>
<span class="sel">.btn</span> { ... }`,
        note: 'A plain CSS <b>side-effect import</b> adds the styles to the page. Class names stay <b>global</b>. In dev styles are injected and hot-swapped; in the build they\'re extracted to a hashed <code>.css</code> file.',
      },
      modules: {
        src: `<span class="c">/* Button.module.css */</span>
<span class="sel">.btn</span> { background: #c8ff00; }

<span class="c">// Button.tsx — import the mapping object</span>
<span class="k">import</span> styles <span class="k">from</span> <span class="s">"./Button.module.css"</span>;
&lt;button className={styles.<span class="hash">btn</span>}&gt;Go&lt;/button&gt;`,
        out: `<span class="c">// class names are HASHED and scoped — no collisions</span>
<span class="sel">.btn<span class="hash">_a1b2c3</span></span> { background: #c8ff00; }

<span class="c">// styles is a JS object:</span>
{ btn: <span class="s">"btn_a1b2c3"</span> }`,
        note: 'Any <code>*.module.css</code> file becomes a <b>CSS Module</b>: class names are hashed and locally scoped, and you import a JS object mapping your names to the generated ones. Zero naming collisions, no BEM gymnastics.',
      },
      scss: {
        src: `<span class="c">/* styles.scss */</span>
$brand: #c8ff00;
<span class="sel">.card</span> {
  background: $brand;
  <span class="sel">.title</span> { font-weight: 600; }
}

<span class="k">import</span> <span class="s">"./styles.scss"</span>;`,
        out: `<span class="c">// just install the preprocessor — no config:</span>
<span class="c">//   npm i -D sass-embedded</span>

<span class="c">// Vite compiles SCSS → CSS automatically</span>
<span class="sel">.card</span> { background: #c8ff00; }
<span class="sel">.card .title</span> { font-weight: 600; }`,
        note: 'Vite has <b>built-in preprocessor support</b> — install <code>sass-embedded</code> (or <code>less</code>/<code>stylus</code>) and import <code>.scss</code> directly. No loader, no config. Combine with Modules via <code>*.module.scss</code>.',
      },
      inline: {
        src: `<span class="c">// import the CSS as a STRING, not a side effect</span>
<span class="k">import</span> css <span class="k">from</span> <span class="s">"./theme.css?inline"</span>;

shadowRoot.adoptedStyleSheets = [sheet(css)];`,
        out: `<span class="c">// css is the raw stylesheet text:</span>
<span class="k">const</span> css = <span class="s">".card { background: #c8ff00; }"</span>;

<span class="c">// NOT injected into the page automatically —</span>
<span class="c">// you decide where it goes (e.g. shadow DOM)</span>`,
        note: 'The <code>?inline</code> query returns the CSS as a <b>string</b> instead of injecting it. Perfect for Shadow DOM / web components where you need to attach styles to a specific root yourself.',
      },
      postcss: {
        src: `<span class="c">// postcss.config.js — auto-detected</span>
<span class="k">export default</span> {
  plugins: [autoprefixer(), nesting()],
};

<span class="c">/* app.css */</span>
<span class="sel">.card</span> { &amp; <span class="sel">.title</span> { color: red; } }`,
        out: `<span class="c">// Vite runs PostCSS on ALL css automatically</span>
<span class="sel">.card .title</span> { color: red; }   <span class="c">/* nesting flattened */</span>
<span class="sel">.box</span> { -webkit-user-select: none; <span class="c">/* prefixed */</span>
       user-select: none; }`,
        note: 'Drop a <code>postcss.config.js</code> and Vite runs PostCSS on every stylesheet — no extra wiring. Tailwind, autoprefixer, and nesting all work this way. (Vite also ships Lightning CSS as an opt-in transformer/minifier.)',
      },
    };

    function show(t) {
      const d = DATA[t];
      $('#src').innerHTML = d.src;
      $('#out').innerHTML = d.out;
      $('#note').innerHTML = d.note;
      document.querySelectorAll('#tabs button').forEach((b) => b.classList.toggle('on', b.dataset.t === t));
    }
    $('#tabs').addEventListener('click', (e) => { const b = e.target.closest('button'); if (b) show(b.dataset.t); });
    show('plain');
  </script>
</body>
</html>
