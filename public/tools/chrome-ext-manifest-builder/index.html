<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manifest V3 Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    .layout > * { min-width: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 960px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 1rem; align-items: start; }
    @media (max-width: 720px) { .layout { grid-template-columns: 1fr; } }

    .opt { border: 1px solid var(--border); border-radius: 8px; padding: 0.6rem 0.7rem; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.12s; }
    .opt:hover { border-color: var(--text-subtle); }
    .opt.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 8%, transparent); }
    .opt-head { display: flex; align-items: center; gap: 0.5rem; }
    .chk { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 0.7rem; }
    .opt.on .chk { background: var(--accent); border-color: var(--accent); color: #0a0a0a; }
    .opt-name { font-size: 0.85rem; font-weight: 500; }
    .opt-key { font-size: 0.72rem; color: var(--text-subtle); margin-left: auto; }
    .opt-desc { font-size: 0.74rem; color: var(--text-muted); margin-top: 0.3rem; line-height: 1.5; padding-left: 1.5rem; }

    .json { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem; font-size: 0.82rem; line-height: 1.7; overflow-x: auto; white-space: pre; min-height: 360px; }
    .json .k { color: var(--blue); } .json .s { color: var(--green); } .json .n { color: var(--amber); } .json .p { color: var(--text-subtle); }
    .warn { margin-top: 0.7rem; font-size: 0.78rem; color: var(--amber); min-height: 1em; }
  </style>
</head>
<body>
  <h1>Manifest V3 Builder</h1>
  <p class="subtitle">
    Toggle capabilities on the left and watch a valid <code>manifest.json</code> assemble on the right.
    Every line maps to something your extension can do.
  </p>

  <section>
    <div class="layout">
      <div id="opts"></div>
      <div>
        <h2>manifest.json</h2>
        <div class="json" id="json"></div>
        <p class="warn" id="warn"></p>
      </div>
    </div>
  </section>

  <script>
    (function () {
      var OPTS = [
        { id: "popup", name: "Toolbar popup", key: "action", desc: "A small HTML window opened by the toolbar icon.", locked: false, on: true },
        { id: "content", name: "Content scripts", key: "content_scripts", desc: "Inject JS/CSS into matching web pages. Needs match patterns + host_permissions.", on: true },
        { id: "bg", name: "Background service worker", key: "background", desc: "The event-driven brain. No DOM. Wakes on events.", on: true },
        { id: "options", name: "Options page", key: "options_page", desc: "A full settings page for your extension.", on: false },
        { id: "sidepanel", name: "Side panel", key: "side_panel", desc: "A persistent panel docked beside the page (Chrome 114+).", on: false },
        { id: "storage", name: "Storage permission", key: "permissions", desc: "Use chrome.storage to persist data.", on: true },
        { id: "tabs", name: "Tabs permission", key: "permissions", desc: "Read tab info (url/title needs this or activeTab).", on: false },
        { id: "scripting", name: "Scripting permission", key: "permissions", desc: "Programmatically inject code with chrome.scripting.", on: false },
        { id: "host", name: "Host permissions", key: "host_permissions", desc: "Access to specific origins (e.g. https://*.github.com/*).", on: false },
        { id: "commands", name: "Keyboard shortcut", key: "commands", desc: "Bind a global hotkey to your extension.", on: false },
        { id: "war", name: "Web-accessible resources", key: "web_accessible_resources", desc: "Expose extension files (images, scripts) to web pages.", on: false }
      ];
      var state = {};
      OPTS.forEach(function (o) { state[o.id] = o.on; });

      var optsEl = document.getElementById("opts");
      OPTS.forEach(function (o) {
        var d = document.createElement("div");
        d.className = "opt" + (state[o.id] ? " on" : "");
        d.innerHTML = '<div class="opt-head"><span class="chk">' + (state[o.id] ? "✓" : "") + '</span>' +
          '<span class="opt-name">' + o.name + '</span><span class="opt-key">' + o.key + '</span></div>' +
          '<div class="opt-desc">' + o.desc + '</div>';
        d.addEventListener("click", function () {
          state[o.id] = !state[o.id];
          d.classList.toggle("on", state[o.id]);
          d.querySelector(".chk").textContent = state[o.id] ? "✓" : "";
          render();
        });
        optsEl.appendChild(d);
      });

      function render() {
        var m = {
          manifest_version: 3,
          name: "My Extension",
          version: "1.0.0",
          description: "Built with the manifest builder"
        };
        if (state.popup) m.action = { default_popup: "popup.html", default_title: "My Extension" };
        if (state.bg) m.background = { service_worker: "background.js" };
        if (state.content) m.content_scripts = [{ matches: ["https://*/*"], js: ["content.js"], run_at: "document_idle" }];
        if (state.options) m.options_page = "options.html";
        if (state.sidepanel) m.side_panel = { default_path: "panel.html" };

        var perms = [];
        if (state.storage) perms.push("storage");
        if (state.tabs) perms.push("tabs");
        if (state.scripting) perms.push("scripting");
        if (state.sidepanel) perms.push("sidePanel");
        if (perms.length) m.permissions = perms;

        if (state.host) m.host_permissions = ["https://*.github.com/*"];
        if (state.commands) m.commands = { "toggle-feature": { suggested_key: { default: "Ctrl+Shift+Y" }, description: "Toggle the feature" } };
        if (state.war) m.web_accessible_resources = [{ resources: ["inject.js", "icon.png"], matches: ["https://*/*"] }];
        m.icons = { "16": "icons/16.png", "48": "icons/48.png", "128": "icons/128.png" };

        document.getElementById("json").innerHTML = highlight(JSON.stringify(m, null, 2));

        var warn = "";
        if (state.content && !state.host) warn = "⚠ content_scripts match https://*/* — broad scope triggers stricter store review.";
        if (state.scripting && !state.host && !state.tabs) warn = "ℹ chrome.scripting usually pairs with activeTab or host_permissions.";
        document.getElementById("warn").textContent = warn;
      }

      function highlight(s) {
        return s
          .replace(/&/g, "&amp;").replace(/</g, "&lt;")
          .replace(/"([^"]+)":/g, '<span class="k">"$1"</span>:')
          .replace(/: "([^"]*)"/g, ': <span class="s">"$1"</span>')
          .replace(/: (\d+)/g, ': <span class="n">$1</span>')
          .replace(/\[|\]|\{|\}/g, function (m) { return '<span class="p">' + m + '</span>'; });
      }

      render();
    })();
  </script>
</body>
</html>
