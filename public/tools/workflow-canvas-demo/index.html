<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workflow Canvas Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    /* Layout guard — prevent grid/flex blowout when tabs or presets expand content */
    .layout > *,
    .compose-col,
    .preview-col,
    .trees > *,
    .step-layout > *,
    .race > * {
      min-width: 0;
    }
    textarea, input, select, pre, .chat-preview, .json-out, .panel {
      max-width: 100%;
    }


    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #2a2a2a;
      --accent: #c8ff00;
      --text: #e5e5e5;
      --text-muted: #888888;
      --danger: #ef4444;
      --type-trigger: #c8ff00;
      --type-action: #60a5fa;
      --type-condition: #f59e0b;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .page {
      display: flex;
      flex-direction: column;
      height: 100%;
      min-height: 100vh;
      max-width: 1440px;
      margin-inline: auto;
    }

    .page-header {
      flex-shrink: 0;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    .page-header-info h1 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--accent);
      letter-spacing: 0.02em;
    }

    .page-header-info p {
      margin-top: 0.25rem;
      font-size: 0.9375rem;
      color: var(--text-muted);
      max-width: 42rem;
    }

    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    .toolbar-btn {
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      padding: 0.4rem 0.9375rem;
      font-size: 0.9375rem;
      font-family: inherit;
      font-weight: 500;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .toolbar-btn:hover {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 6%, var(--bg));
    }

    .toolbar-btn--danger:hover {
      border-color: var(--danger);
      background: color-mix(in srgb, var(--danger) 8%, var(--bg));
      color: var(--danger);
    }

    .toolbar-btn--active {
      border-color: var(--accent);
      background: color-mix(in srgb, var(--accent) 10%, var(--bg));
      color: var(--accent);
    }

    .toolbar-select {
      padding: 0.4rem 0.5rem;
      font-size: 0.9375rem;
      font-family: inherit;
      border: 1px solid var(--border);
      border-radius: 4px;
      background: var(--bg);
      color: var(--text);
      cursor: pointer;
    }

    .toolbar-select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .toolbar-sep {
      width: 1px;
      height: 20px;
      background: var(--border);
      margin: 0 0.25rem;
    }

    .status-bar {
      padding: 0.35rem 1.5rem;
      border-top: 1px solid var(--border);
      background: var(--surface);
      font-size: 0.875rem;
      color: var(--text-muted);
      display: flex;
      gap: 1.5rem;
      flex-shrink: 0;
    }

    #app {
      flex: 1;
      min-height: 0;
      position: relative;
      overflow: auto;
      background:
        radial-gradient(circle at 1px 1px, var(--border) 1px, transparent 0);
      background-size: 24px 24px;
      background-color: var(--bg);
    }

    .workflow-stage {
      position: relative;
      min-width: 1400px;
      min-height: 600px;
    }

    .workflow-canvas {
      position: absolute;
      top: 0;
      left: 0;
      pointer-events: none;
      z-index: 0;
    }

    .workflow-canvas.edge-interactive {
      pointer-events: auto;
      cursor: pointer;
    }

    .workflow-nodes {
      position: relative;
      z-index: 1;
      min-width: inherit;
      min-height: inherit;
    }

    .wf-node {
      position: absolute;
      width: 220px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 3px;
      border-radius: 6px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
      user-select: none;
      transition: box-shadow 0.15s;
    }

    .wf-node:hover {
      box-shadow: 0 6px 32px rgba(0, 0, 0, 0.6);
    }

    .wf-node.selected {
      box-shadow: 0 0 0 2px var(--accent), 0 6px 32px rgba(0, 0, 0, 0.6);
    }

    .wf-node[data-type="trigger"] { border-left-color: var(--type-trigger); }
    .wf-node[data-type="action"] { border-left-color: var(--type-action); }
    .wf-node[data-type="condition"] { border-left-color: var(--type-condition); }

    .wf-node-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.875rem 0.75rem;
      border-bottom: 1px solid var(--border);
      cursor: grab;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 5px 5px 0 0;
    }

    .wf-node-header:active { cursor: grabbing; }

    .wf-node-badge {
      flex-shrink: 0;
      font-size: 0.625rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 0.15em 0.45em;
      border-radius: 3px;
      border: 1px solid var(--border);
      color: var(--text-muted);
    }

    .wf-node[data-type="trigger"] .wf-node-badge {
      color: var(--type-trigger);
      border-color: color-mix(in srgb, var(--type-trigger) 35%, var(--border));
      background: color-mix(in srgb, var(--type-trigger) 8%, transparent);
    }

    .wf-node[data-type="action"] .wf-node-badge {
      color: var(--type-action);
      border-color: color-mix(in srgb, var(--type-action) 35%, var(--border));
      background: color-mix(in srgb, var(--type-action) 8%, transparent);
    }

    .wf-node[data-type="condition"] .wf-node-badge {
      color: var(--type-condition);
      border-color: color-mix(in srgb, var(--type-condition) 35%, var(--border));
      background: color-mix(in srgb, var(--type-condition) 8%, transparent);
    }

    .wf-node-title {
      flex: 1;
      font-size: 0.8125rem;
      font-weight: 600;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .wf-node-delete {
      flex-shrink: 0;
      width: 18px;
      height: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.9375rem;
      font-family: inherit;
      opacity: 0;
      transition: opacity 0.15s, color 0.15s, background 0.15s;
    }

    .wf-node:hover .wf-node-delete {
      opacity: 1;
    }

    .wf-node-delete:hover {
      color: var(--danger);
      background: color-mix(in srgb, var(--danger) 12%, transparent);
    }

    .wf-node-body {
      padding: 0.7rem 0.75rem 0.875rem;
    }

    .wf-node-field {
      display: flex;
      gap: 0.35rem;
      font-size: 0.6875rem;
      padding: 0.2rem 0;
      line-height: 1.4;
    }

    .wf-node-field-label {
      flex-shrink: 0;
      color: var(--text-muted);
    }

    .wf-node-field-label::after { content: ":"; }

    .wf-node-field-value {
      color: var(--text);
      word-break: break-all;
    }

    .wf-node-port {
      position: absolute;
      top: 50%;
      width: 10px;
      height: 10px;
      margin-top: -5px;
      border-radius: 50%;
      background: var(--bg);
      border: 2px solid var(--border);
      cursor: crosshair;
      transition: transform 0.1s, border-color 0.1s;
      z-index: 2;
    }

    .wf-node-port:hover {
      transform: scale(1.4);
      border-color: var(--accent);
    }

    .wf-node-port-out { right: -6px; }
    .wf-node-port-in { left: -6px; }

    .wf-node[data-type="trigger"] .wf-node-port-out { border-color: var(--type-trigger); }
    .wf-node[data-type="action"] .wf-node-port-out,
    .wf-node[data-type="action"] .wf-node-port-in { border-color: var(--type-action); }
    .wf-node[data-type="condition"] .wf-node-port-out,
    .wf-node[data-type="condition"] .wf-node-port-in { border-color: var(--type-condition); }
    .wf-node[data-type="trigger"] .wf-node-port-in { display: none; }

    .connecting-hint {
      position: fixed;
      bottom: 4rem;
      left: 50%;
      transform: translateX(-50%);
      padding: 0.7rem 1rem;
      background: var(--surface);
      border: 1px solid var(--accent);
      border-radius: 6px;
      font-size: 0.9375rem;
      color: var(--accent);
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .connecting-hint.visible { opacity: 1; }
  </style>
</head>
<body>
  <div class="page">
    <header class="page-header">
      <div class="page-header-info">
        <h1>Workflow Canvas Demo</h1>
        <p>Drag headers to move nodes. Drag from output port (right) to input port (left) to connect. Hover edge + click to delete it.</p>
      </div>
      <div class="toolbar">
        <select class="toolbar-select" id="node-type-select">
          <option value="trigger">Trigger</option>
          <option value="action" selected>Action</option>
          <option value="condition">Condition</option>
        </select>
        <button class="toolbar-btn" id="add-node-btn">+ Add Node</button>
        <div class="toolbar-sep"></div>
        <button class="toolbar-btn toolbar-btn--danger" id="clear-btn">Clear All</button>
      </div>
    </header>
    <div id="app"></div>
    <div class="status-bar">
      <span id="status-nodes">Nodes: 0</span>
      <span id="status-edges">Edges: 0</span>
      <span id="status-hint">Tip: Drag from ● output to ● input to connect</span>
    </div>
  </div>
  <div class="connecting-hint" id="connect-hint">Release on an input port to connect</div>

  <script>
    const NODE_TYPES = ["trigger", "action", "condition"];
    const TYPE_COLORS = {
      trigger: "#c8ff00",
      action: "#60a5fa",
      condition: "#f59e0b",
    };

    const DEFAULT_TITLES = {
      trigger: ["Webhook Trigger", "Cron Schedule", "File Watcher", "Event Listener", "API Poll"],
      action: ["Transform Data", "HTTP Request", "Send Email", "Write DB", "Log Event", "Notify Slack"],
      condition: ["Check Amount", "If Empty", "Rate Limit", "Auth Check", "Feature Flag"],
    };

    let nodeCounter = 0;

    function createWorkflow(selector) {
      const container = document.querySelector(selector);
      if (!container) throw new Error(`Container not found: "${selector}"`);

      const nodes = new Map();
      const edges = [];

      const stage = document.createElement("div");
      stage.className = "workflow-stage";

      const canvas = document.createElement("canvas");
      canvas.className = "workflow-canvas";

      const nodesLayer = document.createElement("div");
      nodesLayer.className = "workflow-nodes";

      stage.appendChild(canvas);
      stage.appendChild(nodesLayer);
      container.appendChild(stage);

      const drag = { active: false, nodeId: null, offsetX: 0, offsetY: 0 };
      const connecting = { active: false, fromId: null, startX: 0, startY: 0, currentX: 0, currentY: 0 };
      let hoveredEdgeIdx = -1;
      let rafId = 0;

      function scheduleDraw() {
        if (rafId) return;
        rafId = requestAnimationFrame(() => {
          rafId = 0;
          updateStageBounds();
          resizeCanvas();
          drawEdges();
          updateStatus();
        });
      }

      function updateStatus() {
        document.getElementById("status-nodes").textContent = `Nodes: ${nodes.size}`;
        document.getElementById("status-edges").textContent = `Edges: ${edges.length}`;
      }

      function updateStageBounds() {
        let maxRight = 1400;
        let maxBottom = 600;
        for (const node of nodes.values()) {
          const w = node.el.offsetWidth;
          const h = node.el.offsetHeight;
          maxRight = Math.max(maxRight, node.x + w + 100);
          maxBottom = Math.max(maxBottom, node.y + h + 100);
        }
        stage.style.minWidth = maxRight + "px";
        stage.style.minHeight = maxBottom + "px";
      }

      function resizeCanvas() {
        const width = stage.scrollWidth;
        const height = stage.scrollHeight;
        const dpr = window.devicePixelRatio || 1;

        canvas.width = Math.ceil(width * dpr);
        canvas.height = Math.ceil(height * dpr);
        canvas.style.width = width + "px";
        canvas.style.height = height + "px";

        const ctx = canvas.getContext("2d");
        if (ctx) ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      }

      function getNodeRect(id) {
        const node = nodes.get(id);
        if (!node) return null;
        return { x: node.x, y: node.y, w: node.el.offsetWidth, h: node.el.offsetHeight };
      }

      function getEdgePath(edge) {
        const from = getNodeRect(edge.from);
        const to = getNodeRect(edge.to);
        if (!from || !to) return null;

        const x1 = from.x + from.w;
        const y1 = from.y + from.h / 2;
        const x2 = to.x;
        const y2 = to.y + to.h / 2;
        const dx = Math.max(Math.abs(x2 - x1) * 0.5, 60);

        return { x1, y1, x2, y2, cp1x: x1 + dx, cp1y: y1, cp2x: x2 - dx, cp2y: y2 };
      }

      function drawEdges() {
        const ctx = canvas.getContext("2d");
        if (!ctx) return;

        const width = stage.scrollWidth;
        const height = stage.scrollHeight;
        ctx.clearRect(0, 0, width, height);

        for (let i = 0; i < edges.length; i++) {
          const edge = edges[i];
          const path = getEdgePath(edge);
          if (!path) continue;

          const fromNode = nodes.get(edge.from);
          const type = fromNode?.type ?? "action";
          const color = TYPE_COLORS[type] ?? "#888888";
          const isHovered = i === hoveredEdgeIdx;

          ctx.beginPath();
          ctx.moveTo(path.x1, path.y1);
          ctx.bezierCurveTo(path.cp1x, path.cp1y, path.cp2x, path.cp2y, path.x2, path.y2);
          ctx.strokeStyle = isHovered ? "#ef4444" : color;
          ctx.lineWidth = isHovered ? 3 : 2;
          ctx.globalAlpha = isHovered ? 1 : 0.75;
          ctx.stroke();
          ctx.globalAlpha = 1;

          const angle = Math.atan2(path.y2 - path.cp2y, path.x2 - path.cp2x);
          const arrowLen = isHovered ? 10 : 8;
          ctx.beginPath();
          ctx.moveTo(path.x2, path.y2);
          ctx.lineTo(path.x2 - arrowLen * Math.cos(angle - Math.PI / 6), path.y2 - arrowLen * Math.sin(angle - Math.PI / 6));
          ctx.lineTo(path.x2 - arrowLen * Math.cos(angle + Math.PI / 6), path.y2 - arrowLen * Math.sin(angle + Math.PI / 6));
          ctx.closePath();
          ctx.fillStyle = isHovered ? "#ef4444" : color;
          ctx.globalAlpha = isHovered ? 1 : 0.75;
          ctx.fill();
          ctx.globalAlpha = 1;
        }

        if (connecting.active) {
          ctx.beginPath();
          ctx.setLineDash([6, 4]);
          ctx.moveTo(connecting.startX, connecting.startY);
          const dx = Math.max(Math.abs(connecting.currentX - connecting.startX) * 0.5, 40);
          ctx.bezierCurveTo(
            connecting.startX + dx, connecting.startY,
            connecting.currentX - dx, connecting.currentY,
            connecting.currentX, connecting.currentY
          );
          ctx.strokeStyle = var_accent;
          ctx.lineWidth = 2;
          ctx.globalAlpha = 0.6;
          ctx.stroke();
          ctx.setLineDash([]);
          ctx.globalAlpha = 1;
        }
      }

      const var_accent = "#c8ff00";

      function setNodePosition(id, x, y) {
        const node = nodes.get(id);
        if (!node) return;
        node.x = x;
        node.y = y;
        node.el.style.left = x + "px";
        node.el.style.top = y + "px";
        scheduleDraw();
      }

      function onMouseMove(e) {
        if (!drag.active || !drag.nodeId) return;
        const stageRect = stage.getBoundingClientRect();
        const x = e.clientX - stageRect.left + container.scrollLeft - drag.offsetX;
        const y = e.clientY - stageRect.top + container.scrollTop - drag.offsetY;
        setNodePosition(drag.nodeId, Math.max(0, x), Math.max(0, y));
      }

      function onMouseUp() {
        drag.active = false;
        drag.nodeId = null;
        document.removeEventListener("mousemove", onMouseMove);
        document.removeEventListener("mouseup", onMouseUp);
      }

      function distanceToBezier(px, py, path, steps = 40) {
        let minDist = Infinity;
        for (let i = 0; i <= steps; i++) {
          const t = i / steps;
          const t2 = t * t;
          const t3 = t2 * t;
          const mt = 1 - t;
          const mt2 = mt * mt;
          const mt3 = mt2 * mt;
          const x = mt3 * path.x1 + 3 * mt2 * t * path.cp1x + 3 * mt * t2 * path.cp2x + t3 * path.x2;
          const y = mt3 * path.y1 + 3 * mt2 * t * path.cp1y + 3 * mt * t2 * path.cp2y + t3 * path.y2;
          const dx = px - x;
          const dy = py - y;
          minDist = Math.min(minDist, Math.sqrt(dx * dx + dy * dy));
        }
        return minDist;
      }

      function onCanvasMouseMove(e) {
        const rect = canvas.getBoundingClientRect();
        const x = e.clientX - rect.left;
        const y = e.clientY - rect.top;

        let found = -1;
        for (let i = 0; i < edges.length; i++) {
          const path = getEdgePath(edges[i]);
          if (!path) continue;
          if (distanceToBezier(x, y, path) < 8) {
            found = i;
            break;
          }
        }

        if (found !== hoveredEdgeIdx) {
          hoveredEdgeIdx = found;
          canvas.style.cursor = found >= 0 ? "pointer" : "";
          scheduleDraw();
        }
      }

      function onCanvasClick(e) {
        if (hoveredEdgeIdx >= 0 && hoveredEdgeIdx < edges.length) {
          edges.splice(hoveredEdgeIdx, 1);
          hoveredEdgeIdx = -1;
          canvas.style.cursor = "";
          scheduleDraw();
        }
      }

      canvas.classList.add("edge-interactive");
      canvas.addEventListener("mousemove", onCanvasMouseMove);
      canvas.addEventListener("click", onCanvasClick);

      function onConnectMove(e) {
        if (!connecting.active) return;
        const stageRect = stage.getBoundingClientRect();
        connecting.currentX = e.clientX - stageRect.left + container.scrollLeft;
        connecting.currentY = e.clientY - stageRect.top + container.scrollTop;
        scheduleDraw();
      }

      function onConnectUp(e) {
        if (!connecting.active) return;
        const target = e.target;
        if (target && target.classList.contains("wf-node-port-in")) {
          const targetNode = target.closest(".wf-node");
          if (targetNode) {
            const toId = targetNode.dataset.id;
            const fromId = connecting.fromId;
            if (fromId && toId && fromId !== toId) {
              const alreadyExists = edges.some(edge => edge.from === fromId && edge.to === toId);
              if (!alreadyExists) {
                edges.push({ from: fromId, to: toId });
              }
            }
          }
        }
        connecting.active = false;
        connecting.fromId = null;
        document.getElementById("connect-hint").classList.remove("visible");
        document.removeEventListener("mousemove", onConnectMove);
        document.removeEventListener("mouseup", onConnectUp);
        scheduleDraw();
      }

      function addNode(input) {
        if (nodes.has(input.id)) throw new Error(`Duplicate id "${input.id}"`);
        if (!NODE_TYPES.includes(input.type)) throw new Error(`Unknown type "${input.type}"`);

        const el = document.createElement("div");
        el.className = "wf-node";
        el.dataset.type = input.type;
        el.dataset.id = input.id;
        el.style.left = input.x + "px";
        el.style.top = input.y + "px";

        const header = document.createElement("div");
        header.className = "wf-node-header";

        const badge = document.createElement("span");
        badge.className = "wf-node-badge";
        badge.textContent = input.type;

        const title = document.createElement("span");
        title.className = "wf-node-title";
        title.textContent = input.title;

        const deleteBtn = document.createElement("button");
        deleteBtn.className = "wf-node-delete";
        deleteBtn.textContent = "✕";
        deleteBtn.title = "Delete node";
        deleteBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          removeNode(input.id);
        });

        header.appendChild(badge);
        header.appendChild(title);
        header.appendChild(deleteBtn);

        const body = document.createElement("div");
        body.className = "wf-node-body";

        for (const field of input.fields ?? []) {
          const row = document.createElement("div");
          row.className = "wf-node-field";

          const label = document.createElement("span");
          label.className = "wf-node-field-label";
          label.textContent = field.label;

          const value = document.createElement("span");
          value.className = "wf-node-field-value";
          value.textContent = field.value;

          row.appendChild(label);
          row.appendChild(value);
          body.appendChild(row);
        }

        const portIn = document.createElement("span");
        portIn.className = "wf-node-port wf-node-port-in";

        const portOut = document.createElement("span");
        portOut.className = "wf-node-port wf-node-port-out";

        el.appendChild(header);
        el.appendChild(body);
        el.appendChild(portIn);
        el.appendChild(portOut);

        header.addEventListener("mousedown", (e) => {
          if (e.target === deleteBtn) return;
          if (e.button !== 0) return;
          e.preventDefault();
          const node = nodes.get(input.id);
          if (!node) return;
          drag.active = true;
          drag.nodeId = input.id;
          const stageRect = stage.getBoundingClientRect();
          drag.offsetX = e.clientX - stageRect.left + container.scrollLeft - node.x;
          drag.offsetY = e.clientY - stageRect.top + container.scrollTop - node.y;
          document.addEventListener("mousemove", onMouseMove);
          document.addEventListener("mouseup", onMouseUp);
        });

        portOut.addEventListener("mousedown", (e) => {
          e.preventDefault();
          e.stopPropagation();
          const node = nodes.get(input.id);
          if (!node) return;
          const stageRect = stage.getBoundingClientRect();
          connecting.active = true;
          connecting.fromId = input.id;
          connecting.startX = node.x + el.offsetWidth;
          connecting.startY = node.y + el.offsetHeight / 2;
          connecting.currentX = e.clientX - stageRect.left + container.scrollLeft;
          connecting.currentY = e.clientY - stageRect.top + container.scrollTop;
          document.getElementById("connect-hint").classList.add("visible");
          document.addEventListener("mousemove", onConnectMove);
          document.addEventListener("mouseup", onConnectUp);
        });

        nodesLayer.appendChild(el);
        nodes.set(input.id, { ...input, el });
        scheduleDraw();
      }

      function removeNode(id) {
        const node = nodes.get(id);
        if (!node) return;
        node.el.remove();
        nodes.delete(id);
        for (let i = edges.length - 1; i >= 0; i--) {
          if (edges[i].from === id || edges[i].to === id) {
            edges.splice(i, 1);
          }
        }
        scheduleDraw();
      }

      function connect(fromId, toId) {
        if (!nodes.has(fromId)) throw new Error(`Source "${fromId}" not found`);
        if (!nodes.has(toId)) throw new Error(`Target "${toId}" not found`);
        const exists = edges.some(e => e.from === fromId && e.to === toId);
        if (!exists) edges.push({ from: fromId, to: toId });
      }

      function clearAll() {
        for (const node of nodes.values()) {
          node.el.remove();
        }
        nodes.clear();
        edges.length = 0;
        scheduleDraw();
      }

      function render() {
        updateStageBounds();
        resizeCanvas();
        drawEdges();
        updateStatus();
      }

      const resizeObserver = new ResizeObserver(() => scheduleDraw());
      resizeObserver.observe(stage);
      window.addEventListener("resize", () => scheduleDraw());

      return { addNode, removeNode, connect, clearAll, render, nodes, edges };
    }

    // --- Init ---
    const workflow = createWorkflow("#app");

    workflow.addNode({
      id: "start",
      type: "trigger",
      title: "Webhook Trigger",
      x: 100,
      y: 120,
      fields: [
        { label: "Method", value: "POST" },
        { label: "Path", value: "/api/order" },
      ],
    });

    workflow.addNode({
      id: "transform",
      type: "action",
      title: "Transform Data",
      x: 420,
      y: 160,
      fields: [{ label: "Input", value: "order.payload" }],
    });

    workflow.addNode({
      id: "condition",
      type: "condition",
      title: "Check Amount",
      x: 740,
      y: 100,
      fields: [{ label: "If", value: "amount > 1000" }],
    });

    workflow.addNode({
      id: "email",
      type: "action",
      title: "Send Email",
      x: 1060,
      y: 200,
      fields: [
        { label: "To", value: "admin@company.com" },
        { label: "Template", value: "high-value-order" },
      ],
    });

    workflow.connect("start", "transform");
    workflow.connect("transform", "condition");
    workflow.connect("condition", "email");
    workflow.render();

    // --- Toolbar handlers ---
    document.getElementById("add-node-btn").addEventListener("click", () => {
      const type = document.getElementById("node-type-select").value;
      nodeCounter++;
      const id = `node_${Date.now()}_${nodeCounter}`;
      const titles = DEFAULT_TITLES[type] || ["New Node"];
      const title = titles[Math.floor(Math.random() * titles.length)];

      const container = document.getElementById("app");
      const scrollLeft = container.scrollLeft;
      const scrollTop = container.scrollTop;
      const viewW = container.clientWidth;
      const viewH = container.clientHeight;

      const x = scrollLeft + Math.floor(Math.random() * (viewW - 280)) + 40;
      const y = scrollTop + Math.floor(Math.random() * (viewH - 160)) + 40;

      workflow.addNode({
        id,
        type,
        title,
        x: Math.max(20, x),
        y: Math.max(20, y),
        fields: [{ label: "Status", value: "new" }],
      });
    });

    document.getElementById("clear-btn").addEventListener("click", () => {
      if (confirm("Clear all nodes and edges?")) {
        workflow.clearAll();
      }
    });
  </script>
</body>
</html>
