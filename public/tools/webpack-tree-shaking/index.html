<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Tree Shaking</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .opts { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; align-items: center; }
    .check { display: flex; align-items: center; gap: 0.4rem; font-size: 0.78rem; cursor: pointer; }
    .check input { accent-color: var(--accent); }
    .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .seg button { font-family: inherit; font-size: 0.74rem; padding: 0.4rem 0.7rem; background: var(--bg); color: var(--text-muted); border: none; border-right: 1px solid var(--border); cursor: pointer; }
    .seg button:last-child { border-right: none; }
    .seg button.on { background: var(--accent); color: #000; font-weight: 600; }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    pre.code { font-size: 0.74rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; line-height: 1.7; white-space: pre-wrap; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .f { color: var(--amber); }

    .exp { padding: 0.4rem 0.6rem; border-radius: 5px; margin-bottom: 0.4rem; font-size: 0.78rem; display: flex; justify-content: space-between; transition: all 0.2s; }
    .exp.keep { border: 1px solid var(--green); color: var(--green); }
    .exp.shake { border: 1px solid var(--border); color: var(--text-subtle); text-decoration: line-through; opacity: 0.6; }
    .exp .why { font-size: 0.64rem; }

    .metric { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; margin-top: 1rem; }
    @media (max-width: 600px) { .metric { grid-template-columns: 1fr; } }
    .m { border: 1px solid var(--border); border-radius: 6px; padding: 0.6rem; text-align: center; }
    .m .v { font-size: 1.05rem; font-weight: 600; }
    .m .v.good { color: var(--green); } .m .v.bad { color: var(--red); }
    .m .l { font-size: 0.64rem; color: var(--text-subtle); text-transform: uppercase; }
    .banner { font-size: 0.74rem; padding: 0.5rem 0.7rem; border-radius: 6px; margin-top: 0.8rem; }
    .banner.warn { border: 1px solid var(--amber); color: var(--amber); }
    .banner.ok { border: 1px solid var(--green); color: var(--green); }
  </style>
</head>
<body>
  <h1>Webpack Tree Shaking</h1>
  <p class="subtitle">
    Tree shaking drops exports you never import — but only under the right conditions. Toggle them and watch
    which of a utility library's exports survive into the bundle.
  </p>

  <section>
    <h2>1 · Conditions</h2>
    <div class="opts">
      <div class="seg" id="mode">
        <button data-v="prod" class="on">mode: production</button>
        <button data-v="dev">mode: development</button>
      </div>
      <div class="seg" id="fmt">
        <button data-v="esm" class="on">ES modules (import)</button>
        <button data-v="cjs">CommonJS (require)</button>
      </div>
      <label class="check"><input type="checkbox" id="sideeffects" checked /> "sideEffects": false in package.json</label>
    </div>

    <div class="layout">
      <div>
        <h2>your import</h2>
        <pre class="code" id="usercode"></pre>
        <h2 style="margin-top:0.8rem;">utils.js exports</h2>
        <div id="exports"></div>
      </div>
      <div>
        <h2>final bundle</h2>
        <pre class="code" id="bundle"></pre>
        <div class="metric" id="metric"></div>
        <div id="banner"></div>
      </div>
    </div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    // utils library: each export with a size; "used" = imported by app
    const EXPORTS = [
      { n: 'add', kb: 1, used: true },
      { n: 'subtract', kb: 1, used: false },
      { n: 'multiply', kb: 1, used: false },
      { n: 'formatDate', kb: 6, used: true },
      { n: 'parseCSV', kb: 12, used: false },
      { n: 'deepClone', kb: 4, used: false },
    ];
    const state = { mode: 'prod', fmt: 'esm', sideeffects: true };

    function shakeable() {
      // tree shaking requires ESM + production. sideEffects helps drop whole modules.
      return state.fmt === 'esm' && state.mode === 'prod';
    }

    function render() {
      const shakes = shakeable();
      $('#usercode').innerHTML = state.fmt === 'esm'
        ? `<span class="k">import</span> { add, formatDate } <span class="k">from</span> <span class="s">"./utils"</span>;`
        : `<span class="k">const</span> { add, formatDate } = <span class="k">require</span>(<span class="s">"./utils"</span>);`;

      const box = $('#exports'); box.innerHTML = '';
      let kept = 0, kbKept = 0, kbTotal = 0;
      EXPORTS.forEach((e) => {
        kbTotal += e.kb;
        const survive = e.used || !shakes; // if not shakeable, everything stays
        if (survive) { kept++; kbKept += e.kb; }
        const el = document.createElement('div');
        el.className = 'exp ' + (survive ? 'keep' : 'shake');
        const why = survive
          ? (e.used ? 'imported ✓' : 'kept (not shakeable)')
          : 'unused → shaken out';
        el.innerHTML = `<span>export ${e.n} <span style="color:var(--text-subtle)">(${e.kb}kb)</span></span><span class="why">${why}</span>`;
        box.appendChild(el);
      });

      // bundle preview
      const survivors = EXPORTS.filter((e) => e.used || !shakes).map((e) => e.n);
      $('#bundle').innerHTML = survivors.map((n) => `<span class="f">${n}</span>`).join('\n') + `\n<span class="c">// ${kept} of ${EXPORTS.length} exports</span>`;

      $('#metric').innerHTML = `
        <div class="m"><div class="v ${kept < EXPORTS.length ? 'good' : 'bad'}">${kept}/${EXPORTS.length}</div><div class="l">exports kept</div></div>
        <div class="m"><div class="v ${kbKept < kbTotal ? 'good' : 'bad'}">${kbKept}kb</div><div class="l">bundle size</div></div>
        <div class="m"><div class="v">${kbTotal - kbKept}kb</div><div class="l">shaken out</div></div>`;

      // banner explaining why
      const b = $('#banner');
      if (state.fmt === 'cjs') {
        b.className = 'banner warn'; b.textContent = '⚠ CommonJS require() is dynamic — Webpack cannot statically tell what is unused, so nothing is shaken.';
      } else if (state.mode === 'dev') {
        b.className = 'banner warn'; b.textContent = '⚠ Tree shaking only removes dead code in production mode (minimizer drops the marked exports).';
      } else if (!state.sideeffects) {
        b.className = 'banner warn'; b.textContent = 'ℹ Exports shaken, but without "sideEffects": false Webpack may keep whole modules that look like they have side effects.';
      } else {
        b.className = 'banner ok'; b.textContent = '✓ ESM + production + "sideEffects": false → maximum tree shaking.';
      }
    }

    $('#mode').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#mode button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); state.mode = b.dataset.v; render(); });
    $('#fmt').addEventListener('click', (e) => { const b = e.target.closest('button'); if (!b) return; document.querySelectorAll('#fmt button').forEach((x) => x.classList.remove('on')); b.classList.add('on'); state.fmt = b.dataset.v; render(); });
    $('#sideeffects').addEventListener('change', (e) => { state.sideeffects = e.target.checked; render(); });

    render();
  </script>
</body>
</html>
