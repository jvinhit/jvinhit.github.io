<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Tailwind v4 — Utility Class & Design Token Reference</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #f8f8f6;
    --surface: #ffffff;
    --surface2: #f3f3f0;
    --text: #1a1a18;
    --text2: #6b6b66;
    --text3: #9b9b95;
    --border: rgba(0,0,0,0.10);
    --border2: rgba(0,0,0,0.18);
    --radius: 8px;
    --radius-lg: 12px;
    --mono: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141412;
      --surface: #1e1e1c;
      --surface2: #2a2a27;
      --text: #f0f0ec;
      --text2: #a0a09a;
      --text3: #606058;
      --border: rgba(255,255,255,0.09);
      --border2: rgba(255,255,255,0.16);
    }
  }

  body {
    font-family: var(--sans);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  header {
    padding: 2rem 2rem 1.5rem;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }
  header h1 { font-size: 20px; font-weight: 600; margin-bottom: 4px; }
  header p { font-size: 13px; color: var(--text2); }

  .layout { display: flex; height: calc(100vh - 85px); }

  nav {
    width: 210px;
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    overflow-y: auto;
    padding: 12px 8px;
  }
  nav button {
    display: flex; align-items: center; gap: 8px;
    width: 100%; padding: 7px 10px;
    border: none; background: none; cursor: pointer;
    border-radius: var(--radius); font-size: 13px;
    color: var(--text2); text-align: left;
    transition: all 0.12s;
  }
  nav button:hover { background: var(--surface2); color: var(--text); }
  nav button.active { background: var(--text); color: var(--bg); }
  nav button .dot {
    width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
  }

  main {
    flex: 1; overflow-y: auto;
    padding: 1.5rem 2rem;
  }

  .section { display: none; }
  .section.active { display: block; }

  .section-head {
    margin-bottom: 1.5rem;
    padding-bottom: 1rem;
    border-bottom: 1px solid var(--border);
  }
  .section-head h2 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
  .section-head p { font-size: 13px; color: var(--text2); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 12px;
    margin-bottom: 1rem;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 14px 16px;
  }
  .card-title {
    font-size: 11px; font-weight: 600; letter-spacing: 0.06em;
    text-transform: uppercase; color: var(--text3); margin-bottom: 8px;
  }
  .code {
    font-family: var(--mono); font-size: 12px;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 10px 12px;
    margin-bottom: 8px;
    white-space: pre; overflow-x: auto;
    line-height: 1.8; color: var(--text);
  }
  .note { font-size: 12px; color: var(--text2); line-height: 1.5; }

  .tip {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-left: 3px solid #3b82f6;
    border-radius: var(--radius);
    padding: 10px 14px;
    font-size: 12px; color: #1e40af;
    margin-top: 12px; line-height: 1.5;
  }
  @media (prefers-color-scheme: dark) {
    .tip { background: #0f1f3d; border-color: #1e3a6e; border-left-color: #3b82f6; color: #93c5fd; }
  }

  @media (max-width: 760px) {
    header { padding: 1.25rem 1rem 1rem; }
    header h1 { font-size: 18px; }
    .layout {
      display: block;
      height: auto;
      min-height: calc(100vh - 96px);
    }
    nav {
      position: sticky;
      top: 0;
      z-index: 10;
      width: 100%;
      display: flex;
      gap: 6px;
      overflow-x: auto;
      border-right: 0;
      border-bottom: 1px solid var(--border);
      padding: 8px;
    }
    nav button {
      width: auto;
      flex: 0 0 auto;
      white-space: nowrap;
    }
    main {
      overflow: visible;
      padding: 1rem;
    }
    .grid {
      grid-template-columns: 1fr;
    }
    .code {
      font-size: 11px;
    }
  }
</style>
</head>
<body>

<header>
  <h1>Tailwind CSS v4 — Utility Class & Design Token Reference</h1>
  <p>13 sections utility class · 1 section Design Tokens (@theme) đầy đủ · Click section bên trái để xem</p>
</header>

<div class="layout">
<nav id="nav"></nav>
<main id="main"></main>
</div>

const navEl = document.getElementById('nav');
const mainEl = document.getElementById('main');

sections.forEach((s, i) => {
  const btn = document.createElement('button');
  btn.className = i === 0 ? 'active' : '';
  btn.innerHTML = `<span class="dot" style="background:${s.color}"></span>${s.label}`;
  btn.dataset.id = s.id;
  navEl.appendChild(btn);

  const sec = document.createElement('div');
  sec.className = 'section' + (i === 0 ? ' active' : '');
  sec.id = 'sec-' + s.id;

  const cardsHtml = s.cards.map(c => `
    <div class="card">
      <div class="card-title">${c.title}</div>
      <div class="code">${escHtml(c.code)}</div>
      <div class="note">${c.note}</div>
    </div>`).join('');

  sec.innerHTML = `
    <div class="section-head">
      <h2>${s.label}</h2>
      <p>${s.desc}</p>
    </div>
    <div class="grid" style="${s.id === 'design-tokens' ? 'grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));' : ''}">${cardsHtml}</div>
    <div class="tip">${s.tip}</div>
  `;
  mainEl.appendChild(sec);
});

navEl.addEventListener('click', e => {
  const btn = e.target.closest('button');
  if (!btn) return;
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('sec-' + btn.dataset.id).classList.add('active');
});

function escHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
