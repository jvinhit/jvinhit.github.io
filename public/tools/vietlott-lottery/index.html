<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vietlott Mega Draw — 6/45 & 6/55</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
  :root{
    --bg-0:#0a0608;
    --bg-1:#13090c;
    --bg-2:#1a0d10;
    --gold-1:#f9e7a1;
    --gold-2:#d4a72c;
    --gold-3:#8a5a14;
    --red:#9b1c2c;
    --red-deep:#5a0a14;
    --cream:#f4e6c8;
    --ink:#1a0d10;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{
    height:100%;
    font-family:'Cormorant Garamond',serif;
    color:var(--cream);
    background:
      radial-gradient(ellipse at 50% -10%, rgba(212,167,44,0.15), transparent 55%),
      radial-gradient(ellipse at 50% 110%, rgba(155,28,44,0.18), transparent 50%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1) 50%, var(--bg-0));
    background-attachment:fixed;
    min-height:100vh;
    overflow-x:hidden;
  }
  body::before{
    content:"";
    position:fixed;inset:0;
    background-image:
      repeating-linear-gradient(45deg, rgba(255,255,255,0.012) 0 2px, transparent 2px 5px);
    pointer-events:none;
    z-index:0;
  }
  .frame{
    max-width:1180px;
    margin:0 auto;
    padding:36px 28px 60px;
    position:relative;
    z-index:1;
  }
  /* header */
  header{
    text-align:center;
    margin-bottom:26px;
    position:relative;
  }
  .ornament{
    display:flex;align-items:center;justify-content:center;gap:18px;
    color:var(--gold-2);
    font-size:14px;
    letter-spacing:.5em;
    text-transform:uppercase;
    margin-bottom:10px;
  }
  .ornament::before,.ornament::after{
    content:"";flex:0 0 80px;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold-2),transparent);
  }
  h1{
    font-family:'Cinzel',serif;
    font-weight:900;
    font-size:clamp(36px,5.5vw,64px);
    letter-spacing:.04em;
    background:linear-gradient(180deg,var(--gold-1) 10%,var(--gold-2) 55%,var(--gold-3) 100%);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    text-shadow:0 0 40px rgba(212,167,44,0.15);
    line-height:1;
  }
  .subtitle{
    font-style:italic;
    color:#a78b62;
    margin-top:8px;
    font-size:18px;
    letter-spacing:.02em;
  }
  /* mode tabs */
  .tabs{
    display:flex;justify-content:center;gap:0;
    margin:30px auto 22px;
    width:fit-content;
    border:1px solid rgba(212,167,44,0.35);
    border-radius:2px;
    background:rgba(0,0,0,0.35);
    overflow:hidden;
    box-shadow:0 0 0 1px rgba(0,0,0,0.5) inset, 0 10px 40px rgba(0,0,0,0.5);
  }
  .tab{
    font-family:'Cinzel',serif;
    font-weight:700;
    letter-spacing:.18em;
    font-size:13px;
    padding:14px 30px;
    background:transparent;
    color:#8a7042;
    border:none;
    cursor:pointer;
    transition:all .4s ease;
    text-transform:uppercase;
    position:relative;
  }
  .tab:hover{color:var(--gold-1)}
  .tab.active{
    color:var(--ink);
    background:linear-gradient(180deg,var(--gold-1),var(--gold-2) 60%,var(--gold-3));
    text-shadow:0 1px 0 rgba(255,255,255,0.3);
  }
  .tab + .tab{border-left:1px solid rgba(212,167,44,0.25)}
  /* stage */
  .stage{
    position:relative;
    border:1px solid rgba(212,167,44,0.35);
    border-radius:4px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(212,167,44,0.06), transparent 60%),
      linear-gradient(180deg, #170a0d 0%, #0d0608 100%);
    box-shadow:
      0 0 0 1px rgba(0,0,0,0.6) inset,
      0 0 60px rgba(0,0,0,0.6),
      0 0 120px rgba(155,28,44,0.08);
    overflow:hidden;
  }
  .stage::before,.stage::after{
    content:"";position:absolute;width:60px;height:60px;
    border:1px solid var(--gold-2);
    opacity:.55;
    pointer-events:none;
  }
  .stage::before{top:10px;left:10px;border-right:none;border-bottom:none}
  .stage::after{bottom:10px;right:10px;border-left:none;border-top:none}
  .corner-tr,.corner-bl{position:absolute;width:60px;height:60px;border:1px solid var(--gold-2);opacity:.55;pointer-events:none}
  .corner-tr{top:10px;right:10px;border-left:none;border-bottom:none}
  .corner-bl{bottom:10px;left:10px;border-right:none;border-top:none}
  #phaser-container{
    width:100%;
    aspect-ratio: 16 / 9;
    min-height:380px;
  }
  #phaser-container canvas{display:block;width:100%;height:100%}
  /* controls */
  .control-bar{
    display:flex;align-items:center;justify-content:space-between;
    gap:24px;
    padding:18px 26px;
    border-top:1px solid rgba(212,167,44,0.25);
    background:linear-gradient(180deg, rgba(212,167,44,0.04), transparent);
    flex-wrap:wrap;
  }
  .draw-btn{
    font-family:'Cinzel',serif;
    font-weight:900;
    letter-spacing:.25em;
    font-size:15px;
    padding:16px 42px;
    color:var(--ink);
    background:linear-gradient(180deg,var(--gold-1) 0%,var(--gold-2) 55%,var(--gold-3) 100%);
    border:1px solid var(--gold-3);
    border-radius:2px;
    cursor:pointer;
    text-transform:uppercase;
    box-shadow:
      0 2px 0 rgba(0,0,0,0.4),
      0 0 30px rgba(212,167,44,0.35),
      inset 0 1px 0 rgba(255,255,255,0.4);
    transition:transform .15s ease, box-shadow .3s ease;
    position:relative;
  }
  .draw-btn:hover:not(:disabled){
    transform:translateY(-1px);
    box-shadow:
      0 4px 0 rgba(0,0,0,0.4),
      0 0 50px rgba(212,167,44,0.6),
      inset 0 1px 0 rgba(255,255,255,0.5);
  }
  .draw-btn:active:not(:disabled){transform:translateY(1px)}
  .draw-btn:disabled{opacity:.4;cursor:not-allowed;filter:grayscale(.5)}
  .reset-btn{
    font-family:'Cinzel',serif;
    font-weight:700;
    letter-spacing:.2em;
    font-size:12px;
    padding:14px 24px;
    color:var(--gold-1);
    background:transparent;
    border:1px solid rgba(212,167,44,0.45);
    border-radius:2px;
    cursor:pointer;
    text-transform:uppercase;
    transition:all .3s ease;
  }
  .reset-btn:hover{background:rgba(212,167,44,0.1);border-color:var(--gold-2)}
  .speed-group{display:flex;gap:6px;align-items:center}
  .speed-label{
    font-family:'Cinzel',serif;font-size:11px;letter-spacing:.2em;
    color:#8a7042;text-transform:uppercase;
  }
  .speed-btn{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;font-weight:700;
    padding:8px 12px;
    background:transparent;
    color:#8a7042;
    border:1px solid rgba(212,167,44,0.3);
    border-radius:2px;
    cursor:pointer;
    transition:all .2s ease;
  }
  .speed-btn.active{
    color:var(--gold-1);
    border-color:var(--gold-2);
    background:rgba(212,167,44,0.1);
  }
  /* results panel */
  .results{
    margin-top:32px;
    border:1px solid rgba(212,167,44,0.3);
    border-radius:4px;
    background:
      radial-gradient(ellipse at 50% 0%, rgba(155,28,44,0.12), transparent 70%),
      linear-gradient(180deg,#150a0d,#0c0507);
    padding:30px 28px;
    text-align:center;
    position:relative;
    box-shadow:0 10px 40px rgba(0,0,0,0.5);
  }
  .results-label{
    font-family:'Cinzel',serif;
    letter-spacing:.4em;
    font-size:12px;
    color:var(--gold-2);
    text-transform:uppercase;
    margin-bottom:18px;
  }
  .results-label::before,.results-label::after{content:"❖";margin:0 14px;color:var(--red)}
  .balls-row{
    display:flex;justify-content:center;gap:18px;flex-wrap:wrap;
    min-height:72px;
    align-items:center;
  }
  .result-ball{
    width:62px;height:62px;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:900;font-size:24px;
    color:var(--ink);
    background:radial-gradient(circle at 35% 30%, #fff, var(--gold-1) 25%, var(--gold-2) 65%, var(--gold-3));
    box-shadow:
      inset -3px -4px 8px rgba(0,0,0,0.35),
      inset 2px 2px 6px rgba(255,255,255,0.5),
      0 4px 14px rgba(212,167,44,0.45),
      0 0 0 1px var(--gold-3);
    position:relative;
    animation:reveal .55s cubic-bezier(.2,.9,.3,1.4) both;
  }
  .result-ball::after{
    content:"";position:absolute;top:8px;left:14px;
    width:18px;height:10px;border-radius:50%;
    background:rgba(255,255,255,0.55);
    filter:blur(1px);
  }
  .result-ball.empty{
    background:transparent;
    border:1px dashed rgba(212,167,44,0.3);
    box-shadow:none;
    color:rgba(212,167,44,0.3);
    font-size:18px;
    animation:none;
  }
  .result-ball.empty::after{display:none}
  @keyframes reveal{
    0%{transform:scale(0) rotate(-180deg);opacity:0}
    60%{transform:scale(1.15) rotate(10deg);opacity:1}
    100%{transform:scale(1) rotate(0);opacity:1}
  }
  /* footer */
  footer{
    margin-top:34px;text-align:center;
    color:#5a4828;
    font-style:italic;font-size:14px;
    letter-spacing:.05em;
  }
  footer .divider{
    color:var(--gold-3);margin:0 14px;
  }
  /* status line */
  .status{
    text-align:center;
    font-family:'Cinzel',serif;
    font-size:13px;letter-spacing:.3em;
    color:var(--gold-2);
    text-transform:uppercase;
    margin-top:14px;
    min-height:18px;
    transition:opacity .3s ease;
  }
  @media (max-width:680px){
    .frame{padding:20px 14px 40px}
    .control-bar{flex-direction:column;gap:14px;padding:16px}
    .draw-btn{padding:14px 28px;font-size:13px}
    .result-ball{width:48px;height:48px;font-size:20px}
    .balls-row{gap:10px}
    #phaser-container{min-height:280px}
  }
</style>
</head>
<body>
<div class="frame">

  <header>
    <div class="ornament">Vietlott Lounge</div>
    <h1>Mega Draw</h1>
    <div class="subtitle">— a theatre of chance, in six golden orbs —</div>
  </header>

  <div class="tabs" role="tablist">
    <button class="tab active" data-mode="45">Mega 6/45</button>
    <button class="tab" data-mode="55">Power 6/55</button>
  </div>

  <div class="stage">
    <div class="corner-tr"></div>
    <div class="corner-bl"></div>
    <div id="phaser-container"></div>
    <div class="control-bar">
      <button class="reset-btn" id="reset-btn">↺ Reset</button>
      <button class="draw-btn" id="draw-btn">Quay số</button>
      <div class="speed-group">
        <span class="speed-label">Tốc độ</span>
        <button class="speed-btn" data-speed="0.6">Chậm</button>
        <button class="speed-btn active" data-speed="1">Vừa</button>
        <button class="speed-btn" data-speed="1.8">Nhanh</button>
      </div>
    </div>
  </div>

  <div class="status" id="status">Sẵn sàng — chọn thể loại và bắt đầu</div>

  <div class="results">
    <div class="results-label">Kết quả quay</div>
    <div class="balls-row" id="balls-row"></div>
  </div>

  <footer>
    <span>For entertainment only</span>
    <span class="divider">✦</span>
    <span>Demo built with Phaser 3</span>
  </footer>
</div>

<script>
/* =====================================================================
   VIETLOTT MEGA DRAW — Phaser 3 demo
   ===================================================================== */

const STATE = {
  mode: 45,           // 45 or 55
  drawing: false,
  drawn: [],          // numbers that have been drawn
  speedMul: 1,        // global speed multiplier
};

const PALETTE = {
  // color per ball derived from number — Vietlott style: yellow/red mix
  yellow: 0xf2c94c,
  yellowDark: 0x8a6212,
  red: 0xc83a3a,
  redDark: 0x5a0a14,
  white: 0xfffaf0,
  ink: 0x1a0d10,
  gold: 0xd4a72c,
  goldLight: 0xf9e7a1,
};

/* ---------------- ball rendering helpers ---------------- */
function ballColors(n){
  // Yellow for 1-25, Red for 26+ (Vietlott Mega style hint)
  // For 6/55 Power, mix it up a bit
  const isYellow = (STATE.mode === 45) ? (n <= 22) : (n % 2 === 0);
  return isYellow
    ? { base:0xf2c94c, dark:0xb88817, num:0x2a1808 }
    : { base:0xe04848, dark:0x6a0d18, num:0xffffff };
}

/* ---------------- Phaser scene ---------------- */
class DrawScene extends Phaser.Scene {
  constructor(){ super('draw'); }

  create(){
    const w = this.scale.width, h = this.scale.height;
    this.W = w; this.H = h;

    // background flourish — a soft chamber + ground
    this.drawChamber();

    // physics world bounds: a rounded container (we use a circle barrier of segments)
    this.createChamber();

    // groups
    this.balls = [];      // {body, sprite, label, num}
    this.queueIn = [];    // numbers waiting to come into the chamber
    this.drawnSprites = []; // balls displayed in the tray
    this.fanRunning = false;

    // tray (where drawn balls land at top)
    this.trayY = 56;
    this.trayCenter = w/2;
    this.trayBallSize = 38;

    // header text inside canvas
    this.titleText = this.add.text(w/2, 30,
      'CHAMBER', {
        fontFamily:'Cinzel, serif',
        fontSize: '16px',
        color:'#d4a72c',
        align:'center'
      }).setOrigin(0.5,0.5).setAlpha(0.55).setLetterSpacing(8);

    // chamber label
    this.statusInternal = this.add.text(w/2, h-22,
      '', {
        fontFamily:'Cinzel, serif',
        fontSize:'12px',
        color:'#8a7042'
      }).setOrigin(0.5,0.5).setLetterSpacing(4);

    // populate chamber with all numbers for current mode
    this.spawnPool(STATE.mode);

    // gentle continuous swirl
    this.swirlTime = 0;

    // expose to outside
    window.__scene = this;
  }

  drawChamber(){
    const g = this.add.graphics();
    const {W,H} = this;
    // velvet floor
    g.fillStyle(0x0a0608,1);
    g.fillRect(0,0,W,H);
    // subtle vignette gradient via concentric circles
    for (let i=0;i<6;i++){
      g.fillStyle(0x6e1424, 0.04 - i*0.005);
      g.fillCircle(W/2, H*0.62, Math.min(W,H)*0.55 - i*8);
    }
    // ground line
    g.lineStyle(1, 0xd4a72c, 0.25);
    g.beginPath();
    g.moveTo(40, H-44);
    g.lineTo(W-40, H-44);
    g.strokePath();
  }

  createChamber(){
    // Big circular bowl in the lower-middle area; opening at the top with a tube exit
    const cx = this.W/2;
    const cy = this.H * 0.58;
    const radius = Math.min(this.W * 0.34, this.H * 0.42);
    this.chamberCx = cx;
    this.chamberCy = cy;
    this.chamberR = radius;

    // Outer ring graphic
    const g = this.add.graphics();
    // outer brass ring
    g.lineStyle(8, 0x3a2410, 1).strokeCircle(cx, cy, radius+10);
    g.lineStyle(3, 0xd4a72c, 1).strokeCircle(cx, cy, radius+6);
    g.lineStyle(1, 0xf9e7a1, 0.8).strokeCircle(cx, cy, radius+2);
    // glass tint
    g.fillStyle(0x1a0d10, 0.35).fillCircle(cx, cy, radius);
    // light highlight
    g.lineStyle(2, 0xfff6dc, 0.18).strokeCircle(cx, cy, radius-6);
    // glass shine arcs
    g.lineStyle(3, 0xffffff, 0.12);
    g.beginPath();
    g.arc(cx, cy, radius-12, Phaser.Math.DegToRad(200), Phaser.Math.DegToRad(260), false);
    g.strokePath();
    g.beginPath();
    g.arc(cx, cy, radius-22, Phaser.Math.DegToRad(210), Phaser.Math.DegToRad(240), false);
    g.strokePath();

    // exit tube at the top
    const tubeW = 70;
    const tubeH = 80;
    const tubeX = cx - tubeW/2;
    const tubeY = cy - radius - tubeH + 14;
    g.fillStyle(0x1a0d10,1).fillRect(tubeX, tubeY, tubeW, tubeH);
    g.lineStyle(3, 0xd4a72c, 1).strokeRect(tubeX, tubeY, tubeW, tubeH);
    g.lineStyle(1, 0xf9e7a1, 0.6).strokeRect(tubeX+3, tubeY+3, tubeW-6, tubeH-6);
    // arrow on tube
    g.fillStyle(0xd4a72c, 0.7);
    g.fillTriangle(cx-8, tubeY+24, cx+8, tubeY+24, cx, tubeY+10);

    this.tube = {x:cx, yBottom: tubeY+tubeH, yTop: tubeY, w: tubeW};

    // pedestal
    g.fillStyle(0x2a1408,1).fillRect(cx-radius*0.4, cy+radius+8, radius*0.8, 10);
    g.lineStyle(1,0xd4a72c,0.5).strokeRect(cx-radius*0.4, cy+radius+8, radius*0.8, 10);

    // physics: build circular wall using arcade physics rectangles around circle
    // We use manual collision: simpler & more visually correct.
    this.useManualBounds = true;

    // Particles for burst on draw
    this.sparkTexture = this.makeSparkTexture();
  }

  makeSparkTexture(){
    const key = 'spark';
    if (this.textures.exists(key)) return key;
    const size = 16;
    const tex = this.textures.createCanvas(key, size, size);
    const ctx = tex.getContext();
    const grd = ctx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
    grd.addColorStop(0,'rgba(255,240,200,1)');
    grd.addColorStop(0.4,'rgba(255,200,80,0.8)');
    grd.addColorStop(1,'rgba(255,150,0,0)');
    ctx.fillStyle = grd;
    ctx.fillRect(0,0,size,size);
    tex.refresh();
    return key;
  }

  /* ----- spawn pool of balls ----- */
  spawnPool(mode){
    // Clear existing balls
    this.balls.forEach(b => { b.container.destroy(); });
    this.balls = [];

    const total = mode; // 45 or 55
    const r = this.ballRadius();
    for (let n=1; n<=total; n++){
      const angle = Math.random()*Math.PI*2;
      const dist = Math.random()*(this.chamberR - r - 6);
      const x = this.chamberCx + Math.cos(angle)*dist;
      const y = this.chamberCy + Math.sin(angle)*dist;
      const ball = this.makeBall(n, x, y, r);
      // random velocity
      ball.vx = (Math.random()-0.5)*200;
      ball.vy = (Math.random()-0.5)*200;
      this.balls.push(ball);
    }
  }

  ballRadius(){
    // smaller balls for 55 to fit
    return STATE.mode === 45 ? 18 : 16;
  }

  makeBall(n, x, y, r){
    const colors = ballColors(n);
    const c = this.add.container(x,y);
    const g = this.add.graphics();
    // shadow
    g.fillStyle(0x000000, 0.35);
    g.fillCircle(2, 3, r);
    // main
    g.fillStyle(colors.dark,1).fillCircle(0,0,r);
    g.fillStyle(colors.base,1).fillCircle(0,0,r-1.5);
    // highlight
    g.fillStyle(0xffffff, 0.55).fillCircle(-r*0.35,-r*0.4, r*0.28);
    g.fillStyle(0xffffff, 0.2).fillCircle(-r*0.2,-r*0.25, r*0.15);
    // ring
    g.lineStyle(1, colors.dark, 0.8).strokeCircle(0,0,r-0.5);
    c.add(g);
    // number label
    const t = this.add.text(0, 1, String(n).padStart(2,'0'), {
      fontFamily:'Cinzel, serif',
      fontSize: (r*0.95)+'px',
      fontStyle:'700',
      color: colors.num === 0xffffff ? '#fffaf0' : '#2a1808'
    }).setOrigin(0.5,0.5);
    c.add(t);

    return { container:c, num:n, r, vx:0, vy:0, settled:false, removed:false };
  }

  /* ----- main update: physics ----- */
  update(time, delta){
    const dt = Math.min(delta, 32) / 1000;
    const speed = STATE.speedMul;
    this.swirlTime += dt*speed;

    const cx = this.chamberCx, cy = this.chamberCy, R = this.chamberR;
    const drawing = STATE.drawing;

    // swirl strength
    const swirl = drawing ? 580 : 90;
    const blowUp = drawing ? 240 : 0;  // pushes balls upward toward tube
    const drag = 0.992;
    const ballRestitution = 0.78;

    // ball-vs-wall + ball-vs-ball
    const balls = this.balls;
    for (let i=0;i<balls.length;i++){
      const b = balls[i];
      if (b.removed) continue;
      const p = b.container;

      // forces: swirl (tangential) + slight inward gravity + blow up
      const dx = p.x - cx, dy = p.y - cy;
      const dist = Math.sqrt(dx*dx + dy*dy) || 0.001;
      const tx = -dy/dist, ty = dx/dist; // tangent (counter-clockwise)
      // swirl direction alternates a bit, with extra burst during drawing
      const tang = swirl * (1 + 0.35*Math.sin(this.swirlTime*1.7));
      b.vx += tx * tang * dt * speed;
      b.vy += ty * tang * dt * speed;
      // slight gravity (real-world feel) - downward
      b.vy += 180 * dt * speed;
      // suction toward center (keeps them inside)
      b.vx += (-dx/dist) * 40 * dt * speed;
      b.vy += (-dy/dist) * 40 * dt * speed;
      // upward blow when drawing
      if (drawing){
        b.vy -= blowUp * dt * speed * (0.6 + Math.random()*0.8);
        // bias toward tube horizontally
        b.vx += (this.tube.x - p.x) * 0.6 * dt * speed * 0.2;
      }

      // integrate
      p.x += b.vx * dt * speed;
      p.y += b.vy * dt * speed;

      // drag
      b.vx *= drag;
      b.vy *= drag;

      // circular wall collision
      const ndx = p.x - cx, ndy = p.y - cy;
      const nd = Math.sqrt(ndx*ndx + ndy*ndy);
      const maxR = R - b.r - 2;
      // allow exit through the tube
      const inTubeColumn = Math.abs(p.x - this.tube.x) < this.tube.w/2 - b.r - 2 && p.y < cy;
      if (nd > maxR && !inTubeColumn){
        const nx = ndx/nd, ny = ndy/nd;
        p.x = cx + nx*maxR;
        p.y = cy + ny*maxR;
        // reflect velocity
        const vn = b.vx*nx + b.vy*ny;
        b.vx -= (1+ballRestitution) * vn * nx;
        b.vy -= (1+ballRestitution) * vn * ny;
      }

      // rotation visual: rotate container slightly based on velocity
      p.rotation += (b.vx)*0.0008;
    }

    // ball-ball collisions (simple, O(n^2) — fine for 45-55 balls)
    for (let i=0;i<balls.length;i++){
      const a = balls[i]; if (a.removed) continue;
      for (let j=i+1;j<balls.length;j++){
        const b = balls[j]; if (b.removed) continue;
        const dx = b.container.x - a.container.x;
        const dy = b.container.y - a.container.y;
        const dist2 = dx*dx+dy*dy;
        const rs = a.r + b.r;
        if (dist2 < rs*rs && dist2 > 0.0001){
          const dist = Math.sqrt(dist2);
          const nx = dx/dist, ny = dy/dist;
          const overlap = (rs - dist) * 0.5;
          a.container.x -= nx*overlap;
          a.container.y -= ny*overlap;
          b.container.x += nx*overlap;
          b.container.y += ny*overlap;
          // relative velocity
          const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
          const vn = rvx*nx + rvy*ny;
          if (vn < 0){
            const e = 0.82;
            const jimp = -(1+e)*vn / 2;
            a.vx -= jimp*nx; a.vy -= jimp*ny;
            b.vx += jimp*nx; b.vy += jimp*ny;
          }
        }
      }
    }

    // check if a ball entered the tube — eligible for draw selection
    if (drawing && !this._capturing){
      for (const b of balls){
        if (b.removed) continue;
        const p = b.container;
        // tube column and above chamber top
        if (Math.abs(p.x - this.tube.x) < this.tube.w/2 - b.r - 2 &&
            p.y < cy - R + b.r + 4 && b.vy < 0){
          // capture this ball
          this._capturing = true;
          this.captureBall(b);
          break;
        }
      }
    }
  }

  captureBall(b){
    // freeze ball, animate up through tube, then to tray
    b.vx = 0; b.vy = 0;
    b.removed = true;
    STATE.drawn.push(b.num);
    setStatus('Đã rút quả số ' + String(b.num).padStart(2,'0'));

    // sparkle particles
    this.burst(b.container.x, b.container.y);

    // animate up the tube
    const targetUpY = this.tube.yTop - 20;
    const trayIdx = STATE.drawn.length - 1;
    const slot = this.computeTraySlot(trayIdx);

    this.tweens.add({
      targets: b.container,
      x: this.tube.x,
      y: targetUpY,
      scale: 1.05,
      duration: 700 / STATE.speedMul,
      ease: 'Sine.easeOut',
      onComplete: ()=>{
        // travel to tray slot
        this.tweens.add({
          targets: b.container,
          x: slot.x,
          y: slot.y,
          scale: this.trayBallSize / (this.ballRadius()*2),
          rotation: 0,
          duration: 600 / STATE.speedMul,
          ease: 'Cubic.easeOut',
          onComplete: ()=>{
            // pulse
            this.tweens.add({
              targets: b.container,
              scale: '+=0.08',
              yoyo: true,
              duration: 220,
              ease: 'Sine.easeInOut'
            });
            this.burst(slot.x, slot.y, 0.6);
            this._capturing = false;
            // update DOM result
            updateResultsDOM();
            // check end
            if (STATE.drawn.length >= 6){
              endDrawing();
            } else {
              // small pause before next draw — keeps tension
              this.time.delayedCall(450 / STATE.speedMul, ()=>{
                // continue drawing automatically
              });
            }
          }
        });
      }
    });
  }

  computeTraySlot(idx){
    const gap = this.trayBallSize + 14;
    const totalW = gap*5;
    const startX = this.W/2 - totalW/2;
    return { x: startX + idx*gap, y: this.trayY };
  }

  burst(x,y, intensity=1){
    const emitter = this.add.particles(x, y, this.sparkTexture, {
      lifespan: 700,
      speed: { min: 80*intensity, max: 280*intensity },
      scale: { start: 1.0*intensity, end: 0 },
      alpha: { start: 1, end: 0 },
      blendMode: 'ADD',
      quantity: Math.floor(28*intensity),
      emitting: false
    });
    emitter.explode(Math.floor(28*intensity));
    this.time.delayedCall(900, ()=> emitter.destroy());
  }

  resetAll(mode){
    STATE.mode = mode;
    STATE.drawing = false;
    STATE.drawn = [];
    this._capturing = false;
    this.spawnPool(mode);
    updateResultsDOM();
    setStatus('Sẵn sàng — Mega 6/' + mode);
  }

  startDraw(){
    if (STATE.drawing) return;
    if (STATE.drawn.length >= 6){
      setStatus('Đã đủ 6 số — hãy Reset để quay lại');
      return;
    }
    STATE.drawing = true;
    setStatus('Đang quay…');
    // boost velocities to start the shake
    for (const b of this.balls){
      if (b.removed) continue;
      b.vx += (Math.random()-0.5)*300;
      b.vy += (Math.random()-0.5)*300 - 100;
    }
  }
}

/* ---------------- Phaser config ---------------- */
const container = document.getElementById('phaser-container');
const game = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'phaser-container',
  width: 1080,
  height: 600,
  backgroundColor: '#0a0608',
  scale: {
    mode: Phaser.Scale.FIT,
    autoCenter: Phaser.Scale.CENTER_BOTH
  },
  scene: [DrawScene],
  fps: { target: 60, forceSetTimeOut: false },
});

/* ---------------- UI wiring ---------------- */
const drawBtn = document.getElementById('draw-btn');
const resetBtn = document.getElementById('reset-btn');
const ballsRow = document.getElementById('balls-row');
const statusEl = document.getElementById('status');

function setStatus(t){
  statusEl.style.opacity = 0;
  setTimeout(()=>{ statusEl.textContent = t; statusEl.style.opacity = 1; }, 150);
  // update internal scene status too
  if (window.__scene) window.__scene.statusInternal.setText(t.toUpperCase());
}

function updateResultsDOM(){
  ballsRow.innerHTML = '';
  const drawn = [...STATE.drawn].sort((a,b)=>a-b);
  for (let i=0;i<6;i++){
    const div = document.createElement('div');
    if (i < drawn.length){
      div.className = 'result-ball';
      div.textContent = String(drawn[i]).padStart(2,'0');
      div.style.animationDelay = (i*60)+'ms';
    } else {
      div.className = 'result-ball empty';
      div.textContent = '·';
    }
    ballsRow.appendChild(div);
  }
}

function endDrawing(){
  STATE.drawing = false;
  setStatus('Kết quả: ' + [...STATE.drawn].sort((a,b)=>a-b).map(n=>String(n).padStart(2,'0')).join(' · '));
  drawBtn.disabled = true;
  // big final burst
  const s = window.__scene;
  if (s){
    for (let i=0;i<5;i++){
      s.time.delayedCall(i*120, ()=>{
        s.burst(s.W/2, 80, 1.3);
      });
    }
  }
}

drawBtn.addEventListener('click', ()=>{
  const s = window.__scene; if (!s) return;
  s.startDraw();
});

resetBtn.addEventListener('click', ()=>{
  const s = window.__scene; if (!s) return;
  s.resetAll(STATE.mode);
  drawBtn.disabled = false;
});

document.querySelectorAll('.tab').forEach(tab=>{
  tab.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    const mode = parseInt(tab.dataset.mode,10);
    const s = window.__scene; if (!s) return;
    s.resetAll(mode);
    drawBtn.disabled = false;
  });
});

document.querySelectorAll('.speed-btn').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    STATE.speedMul = parseFloat(btn.dataset.speed);
  });
});

// initial paint
updateResultsDOM();
</script>
