"vi":"Vì bạn không kiểm soát được output giữa các browser, làm gì ở client cũng vậy."},{"s":"You","en":"That actually explains a lot. Let me rewrite the proposal with a server-side approach. Thanks for pushing back.","vi":"Điều đó giải thích được nhiều thứ. Tôi sẽ viết lại đề xuất theo hướng server. Cảm ơn bạn đã phản biện."}],"chunks":[{"en":"Do you have ten minutes today?","vi":"Bạn có 10 phút hôm nay không?","n":"Xin một lượng thời gian cụ thể, nhỏ. Dễ được đồng ý hơn 'can you help me'."},{"en":"I'm stuck on something","vi":"Tôi đang tắc ở một việc","n":"be stuck on = tắc ở. Đơn giản và không có gì đáng ngại."},{"en":"I've run out of ideas","vi":"Tôi đã hết cách","n":"Trung thực và không tự hạ thấp. Ai cũng gặp lúc này."},{"en":"I've tried three things: ~","vi":"Tôi đã thử ba thứ: ~","n":"Câu quan trọng nhất bài này. Nó chứng minh bạn xin giúp, không xin làm hộ."},{"en":"That's a fair point.","vi":"Đó là điểm hợp lý.","n":"Ghi nhận góp ý trước khi phản hồi. Nó cho bạn thời gian và giữ không khí."},{"en":"Can you say more about why?","vi":"Bạn nói rõ hơn vì sao không?","n":"Câu vàng khi nhận feedback. Nó biến chỉ trích thành thông tin."},{"en":"That actually explains a lot.","vi":"Điều đó giải thích được nhiều thứ.","n":"Cách thừa nhận mình đã hiểu sai mà không mất mặt."},{"en":"Thanks for pushing back.","vi":"Cảm ơn bạn đã phản biện.","n":"Câu này làm người ta muốn góp ý cho bạn lần sau. Cực kỳ giá trị."}],"gram":{"t":"would you mind, do you think you could — nhờ việc lịch sự","rule":"Ba mẫu nhờ việc. Would you mind + V-ing (lịch sự, chú ý trả lời: 'no' nghĩa là đồng ý). Do you think you could + V (mềm, dùng với việc lớn hơn). Any chance you could + V (thân mật, phổ biến trong tech).","pairs":[{"a":"Would you mind taking a look?","b":"Could you take a look?","n":"Sau would you mind là V-ing. Sau could là nguyên mẫu. Đừng lẫn."},{"a":"Do you think you could review it today?","b":"Review it today.","n":"A dùng cho người bạn không thân hoặc việc lớn. B chỉ dùng trong nhóm rất thân."},{"a":"Any chance you could join the call?","b":"You must join the call.","n":"Any chance you could là cách hỏi rất tự nhiên, không hạ thấp mình."}],"more":"Cảnh báo về 'Would you mind...?': nếu người ta trả lời 'Not at all' hoặc 'No', tức là họ ĐỒNG Ý. Nghe 'no' mà tưởng bị từ chối là lỗi hiểu rất phổ biến."},"fix":[{"bad":"Can you help me? It doesn't work.","good":"I'm stuck on the HEIC conversion. I've tried A, B, C — here's what each gave me. Do you have ten minutes?","why":"Câu đầu buộc người giúp phải điều tra từ đầu. Câu sau tiết kiệm cho họ 20 phút, nên họ sẽ giúp."},{"bad":"Would you mind to review my PR?","good":"Would you mind reviewing my PR?","why":"Sau would you mind luôn là V-ing."},{"bad":"No, that's not right, you don't understand my case.","good":"That's a fair point. Can you say more about why? There's some context that might change it.","why":"Phòng thủ ngay lập tức làm người ta thôi góp ý cho bạn. Hỏi thêm trước, phản hồi sau."}],"pron":{"t":"Giọng khi nhận góp ý","tip":"Khi nghe một góp ý khó, phản xạ tự nhiên là nói nhanh hơn và cao hơn. Hãy làm ngược: hít một hơi, nói chậm, giọng thấp. 'That's a fair point' nói chậm nghe như suy nghĩ thật; nói nhanh nghe như bác bỏ cho xong.","words":["That's a fair point ↘","Can you say more about why? ↗","Let me think about that ↘","Thanks for pushing back ↘"]},"quiz":[{"q":"Cách xin giúp đỡ hiệu quả nhất:","o":["Can you help me? It doesn't work.","I'm stuck on X. I've tried A, B, C. Do you have 10 minutes?","I need your help urgently."],"a":1,"e":"Nêu rõ vấn đề + những gì đã thử + lượng thời gian cụ thể. Người ta giúp nhanh nhất khi biết chính xác cần gì."},{"q":"Chọn câu đúng:","o":["Would you mind to review it?","Would you mind reviewing it?","Would you mind review it?"],"a":1,"e":"would you mind + V-ing."},{"q":"Bạn hỏi 'Would you mind sending it?' và nhận câu 'Not at all.' Nghĩa là:","o":["Họ từ chối","Họ đồng ý","Họ chưa quyết"],"a":1,"e":"'Not at all' = tôi không thấy phiền = đồng ý. Đây là chỗ rất dễ hiểu ngược."},{"q":"Nhận một góp ý bạn chưa đồng ý. Câu tốt nhất:","o":["That's not right.","Can you say more about why?","You don't understand."],"a":1,"e":"Hỏi thêm trước khi phản hồi. Bạn có thể học được gì đó, hoặc chuẩn bị được câu trả lời tốt hơn."}],"task":{"say":"Nói 45 giây xin giúp đỡ về một vấn đề thật, bắt buộc có: mô tả vấn đề, ba thứ đã thử, kết quả từng thứ, lượng thời gian bạn cần.","write":"Viết lại một lần bạn đã phản ứng phòng thủ với góp ý. Viết lại phản hồi theo mẫu: ghi nhận → hỏi thêm → nêu bối cảnh còn thiếu."},"zen":"Người tiến bộ nhanh nhất không phải người ít bị góp ý — mà người khiến người khác muốn góp ý cho họ. Bốn từ 'thanks for pushing back' có sức mạnh hơn cả một năm tự học."},{"d":25,"phase":5,"t":"Giải thích trade-off kỹ thuật cho người không phải dev","goal":"Trình bày một quyết định kỹ thuật để người không code cũng ra quyết định đúng.","why":"Đây là kỹ năng phân biệt dev giỏi và tech lead. Không phải giải thích cho đơn giản hơn, mà là dịch từ ngôn ngữ kỹ thuật sang ngôn ngữ hệ quả kinh doanh: tiền, thời gian, rủi ro, trải nghiệm người dùng.","scene":"Bạn phải thuyết phục khách hàng về kiến trúc hybrid cho việc chuẩn hoá ảnh.","dlg":[{"s":"Client (non-dev)","en":"Why can't we just do all the image processing in the browser? It'd save server cost.","vi":"Sao mình không xử lý ảnh hết ở browser? Sẽ tiết kiệm chi phí server."},{"s":"You","en":"We can do part of it. The issue is consistency: the same photo comes out differently on Safari and Chrome.","vi":"Làm được một phần. Vấn đề là tính nhất quán: cùng một ảnh cho ra kết quả khác nhau trên Safari và Chrome."},{"s":"Client","en":"How different are we talking?","vi":"Khác nhau đến mức nào?"},{"s":"You","en":"Enough that your AI model would score the same photo differently depending on the user's browser.","vi":"Đủ để model AI của bạn cho điểm khác nhau cho cùng một ảnh, tuỳ browser của user."},{"s":"Client","en":"That's a problem. So what do you recommend?","vi":"Đó là vấn đề. Vậy bạn đề xuất gì?"},{"s":"You","en":"A split: the browser shrinks the file so uploads are fast and cheap. The server does the final conversion so the output is always identical.","vi":"Chia đôi: browser thu nhỏ file để upload nhanh và rẻ. Server làm bước chuyển cuối để output luôn giống nhau."},{"s":"You","en":"You still get most of the bandwidth savings, and you get one source of truth for the model.","vi":"Bạn vẫn tiết kiệm phần lớn băng thông, và có một nguồn chuẩn duy nhất cho model."}],"chunks":[{"en":"We can do part of it. The issue is ~","vi":"Làm được một phần. Vấn đề là ~","n":"Đồng ý phần đúng trước, rồi mới nêu vấn đề. Không bao giờ mở đầu bằng no."},{"en":"The issue is consistency","vi":"Vấn đề là tính nhất quán","n":"Đặt tên cho vấn đề bằng một từ. Nó giúp người nghe nhớ và nhắc lại được."},{"en":"How different are we talking?","vi":"Khác nhau đến mức nào?","n":"Câu hỏi hay của người nghe. Nó có nghĩa họ đang muốn số liệu."},{"en":"Enough that ~","vi":"Đủ để ~","n":"Cấu trúc nêu mức độ qua hệ quả, không qua con số kỹ thuật. Rất hiệu quả với người không phải dev."},{"en":"So what do you recommend?","vi":"Vậy bạn đề xuất gì?","n":"Nghe câu này là bạn đã thuyết phục được phần vấn đề. Giờ tới phần giải pháp."},{"en":"A split: ~ so that ~","vi":"Chia đôi: ~ để ~","n":"Mỗi phần của giải pháp gắn với một lợi ích. Đừng chỉ mô tả kiến trúc."},{"en":"one source of truth","vi":"một nguồn chuẩn duy nhất","n":"Cụm này người không phải dev cũng hiểu ngay và rất thích."},{"en":"You still get most of ~","vi":"Bạn vẫn được phần lớn ~","n":"Kết bằng việc họ vẫn giữ được điều họ muốn. Đây là câu chốt."}],"gram":{"t":"So sánh và nối lập luận","rule":"Ba nhóm từ nối cho lập luận kỹ thuật: đối lập (however, on the other hand, that said, the trade-off is), nguyên nhân kết quả (which means, so, as a result, that's why), nhượng bộ (admittedly, it's true that, you're right that).","pairs":[{"a":"It's faster but less consistent.","b":"It's faster. The trade-off is consistency.","n":"B tách thành hai câu, đặt tên cho sự đánh đổi. Người nghe theo dõi dễ hơn."},{"a":"The browser is different from Safari.","b":"Chrome and Safari produce different output.","n":"different FROM (không different with). Nhưng câu B cụ thể hơn nên tốt hơn."},{"a":"It's the same with the old version.","b":"It's the same as the old version.","n":"the same AS, không the same with. Lỗi rất phổ biến."}],"more":"Khi giải thích cho người không phải dev, mỗi lần dùng một thuật ngữ thì thêm một cụm hệ quả: 'it's not deterministic — which means the same photo can score differently'. Thuật ngữ + hệ quả, luôn đi đôi."},"fix":[{"bad":"It's different with Chrome.","good":"It's different from Chrome.","why":"different from là chuẩn. different than dùng ở Mỹ, chấp nhận được. different with thì sai."},{"bad":"The output is same with the server.","good":"The output is the same as the server's.","why":"the same as, và cần mạo từ the trước same."},{"bad":"Because of non-deterministic encoding, we should use server-side libvips.","good":"The same photo can come out differently on each browser — which means your AI would score it differently. Doing it on the server fixes that.","why":"Không sai, nhưng người quyết định không hiểu. Dịch thuật ngữ thành hệ quả họ quan tâm."}],"pron":{"t":"Ngắt nhịp khi giải thích","tip":"Khi trình bày lập luận, ngắt một nhịp sau mỗi ý. Người nghe cần thời gian xử lý, đặc biệt khi nội dung mới với họ. Nói liền mạch làm họ mất một ý và rồi mất cả lập luận. Ngắt nhịp là hình thức tôn trọng.","words":["The issue is consistency. // The same photo // comes out differently // on each browser.","You still get most of the savings // and one source of truth."]},"quiz":[{"q":"Chọn câu đúng:","o":["It's different with Chrome.","It's different from Chrome.","It's different than with Chrome."],"a":1,"e":"different from là chuẩn quốc tế."},{"q":"Chọn câu đúng:","o":["The output is same with before.","The output is the same as before.","The output is same than before."],"a":1,"e":"the same as, và có mạo từ the."},{"q":"Giải thích thuật ngữ cho người không phải dev, cách tốt nhất:","o":["Dùng thuật ngữ chính xác nhất","Thuật ngữ + một cụm hệ quả họ quan tâm","Tránh hoàn toàn thuật ngữ"],"a":1,"e":"Không cần né thuật ngữ, chỉ cần luôn kèm hệ quả: it's not deterministic — which means..."},{"q":"Cách mở đầu tốt nhất khi bạn không đồng ý với đề xuất của khách:","o":["No, that won't work.","We can do part of it. The issue is ~","That's technically impossible."],"a":1,"e":"Đồng ý phần đúng trước, đặt tên vấn đề, rồi đề xuất. Người nghe không phòng thủ."}],"task":{"say":"Chọn một quyết định kỹ thuật thật của bạn. Giải thích 90 giây cho một người không code: vấn đề → hệ quả kinh doanh → giải pháp → cái họ vẫn giữ được. Không dùng quá 3 thuật ngữ.","write":"Viết một đoạn 5 câu giải thích trade-off đó. Mỗi thuật ngữ phải kèm một cụm 'which means...'."},"zen":"Khả năng dịch từ kỹ thuật sang hệ quả là ranh giới giữa người thực thi và người có ảnh hưởng. Không phải nói cho đơn giản — mà nói cho đúng thứ người nghe cần để quyết định."},{"d":26,"phase":6,"t":"Kể lại một sự cố","goal":"Thuật lại một incident theo dòng thời gian, rõ ràng, không lộn xộn thì.","why":"Kể chuyện là dạng nói dài nhất bạn phải làm trong công việc: postmortem, phỏng vấn, giải thích với khách. Nó cũng là chỗ ngữ pháp thì dễ vỡ nhất, vì bạn phải chuyển qua lại giữa các mốc thời gian.","scene":"Postmortem sau một sự cố production.","dlg":[{"s":"Lead","en":"Walk us through what happened.","vi":"Kể lại cho mọi người chuyện gì đã xảy ra."},{"s":"You","en":"At around two p.m., alerts started firing. We were in the middle of a deploy at the time.","vi":"Khoảng 2 giờ chiều, các alert bắt đầu nổ. Lúc đó chúng tôi đang giữa một lần deploy."},{"s":"You","en":"At first we thought it was the deploy, so we rolled back. But the errors kept coming.","vi":"Ban đầu chúng tôi tưởng là do deploy, nên đã rollback. Nhưng lỗi vẫn tiếp tục."},{"s":"You","en":"Then Hoa noticed that the upload service had been failing since noon — two hours before our deploy.","vi":"Rồi Hoa phát hiện service upload đã lỗi từ trưa — hai tiếng trước lần deploy của chúng tôi."},{"s":"Lead","en":"So what was the actual cause?","vi":"Vậy nguyên nhân thật là gì?"},{"s":"You","en":"A disk had filled up on the storage node. Once we cleared it, the errors stopped within a minute.","vi":"Một ổ đĩa đầy trên storage node. Sau khi dọn xong, lỗi dừng trong vòng một phút."},{"s":"You","en":"The main lesson is that we didn't have an alert for disk usage. I've added one, and I'm writing up the timeline in the doc.","vi":"Bài học chính là chúng tôi không có alert cho disk usage. Tôi đã thêm một cái, và đang viết lại timeline vào doc."}],"chunks":[{"en":"Walk us through what happened.","vi":"Kể lại cho mọi người chuyện gì đã xảy ra.","n":"Nghe câu này là bạn cần kể theo dòng thời gian, không phải nêu kết luận."},{"en":"alerts started firing","vi":"các alert bắt đầu nổ","n":"fire = kích hoạt. an alert fires, a trigger fires."},{"en":"We were in the middle of a deploy at the time.","vi":"Lúc đó chúng tôi đang giữa một lần deploy.","n":"Bối cảnh đang diễn ra → quá khứ tiếp diễn."},{"en":"At first we thought ~, so we ~","vi":"Ban đầu chúng tôi tưởng ~, nên ~","n":"At first báo hiệu rằng giả thuyết ban đầu đã sai. Cấu trúc kể chuyện rất tự nhiên."},{"en":"the errors kept coming","vi":"lỗi vẫn tiếp tục","n":"keep + V-ing = cứ tiếp tục. keep failing, keep crashing."},{"en":"had been failing since noon","vi":"đã lỗi từ trưa","n":"Việc xảy ra TRƯỚC một mốc quá khứ khác → quá khứ hoàn thành."},{"en":"Once we cleared it, ~","vi":"Sau khi dọn xong, ~","n":"once = ngay khi. Nối hai sự việc liên tiếp gọn hơn 'after that'."},{"en":"The main lesson is that ~","vi":"Bài học chính là ~","n":"Câu kết của mọi postmortem. Luôn kèm hành động đã làm."}],"gram":{"t":"Ba thì kể chuyện: past simple, past continuous, past perfect","rule":"Past simple = chuỗi sự việc chính, theo thứ tự. Past continuous = bối cảnh đang diễn ra khi sự việc xảy ra. Past perfect = việc đã xảy ra TRƯỚC một mốc quá khứ khác. Bạn chỉ cần past perfect khi thứ tự thời gian quan trọng — và trong incident thì nó luôn quan trọng.","pairs":[{"a":"We were deploying when the alerts fired.","b":"We deployed and then the alerts fired.","n":"A: deploy đang diễn ra, alert cắt ngang. B: hai việc lần lượt. Sắc thái khác nhau rõ."},{"a":"The service had been failing since noon.","b":"The service failed at noon.","n":"A: lỗi kéo dài trước mốc chúng tôi phát hiện. B: một sự việc tại một thời điểm."},{"a":"By the time we noticed, it had been down for two hours.","b":"When we noticed, it was down.","n":"by the time + past perfect là mẫu chuẩn khi nói về việc đã diễn ra một lúc rồi."}],"more":"Từ nối thời gian cho kể chuyện: at first, then, meanwhile, at that point, after that, eventually, in the end. Dùng chúng thay vì lặp 'and then' mãi."},"fix":[{"bad":"When we noticed it, it was failing since noon.","good":"When we noticed it, it had been failing since noon.","why":"Việc kéo dài trước một mốc quá khứ → past perfect continuous (had been + V-ing)."},{"bad":"We were rollback the deploy.","good":"We rolled back the deploy.","why":"rollback là danh từ, roll back là động từ. Quá khứ: rolled back."},{"bad":"The disk was full so the service is failing.","good":"The disk was full, so the service was failing.","why":"Kể chuyện quá khứ thì giữ toàn bộ ở quá khứ. Nhảy sang hiện tại giữa câu làm người nghe mất mạch."}],"pron":{"t":"Đọc mốc thời gian trong kể chuyện","tip":"Nhấn vào mốc thời gian khi mở đầu mỗi đoạn: at around TWO p.m., since NOON, TWO HOURS before. Mốc thời gian là xương sống của câu chuyện — người nghe dùng nó để dựng lại dòng sự kiện trong đầu.","words":["at around two p.m.","two hours before","by the time we noticed","within a minute","since noon"]},"quiz":[{"q":"Chọn câu đúng:","o":["When we noticed, it was failing since noon.","When we noticed, it had been failing since noon.","When we noticed, it is failing since noon."],"a":1,"e":"Việc kéo dài trước một mốc quá khứ khác → had been + V-ing."},{"q":"Bối cảnh đang diễn ra khi sự việc xảy ra:","o":["We deployed when the alerts fired.","We were deploying when the alerts fired.","We deploy when alerts fired."],"a":1,"e":"Quá khứ tiếp diễn cho bối cảnh, quá khứ đơn cho việc cắt ngang."},{"q":"Chọn câu đúng:","o":["We were rollback the deploy.","We rolled back the deploy.","We rollbacked the deploy."],"a":1,"e":"Động từ là roll back (hai từ), quá khứ rolled back. Danh từ mới là rollback."},{"q":"Điền: ___ we cleared the disk, the errors stopped.","o":["Once","During","While"],"a":0,"e":"once = ngay khi. Nối hai sự việc liên tiếp."}],"task":{"say":"Kể 90 giây về một sự cố thật bạn từng gặp, theo dòng thời gian, bắt buộc dùng ít nhất một câu past continuous và một câu past perfect. Kết bằng 'The main lesson is that...'.","write":"Viết timeline 6 dòng của sự cố đó, mỗi dòng bắt đầu bằng một mốc thời gian."},"zen":"Kể chuyện là dạng nói duy nhất mà người nghe sẵn sàng cho bạn 90 giây liên tục. Đó là cơ hội lớn nhất để tiếng Anh của bạn được nghe trọn vẹn. Đừng bỏ nó."},{"d":27,"phase":6,"t":"Phỏng vấn: nói về kinh nghiệm của mình","goal":"Trả lời câu hỏi kinh nghiệm bằng cấu trúc kể chuyện có kết quả đo được.","why":"Dù bạn không tìm việc, đây vẫn là kỹ năng bạn dùng khi giới thiệu bản thân với khách hàng mới, xin dự án, hay đề nghị tăng lương. Nội dung là kinh nghiệm của bạn — vấn đề chỉ là bạn có sẵn cấu trúc để kể hay không.","scene":"Phỏng vấn hoặc buổi giới thiệu năng lực với khách hàng mới.","dlg":[{"s":"Interviewer","en":"Tell me about a technical decision you're proud of.","vi":"Kể tôi nghe về một quyết định kỹ thuật bạn tự hào."},{"s":"You","en":"Sure. Last year our admin portal was taking about six seconds to load, and the ops team was complaining daily.","vi":"Được. Năm ngoái admin portal của chúng tôi mất khoảng sáu giây để tải, và team vận hành phàn nàn hàng ngày."},{"s":"You","en":"My job was to bring that under two seconds without a rewrite. I profiled it and found that two thirds of the bundle was one charting library.","vi":"Việc của tôi là đưa nó xuống dưới hai giây mà không viết lại. Tôi profile và thấy hai phần ba bundle là một thư viện chart."},{"s":"You","en":"So I replaced it with a smaller one, code-split the routes, and moved the icons to SVG sprites.","vi":"Nên tôi thay bằng thư viện nhỏ hơn, code-split các route, và chuyển icon sang SVG sprite."},{"s":"Interviewer","en":"And the result?","vi":"Kết quả thế nào?"},{"s":"You","en":"Load time went from six seconds to one point four. The bundle dropped by about sixty percent.","vi":"Thời gian tải từ sáu giây xuống một phẩy bốn. Bundle giảm khoảng sáu mươi phần trăm."},{"s":"You","en":"What I'd do differently is set up a bundle size check in CI from the start, so it never creeps back.","vi":"Điều tôi sẽ làm khác là thiết lập kiểm tra kích thước bundle trong CI từ đầu, để nó không phình lại."}],"chunks":[{"en":"Last year our ~ was taking about ~","vi":"Năm ngoái ~ của chúng tôi mất khoảng ~","n":"Mở đầu bằng bối cảnh có số liệu. Số liệu làm câu chuyện đáng tin ngay từ câu đầu."},{"en":"My job was to ~","vi":"Việc của tôi là ~","n":"Nêu rõ vai trò của bạn. Đừng để người nghe đoán bạn làm phần nào."},{"en":"I profiled it and found that ~","vi":"Tôi profile và phát hiện ~","n":"Nêu phương pháp trước kết quả. Nó cho thấy bạn làm có hệ thống."},{"en":"So I ~, ~, and ~","vi":"Nên tôi ~, ~, và ~","n":"Ba hành động, liệt kê song song. Ba là con số tốt nhất cho một danh sách khi nói."},{"en":"Load time went from six to one point four.","vi":"Thời gian tải từ sáu xuống một phẩy bốn.","n":"Ôn ngày 9. Mẫu câu báo kết quả bằng số."},{"en":"The bundle dropped by about sixty percent.","vi":"Bundle giảm khoảng sáu mươi phần trăm.","n":"drop by + mức giảm. Ôn lại by."},{"en":"What I'd do differently is ~","vi":"Điều tôi sẽ làm khác là ~","n":"Câu này rất mạnh. Nó cho thấy bạn có phản tư, không chỉ có thành tích."},{"en":"I've been working with React for about six years.","vi":"Tôi làm với React khoảng sáu năm rồi.","n":"Kinh nghiệm còn đang tiếp tục → have been + V-ing."}],"gram":{"t":"Bốn phần của một câu trả lời tốt, và thì tương ứng","rule":"Bối cảnh (quá khứ đơn hoặc quá khứ tiếp diễn) → vai trò và hành động của bạn (quá khứ đơn) → kết quả (quá khứ đơn với số liệu) → phản tư hoặc hiện tại (would / hiện tại hoàn thành). Bốn phần, khoảng 60-90 giây.","pairs":[{"a":"I've worked with React for six years.","b":"I've been working with React for six years.","n":"Cả hai đúng. B nhấn vào tính liên tục, nghe tự nhiên hơn khi nói về kinh nghiệm đang tiếp tục."},{"a":"I worked at FPT for three years.","b":"I've worked at FPT for three years.","n":"A: đã rời đi. B: vẫn đang ở đó. Chọn sai là người nghe hiểu sai hoàn toàn."},{"a":"What I'd do differently is ~","b":"I made a mistake there.","n":"A nghe như người trưởng thành có phản tư. B nghe như tự hạ thấp. Cùng một nội dung."}],"more":"Đừng dùng 'we' cho mọi thứ trong phỏng vấn. Người nghe cần biết bạn làm gì. Dùng we cho bối cảnh, I cho hành động của bạn: 'We had a performance problem. I profiled the bundle and found...'"},"fix":[{"bad":"I have worked here since 3 years.","good":"I've worked here for three years. / since 2023.","why":"for + khoảng thời gian. since + mốc bắt đầu. Không bao giờ 'since three years'."},{"bad":"I am working in this company since 2023.","good":"I've been working at this company since 2023.","why":"since → hiện tại hoàn thành. Và work AT a company (work in a field/department)."},{"bad":"We did it and it was better.","good":"I replaced the charting library, and load time dropped from six seconds to one point four.","why":"Không có số liệu và không rõ bạn làm gì. Đây là lỗi làm câu chuyện tốt trở nên vô nghĩa."}],"pron":{"t":"Đọc con số kết quả cho có sức nặng","tip":"Khi nói kết quả, chậm lại ở con số và ngắt nhẹ trước nó: load time went from six seconds // to one point four. Chỗ ngắt làm con số nổi lên. Nói liền mạch làm nó trôi qua không ai nhớ.","words":["from six seconds // to one point four","dropped by // sixty percent","under // two seconds"]},"quiz":[{"q":"Chọn câu đúng:","o":["I work here since 3 years.","I've worked here for three years.","I'm working here since three years."],"a":1,"e":"for + khoảng thời gian. since + mốc bắt đầu cụ thể."},{"q":"Bạn đã rời công ty cũ. Nói:","o":["I've worked at FPT for three years.","I worked at FPT for three years.","I work at FPT for three years."],"a":1,"e":"Đã kết thúc → quá khứ đơn. Dùng have là người nghe tưởng bạn vẫn ở đó."},{"q":"Phần nào hay bị thiếu nhất trong câu trả lời phỏng vấn?","o":["Bối cảnh","Kết quả có số liệu","Danh sách công nghệ"],"a":1,"e":"Kết quả đo được là thứ biến một câu chuyện thành bằng chứng năng lực."},{"q":"Câu nào thể hiện sự trưởng thành tốt nhất?","o":["It was perfect.","What I'd do differently is add a CI check.","I made a big mistake."],"a":1,"e":"Phản tư có hành động cụ thể. Nó cho thấy bạn học được từ kinh nghiệm."}],"task":{"say":"Kể 90 giây về một quyết định kỹ thuật bạn tự hào, đủ 4 phần: bối cảnh có số → vai trò của bạn → hành động (ba việc) → kết quả có số + điều sẽ làm khác. Bấm giờ.","write":"Viết 3 câu chuyện theo khung này, mỗi cái 6 dòng. Đây là tài sản dùng được cho phỏng vấn, hồ sơ, và giới thiệu với khách hàng."},"zen":"Bạn đã làm những việc đáng kể. Vấn đề duy nhất là bạn chưa có sẵn cách kể chúng bằng tiếng Anh. Đây không phải học tiếng Anh — đây là chuẩn bị bằng chứng cho công việc bạn đã làm."},{"d":28,"phase":6,"t":"Demo và thuyết trình","goal":"Dẫn người nghe qua một bản demo mà không ai bị lạc.","why":"Demo là nơi công việc của bạn được nhìn thấy. Một demo dẫn tốt làm công việc bình thường trông có giá trị; một demo lộn xộn làm công việc tốt trông đáng ngờ.","scene":"Demo tính năng upload cho khách hàng, 5 phút.","dlg":[{"s":"You","en":"I'll show you three things today: the upload flow, the error handling, and what's still missing.","vi":"Hôm nay tôi sẽ trình bày ba thứ: luồng upload, xử lý lỗi, và những gì còn thiếu."},{"s":"You","en":"Let's start with the happy path. I'm dropping in a five-megabyte JPEG here.","vi":"Bắt đầu với happy path. Tôi kéo vào đây một file JPEG 5MB."},{"s":"You","en":"As you can see, it resizes in the browser first — that's why the progress bar moves this fast.","vi":"Như bạn thấy, nó resize ở browser trước — đó là lý do progress bar chạy nhanh vậy."},{"s":"You","en":"Now let me show you what happens when the file is too big. Watch the message at the bottom.","vi":"Giờ tôi cho bạn xem khi file quá lớn thì sao. Chú ý dòng thông báo phía dưới."},{"s":"Client","en":"Can you go back to the previous screen for a second?","vi":"Bạn quay lại màn hình trước một chút được không?"},{"s":"You","en":"Of course. So this is the point I mentioned earlier — the retry button isn't wired up yet.","vi":"Tất nhiên. Đây chính là điểm tôi nhắc lúc đầu — nút retry chưa được nối."},{"s":"You","en":"That's the last piece, and it's next on my list. Any questions before I move on?","vi":"Đó là phần cuối, và nó là việc tiếp theo của tôi. Có câu hỏi nào trước khi tôi tiếp không?"}],"chunks":[{"en":"I'll show you three things today:","vi":"Hôm nay tôi sẽ trình bày ba thứ:","n":"Nêu số lượng ngay câu đầu. Người nghe biết mình đang ở đâu trong toàn bộ demo."},{"en":"Let's start with the happy path.","vi":"Bắt đầu với happy path.","n":"happy path = luồng chạy đúng. Từ này người không phải dev cũng hiểu ngay."},{"en":"As you can see, ~","vi":"Như bạn thấy, ~","n":"Hướng mắt người nghe. Dùng nhiều trong demo, nhưng đừng lặp quá 3 lần."},{"en":"that's why ~","vi":"đó là lý do ~","n":"Nối quan sát với giải thích. Nó biến demo thành bài học chứ không phải màn biểu diễn."},{"en":"Now let me show you what happens when ~","vi":"Giờ tôi cho bạn xem khi ~ thì sao","n":"Câu chuyển đoạn. Người nghe biết bạn đang sang phần mới."},{"en":"Watch the message at the bottom.","vi":"Chú ý dòng thông báo phía dưới.","n":"Chỉ rõ chỗ cần nhìn. Người nghe không biết nhìn đâu là mất luôn ý bạn muốn nói."},{"en":"This is the point I mentioned earlier —","vi":"Đây chính là điểm tôi nhắc lúc đầu —","n":"Nối lại với phần mở đầu. Nó tạo cảm giác demo có cấu trúc."},{"en":"Any questions before I move on?","vi":"Có câu hỏi nào trước khi tôi tiếp không?","n":"Chốt từng phần. Tốt hơn là để dồn hết câu hỏi tới cuối."}],"gram":{"t":"Ngôn ngữ chỉ đường trong thuyết trình","rule":"Bốn loại câu chỉ đường. Mở đầu: I'll cover three things / Here's the plan. Chuyển đoạn: Now let's look at / Moving on to / That brings me to. Nhấn mạnh: The key thing here is / What matters most is. Kết: To sum up / So where does that leave us.","pairs":[{"a":"Now let's look at the error case.","b":"And then the error case.","n":"A là câu chỉ đường rõ ràng. B làm người nghe không biết đã sang phần mới."},{"a":"The key thing here is the server does the final conversion.","b":"The server does the final conversion.","n":"Thêm câu nhấn mạnh làm người nghe biết đây là điểm cần nhớ."},{"a":"To sum up, we have two of three pieces done.","b":"So that's it.","n":"Kết bằng tóm tắt có nội dung, đừng kết bằng câu trống."}],"more":"Trong demo, dùng hiện tại đơn để mô tả cái đang xảy ra trên màn hình: 'it resizes in the browser', 'the message appears here'. Đây là quy ước, giống như thuyết minh trực tiếp."},"fix":[{"bad":"Here I will click and it will show and then it will go...","good":"I'm clicking Upload. The file resizes here, and the result appears below.","why":"Lạm dụng will làm demo nghe như dự báo. Mô tả cái đang xảy ra bằng hiện tại đơn hoặc tiếp diễn."},{"bad":"Sorry, this is not finished, sorry it's ugly, sorry...","good":"The retry button isn't wired up yet — that's next on my list.","why":"Xin lỗi về bản demo làm người nghe mất niềm tin. Nêu rõ cái chưa xong và khi nào xong thì họ yên tâm."},{"bad":"Do you have any question?","good":"Any questions before I move on?","why":"question phải số nhiều trong câu này. Và thêm 'before I move on' để giữ kiểm soát nhịp."}],"pron":{"t":"Âm lượng và tốc độ khi demo","tip":"Khi tay bạn đang bấm chuột, tốc độ nói tự nhiên tăng lên và âm lượng giảm. Hãy chủ động làm ngược: nói chậm hơn khi đang thao tác. Và nói TRƯỚC khi bấm, không phải sau: 'Now I'm going to upload a large file' rồi mới bấm.","words":["Let's start with...","As you can see...","Now let me show you...","Any questions before I move on?"]},"quiz":[{"q":"Câu mở đầu demo tốt nhất:","o":["OK so let me show something.","I'll show you three things today: A, B, and C.","This is my feature."],"a":1,"e":"Nêu số lượng và nội dung giúp người nghe theo dõi được vị trí của mình."},{"q":"Chọn câu đúng:","o":["Do you have any question?","Any questions before I move on?","Do you have some question?"],"a":1,"e":"questions số nhiều. Và câu B giữ được nhịp của bạn."},{"q":"Có phần chưa hoàn thiện trong demo. Nên:","o":["Xin lỗi nhiều lần","Không nhắc tới","Nêu rõ nó chưa xong và kế hoạch tiếp theo"],"a":2,"e":"Nêu rõ tạo tin tưởng. Người nghe sẽ tự phát hiện, và tốt hơn là họ biết bạn đã biết."},{"q":"Mô tả cái đang xảy ra trên màn hình, dùng thì nào?","o":["Tương lai với will","Hiện tại đơn hoặc tiếp diễn","Quá khứ đơn"],"a":1,"e":"Thuyết minh trực tiếp dùng hiện tại: it resizes here, I'm clicking Upload."}],"task":{"say":"Demo một tính năng bạn đã làm, 3 phút, thật, có bấm chuột. Bắt buộc có: câu mở nêu ba phần, hai câu chuyển đoạn, một câu nhấn mạnh, một câu nêu phần chưa xong, một câu mời hỏi.","write":"Viết script mở đầu và kết thúc demo cho tính năng hiện tại của bạn. Chỉ hai đoạn — đó là hai chỗ dễ vỡ nhất."},"zen":"Công việc tốt không tự nói cho mình. Trong bất kỳ tổ chức nào, khả năng trình bày công việc của bạn là một phần của công việc — không phải phần phụ."},{"d":29,"phase":6,"t":"Làm việc đa văn hoá và small talk sâu hơn","goal":"Đọc được tín hiệu gián tiếp và tránh các lỗi giao tiếp liên văn hoá.","why":"Bạn làm với team Hàn, có thể cả Mỹ, Nhật, Ấn. Cùng một câu tiếng Anh mang nghĩa khác nhau tuỳ văn hoá. Hiểu được điều này quan trọng hơn phát âm hoàn hảo.","scene":"Ba tình huống nghe hiểu tín hiệu gián tiếp.","dlg":[{"s":"Tình huống 1","en":"That's an interesting idea. Let me think about it and get back to you.","vi":"Ở nhiều nền văn hoá, câu này thường có nghĩa: chưa thuyết phục. Đừng coi là đã đồng ý."},{"s":"Tình huống 2","en":"It might be a bit difficult for us.","vi":"Trong ngữ cảnh Hàn/Nhật, đây thường là lời từ chối lịch sự, không phải một chút khó."},{"s":"Tình huống 3","en":"I hear what you're saying, but ~","vi":"Người Anh/Mỹ dùng câu này khi họ KHÔNG đồng ý. Phần quan trọng nằm sau chữ but."},{"s":"Bạn nên hỏi","en":"Just so I understand — is that a no, or something we could revisit later?","vi":"Để tôi hiểu rõ — đó là không, hay là việc mình có thể xem lại sau?"},{"s":"Bạn nên nói","en":"In my experience, being direct saves us both time — so let me be clear about where I stand.","vi":"Theo kinh nghiệm của tôi, nói thẳng tiết kiệm thời gian cho cả hai — nên để tôi nói rõ quan điểm."},{"s":"An toàn để nói","en":"How do you usually handle this on your side? I'd rather follow your process than guess.","vi":"Bên bạn thường xử lý việc này thế nào? Tôi muốn theo quy trình của bạn hơn là tự đoán."}],"chunks":[{"en":"Let me think about it and get back to you.","vi":"Để tôi nghĩ rồi trả lời bạn.","n":"Bạn cũng có thể dùng câu này. Nó là cách trì hoãn hợp lệ, không phải né tránh."},{"en":"It might be a bit difficult.","vi":"Có thể hơi khó.","n":"Học để NGHE hiểu. Khi khách hàng nói câu này, thường là không."},{"en":"I hear what you're saying, but ~","vi":"Tôi hiểu ý bạn, nhưng ~","n":"Phần thật nằm sau but. Đừng dừng ở nửa đầu câu."},{"en":"Is that a no, or something we could revisit?","vi":"Đó là không, hay việc có thể xem lại?","n":"Câu làm rõ tín hiệu mơ hồ. Hỏi thẳng nhưng có cho hai đường."},{"en":"let me be clear about where I stand","vi":"để tôi nói rõ quan điểm của mình","n":"Cách chuyển sang nói thẳng mà báo trước, nên không ai bị sốc."},{"en":"How do you usually handle this on your side?","vi":"Bên bạn thường xử lý việc này thế nào?","n":"Câu hỏi vàng trong làm việc đa văn hoá. Nó tránh được vô số giả định sai."},{"en":"I'd rather follow your process than guess.","vi":"Tôi muốn theo quy trình của bạn hơn là đoán.","n":"would rather A than B. Thể hiện tôn trọng mà vẫn chủ động."},{"en":"Correct me if I'm wrong, but ~","vi":"Sửa tôi nếu tôi sai, nhưng ~","n":"Cách nêu giả định của mình để người ta xác nhận. An toàn ở mọi văn hoá."}],"gram":{"t":"Nói gián tiếp và mức độ trực tiếp","rule":"Không có mức đúng tuyệt đối. Với đồng nghiệp Hà Lan hay Đức, quá gián tiếp bị coi là không rõ ràng. Với đồng nghiệp Nhật hay Hàn, quá trực tiếp có thể bị coi là thiếu tôn trọng. Cách an toàn: nói thẳng về nội dung, mềm về hình thức. Nội dung rõ ràng, câu chữ lịch sự.","pairs":[{"a":"This won't work.","b":"I don't think this will work, and here's the specific reason.","n":"B rõ về nội dung nhưng mềm về hình thức. Dùng được ở gần như mọi nơi."},{"a":"Maybe we could possibly consider perhaps changing it.","b":"I'd suggest changing it. Here's why.","n":"A quá gián tiếp đến mức người nghe không biết bạn muốn gì. Đó cũng là một lỗi."},{"a":"I'd rather do it on the server than in the browser.","b":"I prefer server.","n":"would rather A than B là mẫu câu chuẩn để nêu ưu tiên có so sánh."}],"more":"Cụm an toàn ở mọi văn hoá: I'd suggest / My recommendation would be / From what I've seen / Correct me if I'm wrong. Chúng rõ ràng mà không áp đặt."},"fix":[{"bad":"Khách nói 'It might be a bit difficult' → bạn hiểu là hơi khó và vẫn tiếp tục đẩy.","good":"Nghe câu đó, hỏi lại: Is that a no, or something we could revisit later?","why":"Đây không phải lỗi ngữ pháp mà là lỗi nghe hiểu văn hoá — và nó đắt hơn mọi lỗi ngữ pháp."},{"bad":"You must do it this way.","good":"My recommendation would be to do it this way — happy to hear if you see it differently.","why":"must với đối tác ngoài team gần như luôn quá mạnh, bất kể văn hoá nào."},{"bad":"I'd rather to work on the server.","good":"I'd rather work on the server.","why":"Sau would rather là động từ nguyên mẫu không to."}],"pron":{"t":"Nghe hiểu các accent khác nhau","tip":"Bạn sẽ nghe tiếng Anh của người Hàn, Ấn, Nhật, Đức nhiều hơn của người Mỹ. Đừng chỉ luyện nghe accent Mỹ. Nghe podcast kỹ thuật có khách mời quốc tế 10 phút mỗi ngày. Kỹ năng nghe accent đa dạng có giá trị hơn phát âm hoàn hảo.","words":["Nghe: Indian English tech talks","Nghe: Korean/Japanese engineers","Nghe: European English","Chấp nhận: không cần accent Mỹ"]},"quiz":[{"q":"Khách hàng nói 'It might be a bit difficult for us.' Nghĩa thường là:","o":["Hơi khó nhưng làm được","Đây là lời từ chối lịch sự","Họ cần thêm thông tin"],"a":1,"e":"Ở nhiều nền văn hoá Đông Á, đây là cách nói không. Nên hỏi lại để làm rõ."},{"q":"Chọn câu đúng:","o":["I'd rather to use the server.","I'd rather use the server.","I'd rather using the server."],"a":1,"e":"would rather + động từ nguyên mẫu không to."},{"q":"Nghe 'I hear what you're saying, but...' nghĩa là:","o":["Họ đồng ý","Họ không đồng ý","Họ chưa hiểu"],"a":1,"e":"Đây là cách phản đối lịch sự. Nội dung thật nằm sau but."},{"q":"Câu hỏi hữu ích nhất khi làm việc với văn hoá khác:","o":["Is that OK?","How do you usually handle this on your side?","Do you understand?"],"a":1,"e":"Nó cho bạn biết quy trình thật của họ thay vì phải đoán, và thể hiện tôn trọng."}],"task":{"say":"Luyện 5 câu làm rõ tín hiệu: Is that a no, or something we could revisit? / Just so I understand... / Correct me if I'm wrong... / How do you usually handle this? / Let me be clear about where I stand.","write":"Viết lại 3 lần bạn từng hiểu sai ý khách hàng. Với mỗi lần, viết câu hỏi làm rõ mà bạn nên đã dùng."},"zen":"Tiếng Anh chỉ là lớp bề mặt. Bên dưới nó là kỳ vọng văn hoá về mức độ trực tiếp, về cách nói không, về ai được nói trước. Người giao tiếp giỏi nhất không phải người nói hay nhất — mà người đọc được lớp bên dưới."},{"d":30,"phase":6,"t":"Ngày cuối: kiểm tra tổng và kế hoạch 90 ngày","goal":"Chứng minh với chính mình rằng bạn dùng được, rồi thiết lập cơ chế để không tụt lại.","why":"Ba mươi ngày đủ để xây bộ khung. Nó không đủ để thành thạo — và không ai hứa với bạn điều đó. Việc quan trọng nhất hôm nay không phải bài kiểm tra, mà là quyết định bạn làm gì từ ngày 31.","scene":"Một ngày làm việc mô phỏng, dùng lại toàn bộ 29 ngày trước.","dlg":[{"s":"09:00 Standup","en":"Yesterday I finished the resize logic and opened a PR. Today I'm on HEIC conversion. One blocker: I'm still waiting on the storage config.","vi":"Hôm qua tôi xong phần resize và mở PR. Hôm nay tôi làm phần HEIC. Một vướng mắc: tôi vẫn đang chờ storage config."},{"s":"10:30 Slack","en":"Hey Jun — quick one: could you send over the storage config when you get a chance? It's blocking the HEIC work, so today would be ideal.","vi":"Chào Jun — nhanh thôi: bạn gửi storage config khi nào rảnh nhé? Nó đang chặn phần HEIC, nên hôm nay là lý tưởng."},{"s":"13:00 Họp","en":"Sorry to jump in — one risk with client-side conversion: the output isn't consistent across browsers. What if the server handled the final step?","vi":"Xin lỗi chen vào — một rủi ro với convert ở client: output không nhất quán giữa các browser. Hay là server làm bước cuối?"},{"s":"14:00 Estimate","en":"Off the top of my head, two to three days, depending on whether we need Excel formatting. I'll confirm after I look at the data model tomorrow.","vi":"Nghĩ nhanh thì hai đến ba ngày, tuỳ có cần format Excel không. Tôi sẽ xác nhận sau khi xem data model ngày mai."},{"s":"16:00 Tin xấu","en":"I want to flag this early: the release will slip by two days. The demo is still safe. Two options — ship without HEIC on Friday, or ship everything Tuesday. I'd recommend the second.","vi":"Tôi muốn báo sớm: bản release sẽ trễ hai ngày. Buổi demo vẫn an toàn. Hai phương án — ship không có HEIC vào thứ Sáu, hoặc ship đủ vào thứ Ba. Tôi nghiêng phương án hai."},{"s":"17:30 Chốt","en":"Let me recap the action items. I'll update the spec by tomorrow noon. Jun, you're confirming the config by Thursday. We're meeting again Tuesday. I'll send notes right after this.","vi":"Để tôi tóm lại việc cần làm. Tôi cập nhật spec trước trưa mai. Jun xác nhận config trước thứ Năm. Chúng ta gặp lại thứ Ba. Tôi gửi biên bản ngay sau đây."}],"chunks":[{"en":"Kế hoạch 90 ngày — bước 1","vi":"Mỗi ngày: nói standup thật bằng tiếng Anh, thành tiếng, dù team bạn nói tiếng Việt. 45 giây, không bỏ ngày nào.","n":"Đây là bài tập có ROI cao nhất. Nó lặp lại đúng những cấu trúc bạn cần."},{"en":"Kế hoạch 90 ngày — bước 2","vi":"Mỗi tuần: viết một email hoặc một chuỗi comment review bằng tiếng Anh và gửi thật.","n":"Văn bản là nơi bạn có thời gian nghĩ, nên nó là nơi trình độ tăng nhanh nhất."},{"en":"Kế hoạch 90 ngày — bước 3","vi":"Mỗi tuần: nói một câu có nội dung trong một buổi họp tiếng Anh. Một câu. Ghi lại là đã làm.","n":"Đây là bước khó nhất và cũng là bước duy nhất tạo ra thay đổi thật."},{"en":"Kế hoạch 90 ngày — bước 4","vi":"Mỗi tuần: nghe 30 phút kỹ thuật bằng tiếng Anh với accent không phải Mỹ.","n":"Nghe được accent đa dạng quan trọng hơn phát âm hoàn hảo."},{"en":"Kế hoạch 90 ngày — bước 5","vi":"Mỗi tháng: kể lại một sự cố hoặc một quyết định kỹ thuật trong 90 giây, tự ghi âm, tự nghe lại.","n":"Nghe lại giọng mình là cách tự sửa nhanh nhất, dù khó chịu."},{"en":"Cách dùng lại tài liệu này","vi":"Mở lại ngày 4, 14, 21, 23 mỗi tháng một lần. Đó là bốn ngày có giá trị lâu dài nhất: hỏi lại, diễn đạt lại, nêu trade-off, báo tin xấu.","n":"Ôn lại có chọn lọc hiệu quả hơn học thêm nội dung mới."},{"en":"Chỉ số cần theo dõi","vi":"Không đo bằng cảm giác tự tin. Đo bằng: số câu bạn nói trong họp mỗi tuần, số email tiếng Anh bạn gửi, số lần bạn hỏi lại thay vì cười trừ.","n":"Cảm giác lên xuống. Số đếm thì không nói dối."},{"en":"Điều cuối cùng","vi":"Bạn không cần chờ tới lúc giỏi để bắt đầu dùng. Việc dùng chính là cách trở nên giỏi.","n":"Đây là câu duy nhất trong 30 ngày mà bạn nên nhớ nếu quên hết những câu khác."}],"gram":{"t":"Tổng kiểm tra: bảy quyết định ngữ pháp của cả khoá","rule":"Toàn bộ 30 ngày gói lại thành bảy quyết định. Nếu bạn quyết đúng bảy chỗ này, ngữ pháp của bạn đủ cho hầu hết công việc quốc tế.","pairs":[{"a":"I work on X / I'm working on Y","b":"Vai trò lâu dài vs. việc tạm thời","n":"Ngày 1"},{"a":"I fixed it yesterday / I've fixed it","b":"Có mốc quá khứ vs. kết quả tính đến giờ","n":"Ngày 6"},{"a":"by Friday / until Friday","b":"Hạn chót vs. khoảng thời gian","n":"Ngày 5"},{"a":"a proxy / the proxy / feedback","b":"Lần đầu nhắc vs. đã biết vs. không đếm được","n":"Ngày 2"},{"a":"That won't work / That might not work","b":"Phán xét vs. đề xuất","n":"Ngày 12"},{"a":"If we add it, we'll be late","b":"Không dùng will sau if","n":"Ngày 21"},{"a":"it had been failing since noon","b":"Việc xảy ra trước một mốc quá khứ khác","n":"Ngày 26"}],"more":"Chú ý: trong bảy quyết định này không có câu nào cần bạn thuộc bảng chia động từ. Ngữ pháp dùng được là ngữ pháp gắn với một quyết định giao tiếp cụ thể."},"fix":[{"bad":"Học xong 30 ngày rồi nghỉ, chờ khi nào cần thì dùng.","good":"Từ ngày 31, mỗi ngày nói standup 45 giây bằng tiếng Anh, thành tiếng.","why":"Ngôn ngữ không được dùng sẽ mờ đi trong khoảng sáu tuần. Cơ chế duy trì quan trọng hơn khoá học."},{"bad":"Chờ đến khi tự tin rồi mới nói trong họp.","good":"Nói một câu trong buổi họp tiếng Anh gần nhất, dù còn thấy chưa sẵn sàng.","why":"Tự tin là hệ quả của việc đã làm, không phải điều kiện để bắt đầu. Thứ tự nhân quả này rất nhiều người hiểu ngược."},{"bad":"Học thêm 3000 từ vựng để nghe hiểu tốt hơn.","good":"Luyện lại 100 cụm trong tài liệu này cho đến khi không phải nghĩ.","why":"Vấn đề của bạn không phải thiếu từ, mà là tốc độ truy xuất. Ít cụm hơn nhưng nhanh hơn thắng nhiều cụm mà chậm."}],"pron":{"t":"Ba việc phát âm cần giữ mãi","tip":"Nếu chỉ giữ được ba thứ từ toàn bộ khoá: (1) bật âm cuối, (2) nói -s và -ed, (3) nhấn trọng âm vào từ mang thông tin. Ba điều này quyết định người ta có phải hỏi lại bạn hay không, nhiều hơn mọi thứ khác.","words":["Âm cuối: build, work, deployed","Đuôi -s: handles, services","Đuôi -ed: fixed /t/, merged /d/, needed /ɪd/","Trọng âm: I'm BLOCKED on the SCHEMA"]},"quiz":[{"q":"Bài tập duy trì có ROI cao nhất sau khoá học:","o":["Học thêm từ vựng mỗi ngày","Nói standup 45 giây bằng tiếng Anh mỗi ngày","Xem phim không phụ đề"],"a":1,"e":"Nó lặp lại đúng những cấu trúc bạn cần trong công việc, mỗi ngày, không tốn thêm thời gian."},{"q":"Chọn câu đúng:","o":["If we will add it, we'll be late.","If we add it, we'll be late.","If we adding it, we late."],"a":1,"e":"Ngày 21. Không dùng will ngay sau if."},{"q":"Chọn câu đúng:","o":["I've fixed it yesterday.","I fixed it yesterday.","I fix it yesterday."],"a":1,"e":"Ngày 6. yesterday là mốc quá khứ cụ thể → quá khứ đơn."},{"q":"Điều quan trọng nhất để tiến bộ tiếp:","o":["Chờ đến khi tự tin hơn rồi dùng","Dùng ngay dù chưa thấy sẵn sàng","Học lại từ đầu cho chắc"],"a":1,"e":"Tự tin là hệ quả của việc dùng, không phải điều kiện. Đây là bài học lớn nhất của 30 ngày."}],"task":{"say":"Diễn lại toàn bộ một ngày làm việc ở trên, không nhìn chữ, bằng nội dung công việc thật của bạn. Bấm giờ 6 phút. Đây là bài kiểm tra cuối.","write":"Viết kế hoạch 90 ngày của bạn: 4 việc, mỗi việc có tần suất cụ thể và cách đo. Rồi đặt lịch nhắc thật trên máy. Kế hoạch không có lịch nhắc thì không phải kế hoạch."},"zen":"Ba mươi ngày trước, bạn muốn tự tin giao tiếp trong công việc. Bạn sẽ không thấy điều đó như một cảm giác đến bất chợt — nó đến dưới dạng một hôm nào đó bạn nói xong một câu trong họp và nhận ra mình đã không kịp lo lắng. Đó là lúc nó đã xảy ra rồi. Giữ chuỗi. Dùng nó. Cảm ơn bạn đã đi hết 30 ngày."}]</script>
<script id="qaData" type="application/json">[{"id":"qa","ab":"Q","t":"Hỏi & Đáp","sub":"Đặt câu hỏi và trả lời — phần hỏng nhiều nhất khi đi làm.","units":[{"id":"q1","n":1,"t":"Cỗ máy câu hỏi: đảo trợ động từ lên trước","one":"Tiếng Việt thêm từ vào cuối câu (…không? …chưa? …hả?). Tiếng Anh thì ĐẢO: kéo trợ động từ ra trước chủ ngữ. Nắm được cái này là xong 70% câu hỏi ở công ty.","frame":"(TỪ HỎI) + TRỢ ĐỘNG TỪ + CHỦ NGỮ + ĐỘNG TỪ NGUYÊN MẪU + phần còn lại","note":"Hai loại duy nhất bạn cần: câu hỏi Yes/No (bỏ trống ô TỪ HỎI) và câu hỏi lấy thông tin (điền ô TỪ HỎI). Luật sắt: khi đã có do/does/did đứng trước thì động từ chính về nguyên mẫu — dấu thời gian chỉ được xuất hiện MỘT lần trong câu.","ex":[{"en":"Do you have a minute?","vi":"Bạn có rảnh một phút không?","n":"Yes/No. Trợ động từ do nhảy lên đầu, have giữ nguyên mẫu."},{"en":"Did you push the fix?","vi":"Bạn đã push bản sửa chưa?","n":"did đã mang nghĩa quá khứ nên push KHÔNG thành pushed."},{"en":"What did you change?","vi":"Bạn đã sửa những gì?","n":"Thêm từ hỏi vào trước, trật tự sau đó y nguyên."},{"en":"When does the sprint end?","vi":"Sprint kết thúc khi nào?","n":"Chủ ngữ số ít the sprint nên dùng does, và end về nguyên mẫu."},{"en":"How long will it take?","vi":"Sẽ mất bao lâu?","n":"will là trợ động từ có sẵn, chỉ cần đảo lên trước it."},{"en":"Can we move the meeting to 4?","vi":"Mình dời họp sang 4 giờ được không?","n":"can đảo lên trước we. Cách đề xuất nhẹ nhàng nhất."}],"fix":[{"bad":"You can help me with this?","good":"Can you help me with this?","why":"Nói câu kể rồi lên giọng ở cuối là thói quen từ tiếng Việt. Người nghe hiểu, nhưng nghe như bạn chưa học ngữ pháp. Đảo can lên trước là xong."},{"bad":"What you think about this approach?","good":"What do you think about this approach?","why":"Thiếu do. Sau từ hỏi luôn phải có một trợ động từ trước khi tới chủ ngữ — trừ trường hợp từ hỏi chính là chủ ngữ (xem đơn vị 3)."},{"bad":"Did you went to the meeting?","good":"Did you go to the meeting?","why":"Hai dấu quá khứ trong một câu. did đã làm việc đó rồi, go phải về nguyên mẫu."},{"bad":"Is it work on your machine?","good":"Does it work on your machine?","why":"work ở đây là động từ thường, không phải tính từ, nên trợ động từ phải là does chứ không phải is. Câu dùng is chỉ đúng khi sau nó là danh từ hoặc tính từ: Is it ready?"}],"drills":[{"type":"order","ans":"Do you have a minute?","hint":"Bạn có rảnh một phút không?","ansTokens":["do","you","have","a","minute"],"chips":["minute","do","a","you","have"]},{"type":"order","ans":"Did you get my message?","hint":"Bạn nhận được tin của tôi chưa?","ansTokens":["did","you","get","my","message"],"chips":["get","my","you","message","did"]},{"type":"order","ans":"Can you take a look at my PR?","hint":"Bạn xem giúp PR của tôi được không?","ansTokens":["can","you","take","a","look","at","my","PR"],"chips":["you","take","at","look","PR","my","can","a"]},{"type":"order","ans":"What time does the call start?","hint":"Cuộc gọi bắt đầu mấy giờ?","ansTokens":["what","time","does","the","call","start"],"chips":["time","does","start","the","call","what"]},{"type":"order","ans":"How long will the deploy take?","hint":"Việc deploy sẽ mất bao lâu?","ansTokens":["how","long","will","the","deploy","take"],"chips":["the","take","will","how","deploy","long"]},{"type":"order","ans":"Why did the build fail?","hint":"Tại sao bản build lỗi?","ansTokens":["why","did","the","build","fail"],"chips":["build","the","fail","did","why"]},{"type":"fix","bad":"You have the design file?","ans":"Do you have the design file?","why":"Câu Yes/No với động từ thường ở hiện tại thì cần do/does dẫn đầu."},{"type":"fix","bad":"Where you put the config?","ans":"Where did you put the config?","why":"Sau từ hỏi phải có trợ động từ. Hành động đã xảy ra nên dùng did, và put giữ nguyên mẫu."},{"type":"fix","bad":"Does the tests passed?","ans":"Did the tests pass?","why":"Hai lỗi: tests số nhiều nên không dùng does, và đã có trợ động từ thì pass về nguyên mẫu. Muốn nói hiện tại thì viết Do the tests pass?"},{"type":"transform","prompt":"You reviewed the PR.","ans":"Did you review the PR?","alt":["did you review the pr"],"why":"Chuyển câu kể quá khứ thành câu hỏi: thêm did lên đầu, đưa động từ về nguyên mẫu."},{"type":"transform","prompt":"The API returns a token.","ans":"Does the API return a token?","alt":["does the api return a token"],"why":"Chủ ngữ số ít nên does, và chữ s của returns chuyển sang does."},{"type":"transform","prompt":"We can ship it today.","ans":"Can we ship it today?","alt":["can we ship it today"],"why":"Đã có can nên chỉ cần đảo can ra trước chủ ngữ, không thêm do."},{"type":"pick","q":"Câu nào đúng ngữ pháp?","o":["Why you didn't tell me earlier?","Why didn't you tell me earlier?","Why did not you tell me earlier?","Why you not told me earlier?"],"a":1,"e":"Dạng viết tắt didn't đứng ngay sau từ hỏi rồi mới đến chủ ngữ. Nếu viết đầy đủ thì phải là Why did you not tell me earlier? — nghe rất trang trọng, ít dùng khi nói."},{"type":"pick","q":"Chọn câu tự nhiên nhất khi bạn muốn xin thêm thời gian trong standup.","o":["I can have one more day?","Can I have one more day?","Do I can have one more day?","I have one more day, can?"],"a":1,"e":"can đảo lên trước I. Không bao giờ ghép do với can — một câu chỉ có một trợ động từ."}]},{"id":"q2","n":2,"t":"Chọn đúng trợ động từ trong hai giây","one":"Đừng học thuộc bảng. Chỉ cần soi câu kể gốc rồi hỏi: trong đó đã có sẵn trợ động từ nào chưa?","frame":"Có be (am/is/are/was/were)? → đảo be. Có can/will/should/would/have/has? → đảo nó. Không có gì cả? → thêm do / does / did.","note":"Ba nhánh, hết. Nhánh thứ ba là nhánh duy nhất bạn phải tự sinh ra trợ động từ, và cũng là nhánh mà người Việt hay quên nhất. Mẹo nhớ: does và did đã giữ hết dấu thời gian, nên động từ đằng sau luôn trần trụi.","ex":[{"en":"Are you free at three?","vi":"Ba giờ bạn rảnh không?","n":"Câu gốc You are free → có be, đảo be."},{"en":"Is the staging environment up?","vi":"Môi trường staging đang chạy chứ?","n":"Sau be là tính từ up, nên be là lựa chọn đúng."},{"en":"Have you seen the ticket?","vi":"Bạn xem cái ticket chưa?","n":"Câu gốc You have seen → have là trợ động từ có sẵn, đảo have."},{"en":"Do you have the credentials?","vi":"Bạn có thông tin đăng nhập không?","n":"Ở đây have là động từ chính mang nghĩa sở hữu, không phải trợ động từ, nên vẫn cần do."},{"en":"Should we roll back?","vi":"Mình có nên roll back không?","n":"Cách hỏi ý kiến gọn nhất. should đảo lên trước we."},{"en":"Was the bug reproducible on your side?","vi":"Lỗi đó bên bạn tái hiện được không?","n":"Câu gốc quá khứ với be → đảo was."}],"fix":[{"bad":"Are you have time this afternoon?","good":"Do you have time this afternoon?","why":"Một câu không thể có hai trợ động từ. have ở đây là động từ chính nghĩa sở hữu, nên trợ động từ đúng là do."},{"bad":"Do you can join the call?","good":"Can you join the call?","why":"can tự nó đã là trợ động từ. Ghép do vào là thừa. Nguyên tắc: mỗi câu hỏi có đúng một trợ động từ."},{"bad":"Did you have finished the migration?","good":"Have you finished the migration?","why":"Chọn một: hoặc Did you finish…? (quá khứ đơn, xong hẳn) hoặc Have you finished…? (hiện tại hoàn thành, nhấn kết quả hiện tại). Trong công việc, dạng have thông dụng hơn khi hỏi tiến độ."}],"drills":[{"type":"pick","q":"Điền trợ động từ: ___ the endpoint return 200?","o":["Is","Does","Do","Has"],"a":1,"e":"return là động từ thường, chủ ngữ the endpoint số ít → does. Nếu chọn is thì phải viết Is the endpoint returning 200?"},{"type":"pick","q":"Điền trợ động từ: ___ you available for a quick call?","o":["Do","Does","Are","Have"],"a":2,"e":"available là tính từ, nên câu gốc là You are available → đảo are."},{"type":"pick","q":"Điền trợ động từ: ___ you already merged it?","o":["Did","Are","Have","Do"],"a":2,"e":"merged là dạng V3 đi cùng already → hiện tại hoàn thành, dùng have. Nếu chọn Did thì phải bỏ already và viết Did you merge it?"},{"type":"pick","q":"Điền trợ động từ: ___ the client want the dark mode in this release?","o":["Do","Does","Is","Did"],"a":1,"e":"the client là số ít nên does, và want về nguyên mẫu."},{"type":"pick","q":"Câu nào SAI?","o":["Can you send me the link?","Have you got a minute?","Do you can review this today?","Are you on the call already?"],"a":2,"e":"do và can không đi cùng nhau. Ba câu còn lại đều dùng đúng một trợ động từ."},{"type":"order","ans":"Is the design ready for review?","hint":"Bản design đã sẵn sàng để review chưa?","ansTokens":["is","the","design","ready","for","review"],"chips":["for","is","review","the","ready","design"]},{"type":"order","ans":"Have you talked to the backend team?","hint":"Bạn đã nói chuyện với team backend chưa?","ansTokens":["have","you","talked","to","the","backend","team"],"chips":["to","backend","have","you","team","talked","the"]},{"type":"order","ans":"Should we split this into two tickets?","hint":"Mình có nên tách việc này thành hai ticket không?","ansTokens":["should","we","split","this","into","two","tickets"],"chips":["we","this","tickets","two","into","should","split"]},{"type":"order","ans":"Was there a reason for the delay?","hint":"Có lý do gì cho việc trễ hạn không?","ansTokens":["was","there","a","reason","for","the","delay"],"chips":["was","a","the","delay","reason","there","for"]},{"type":"transform","prompt":"You are working on the login page.","ans":"Are you working on the login page?","alt":["are you working on the login page"],"why":"Có be trong câu gốc nên chỉ đảo are, không thêm do."},{"type":"transform","prompt":"She has updated the document.","ans":"Has she updated the document?","alt":["has she updated the document"],"why":"has là trợ động từ có sẵn, đảo has và giữ updated."},{"type":"transform","prompt":"The team needs more time.","ans":"Does the team need more time?","alt":["does the team need more time"],"why":"Không có trợ động từ sẵn nên thêm does, và chữ s của needs chuyển sang does."},{"type":"fix","bad":"Is you know the status?","ans":"Do you know the status?","why":"know là động từ thường nên trợ động từ là do. is không bao giờ đi với you."},{"type":"fix","bad":"Have the tests pass?","ans":"Have the tests passed?","why":"Sau have/has phải là dạng V3 (passed), không phải nguyên mẫu. Nếu muốn nguyên mẫu thì đổi trợ động từ: Did the tests pass?"}]},{"id":"q3","n":3,"t":"Bảy từ hỏi và cái bẫy khi từ hỏi chính là chủ ngữ","one":"Khi who hoặc what chính là người/thứ gây ra hành động, câu hỏi KHÔNG đảo và KHÔNG có do. Nó giữ y nguyên trật tự câu kể.","frame":"Hỏi về chủ ngữ: WHO / WHAT + ĐỘNG TỪ ĐÃ CHIA (không do, không đảo) — Who broke the build? Hỏi về tân ngữ: WHO / WHAT + do/did + S + V — Who did you ask?","note":"Đây là ngoại lệ duy nhất của cỗ máy ở đơn vị 1, và nó xuất hiện liên tục trong công việc: ai làm việc này, cái gì gây ra lỗi, phần nào bị ảnh hưởng. Ngoài ra nhớ nhóm how: how long (bao lâu), how many / how much (bao nhiêu), how often (mấy lần), how soon (bao lâu nữa), how come (sao lại thế — và how come thì giữ trật tự câu kể).","ex":[{"en":"Who broke the build?","vi":"Ai làm hỏng bản build?","n":"who là chủ ngữ, nên động từ chia luôn ở quá khứ, không có did."},{"en":"Who did you ask about this?","vi":"Bạn đã hỏi ai về việc này?","n":"Ở đây who là tân ngữ (bạn hỏi ai) nên phải có did và đảo bình thường."},{"en":"What caused the outage?","vi":"Cái gì gây ra sự cố?","n":"what là chủ ngữ. Không viết What did cause… trừ khi muốn nhấn giọng phản bác."},{"en":"Which service is down?","vi":"Service nào đang chết?","n":"which + danh từ cũng làm chủ ngữ được, dùng khi có một tập lựa chọn hữu hạn."},{"en":"How often does this happen?","vi":"Chuyện này xảy ra thường xuyên cỡ nào?","n":"how often không phải chủ ngữ nên vẫn cần does và happen nguyên mẫu."},{"en":"How come the staging build is green?","vi":"Sao bản staging lại xanh được nhỉ?","n":"how come là ngoại lệ dễ thương: sau nó giữ nguyên trật tự câu kể, không đảo."}],"fix":[{"bad":"Who did break the build?","good":"Who broke the build?","why":"who là chủ ngữ nên không cần did. Câu sai này chỉ đúng khi bạn nhấn giọng để phản bác điều ai đó vừa nói — nghe khá gay gắt, tránh dùng trong họp."},{"bad":"What did happen after the deploy?","good":"What happened after the deploy?","why":"Cùng một lỗi: what là chủ ngữ. Đây là câu bạn sẽ hỏi rất nhiều khi debug, nên sửa dứt điểm cho sạch."},{"bad":"How much time it will take?","good":"How much time will it take?","why":"how much time không phải chủ ngữ, nên vẫn phải đảo will lên trước it."},{"bad":"Who is responsible this module?","good":"Who is responsible for this module?","why":"responsible luôn đi với for. Câu này cực kỳ hữu dụng khi bạn cần tìm người đúng để hỏi."}],"drills":[{"type":"pick","q":"Bạn muốn hỏi ai đã sửa cái config. Câu nào đúng?","o":["Who did change the config?","Who changed the config?","Who has change the config?","Who change the config?"],"a":1,"e":"who là chủ ngữ nên động từ chia thẳng ở quá khứ: changed. Không do, không đảo."},{"type":"pick","q":"Bạn muốn hỏi đồng nghiệp là họ đã hỏi ý ai. Câu nào đúng?","o":["Who asked you?","Who did you ask?","Who you asked?","Whom did ask you?"],"a":1,"e":"Ở đây who là tân ngữ nên cần did và đảo. Lưu ý Who asked you? mang nghĩa hoàn toàn khác: ai đã hỏi bạn."},{"type":"pick","q":"Câu nào đúng?","o":["What make the page slow?","What does make the page slow?","What makes the page slow?","What is make the page slow?"],"a":2,"e":"what là chủ ngữ số ít nên động từ chia thành makes. Đây là cách hỏi nguyên nhân gọn nhất."},{"type":"pick","q":"Điền: ___ of these two options is cheaper to maintain?","o":["What","Which","How","Who"],"a":1,"e":"which dùng khi có một tập lựa chọn xác định. what dùng khi khả năng là mở."},{"type":"order","ans":"Who owns this service?","hint":"Ai phụ trách service này?","ansTokens":["who","owns","this","service"],"chips":["who","this","owns","service"]},{"type":"order","ans":"What broke the pipeline yesterday?","hint":"Cái gì làm hỏng pipeline hôm qua?","ansTokens":["what","broke","the","pipeline","yesterday"],"chips":["pipeline","what","the","yesterday","broke"]},{"type":"order","ans":"How often do you release to production?","hint":"Các bạn release lên production bao lâu một lần?","ansTokens":["how","often","do","you","release","to","production"],"chips":["production","to","often","you","do","release","how"]},{"type":"order","ans":"How soon can you get back to me?","hint":"Bao lâu nữa bạn phản hồi được cho tôi?","ansTokens":["how","soon","can","you","get","back","to","me"],"chips":["can","soon","to","you","back","how","me","get"]},{"type":"order","ans":"Which team is handling the migration?","hint":"Team nào đang xử lý việc migration?","ansTokens":["which","team","is","handling","the","migration"],"chips":["migration","is","which","the","handling","team"]},{"type":"transform","prompt":"Hỏi về chủ ngữ: Someone approved the PR.","ans":"Who approved the PR?","alt":["who approved the pr"],"why":"Thay someone bằng who và giữ nguyên mọi thứ còn lại. Không thêm did."},{"type":"transform","prompt":"Hỏi về tân ngữ: You told someone about the delay.","ans":"Who did you tell about the delay?","alt":["who did you tell about the delay","whom did you tell about the delay"],"why":"someone là tân ngữ nên phải đảo và thêm did. Dạng whom đúng ngữ pháp nhưng nghe cổ, ít dùng khi nói."},{"type":"transform","prompt":"Hỏi về chủ ngữ: Something is blocking the release.","ans":"What is blocking the release?","alt":["what is blocking the release","what's blocking the release"],"why":"what thay cho something và làm chủ ngữ, is blocking giữ nguyên."},{"type":"fix","bad":"Who did wrote this function?","ans":"Who wrote this function?","why":"who là chủ ngữ nên bỏ did, và động từ chia ở quá khứ. Ngoài ra did wrote còn sai kép vì sau did phải là nguyên mẫu."},{"type":"fix","bad":"How long it takes to build?","ans":"How long does it take to build?","why":"Thiếu trợ động từ. how long không phải chủ ngữ nên cần does, và takes về nguyên mẫu."}]},{"id":"q4","n":4,"t":"Câu hỏi gián tiếp: lịch sự hơn, nhưng đừng đảo hai lần","one":"Đây là lỗi ngữ pháp số một của người Việt đi làm. Sau phần mở đầu lịch sự, mệnh đề PHẢI trở về trật tự câu kể. Đảo một lần là đủ.","frame":"Mở đầu lịch sự + TỪ HỎI + CHỦ NGỮ + ĐỘNG TỪ (KHÔNG đảo, KHÔNG do) — Could you tell me where the file is?","note":"Nếu câu hỏi gốc là Yes/No thì không có từ hỏi để dùng, hãy thay bằng if hoặc whether: Do you know if the server is up? Thang lịch sự từ nhẹ đến trang trọng: Any idea… → Do you know… → Could you tell me… → I was wondering if… → Would you mind telling me… Dùng dạng gián tiếp khi hỏi người lạ, hỏi cấp trên, hỏi qua email, hoặc khi câu hỏi trực tiếp nghe như đang chất vấn.","ex":[{"en":"Could you tell me where the config file is?","vi":"Bạn cho tôi biết file config nằm ở đâu được không?","n":"Chú ý is nằm ở CUỐI, không phải where is the config file."},{"en":"Do you know if the API is ready?","vi":"Bạn có biết API xong chưa không?","n":"Câu gốc là Yes/No nên dùng if. Sau if là trật tự câu kể."},{"en":"I was wondering when we could start.","vi":"Tôi đang không rõ khi nào mình có thể bắt đầu.","n":"Dạng cực lịch sự, hay dùng mở đầu email. Không cần dấu hỏi vì hình thức là câu kể."},{"en":"Any idea why the test is flaky?","vi":"Bạn có biết vì sao cái test đó lúc được lúc không?","n":"Dạng ngắn thân mật cho Slack trong team."},{"en":"Would you mind telling me what the deadline is?","vi":"Bạn cho tôi biết deadline là khi nào được không?","n":"Sau mind luôn là V-ing. Rất trang trọng, dùng với người bạn chưa quen."},{"en":"Can you let me know whether this is still needed?","vi":"Bạn cho tôi biết cái này còn cần nữa không nhé.","n":"whether trang trọng hơn if một chút, hay dùng trong văn viết."}],"fix":[{"bad":"Do you know what is the problem?","good":"Do you know what the problem is?","why":"Bạn đã đảo một lần ở Do you know. Mệnh đề sau phải là câu kể: what the problem is. Đây là lỗi hay bị bắt nhất trong phỏng vấn tiếng Anh."},{"bad":"Could you tell me when will it be ready?","good":"Could you tell me when it will be ready?","why":"will phải nằm sau chủ ngữ it. Nghe thử: when it will be ready — nhịp nghe lạ lúc đầu nhưng đó mới là dạng đúng."},{"bad":"Do you know does he have the access?","good":"Do you know if he has the access?","why":"Không bao giờ dùng do/does trong mệnh đề gián tiếp. Câu gốc là Yes/No nên thay bằng if, rồi chia động từ bình thường: he has."},{"bad":"I was wondering that you can help me.","good":"I was wondering if you could help me.","why":"wonder đi với if hoặc từ hỏi, không đi với that. Đổi can thành could cho lịch sự thêm một bậc."}],"drills":[{"type":"transform","prompt":"Where is the document? → làm cho lịch sự bằng Could you tell me…","ans":"Could you tell me where the document is?","alt":["could you tell me where the document is"],"why":"is chuyển ra sau chủ ngữ the document. Không có dạng where is trong mệnh đề gián tiếp."},{"type":"transform","prompt":"When will the fix be deployed? → Do you know…","ans":"Do you know when the fix will be deployed?","alt":["do you know when the fix will be deployed"],"why":"will nằm sau chủ ngữ the fix."},{"type":"transform","prompt":"Is the server up? → Do you know…","ans":"Do you know if the server is up?","alt":["do you know if the server is up","do you know whether the server is up"],"why":"Câu gốc Yes/No không có từ hỏi nên phải thêm if hoặc whether."},{"type":"transform","prompt":"Who is handling this ticket? → Could you tell me…","ans":"Could you tell me who is handling this ticket?","alt":["could you tell me who is handling this ticket"],"why":"Bẫy ngược: who ở đây đã là chủ ngữ nên trật tự vốn đã là câu kể, giữ y nguyên. Không phải câu nào cũng cần đảo lại."},{"type":"transform","prompt":"Did they test it on mobile? → Do you know…","ans":"Do you know if they tested it on mobile?","alt":["do you know if they tested it on mobile","do you know whether they tested it on mobile"],"why":"Bỏ did, thêm if, và chuyển động từ về quá khứ: tested."},{"type":"transform","prompt":"How much does the license cost? → I was wondering…","ans":"I was wondering how much the license costs.","alt":["i was wondering how much the license costs","i was wondering how much the license cost"],"why":"Bỏ does, và chữ s quay về động từ: costs. Câu này kết bằng dấu chấm, không phải dấu hỏi."},{"type":"fix","bad":"Can you tell me where can I find the logs?","ans":"Can you tell me where I can find the logs?","why":"Đảo hai lần. Chỉ Can you tell me được đảo, phần sau về trật tự câu kể: where I can find."},{"type":"fix","bad":"Do you know what time is the meeting?","ans":"Do you know what time the meeting is?","why":"is về cuối, sau chủ ngữ the meeting."},{"type":"fix","bad":"I would like to know that when you can deliver.","ans":"I would like to know when you can deliver.","why":"Có từ hỏi when rồi thì không cần that nữa. Chỉ dùng that khi truyền đạt một câu kể: I would like to know that everything is on track — nhưng câu đó nghe rất lạ, tránh."},{"type":"order","ans":"Could you tell me who I should talk to?","hint":"Bạn cho tôi biết tôi nên nói với ai được không?","ansTokens":["could","you","tell","me","who","I","should","talk","to"],"chips":["could","you","who","me","should","talk","tell","I","to"]},{"type":"order","ans":"Do you know if this is still in scope?","hint":"Bạn có biết việc này còn trong phạm vi công việc không?","ansTokens":["do","you","know","if","this","is","still","in","scope"],"chips":["is","in","still","this","do","if","know","scope","you"]},{"type":"order","ans":"I was wondering if we could push the deadline.","hint":"Tôi đang muốn hỏi liệu mình có thể dời deadline không.","ansTokens":["I","was","wondering","if","we","could","push","the","deadline"],"chips":["push","deadline","was","I","wondering","if","could","we","the"]},{"type":"pick","q":"Câu nào đúng?","o":["Do you know where is he?","Do you know where he is?","Do you know where does he be?","Do you know he is where?"],"a":1,"e":"Trong mệnh đề gián tiếp, chủ ngữ he đứng trước động từ is. Nếu hỏi trực tiếp thì mới là Where is he?"},{"type":"pick","q":"Bạn viết email cho một khách hàng chưa từng gặp, cần biết ngân sách. Chọn câu phù hợp nhất.","o":["What is your budget?","Tell me your budget.","Could you let me know what your budget is?","How much money do you have?"],"a":2,"e":"Dạng gián tiếp làm câu hỏi mềm đi mà vẫn rõ ràng. Câu trực tiếp What is your budget? không sai, nhưng trong email đầu tiên với khách lạ thì nghe khá thẳng."}]},{"id":"q5","n":5,"t":"Câu hỏi xác nhận: right, tag question và câu hỏi phủ định","one":"Ba công cụ để kiểm tra lại điều bạn tưởng là mình đã hiểu đúng — thay vì im lặng rồi làm sai cả buổi chiều.","frame":"An toàn nhất: câu kể + …, right? — Chuẩn hơn: câu khẳng định + tag PHỦ ĐỊNH (You pushed it, didn't you?) và câu phủ định + tag KHẲNG ĐỊNH (You haven't pushed it, have you?)","note":"Tag question dùng lại đúng trợ động từ của câu chính, và đảo dấu. Nếu câu chính không có trợ động từ thì tag lấy do/does/did. Khi bí, cứ dùng right? — nó đúng trong mọi trường hợp và không ai đánh giá bạn. Câu hỏi phủ định (Didn't we agree on Friday?) mang sắc thái nhắc nhở hoặc ngạc nhiên, nên dùng cẩn thận: với cấp trên thì đổi thành I thought we agreed on Friday — did that change?","ex":[{"en":"So the deadline is Friday, right?","vi":"Vậy deadline là thứ Sáu, đúng chứ?","n":"Công cụ dùng được ở mọi lúc. Thêm so ở đầu để báo hiệu bạn đang chốt lại."},{"en":"You've already deployed it, haven't you?","vi":"Bạn đã deploy rồi phải không?","n":"Câu chính dùng have nên tag là haven't."},{"en":"The tests aren't running in CI, are they?","vi":"Test không chạy trong CI, đúng không?","n":"Câu chính phủ định nên tag khẳng định."},{"en":"You handle the mobile side, don't you?","vi":"Bạn phụ trách phần mobile đúng không?","n":"Câu chính không có trợ động từ nên tag lấy don't."},{"en":"Didn't we agree to cut that feature?","vi":"Không phải mình đã đồng ý bỏ tính năng đó rồi sao?","n":"Câu hỏi phủ định: hàm ý tôi khá chắc và tôi hơi ngạc nhiên. Dùng khi bạn thực sự có cơ sở."},{"en":"Oh, you did? What did you change?","vi":"Ồ thế à? Bạn sửa gì?","n":"Echo question: lặp lại trợ động từ để thể hiện bạn đang nghe. Cực rẻ mà cực hiệu quả trong cuộc gọi."}],"fix":[{"bad":"The meeting is at 3, no?","good":"The meeting is at 3, right?","why":"…, no? là cách nói của tiếng Pháp và một số ngôn ngữ khác, không dùng trong tiếng Anh công việc. right? là dạng phổ dụng và an toàn."},{"bad":"You are ready, isn't it?","good":"You're ready, aren't you?","why":"isn't it chỉ dùng khi chủ ngữ là it. Tag phải khớp cả trợ động từ và chủ ngữ của câu chính: you are → aren't you."},{"bad":"You didn't test it, didn't you?","good":"You didn't test it, did you?","why":"Câu chính đã phủ định thì tag phải khẳng định. Hai lần phủ định làm người nghe không biết bạn đang hỏi gì."}],"drills":[{"type":"pick","q":"Chọn tag đúng: The API returns JSON, ___?","o":["isn't it","doesn't it","don't it","didn't it"],"a":1,"e":"Câu chính không có trợ động từ, chủ ngữ số ít the API → doesn't it."},{"type":"pick","q":"Chọn tag đúng: We can't ship without QA, ___?","o":["can we","can't we","do we","could we"],"a":0,"e":"Câu chính phủ định (can't) nên tag khẳng định: can we."},{"type":"pick","q":"Chọn tag đúng: You've seen the mockups, ___?","o":["didn't you","don't you","haven't you","aren't you"],"a":2,"e":"Câu chính dùng have nên tag là haven't you."},{"type":"pick","q":"Chọn tag đúng: The client approved it last week, ___?","o":["didn't they","don't they","haven't they","wasn't it"],"a":0,"e":"Quá khứ đơn, không có trợ động từ sẵn → didn't. Chủ ngữ the client thường được nhắc lại bằng they trong tiếng Anh công việc."},{"type":"pick","q":"Đồng nghiệp nói: I finished the migration last night. Câu echo tự nhiên nhất là gì?","o":["Did you finish?","Oh, did you? Nice.","Are you?","You finished?"],"a":1,"e":"Echo lặp lại đúng trợ động từ của câu vừa nghe (finished → did). Nó báo hiệu bạn đang theo dõi mà không chiếm lượt nói."},{"type":"pick","q":"Bạn nghĩ deadline là thứ Năm nhưng cấp trên vừa nói thứ Ba. Cách hỏi lại an toàn nhất với cấp trên là gì?","o":["Didn't you say Thursday?","I thought it was Thursday — did that change?","You said Thursday, no?","That's wrong, it's Thursday."],"a":1,"e":"Nhận phần không chắc về mình (I thought) rồi hỏi mở. Didn't you say…? nghe như đang bắt lỗi người khác."},{"type":"order","ans":"So we are targeting Friday, right?","hint":"Vậy mình đang nhắm tới thứ Sáu, đúng chứ?","ansTokens":["so","we","are","targeting","Friday,","right"],"chips":["are","targeting","right","so","Friday,","we"]},{"type":"order","ans":"You haven't merged it yet, have you?","hint":"Bạn chưa merge phải không?","ansTokens":["you","haven't","merged","it","yet,","have","you"],"chips":["you","have","it","yet,","you","merged","haven't"]},{"type":"fix","bad":"This is the final version, is it?","ans":"This is the final version, isn't it?","why":"Câu chính khẳng định thì tag phải phủ định. Dạng …, is it? tồn tại nhưng mang sắc thái nghi ngờ hoặc châm biếm — không phải điều bạn muốn trong họp."},{"type":"fix","bad":"You will join the call, will you?","ans":"You will join the call, won't you?","why":"Đảo dấu: will → won't. Dạng …, will you? là câu ra lệnh nhẹ (Close the door, will you?), nghĩa khác hoàn toàn."}]},{"id":"q6","n":6,"t":"Trả lời ngắn: lặp lại trợ động từ, rồi thêm một câu","one":"Câu hỏi hỏi bằng trợ động từ nào, bạn trả lời bằng đúng trợ động từ đó. Và đừng bao giờ dừng ở Yes hoặc No.","frame":"[Yes / No] + [chủ ngữ + trợ động từ] + [MỘT câu thông tin] — Do you have it? → Yes, I do. Ha sent it this morning.","note":"Trả lời trần trụi bằng Yes hay No làm người đối diện phải hỏi tiếp, và trong tiếng Anh nó nghe lạnh hơn bạn tưởng. Một câu thông tin thêm vào là đủ để cuộc hội thoại tự chạy. Với câu hỏi phủ định (Didn't you push it?), hãy trả lời theo SỰ THẬT chứ không theo hình thức câu hỏi: nếu bạn chưa push thì No, not yet. Nếu bạn đã push rồi thì Yes, I did — đúng như khi được hỏi ở dạng khẳng định.","ex":[{"en":"Do you have the design? — Yes, I do. Ha shared it this morning.","vi":"Bạn có bản design chưa? — Có. Hà gửi sáng nay.","n":"do trả lời do. Câu thứ hai làm phần trả lời trở nên hữu ích."},{"en":"Can you finish it today? — I can, but only if the API is ready by noon.","vi":"Hôm nay bạn xong được không? — Được, nhưng chỉ khi API xong trước trưa.","n":"Trả lời có điều kiện: cam kết rõ ràng mà không tự bó tay mình."},{"en":"Have you tested it on Safari? — Not yet. I'll do that after lunch.","vi":"Bạn test trên Safari chưa? — Chưa. Tôi sẽ làm sau bữa trưa.","n":"Not yet mềm hơn No và ngầm hứa sẽ làm."},{"en":"Is the staging build green? — It is now. It was failing an hour ago.","vi":"Bản staging xanh chưa? — Giờ thì xanh rồi. Một tiếng trước còn lỗi.","n":"It is now là dạng trả lời rất tự nhiên, gọn hơn Yes, it is green now."},{"en":"Didn't you push the fix? — I did, but it's on a feature branch.","vi":"Bạn chưa push bản sửa à? — Tôi push rồi, nhưng trên nhánh feature.","n":"Câu hỏi phủ định vẫn trả lời theo sự thật. did trả lời did."},{"en":"Are you blocked on anything? — I am, actually. I need database access.","vi":"Bạn có đang bị vướng gì không? — Thật ra là có. Tôi cần quyền truy cập database.","n":"actually báo hiệu câu trả lời hơi trái với kỳ vọng người hỏi. Cực hữu dụng ở standup."}],"fix":[{"bad":"Do you agree? — Yes, I am agree.","good":"Do you agree? — Yes, I do. I think it's the right call.","why":"agree đã là động từ nên không cần am. Câu hỏi dùng do thì trả lời cũng dùng do."},{"bad":"Can you review it today? — Yes, of course!","good":"Can you review it today? — Sure, I'll get to it before 5.","why":"Yes, of course! không sai nhưng không chứa thông tin nào. Người hỏi vẫn phải hỏi tiếp là khi nào. Thêm một mốc thời gian là xong."},{"bad":"Have you finished? — Yes, I finished.","good":"Have you finished? — Yes, I have. It's ready for review.","why":"Trả lời ngắn phải lặp lại have, không lặp lại động từ chính. Sau đó thêm bước tiếp theo để người hỏi biết phải làm gì."}],"drills":[{"type":"pick","q":"Do you use TypeScript on this project? → Trả lời ngắn đúng là gì?","o":["Yes, I use.","Yes, I do.","Yes, I am.","Yes, I did."],"a":1,"e":"Câu hỏi dùng do thì trả lời ngắn dùng do. Không lặp lại động từ chính."},{"type":"pick","q":"Is the ticket assigned to you? → Trả lời ngắn đúng là gì?","o":["Yes, it does.","Yes, it is.","Yes, it has.","Yes, I am."],"a":1,"e":"Câu hỏi dùng is và chủ ngữ là the ticket nên trả lời là it is."},{"type":"pick","q":"Have the tests passed? → Trả lời ngắn đúng là gì?","o":["Yes, they did.","Yes, they have.","Yes, they are.","Yes, it has."],"a":1,"e":"have trả lời have, và the tests là số nhiều nên dùng they."},{"type":"pick","q":"Could you take this over? → Trả lời tự nhiên nhất khi bạn đồng ý là gì?","o":["Yes, I could.","Sure, I can take it from here.","Yes, I would.","Of course I could."],"a":1,"e":"Với could mang nghĩa đề nghị lịch sự, người bản ngữ trả lời bằng Sure hoặc can, chứ không lặp lại could — lặp lại could nghe như bạn đang nói về khả năng giả định."},{"type":"pick","q":"Didn't you get my message? Bạn thực sự CHƯA nhận được. Trả lời đúng là gì?","o":["Yes, I didn't.","No, I didn't — let me check Slack now.","Yes, I did not receive.","No, I did."],"a":1,"e":"Trả lời theo sự thật: chưa nhận thì No. Không bao giờ ghép Yes với một mệnh đề phủ định."},{"type":"reply","q":"Do you have a minute?","models":["Sure, what's up?","I do, but only about ten minutes — I have a call at 3.","Not right now, sorry. Can I come find you in twenty minutes?"],"why":"Ba mức: đồng ý, đồng ý có điều kiện, từ chối kèm giải pháp. Mức thứ hai và thứ ba là thứ bạn cần nhất khi thật sự đang bận."},{"type":"reply","q":"Have you started on the reporting page yet?","models":["Not yet — I'm finishing the login flow first.","I have, but only the layout. The charts are next.","Yes, I have. It should be ready for review tomorrow."],"why":"Luôn kèm trạng thái tiếp theo. Chỉ nói Not yet mà không nói lý do sẽ khiến người hỏi lo."},{"type":"reply","q":"Can you get this done by Thursday?","models":["I can, as long as the API is ready by Tuesday.","Thursday is tight. I could do a first version by Thursday and polish it Friday.","Not by Thursday, no. Friday afternoon is realistic."],"why":"Cả ba đều là cam kết rõ. Tránh I'll try my best — nó nghe như đồng ý nhưng không hứa gì, và đó là nguồn gốc của phần lớn xung đột về deadline."},{"type":"reply","q":"Are you comfortable presenting this to the client?","models":["I am, yes. I've done the demo internally twice already.","I'd rather not lead it, but I can handle the technical questions.","Honestly, not very. Could we do it together this time?"],"why":"I'd rather not là cách từ chối lịch sự và rõ ràng nhất. Honestly, not very trung thực mà không hạ thấp bản thân."},{"type":"fix","bad":"Do you know this library? — Yes, I know.","ans":"Do you know this library? — Yes, I do. I used it on my last project.","why":"Trả lời ngắn lặp lại do. Yes, I know trong tiếng Anh thường mang nghĩa tôi biết rồi, đừng nói nữa — nghe cắt ngang.","soft":true},{"type":"fix","bad":"Will you be at the demo? — Yes, I will be there, I think, maybe.","ans":"Will you be at the demo? — Yes, I'll be there.","why":"Ba lớp phòng bị chồng lên nhau làm câu trả lời mất hết trọng lượng. Nếu chắc thì nói chắc; nếu không chắc thì chọn một cách rào duy nhất: I should be, yes.","soft":true}]},{"id":"q7","n":7,"t":"Khi bạn không biết, không chắc, hoặc cần vài giây","one":"I don't know là một câu trả lời chết. Thay nó bằng một vị trí trên thang chắc chắn, cộng một bước hành động.","frame":"Chắc chắn → Definitely / Yes, absolutely · Khá chắc → I'm pretty sure… · Nghiêng về → I think… / As far as I know… · Không chắc → I'm not sure, but my guess is… · Không biết → I don't have that off the top of my head — let me check and get back to you.","note":"Câu cuối là câu quý giá nhất trong toàn bộ khoá học này. Nó thừa nhận bạn không biết mà vẫn giữ được uy tín, vì bạn kèm theo một cam kết. Ngoài ra hãy học hai câu đệm thời gian: That's a good question và Let me think for a second — chúng cho bạn ba đến bốn giây để dịch trong đầu mà không tạo ra khoảng lặng khó xử.","ex":[{"en":"That's a good question. Let me think for a second.","vi":"Câu hỏi hay. Để tôi nghĩ một chút.","n":"Bốn giây vàng. Nói chậm, đừng vội."},{"en":"I'm pretty sure it's a caching issue, but let me confirm.","vi":"Tôi khá chắc là vấn đề cache, nhưng để tôi xác nhận lại.","n":"Nêu quan điểm mà vẫn để cửa sửa sai."},{"en":"I don't have that number off the top of my head. I'll send it after this call.","vi":"Con số đó tôi không nhớ ngay được. Tôi sẽ gửi sau cuộc gọi này.","n":"Thay thế hoàn hảo cho I don't know."},{"en":"As far as I know, nothing has changed on our side.","vi":"Theo tôi biết thì bên mình chưa có gì thay đổi.","n":"Rào một cách chuyên nghiệp: đúng theo thông tin tôi có."},{"en":"Just so I understand — are you asking about the mobile view or the desktop one?","vi":"Cho tôi hỏi lại cho rõ — anh đang hỏi về bản mobile hay bản desktop?","n":"Vũ khí tốt nhất khi bạn nghe câu hỏi mà không hiểu ý. Vừa được thêm thời gian, vừa nghe rất chủ động."},{"en":"Actually, it works a bit differently — let me explain.","vi":"Thật ra nó hoạt động hơi khác một chút — để tôi giải thích.","n":"Dùng khi câu hỏi dựa trên một giả định sai. Sửa giả định trước, đừng trả lời câu hỏi sai."}],"fix":[{"bad":"I don't know.","good":"I'm not sure — let me check and get back to you within the hour.","why":"Cùng một sự thật, nhưng bản sửa cho người nghe biết chuyện gì xảy ra tiếp theo. Trong công việc, người ta không phạt bạn vì không biết; người ta phạt vì không có bước kế tiếp."},{"bad":"Sorry, sorry, my English is not good, I don't understand.","good":"Sorry, could you rephrase that? I want to make sure I get it right.","why":"Đừng xin lỗi về trình độ tiếng Anh của mình — nó chuyển sự chú ý từ nội dung sang bạn. Chỉ cần hỏi lại một cách bình thường; người bản ngữ cũng hỏi lại nhau suốt."},{"bad"
