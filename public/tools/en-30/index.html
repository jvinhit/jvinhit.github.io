o việc đẩy một vấn đề lên cấp cao hơn."}],"pool":[{"vi":"Mình gác cái đó lại đã.","en":"Let's park that for now.","ans":"Agreed — I'll add it to the backlog."},{"vi":"Tôi sẽ kéo team backend vào.","en":"I'll loop in the backend team.","ans":"Good idea. Tag Minh, he owns that service."},{"vi":"Bạn dẫn tôi đi qua luồng này được không?","en":"Could you walk me through this flow?","ans":"Sure. Let me share my screen."},{"vi":"Mình chia việc này thành hai ticket nhé.","en":"Let's break this down into two tickets.","ans":"Makes sense. I'll do the split."},{"vi":"Tôi muốn nêu một rủi ro.","en":"I want to flag a risk.","ans":"Go ahead — better now than Thursday."},{"vi":"Nếu hỏng thì mình quay lại bản trước.","en":"If it breaks, we'll roll back.","ans":"Right. Keep the previous build ready."},{"vi":"Tôi nhận việc này, chưa ai làm.","en":"I'll pick this one up — nobody's on it yet.","ans":"Thanks. Assign it to yourself in Jira."},{"vi":"Cái này tôi cần đẩy lên quản lý.","en":"I need to escalate this to my manager.","ans":"Understood. Loop me in on the thread."},{"vi":"Mình đồng bộ lại nhanh 10 phút nhé?","en":"Can we sync for ten minutes?","ans":"Sure — right after standup?"},{"vi":"Tôi cần bạn gỡ vướng cho tôi phần quyền.","en":"I need you to unblock me on access.","ans":"On it. I'll request it now."},{"vi":"Tôi sẽ đào sâu vào phần log.","en":"I'll dig into the logs.","ans":"Thanks. Post anything odd in the channel."},{"vi":"Tôi sẽ bàn giao phần này cho Hà.","en":"I'll hand this off to Ha.","ans":"Please write up where you left off."},{"vi":"Mình cần ước lượng phạm vi trước đã.","en":"We need to scope it first.","ans":"Fair. Give me a day."},{"vi":"Tuần sau mình quay lại chuyện này.","en":"Let's circle back next week.","ans":"Works for me. I'll put it on the agenda."},{"vi":"Cái API cũ sắp bị bỏ.","en":"That old API is being deprecated.","ans":"Good to know. When's the cutoff?"},{"vi":"Tôi sẽ theo dõi tiếp với khách.","en":"I'll follow up with the client.","ans":"Great. Copy me on the email."}],"drills":[{"type":"pick","q":"Bản deploy gây lỗi nặng. Bạn muốn nói quay lại bản trước ngay. Chọn động từ đúng.","o":["roll out","roll back","break down","hand off"],"a":1,"e":"roll back = quay lại phiên bản trước. roll out thì ngược lại: tung ra dần dần cho người dùng."},{"type":"pick","q":"Cuộc họp đang lạc đề. Bạn muốn gác chủ đề đó lại. Chọn cụm đúng.","o":["Let's park that for now.","Let's break that down.","Let's escalate that.","Let's spin that up."],"a":0,"e":"park = gác lại để bàn sau. Thường đi cặp với circle back."},{"type":"pick","q":"Bạn nhận lại một việc mà đồng nghiệp đang làm dở vì họ nghỉ. Chọn động từ đúng.","o":["pick up","take over","take off","hand off"],"a":1,"e":"take over = nhận lại từ tay người khác. pick up dùng khi việc chưa ai làm."},{"type":"pick","q":"Bạn muốn ai đó giải thích cho bạn từng bước một hệ thống. Chọn cụm đúng.","o":["dig into it","walk me through it","loop me in","follow up on it"],"a":1,"e":"walk somebody through something = dẫn ai đó đi qua từng bước."},{"type":"pick","q":"Bạn muốn nêu một rủi ro cho cả team thấy, nhưng chưa cần đẩy lên cấp trên. Chọn động từ đúng.","o":["escalate it","flag it","deprecate it","revert it"],"a":1,"e":"flag = nêu ra để mọi người chú ý. escalate mới là đẩy lên cấp cao hơn."},{"type":"pick","q":"Điền: I'm blocked on database access — could you ___ me?","o":["unblock","break down","hand off","scope"],"a":0,"e":"unblock = gỡ vướng cho ai. Rất thông dụng trong standup."},{"type":"fix","bad":"We will make a release tomorrow and after we will see the result.","ans":"We're shipping tomorrow, and then we'll see how it goes.","why":"make a release nghe lạ; ship hoặc release dùng làm động từ trực tiếp. Và see how it goes là cụm tự nhiên cho chờ xem kết quả."},{"type":"fix","bad":"Let's discuss about this later, now let's continue the meeting.","ans":"Let's park this and circle back later. Moving on.","why":"Bản sửa dùng đúng hai động từ chuyên dụng và thêm Moving on — câu chuyển chủ đề gọn nhất trong họp."},{"type":"order","ans":"Let's park that and circle back next week.","hint":"Mình gác cái đó lại, tuần sau quay lại.","ansTokens":["let's","park","that","and","circle","back","next","week"],"chips":["circle","next","week","back","park","that","let's","and"]},{"type":"order","ans":"Could you walk me through the auth flow?","hint":"Bạn dẫn tôi đi qua luồng auth được không?","ansTokens":["could","you","walk","me","through","the","auth","flow"],"chips":["auth","flow","could","you","me","through","walk","the"]},{"type":"order","ans":"I will loop in the backend team.","hint":"Tôi sẽ kéo team backend vào.","ansTokens":["I","will","loop","in","the","backend","team"],"chips":["will","I","loop","team","the","backend","in"]}]},{"id":"w2","n":2,"t":"Phrasal verb dễ nhầm: đổi giới từ là đổi nghĩa","one":"Phrasal verb là chỗ mà một giới từ sai không làm bạn nghe sai ngữ pháp — nó làm bạn nói ra một nghĩa hoàn toàn khác, và không ai nhận ra để sửa cho bạn.","frame":"look INTO điều tra · look OVER xem qua · look AFTER trông coi — take ON nhận thêm · take OVER nhận lại · take OFF cất cánh, rời đi — put OFF hoãn · put TOGETHER lắp ghép, soạn — run INTO tình cờ gặp · run THROUGH duyệt qua nhanh — come UP xuất hiện · come UP WITH nghĩ ra","note":"Hai cụm cần nhớ riêng vì rất hay dùng: get back to somebody nghĩa là phản hồi lại một người, còn get around to something nghĩa là cuối cùng cũng làm được việc gì sau khi trì hoãn. Và sign off on something nghĩa là chính thức phê duyệt — câu bạn cần khi xin khách chốt.","ex":[{"en":"I'll look into it and get back to you by 4.","vi":"Tôi sẽ điều tra rồi phản hồi lại bạn trước 4 giờ.","n":"look into = điều tra. Cặp look into + get back to là mẫu chuẩn khi bạn chưa có câu trả lời."},{"en":"Could you look over my email before I send it?","vi":"Bạn xem qua email của tôi trước khi tôi gửi nhé?","n":"look over = xem qua nhanh để bắt lỗi. Nhẹ hơn review."},{"en":"We ran into a rate limit on the third-party API.","vi":"Bên mình gặp phải giới hạn số lần gọi ở API bên thứ ba.","n":"run into a problem = tình cờ gặp phải một vấn đề. Rất tự nhiên khi báo cáo trở ngại."},{"en":"Let's run through the agenda quickly before the client joins.","vi":"Mình duyệt nhanh agenda trước khi khách vào nhé.","n":"run through = đi qua nhanh một danh sách."},{"en":"If something comes up, ping me. I'll come up with a workaround.","vi":"Có gì phát sinh thì nhắn tôi. Tôi sẽ nghĩ ra cách xử lý tạm.","n":"come up = phát sinh; come up with = nghĩ ra. Một chữ with đổi hẳn nghĩa."},{"en":"We need the client to sign off on the design before we build.","vi":"Cần khách phê duyệt bản design trước khi bên mình làm.","n":"sign off on = chính thức phê duyệt. Câu này bảo vệ bạn khỏi việc làm lại."}],"fix":[{"bad":"I will look after this bug today.","good":"I'll look into this bug today.","why":"look after nghĩa là trông coi, chăm sóc — dùng cho em bé hoặc thú nuôi. Điều tra một lỗi là look into."},{"bad":"Can you take over one more ticket this sprint?","good":"Can you take on one more ticket this sprint?","why":"take on = nhận thêm việc mới. take over = nhận lại việc từ tay người khác. Câu sai kia làm người nghe tưởng có ai đang bỏ dở."},{"bad":"Sorry, I will put off my answer until tomorrow.","good":"Sorry, I'll get back to you tomorrow.","why":"put off nghĩa là hoãn, và hoãn câu trả lời của chính mình nghe rất tiêu cực. get back to you là cách nói chuẩn và tích cực."}],"drills":[{"type":"pick","q":"Bạn sẽ điều tra một lỗi. Chọn cụm đúng.","o":["look after it","look over it","look into it","look for it"],"a":2,"e":"look into = điều tra. look over = xem qua, look after = trông coi, look for = tìm kiếm."},{"type":"pick","q":"Bạn xin đồng nghiệp đọc nhanh email giúp trước khi gửi. Chọn cụm đúng.","o":["look into it","look over it","look after it","look up it"],"a":1,"e":"look over = xem qua nhanh để bắt lỗi. Nhẹ và thân thiện hơn review."},{"type":"pick","q":"Điền: We ___ an unexpected CORS error during testing.","o":["ran through","ran into","ran over","ran up"],"a":1,"e":"run into a problem = tình cờ gặp phải. run through = duyệt qua nhanh một danh sách."},{"type":"pick","q":"Bạn nghĩ ra một cách xử lý tạm. Chọn cụm đúng.","o":["came up a workaround","came up with a workaround","came with a workaround","came out a workaround"],"a":1,"e":"come up WITH = nghĩ ra. Bỏ with đi thì thành come up = phát sinh, nghĩa khác hẳn."},{"type":"pick","q":"Bạn cần khách chính thức phê duyệt trước khi làm. Chọn cụm đúng.","o":["sign in the design","sign off on the design","sign up the design","sign for the design"],"a":1,"e":"sign off on something = chính thức phê duyệt. Câu này rất đáng học vì nó bảo vệ bạn."},{"type":"pick","q":"Điền: Sorry for the delay — I finally ___ your review this morning.","o":["got back to","got around to","got over","got into"],"a":1,"e":"get around to something = cuối cùng cũng làm được sau khi trì hoãn. Cụm này rất hữu dụng khi xin lỗi vì chậm."},{"type":"fix","bad":"I will take over two more tickets if you need.","ans":"I can take on two more tickets if you need.","why":"take on = nhận thêm việc mới. take over hàm ý nhận lại từ người khác."},{"type":"fix","bad":"Let's run into the agenda before the client joins.","ans":"Let's run through the agenda before the client joins.","why":"run through = duyệt qua. run into = tình cờ gặp phải, thường là vấn đề."},{"type":"fix","bad":"I will look after it and revert to you.","ans":"I'll look into it and get back to you.","why":"Hai lỗi trong một câu ngắn, và cả hai đều rất phổ biến: look after thay vì look into, revert to you thay vì get back to you."},{"type":"order","ans":"I will look into it and get back to you.","hint":"Tôi sẽ điều tra rồi phản hồi lại bạn.","ansTokens":["I","will","look","into","it","and","get","back","to","you"],"chips":["it","you","and","back","will","into","get","I","look","to"]},{"type":"order","ans":"We ran into a problem with the API.","hint":"Bên mình gặp phải một vấn đề với API.","ansTokens":["we","ran","into","a","problem","with","the","API"],"chips":["the","API","ran","with","we","problem","a","into"]}]},{"id":"w3","n":3,"t":"Từ nối và câu dẫn đường: cho người nghe biết bạn đang ở đâu","one":"Điều làm người nghe hiểu bạn không phải là từ vựng khó, mà là những câu báo trước bạn sắp làm gì. Chúng cho não người nghe một cái khung để đặt nội dung của bạn vào.","frame":"MỞ: To start with… / First off… · THÊM: On top of that… / Also… · ĐỔI HƯỚNG: That said… / Having said that… / On the other hand… · LÀM RÕ: In other words… / Just to be clear… · TÓM: Long story short… / To wrap up… · NHƯỜNG ĐIỂM: That's a fair point, but… / To be fair…","note":"Ba câu quan trọng nhất trong danh sách này: Just to be clear… trước khi bạn nói lại điều dễ hiểu sai; That said… khi bạn muốn phản đối mà vẫn tôn trọng điều vừa nghe; và The reason I ask is… để giải thích tại sao bạn hỏi, giúp câu hỏi của bạn không nghe như chất vấn.","ex":[{"en":"To start with, the good news: the migration is done.","vi":"Trước hết là tin tốt: phần migration đã xong.","n":"Báo trước cấu trúc làm người nghe thư giãn và theo dõi được."},{"en":"That said, I'd want to load-test it before we tell the client.","vi":"Dù vậy, tôi muốn test tải trước khi mình nói với khách.","n":"That said = tôi đồng ý phần trên, nhưng có một điểm ngược lại. Cách phản biện lịch sự nhất."},{"en":"Just to be clear — we're not changing the database schema, only the API response.","vi":"Nói cho rõ — mình không đổi schema database, chỉ đổi response của API.","n":"Câu chống hiểu sai. Đáng dùng mỗi lần bạn thấy ai đó gật đầu quá nhanh."},{"en":"That's a fair point, but the trade-off is one extra request per page.","vi":"Điểm đó hợp lý, nhưng cái đánh đổi là thêm một request mỗi trang.","n":"Nhường một điểm trước khi phản biện làm người kia dễ nghe hơn nhiều."},{"en":"Long story short, we need one more day.","vi":"Nói ngắn gọn thì mình cần thêm một ngày.","n":"Dùng khi bạn cảm thấy mình đang giải thích quá dài."},{"en":"The reason I ask is that it affects how I structure the state.","vi":"Lý do tôi hỏi là vì nó ảnh hưởng tới cách tôi tổ chức state.","n":"Câu này biến một câu hỏi có thể nghe như chất vấn thành một câu hỏi hợp tác."}],"fix":[{"bad":"No, I don't agree. The performance will be bad.","good":"That's a fair point. That said, I'm worried about the performance — we'd be adding a request on every page load.","why":"Bản gốc không sai ngữ pháp nhưng đóng cuộc thảo luận lại. Nhường một điểm rồi mới phản biện, và nêu bằng chứng cụ thể thay vì một tính từ chung."},{"bad":"So, so, and then, and after that, and also the API is slow.","good":"There are two issues. First, the query is slow. On top of that, the API adds another two seconds.","why":"Nối câu bằng and liên tục làm người nghe không biết bạn còn nói bao lâu. Nêu số lượng trước rồi đánh số từng điểm."},{"bad":"Why did you choose this library?","good":"Why did you go with this library? The reason I ask is that it affects our bundle size.","why":"Câu hỏi trần trụi về một quyết định của người khác rất dễ nghe như chất vấn. Thêm lý do bạn hỏi là xong."}],"drills":[{"type":"pick","q":"Bạn đồng ý với ý người vừa nói nhưng muốn nêu một điểm ngược lại. Chọn câu mở đầu tốt nhất.","o":["No, but…","That said,…","Anyway,…","Actually, you're wrong,…"],"a":1,"e":"That said giữ được sự tôn trọng với ý vừa nghe rồi mới mở ra điểm ngược lại. Đây là cụm phản biện an toàn nhất trong họp."},{"type":"pick","q":"Bạn thấy khách có thể đang hiểu sai phạm vi. Chọn câu mở đầu tốt nhất.","o":["You are wrong about the scope.","Just to be clear — we're only changing the admin side.","Maybe you don't understand.","As I said before…"],"a":1,"e":"Just to be clear sửa lại hiểu biết mà không chỉ ra là ai hiểu sai."},{"type":"pick","q":"Bạn sắp nêu ba vấn đề. Chọn cách mở tốt nhất.","o":["I have some problems.","There are three issues. First,…","And, and also,…","Many problems, for example…"],"a":1,"e":"Nêu số lượng trước cho người nghe một cái khung, rồi đánh số từng điểm. Đây là kỹ thuật thuyết trình cơ bản nhất mà hiệu quả nhất."},{"type":"pick","q":"Bạn giải thích quá dài và muốn chốt lại. Chọn câu đúng.","o":["Finally end,","Long story short,","In the end of the day,","To resume,"],"a":1,"e":"Long story short = nói ngắn gọn thì. Cụm at the end of the day cũng tồn tại nhưng mang nghĩa xét cho cùng thì, hơi khác."},{"type":"pick","q":"Điền: ___ that it changes how I structure the component.","o":["The reason I ask is","The reason of my question is","Because of I ask","I ask because of"],"a":0,"e":"The reason I ask is that… là dạng cố định. Câu này làm mọi câu hỏi khó nghe nhẹ đi hẳn."},{"type":"fix","bad":"I don't agree with you, this is not good for performance.","ans":"That's a fair point. That said, I'm worried about performance — it adds a request on every page load.","why":"Nhường một điểm, dùng That said để đổi hướng, rồi nêu bằng chứng cụ thể thay vì tính từ chung như not good.","soft":true},{"type":"fix","bad":"Anyway, next thing, and about the deadline, we are late.","ans":"Moving on to the deadline: we're going to be about two days late.","why":"Moving on to là câu chuyển chủ đề gọn và rõ. Và nêu con số cụ thể thay vì we are late.","soft":true},{"type":"order","ans":"Just to be clear, we are not changing the schema.","hint":"Nói cho rõ, mình không đổi schema.","ansTokens":["just","to","be","clear,","we","are","not","changing","the","schema"],"chips":["we","are","clear,","changing","be","not","schema","just","the","to"]},{"type":"order","ans":"That is a fair point, but there is a trade-off.","hint":"Điểm đó hợp lý, nhưng có một sự đánh đổi.","ansTokens":["that","is","a","fair","point,","but","there","is","a","trade-off"],"chips":["trade-off","there","but","is","point,","a","fair","is","that","a"]},{"type":"reply","q":"I think we should just use a table instead of cards on mobile.","models":["That's a fair point — tables are easier to scan. That said, on a 375-pixel screen we'd need horizontal scrolling. Could we try cards first and measure?","Just to be clear, do you mean on mobile only, or everywhere?","I'd go with cards, and here's why: on top of the width problem, tables don't handle the variable-length titles well."],"why":"Câu một nhường điểm rồi phản biện có bằng chứng. Câu hai làm rõ trước khi tranh luận — thường là bước bị bỏ qua. Câu ba nêu quan điểm rồi báo trước là sẽ giải thích."}]}]},{"id":"pron","ab":"F","t":"Phát âm & nhịp","sub":"Âm cuối, đuôi -s/-ed, trọng âm, nối âm.","units":[{"id":"f1","n":1,"t":"Âm cuối và đuôi từ: chỗ người nghe mất bạn","one":"Người nghe bản ngữ dựa vào âm cuối để biết bạn nói số ít hay số nhiều, quá khứ hay hiện tại. Tiếng Việt không phát âm mạnh âm cuối, nên đây là chỗ thông tin của bạn bị rơi mất nhiều nhất.","frame":"Đuôi -S ba cách: /s/ sau âm vô thanh (works, helps) · /z/ sau âm hữu thanh (needs, runs, files) · /ɪz/ sau s, z, sh, ch, ge (fixes, pages, watches) — Đuôi -ED ba cách: /t/ sau âm vô thanh (pushed, fixed) · /d/ sau âm hữu thanh (deployed, moved) · /ɪd/ CHỈ sau t và d (started, updated, tested)","note":"Quy tắc quan trọng nhất về -ed: chỉ có hai âm t và d ở cuối động từ mới làm -ed thành một âm tiết riêng. started có hai âm tiết rưỡi, nhưng fixed chỉ có MỘT âm tiết — đọc là fikst. Người Việt hay đọc fixed thành hai âm tiết, và điều đó làm câu mất nhịp. Ngoài ra chú ý cụm phụ âm cuối: asked đọc là askt, texts đọc gần như teksts — cả hai đều khó, và cách luyện là đọc chậm rồi tăng dần.","ex":[{"en":"He works on three projects and needs more time.","vi":"Anh ấy làm ba dự án và cần thêm thời gian.","n":"works là /s/ vì sau k vô thanh; needs là /z/ vì sau d hữu thanh."},{"en":"She fixes the pages and watches the logs.","vi":"Cô ấy sửa các trang và theo dõi log.","n":"Cả ba đều là /ɪz/ vì đứng sau x, ge, ch — đuôi thành một âm tiết riêng."},{"en":"I pushed the fix and deployed it to staging.","vi":"Tôi đã push bản sửa và deploy lên staging.","n":"pushed là một âm tiết (pusht); deployed cũng một âm tiết (diploid)."},{"en":"We started the migration and updated the docs.","vi":"Bên mình đã bắt đầu migration và cập nhật tài liệu.","n":"Cả hai đều /ɪd/ vì gốc kết thúc bằng t và d — đuôi thành âm tiết riêng."},{"en":"I asked twice and I texted him the details.","vi":"Tôi đã hỏi hai lần và nhắn tin cho anh ấy chi tiết.","n":"asked là askt, một cụm phụ âm khó. texted thì /ɪd/ vì gốc kết thúc bằng t."},{"en":"The tests passed but the builds failed.","vi":"Các test đã pass nhưng các bản build lỗi.","n":"Bốn âm cuối liên tiếp trong một câu ngắn. Đây là câu luyện tốt nhất của cả đơn vị này."}],"fix":[{"bad":"I fix the bug yesterday and push it.","good":"I fixed the bug yesterday and pushed it.","why":"Đây là lỗi phát âm biến thành lỗi ngữ pháp. Vì bạn không phát âm đuôi -ed, tay bạn cũng thôi viết nó. Người nghe không biết bạn đang nói về quá khứ hay hiện tại."},{"bad":"fixed đọc thành fik-sed (hai âm tiết)","good":"fixed đọc thành fikst (một âm tiết)","why":"Chỉ động từ kết thúc bằng t hoặc d mới có đuôi -ed thành âm tiết riêng. fix kết thúc bằng âm s nên đuôi chỉ là một âm t gắn thêm."},{"bad":"started đọc thành startd (một âm tiết)","good":"started đọc thành star-tid (ba âm tiết)","why":"Ngược lại với trường hợp trên: start kết thúc bằng t nên bắt buộc phải có âm tiết -id, nếu không người nghe sẽ nghe thành start."}],"drills":[{"type":"pick","q":"Từ nào có đuôi -ed đọc thành một âm tiết riêng /ɪd/?","o":["pushed","fixed","updated","deployed"],"a":2,"e":"update kết thúc bằng t nên đuôi -ed thành /ɪd/. Ba từ kia chỉ thêm một âm t hoặc d, không thêm âm tiết."},{"type":"pick","q":"Từ nào có đuôi -s đọc là /ɪz/?","o":["works","needs","fixes","runs"],"a":2,"e":"fix kết thúc bằng âm /ks/ nên đuôi -es thành một âm tiết /ɪz/. Cùng nhóm: pages, watches, changes, releases."},{"type":"pick","q":"Từ nào có đuôi -s đọc là /s/ (không phải /z/)?","o":["files","needs","helps","runs"],"a":2,"e":"help kết thúc bằng p vô thanh nên đuôi là /s/. Ba từ kia kết thúc bằng âm hữu thanh nên đuôi là /z/."},{"type":"pick","q":"Từ nào có đuôi -ed đọc là /t/?","o":["tested","needed","asked","added"],"a":2,"e":"ask kết thúc bằng k vô thanh nên đuôi là /t/, đọc askt. Ba từ kia kết thúc bằng t hoặc d nên là /ɪd/."},{"type":"pick","q":"Câu nào có nhiều âm tiết hơn: A hoặc B? A = I fixed it. B = I started it.","o":["A nhiều hơn","B nhiều hơn","Bằng nhau","Không xác định được"],"a":1,"e":"fixed một âm tiết, started hai âm tiết. Nếu bạn đọc cả hai thành hai âm tiết thì fixed đang bị đọc sai."},{"type":"say","text":"The tests passed but the builds failed.","tip":"Bốn âm cuối liên tiếp. Đọc chậm ba lần, phát âm rõ từng đuôi, rồi mới tăng tốc. Nếu bạn nghe thấy test pass build fail thì tất cả bốn đuôi đã bị rơi.","words":["tests","passed","builds","failed"]},{"type":"say","text":"I pushed the fix, updated the docs, and asked Ha to review it.","tip":"Ba đuôi -ed với ba cách đọc khác nhau trong cùng một câu: pusht, upday-tid, askt. Đây là bài luyện có giá trị nhất trong sổ tay này.","words":["pushed","updated","asked"]},{"type":"say","text":"She fixes the pages and releases the changes.","tip":"Bốn đuôi /ɪz/ liên tiếp. Mỗi từ đều dài thêm một âm tiết so với dạng gốc.","words":["fixes","pages","releases","changes"]},{"type":"fix","bad":"I already push and merge it, the test pass.","ans":"I've already pushed and merged it — the tests passed.","why":"Ba đuôi bị rơi. Khi bạn tập phát âm đuôi thành thói quen, tay bạn cũng tự viết đúng — hai kỹ năng này gắn với nhau.","soft":true},{"type":"order","ans":"The tests passed but the builds failed.","hint":"Các test pass nhưng các bản build lỗi.","ansTokens":["the","tests","passed","but","the","builds","failed"],"chips":["tests","the","passed","failed","builds","the","but"]}]},{"id":"f2","n":2,"t":"Nhịp câu: trọng âm, nối âm, và ngắt theo cụm","one":"Tiếng Việt phát âm mỗi âm tiết gần bằng nhau. Tiếng Anh thì nhấn mạnh vài từ và nuốt gần hết phần còn lại. Đây là lý do bạn hiểu từng chữ khi đọc nhưng không nghe ra khi họ nói.","frame":"NHẤN: động từ chính, danh từ, tính từ, số · NUỐT: a, the, of, to, for, is, are, and, that · NGẮT theo cụm nghĩa, không theo dấu phẩy · Câu hỏi Yes/No lên giọng cuối · Câu hỏi WH và câu kể xuống giọng cuối","note":"Hai kỹ thuật cụ thể. Một là nối âm: khi một từ kết thúc bằng phụ âm và từ sau bắt đầu bằng nguyên âm, hai từ dính vào nhau — pick it up nghe như pi-ki-tup, get in touch nghe như ge-tin-touch. Hai là ngắt theo cụm: I think / the main problem / is the caching layer. Ngắt đúng chỗ làm bạn nghe chậm rãi và tự tin, chứ không phải chậm và ngập ngừng.","ex":[{"en":"I NEED the DESIGN before I can START.","vi":"Tôi cần bản design trước khi có thể bắt đầu.","n":"Ba từ mang nội dung được nhấn, phần còn lại nuốt nhẹ. Thử vỗ tay ba lần theo ba từ đó."},{"en":"Could you pick it up after lunch?","vi":"Sau bữa trưa bạn nhận việc đó được không?","n":"pick it up nối thành một khối pi-ki-tup. Đây là lý do bạn không nghe ra ba từ riêng."},{"en":"I think / the main problem / is the caching layer.","vi":"Tôi nghĩ vấn đề chính là tầng cache.","n":"Ba cụm nghĩa. Ngắt ở đó thay vì ngắt ngẫu nhiên giữa câu."},{"en":"Is the API ready? ↗","vi":"API xong chưa?","n":"Câu hỏi Yes/No lên giọng ở cuối. Nếu bạn xuống giọng, người nghe tưởng bạn đang khẳng định."},{"en":"When does the sprint end? ↘","vi":"Sprint kết thúc khi nào?","n":"Câu hỏi có từ hỏi thì xuống giọng ở cuối, giống câu kể."},{"en":"We need three things: access, ↗ credentials, ↗ and the docs. ↘","vi":"Bên mình cần ba thứ: quyền, thông tin đăng nhập, và tài liệu.","n":"Liệt kê thì lên giọng ở từng mục và xuống giọng ở mục cuối. Nó báo cho người nghe biết bạn đã nói hết."}],"fix":[{"bad":"Nhấn đều mọi từ: I - need - the - de-sign - be-fore - I - can - start.","good":"Nhấn ba từ nội dung: I NEED the DESIGN before I can START.","why":"Nhấn đều làm câu nghe như đọc danh sách và làm người nghe mệt. Chọn ba từ quan trọng nhất rồi nhấn chúng, nuốt phần còn lại."},{"bad":"Ngắt theo dấu phẩy trên giấy.","good":"Ngắt theo cụm nghĩa: I think / the main problem / is the caching layer.","why":"Dấu phẩy là quy ước viết. Người nghe cần cụm nghĩa, và cụm nghĩa thường không trùng với dấu phẩy."},{"bad":"Is the API ready? đọc xuống giọng ở cuối.","good":"Is the API ready? ↗ lên giọng ở cuối.","why":"Câu hỏi Yes/No xuống giọng nghe như một câu khẳng định hoặc một lời chất vấn. Đây là lỗi làm người nghe bối rối mà không ai nói cho bạn biết."}],"drills":[{"type":"pick","q":"Trong câu I need the design before I can start, ba từ nào được nhấn?","o":["I, the, can","need, design, start","need, before, can","I, design, I"],"a":1,"e":"Động từ chính và danh từ mang nội dung được nhấn. Đại từ, mạo từ và trợ động từ bị nuốt."},{"type":"pick","q":"Cụm pick it up khi nói nhanh nghe gần nhất với gì?","o":["pick - it - up","pi-ki-tup","pick-i-tup","pi-cit-up"],"a":1,"e":"Phụ âm cuối nối vào nguyên âm đầu của từ sau. Nhận ra hiện tượng này là bước lớn nhất để nghe được tiếng Anh nói tự nhiên."},{"type":"pick","q":"Câu nào PHẢI lên giọng ở cuối?","o":["When does it start?","Is the build green?","I'll send it by five.","Who broke the build?"],"a":1,"e":"Chỉ câu hỏi Yes/No lên giọng. Câu hỏi có từ hỏi và câu kể đều xuống giọng."},{"type":"pick","q":"Chỗ ngắt hợp lý nhất trong câu The main reason for the delay is the third-party API là ở đâu?","o":["The main / reason for the / delay is the / third-party API","The main reason for the delay / is the third-party API","The / main reason / for / the delay / is / the third-party API","Không ngắt ở đâu cả"],"a":1,"e":"Ngắt giữa cụm chủ ngữ và cụm vị ngữ. Đó là chỗ ngắt tự nhiên nhất và nó cho bạn một nhịp để lấy hơi."},{"type":"say","text":"I NEED the DESIGN before I can START.","tip":"Vỗ tay ba lần, mỗi lần trùng với một từ được nhấn. Các từ còn lại nói nhanh và nhẹ, gần như nuốt. Nếu bạn vỗ tay tám lần thì bạn đang nói theo nhịp tiếng Việt.","words":["need","design","start"]},{"type":"say","text":"Could you pick it up after lunch?","tip":"Nối pick it up thành một khối. Đọc chậm ba lần rồi tăng tốc cho tới khi nó nghe như một từ dài.","words":["pick it up","after lunch"]},{"type":"say","text":"I think / the main problem / is the caching layer.","tip":"Ngắt rõ ở hai dấu gạch. Mỗi cụm nói liền một hơi. Cách này làm bạn nghe chắc chắn thay vì ngập ngừng.","words":["I think","the main problem","is the caching layer"]},{"type":"say","text":"Is the API ready?","tip":"Lên giọng ở ready. Thu âm rồi nghe lại — nếu cuối câu đi ngang hoặc đi xuống, đó là lý do người ta hay hỏi lại bạn Sorry, is that a question?","words":["Is the API ready?"]},{"type":"say","text":"We need three things: access, credentials, and the docs.","tip":"Lên giọng ở access và credentials, xuống giọng ở docs. Đường giọng đó báo cho người nghe biết danh sách đã hết.","words":["access","credentials","and the docs"]},{"type":"order","ans":"I think the main problem is the caching layer.","hint":"Tôi nghĩ vấn đề chính là tầng cache.","ansTokens":["I","think","the","main","problem","is","the","caching","layer"],"chips":["the","I","the","is","main","think","caching","problem","layer"]}]}]}]</script>
<script>
/* ============================================================
   DATA + STORAGE
   ============================================================ */
const L = JSON.parse(document.getElementById('lessonData').textContent);
const BK = JSON.parse(document.getElementById('qaData').textContent);
const ALLU = BK.flatMap(b=>b.units);
const PHASES = [
  {n:1,t:"Nền tảng: bạn và công việc của bạn"},
  {n:2,t:"Standup & báo cáo tiến độ"},
  {n:3,t:"Họp: hiểu, xen vào, phản biện"},
  {n:4,t:"Viết: Slack, email, code review"},
  {n:5,t:"Hội thoại khó & thương lượng"},
  {n:6,t:"Trôi chảy: kể, present, phỏng vấn"}
];
const KEY = 'en30.v1';
const mem = {};
const store = {
  ok:(()=>{try{const k='__t';localStorage.setItem(k,'1');localStorage.removeItem(k);return true}catch(e){return false}})(),
  get(){
    try{ if(this.ok){const r=localStorage.getItem(KEY);return r?JSON.parse(r):null} }catch(e){}
    return mem[KEY]||null;
  },
  set(v){
    const s=JSON.stringify(v);
    try{ if(this.ok){localStorage.setItem(KEY,s);return} }catch(e){}
    mem[KEY]=JSON.parse(s);
  }
};
const D = Object.assign({
  cur:1, done:{}, notes:{}, quiz:{}, checks:{}, log:{}, theme:'light', hideVi:false, xp:0,
  view:'day', qaCur:1, bk:null, bu:1, qaDone:{}, qaAns:{}, qaPick:{}
}, store.get()||{});
if(!D.bk){ D.bk='qa'; D.bu=D.qaCur||1 }
if(!BK.some(b=>b.id===D.bk)){ D.bk=BK[0].id; D.bu=1 }
const save = () => store.set(D);
const today = () => new Date().toLocaleDateString('sv');  // YYYY-MM-DD

/* ============================================================
   METRICS
   ============================================================ */
function streak(){
  const days = Object.keys(D.log).sort();
  if(!days.length) return 0;
  const t=new Date(today());
  let n=0, probe=new Date(t);
  const has=d=>D.log[d.toLocaleDateString('sv')];
  if(!has(probe)){ probe.setDate(probe.getDate()-1); if(!has(probe)) return 0; }
  while(has(probe)){ n++; probe.setDate(probe.getDate()-1); }
  return n;
}
function refreshMetrics(){
  const d=Object.keys(D.done).filter(k=>D.done[k]).length;
  document.getElementById('mDone').textContent=d;
  document.getElementById('mStreak').textContent=streak();
  document.getElementById('mXp').textContent=D.xp||0;
  document.getElementById('pbar').style.width=(d/30*100)+'%';
}
function addXp(n){ D.xp=(D.xp||0)+n; save(); refreshMetrics(); }

/* ============================================================
   RAIL
   ============================================================ */
function plate(d){
  const b=document.createElement('button');
  b.className='plate'+(D.done[d]?' done':'')+(d===D.cur?' cur':'');
  b.textContent=String(d).padStart(2,'0');
  b.title='Ngày '+d+' — '+L[d-1].t;
  b.onclick=()=>go(d);
  return b;
}
function qplate(bk,u){
  const b=document.createElement('button');
  b.className='plate qp'+(D.qaDone[u.id]?' done':'')+((D.view==='qa'&&D.bk===bk.id&&D.bu===u.n)?' cur':'');
  b.textContent=bk.ab+u.n;
  b.title=bk.t+' — '+u.t;
  b.onclick=()=>goU(bk.id,u.n);
  return b;
}
function buildRail(){
  const box=document.getElementById('railPhases'); box.innerHTML='';
  PHASES.forEach(p=>{
    const w=document.createElement('div'); w.className='phase';
    w.innerHTML=`<div class="phase-h"><span class="n">0${p.n}</span><span class="t">${p.t}</span></div>`;
    const pl=document.createElement('div'); pl.className='plates';
    L.filter(x=>x.phase===p.n).forEach(x=>pl.appendChild(plate(x.d)));
    w.appendChild(pl); box.appendChild(w);
  });
  const rb=document.getElementById('railBooks'); rb.innerHTML='';
  BK.forEach(bk=>{
    const w=el(`<div class="railsec"><h2>${esc(bk.t)}</h2></div>`);
    const pl=el('<div class="plates"></div>');
    bk.units.forEach(u=>pl.appendChild(qplate(bk,u)));
    w.appendChild(pl);
    if(bk.sub) w.appendChild(el(`<p class="railnote">${esc(bk.sub)}</p>`));
    rb.appendChild(w);
  });
  const row=document.getElementById('mRow'); row.innerHTML='';
  L.forEach(x=>row.appendChild(plate(x.d)));
  const c=row.querySelector('.plate.cur'); if(c) c.scrollIntoView({inline:'center',block:'nearest'});
}

/* ============================================================ HELPERS */
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el = (h)=>{const t=document.createElement('template');t.innerHTML=h.trim();return t.content.firstElementChild};

/* ============================================================
   RENDER DAY
   ============================================================ */
function render(){ return D.view==='qa' ? renderQA() : renderDay(); }
function renderDay(){
  const L_ = L[D.cur-1], s=document.getElementById('stage');
  const ph = PHASES.find(p=>p.n===L_.phase);
  s.className='stage'+(D.hideVi?' hide-vi':'');
  s.innerHTML='';

  s.appendChild(el(`<div>

function go(d){ if(d<1||d>30)return; D.cur=d; D.view='day'; save(); buildRail(); render(); window.scrollTo({top:0,behavior:'smooth'}); }
function curBook(){ return BK.find(b=>b.id===D.bk)||BK[0] }
function curUnit(){ const b=curBook(); return b.units[Math.min(Math.max(D.bu,1),b.units.length)-1] }
function goU(bid,n){
  const b=BK.find(x=>x.id===bid); if(!b) return;
  if(n<1||n>b.units.length) return;
  D.bk=b.id; D.bu=n; D.view='qa'; save(); buildRail(); render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ============================================================
   SPEECH
   ============================================================ */
const SPK = (()=>{ try{ return 'speechSynthesis' in window }catch(e){ return false } })();
function speak(t){
  if(!SPK) return;
  try{
    const u=new SpeechSynthesisUtterance(String(t).replace(/\s*[—–]\s*/g,'. '));
    u.lang='en-US'; u.rate=.92;
    speechSynthesis.cancel();
    setTimeout(()=>{ try{ speechSynthesis.speak(u) }catch(e){} },60);
  }catch(e){}
}
function spkBtn(text){
  if(!SPK) return null;
  const b=el('<button class="spk" title="Nghe">&#9654;</button>');
  b.onclick=e=>{e.stopPropagation();speak(text)};
  return b;
}

const DKIND={order:'Xếp lại trật tự',fix:'Sửa lỗi',transform:'Biến đổi câu',pick:'Chọn đáp án',reply:'Tập trả lời',say:'Đọc to'};
const norm = s => String(s).toLowerCase()
  .replace(/[\u2018\u2019\u02bc]/g,"'").replace(/[\u2014\u2013]/g,' ')
  .replace(/[.,!?;:]/g,'').replace(/\s+/g,' ').trim();
function accepts(d,v){
  const list=[d.ans].concat(d.alt||[]).map(norm);
  return list.includes(norm(v));
}
function dkey(u,i){ return u.id+'-'+i }

/* ============================================================
   Q&A — QUESTION BUILDER (unit 1)
   ============================================================ */
const BW=[
  {l:'Từ hỏi',k:'wh',v:['—','what','what time','when','where','why','how','how long']},
  {l:'Trợ động từ + chủ ngữ',k:'aux',v:['do you','did you','can you','could you','will you','should we']},
  {l:'Động từ nguyên mẫu + phần còn lại',k:'v',v:['have a minute','join the call','take a look','deploy today','need more time','review the PR','start the migration']}
];
function builder(){
  const box=el(`<div class="qbuild"><div class="bh">Máy lắp câu hỏi — bấm một ô mỗi cột</div></div>`);
  const cols=el('<div class="bcols"></div>');
  const pick={wh:'—',aux:'do you',v:'have a minute'};
  const out=el(`<div class="bout"><div class="s"></div><div class="g"></div></div>`);
  function draw(){
    const wh = pick.wh==='—' ? '' : pick.wh+' ';
    let s = wh + pick.aux + ' ' + pick.v + '?';
    s = s.charAt(0).toUpperCase()+s.slice(1);
    out.querySelector('.s').textContent=s;
    out.querySelector('.g').textContent = (pick.wh==='—'?'':'TỪ HỎI + ')+'TRỢ ĐỘNG TỪ + CHỦ NGỮ + ĐỘNG TỪ NGUYÊN MẪU';
    cols.querySelectorAll('.bcell').forEach(b=>b.classList.toggle('on', pick[b.dataset.k]===b.dataset.v));
    const sb=out.querySelector('.spk'); if(sb) sb.onclick=()=>speak(s);
  }
  BW.forEach(c=>{
    const w=el(`<div class="bcol"><div class="cl">${esc(c.l)}</div></div>`);
    const cc=el('<div class="cells"></div>');
    c.v.forEach(v=>{
      const b=el(`<button class="bcell">${esc(v)}</button>`);
      b.dataset.k=c.k; b.dataset.v=v;
      b.onclick=()=>{pick[c.k]=v;draw()};
      cc.appendChild(b);
    });
    w.appendChild(cc); cols.appendChild(w);
  });
  box.appendChild(cols);
  const sb=spkBtn(''); if(sb) out.appendChild(sb);
  box.appendChild(out);
  box.appendChild(el(`<p class="railnote" style="margin-top:9px">Mọi tổ hợp ở đây đều ĐÚNG ngữ pháp — đó là điểm mấu chốt: trật tự không đổi dù bạn thay nội dung. Một vài tổ hợp sẽ nghe hơi vô nghĩa, và đó là bài học thứ hai: đúng ngữ pháp chưa chắc là tự nhiên.</p>`));
  draw();
  return box;
}

function drillOrder(u,i,d,wrap){
  const st=wrap.querySelector('.st');
  const line=el('<div class="slotline"></div>');
  const chips=el('<div class="chips"></div>');
  let placed=[];
  const saved=D.qaAns[dkey(u,i)];
  const fb=el('<div class="dfb"></div>');
  function paint(){
    line.innerHTML='';
    if(!placed.length) line.appendChild(el('<span class="ph">bấm các từ bên dưới theo đúng thứ tự…</span>'));
    placed.forEach((t,pi)=>{
      const c=el(`<button class="chip placed">${esc(t)}</button>`);
      c.onclick=()=>{placed.splice(pi,1);paint()};
      line.appendChild(c);
    });
    chips.querySelectorAll('.chip').forEach(c=>{
      const n=placed.filter(x=>x===c.dataset.t).length;
      const tot=d.chips.filter(x=>x===c.dataset.t).length;
      const before=Array.from(chips.querySelectorAll('.chip')).filter(o=>o.dataset.t===c.dataset.t).indexOf(c);
      c.classList.toggle('used', before < n);
      void tot;
    });
  }
  d.chips.forEach(t=>{
    const c=el(`<button class="chip">${esc(t)}</button>`);
    c.dataset.t=t;
    c.onclick=()=>{placed.push(t);paint()};
    chips.appendChild(c);
  });
  const bar=el(`<div class="drow2"><button class="nbtn">Kiểm tra</button><button class="mini">Xoá hết</button><button class="mini">Xem đáp án</button></div>`);
  const [chk,clr,rev]=bar.querySelectorAll('button');
  function done(ok,show,rv){
    wrap.classList.toggle('ok',ok); wrap.classList.toggle('no',!ok&&!rv);
    st.textContent = ok?'✓ đúng':(rv?'đã xem':'thử lại');
    fb.className='dfb on';
    fb.innerHTML = (show?`<span class="good">${esc(d.ans)}</span>`:'') + (ok
      ?'Chính xác. Đọc to câu này một lần trước khi sang bài kế.'
      :(rv?'Đọc to câu đúng ba lần, rồi bấm Xoá hết và tự xếp lại từ đầu — lần này không nhìn.'
          :'Chưa đúng. Nhớ nguyên tắc: trợ động từ đứng trước chủ ngữ, động từ chính về nguyên mẫu.'));
    const prev=D.qaAns[dkey(u,i)]||{};
    if(ok && !prev.ok){ addXp(3) }
    D.qaAns[dkey(u,i)]={ok:ok||!!prev.ok,v:placed.join(' ')}; save();
  }
  chk.onclick=()=>{
    const ok=accepts(d,placed.join(' '));
    done(ok,ok);
    if(ok) speak(d.ans);
  };
  clr.onclick=()=>{placed=[];paint();fb.className='dfb';wrap.classList.remove('ok','no');st.textContent=''};
  rev.onclick=()=>{ placed=d.ansTokens.slice(); paint(); done(false,true,true); speak(d.ans); };
  wrap.appendChild(el(`<p class="dhint">${esc(d.hint)}</p>`));
  wrap.appendChild(line); wrap.appendChild(chips); wrap.appendChild(bar); wrap.appendChild(fb);
  paint();
  if(saved&&saved.ok){ placed=d.ansTokens.slice(); paint(); wrap.classList.add('ok'); st.textContent='✓ đúng'; }
}

function drillText(u,i,d,wrap,mode){
  const st=wrap.querySelector('.st');
  if(mode==='fix'){
    wrap.appendChild(el(`<div class="diff"><div class="drow del"><span class="sg">−</span><span>${esc(d.bad)}</span></div></div>`));
    wrap.appendChild(el(`<p class="dhint">Viết lại cho đúng:</p>`));
  } else {
    wrap.appendChild(el(`<p class="dprompt"><span class="m">${esc(d.prompt)}</span></p>`));
  }
  const fb=el('<div class="dfb"></div>');
  const saved=D.qaAns[dkey(u,i)];
  if(d.soft){
    const bar=el(`<div class="drow2"><button class="nbtn">Xem đáp án</button><button class="mini">Tôi tự sửa được</button></div>`);
    const [rev,own]=bar.querySelectorAll('button');
    function show(ok){
      fb.className='dfb on';
      fb.innerHTML=`<span class="good">${esc(d.ans)}</span>${esc(d.why)}`;
      if(ok){ wrap.classList.add('ok'); st.textContent='✓ tự sửa được'; if(!(D.qaAns[dkey(u,i)]||{}).ok) addXp(3); D.qaAns[dkey(u,i)]={ok:true}; save(); }
      else { st.textContent='đã xem'; }
      speak(d.ans);
    }
    rev.onclick=()=>show(false); own.onclick=()=>show(true);
    wrap.appendChild(bar); wrap.appendChild(fb);
    if(saved&&saved.ok){ wrap.classList.add('ok'); st.textContent='✓ tự sửa được'; }
    return;
  }
  const inp=el(`<input class="din" placeholder="gõ câu tiếng Anh của bạn…" autocomplete="off" spellcheck="false">`);
  if(saved&&saved.v) inp.value=saved.v;
  const bar=el(`<div class="drow2"><button class="nbtn">Kiểm tra</button><button class="mini">Xem đáp án</button></div>`);
  const [chk,rev]=bar.querySelectorAll('button');
  function judge(reveal){
    const ok=accepts(d,inp.value);
    wrap.classList.toggle('ok',ok); wrap.classList.toggle('no',!ok&&!reveal);
    st.textContent = ok?'✓ đúng':(reveal?'đã xem':'chưa đúng');
    fb.className='dfb on';
    fb.innerHTML = ((ok||reveal)?`<span class="good">${esc(d.ans)}</span>`:'') + esc(d.why);
    const prev=D.qaAns[dkey(u,i)]||{};
    if(ok && !prev.ok) addXp(3);
    D.qaAns[dkey(u,i)]={ok:ok||!!prev.ok,v:inp.value}; save();
    if(ok||reveal) speak(d.ans);
  }
  chk.onclick=()=>judge(false);
  rev.onclick=()=>judge(true);
  inp.onkeydown=e=>{ if(e.key==='Enter'){e.preventDefault();judge(false)} };
  wrap.appendChild(inp); wrap.appendChild(bar); wrap.appendChild(fb);
  if(saved&&saved.ok){ wrap.classList.add('ok'); st.textContent='✓ đúng'; }
}

      }
    });

      exp.className='exp on';
      wrap.classList.toggle('ok',picked===d.a); wrap.classList.toggle('no',picked!==d.a);

    });
    fb.appendChild(ms);
    fb.appendChild(el(`<p style="margin:9px 0 0;font-size:14.5px;color:var(--ink-2)">${esc(d.why)}</p>`));
    if(st.textContent==='') st.textContent='đã xem';
  };
  own.onclick=()=>{
    wrap.classList.add('ok'); st.textContent='✓ đã nói';
    if(!(D.qaAns[dkey(u,i)]||{}).ok) addXp(3);
    D.qaAns[dkey(u,i)]={ok:true}; save();
  };
  wrap.appendChild(bar); wrap.appendChild(fb);
  const saved=D.qaAns[dkey(u,i)];
  if(saved&&saved.ok){ wrap.classList.add('ok'); st.textContent='✓ đã nói' }
}

function drillSay(u,i,d,wrap){
  const st=wrap.querySelector('.st');
  const box=el(`<div class="ex"><div class="en" style="font-size:16px">${esc(d.text)}</div></div>`);
  const sb=spkBtn(d.text); if(sb) box.appendChild(sb);
  wrap.appendChild(box);
  wrap.appendChild(el(`<p class="dhint">${esc(d.tip)}</p>`));
  if(d.words&&d.words.length){
    const ww=el('<div class="words"></div>');
    d.words.forEach(w=>{
      const c=el(`<span class="word tap">${esc(w)}</span>`);
      c.onclick=()=>speak(w); ww.appendChild(c);
    });
    wrap.appendChild(ww);
  }
  const bar=el(`<div class="drow2" style="margin-top:10px"><button class="nbtn">Nghe mẫu</button><button class="mini">Tôi đã đọc to ba lần</button></div>`);
  const [ls,own]=bar.querySelectorAll('button');
  ls.onclick=()=>speak(d.text);
  own.onclick=()=>{
    wrap.classList.add('ok'); st.textContent='✓ đã luyện';
    if(!(D.qaAns[dkey(u,i)]||{}).ok) addXp(3);
    D.qaAns[dkey(u,i)]={ok:true}; save();
  };
  wrap.appendChild(bar);
  const saved=D.qaAns[dkey(u,i)];
  if(saved&&saved.ok){ wrap.classList.add('ok'); st.textContent='✓ đã luyện' }
}

/* ============================================================
   Q&A — REFLEX TRAINER
   ============================================================ */
function reflex(u){
  const box=el('<div class="rfx"></div>');
  const modes=el(`<div class="modes">
    <button class="mini on">Hỏi: Việt → Anh</button>
    <button class="mini">Đáp: nghe câu hỏi</button>
    <button class="mini">Hẹn giờ 8 giây</button>
  </div>`);
  const card=el('<div class="card"></div>');
  const bar=el(`<div class="bar"><button class="nbtn">Hiện đáp án</button><button class="nbtn">Nhịp tiếp →</button><button class="mini">Trộn lại</button></div>`);
  const [rev,nxt,shf]=bar.querySelectorAll('button');
  let mode=0, order=u.pool.map((_,i)=>i).sort(()=>Math.random()-.5), at=0, open=false, iv=null, left=8;
  function stop(){ if(iv){clearInterval(iv);iv=null} }
  function draw(){
    const p=u.pool[order[at]];
    stop(); card.innerHTML='';
    if(mode===0){
      card.appendChild(el(`<div class="cue">${esc(p.vi)}</div>`));
      if(open){ const t=el(`<div class="tgt">${esc(p.en)}</div>`); card.appendChild(t); speak(p.en) }
      else card.appendChild(el(`<div class="cnt">tự bật ra câu hỏi tiếng Anh</div>`));
    } else if(mode===1){
      card.appendChild(el(`<div class="tgt">${esc(p.en)}</div>`));
      if(open){ card.appendChild(el(`<div class="ansl">${esc(p.ans)}</div>`)); speak(p.ans) }
      else card.appendChild(el(`<div class="cnt">tự bật ra câu trả lời của bạn</div>`));
      if(!open) speak(p.en);
    } else {
      card.appendChild(el(`<div class="cue">${esc(p.vi)}</div>`));
      const cl=el(`<div class="clock">0:08</div>`); card.appendChild(cl);
      if(open){ card.appendChild(el(`<div class="tgt">${esc(p.en)}</div>`)); speak(p.en) }
      else {
        left=8;
        iv=setInterval(()=>{
          left--; cl.textContent='0:0'+Math.max(left,0);
          if(left<=3) cl.classList.add('hot');
          if(left<=0){ stop(); open=true; draw() }
        },1000);
      }
    }
    card.appendChild(el(`<div class="cnt">nhịp ${at+1} / ${u.pool.length}</div>`));
    rev.textContent = open?'Đã xem':'Hiện đáp án';
  }
  modes.querySelectorAll('.mini').forEach((b,bi)=>b.onclick=()=>{
    mode=bi; open=false;
    modes.querySelectorAll('.mini').forEach((x,xi)=>x.classList.toggle('on',xi===bi));
    draw();
  });
  rev.onclick=()=>{open=true;draw()};
  nxt.onclick=()=>{at=(at+1)%u.pool.length;open=false;draw()};
  shf.onclick=()=>{order=order.sort(()=>Math.random()-.5);at=0;open=false;draw()};
  box.appendChild(modes); box.appendChild(card); box.appendChild(bar);
  draw();
  return box;
}

/* ============================================================
   Q&A — RENDER
   ============================================================ */
function renderQA(){
  const bk=curBook(), u=curUnit(), s=document.getElementById('stage');
  s.className='stage'+(D.hideVi?' hide-vi':'');
  s.innerHTML='';

  s.appendChild(el(`<div>
    <div class="eyebrow"><span>${esc(bk.t)}</span><span class="sep"></span><span>Đơn vị ${String(u.n).padStart(2,'0')} / ${String(bk.units.length).padStart(2,'0')}</span></div>
    <h1 class="day-t">${esc(u.t)}</h1>
    <p class="qa-lead">${esc(u.one)}</p>
    <div class="qa-frame"><span class="lb">Công thức</span><p>${esc(u.frame)}</p></div>
    <p class="qa-note">${esc(u.note)}</p>
  </div>`));

  if(u.id==='q1') s.appendChild(builder());

  // 01 examples
  const b1=el(`<section class="blk"><div class="blk-h"><span class="num">01</span><h3>Mẫu câu</h3><span class="aux"><button class="mini" id="qvi">${D.hideVi?'hiện nghĩa':'ẩn nghĩa'}</button></span></div></section>`);
  u.ex.forEach(x=>{
    const box=el(`<div class="ex"><div class="en">${esc(x.en)}</div><div class="vi">${esc(x.vi)}</div><div class="n">${esc(x.n)}</div></div>`);
    const vi=box.querySelector('.vi'); vi.onclick=()=>vi.classList.toggle('show');
    const sb=spkBtn(x.en); if(sb) box.appendChild(sb);
    b1.appendChild(box);
  });
  s.appendChild(b1);
  b1.querySelector('#qvi').onclick=toggleVi;

  // 02 errors
  const b2=el(`<section class="blk"><div class="blk-h"><span class="num">02</span><h3>Lỗi hay mắc</h3></div></section>`);
  u.fix.forEach(f=>b2.appendChild(el(
    `<div class="diff"><div class="drow del"><span class="sg">−</span><span>${esc(f.bad)}</span></div><div class="drow add"><span class="sg">+</span><span>${esc(f.good)}</span></div><div class="dwhy">${esc(f.why)}</div></div>`
  )));
  s.appendChild(b2);

  // 03 drills
  const nOk=u.drills.filter((d,i)=>d.type==='pick' ? D.qaPick[dkey(u,i)]===d.a : (D.qaAns[dkey(u,i)]||{}).ok).length;
  const b3=el(`<section class="blk"><div class="blk-h"><span class="num">03</span><h3>Bài thực hành</h3><span class="aux"><span class="muted">${nOk}/${u.drills.length} xong</span></span></div></section>`);
  u.drills.forEach((d,i)=>{
    const wrap=el(`<div class="drill"><div class="drill-h"><span class="i">${String(i+1).padStart(2,'0')}</span><span class="k">${DKIND[d.type]||''}</span><span class="st"></span></div></div>`);
    if(d.type==='order') drillOrder(u,i,d,wrap);
    else if(d.type==='pick') drillPick(u,i,d,wrap);
    else if(d.type==='reply') drillReply(u,i,d,wrap);
    else if(d.type==='say') drillSay(u,i,d,wrap);
    else drillText(u,i,d,wrap,d.type);
    b3.appendChild(wrap);
  });
  s.appendChild(b3);

  // 04 reflex
  if(u.pool){
    const b4=el(`<section class="blk"><div class="blk-h"><span class="num">04</span><h3>Vòng phản xạ</h3></div></section>`);
    b4.appendChild(reflex(u)); s.appendChild(b4);
  }

  // nav
  const nav=el('<div class="fnav"></div>');
  const prev=el(`<button class="nbtn">← Đơn vị ${u.n-1}</button>`); prev.disabled=u.n===1; prev.onclick=()=>goU(bk.id,u.n-1);
  const next=el(`<button class="nbtn">Đơn vị ${u.n+1} →</button>`); next.disabled=u.n===bk.units.length; next.onclick=()=>goU(bk.id,u.n+1);
  const mk=el(`<button class="nbtn main${D.qaDone[u.id]?' done':''}">${D.qaDone[u.id]?'✓ Đã hoàn thành đơn vị này':'Đánh dấu hoàn thành'}</button>`);
  mk.onclick=()=>{
    if(!D.qaDone[u.id]){ D.qaDone[u.id]=true; D.log[today()]=true; addXp(8) }
    else delete D.qaDone[u.id];
    save(); buildRail(); refreshMetrics(); render();
    if(D.qaDone[u.id] && u.n<bk.units.length) setTimeout(()=>goU(bk.id,u.n+1),450);
  };
  nav.appendChild(prev); nav.appendChild(mk); nav.appendChild(next);
  s.appendChild(nav);

  const back=el(`<p class="railnote" style="text-align:center;margin-top:16px"><button class="mini">Mục lục sổ tay</button> &nbsp; <button class="mini">Quay lại ngày ${D.cur}</button></p>`);
  const bb=back.querySelectorAll('button');
  bb[0].onclick=openBooks; bb[1].onclick=()=>go(D.cur);
  s.appendChild(back);

  refreshMetrics();
}

/* ============================================================
   MODALS
   ============================================================ */
const scrim=document.getElementById('scrim'), modal=document.getElementById('modal');
function openModal(html){ modal.innerHTML=html; scrim.classList.add('on'); }
function closeModal(){ scrim.classList.remove('on'); }
scrim.onclick=e=>{if(e.target===scrim)closeModal()};

function head(t){ return `<div class="modal-h"><h3>${t}</h3><span class="x"><button class="iconbtn" onclick="closeModal()">✕</button></span></div>` }

// search
function openSearch(){
  openModal(head('Tìm cụm từ')+`<input class="searchin" id="sq" placeholder="ví dụ: blocker, deadline, estimate, by...">`+`<div class="res" id="rs"></div>`);
  const q=document.getElementById('sq'), rs=document.getElementById('rs');
  const idx=[];
  L.forEach(x=>x.chunks.forEach(c=>idx.push({d:x.d,en:c.en,vi:c.vi,t:x.t})));
  BK.forEach(bk=>bk.units.forEach(u=>{
    u.ex.forEach(c=>idx.push({b:bk.id,ab:bk.ab,q:u.n,en:c.en,vi:c.vi,t:u.t}));
    (u.pool||[]).forEach(c=>idx.push({b:bk.id,ab:bk.ab,q:u.n,en:c.en,vi:c.vi,t:u.t}));
  }));
  function run(){
    const v=q.value.trim().toLowerCase(); rs.innerHTML='';
    if(!v){rs.innerHTML='<p class="muted">Gõ một từ tiếng Anh hoặc tiếng Việt.</p>';return}
    const hit=idx.filter(i=>(i.en+' '+i.vi).toLowerCase().includes(v)).slice(0,40);
    if(!hit.length){rs.innerHTML='<p class="muted">Không có kết quả.</p>';return}
    hit.forEach(h=>{
      const lb = h.q ? `Sổ tay ${h.ab}${h.q} · ${esc(h.t)}` : `Ngày ${String(h.d).padStart(2,'0')} · ${esc(h.t)}`;
      const i=el(`<div class="res-i"><div class="d">${lb}</div><div class="en">${esc(h.en)}</div><div class="vi">${esc(h.vi)}</div></div>`);
      i.onclick=()=>{closeModal(); h.q?goU(h.b,h.q):go(h.d)};
      rs.appendChild(i);
    });
  }
  q.oninput=run; run(); q.focus();
}

// books index
function openBooks(){
  let h=head('Sổ tay ngữ pháp thực chiến');
  BK.forEach(bk=>{
    const dn=bk.units.filter(u=>D.qaDone[u.id]).length;
    h+=`<div class="bkrow"><div class="bkh"><b>${esc(bk.t)}</b><span>${dn}/${bk.units.length}</span></div><div data-bk="${bk.id}"></div></div>`;
  });
  openModal(h);
  BK.forEach(bk=>{
    const box=modal.querySelector(`[data-bk="${bk.id}"]`);
    bk.units.forEach(u=>{
      const it=el(`<div class="bkitem${D.qaDone[u.id]?' done':''}"><span class="ab">${bk.ab}${u.n}</span><span class="t">${esc(u.t)}</span></div>`);
      it.onclick=()=>{closeModal();goU(bk.id,u.n)};
      box.appendChild(it);
    });
  });
}

// spaced review
function openReview(){
  const doneDays=Object.keys(D.done).filter(k=>D.done[k]).map(Number);
  if(!doneDays.length){ openModal(head('Ôn tập')+'<p class="muted">Hoàn thành ít nhất một ngày trước đã. Bộ ôn tập sẽ lấy cụm từ các ngày bạn đã học, ưu tiên ngày cách đây 1, 3 và 7 ngày học.</p>'); return }
  const cur=D.cur;
  const want=[cur-1,cur-3,cur-7,cur-2,cur-5].filter(d=>doneDays.includes(d));
  const pool=[];
  (want.length?want:doneDays).forEach(d=>L[d-1].chunks.forEach(c=>pool.push({...c,d})));
  doneDays.forEach(d=>{ if(!want.includes(d)) L[d-1].chunks.forEach(c=>pool.push({...c,d})) });
  const cards=pool.sort(()=>Math.random()-.5).slice(0,12);
  let i=0, flipped=false;
  openModal(head('Ôn tập giãn cách')+`<div class="fc" id="fc"></div><div class="fc-bar"><button class="nbtn" id="fprev">←</button><button class="nbtn" id="fnext">Tiếp →</button><span class="cnt" id="fcnt"></span></div>`);
  const fc=document.getElementById('fc');
  function draw(){
    const c=cards[i];
    fc.innerHTML = flipped
      ? `<div class="en">${esc(c.en)}</div><div class="vi">${esc(c.vi)}</div>${c.n?`<div class="n">${esc(c.n)}</div>`:''}`
      : `<div class="en">${esc(c.en)}</div><div class="tap">bấm để xem nghĩa · ngày ${String(c.d).padStart(2,'0')}</div>`;
    document.getElementById('fcnt').textContent=`${i+1} / ${cards.length}`;
  }
  fc.onclick=()=>{flipped=!flipped;draw()};
  document.getElementById('fnext').onclick=()=>{i=(i+1)%cards.length;flipped=false;draw()};
  document.getElementById('fprev').onclick=()=>{i=(i-1+cards.length)%cards.length;flipped=false;draw()};
  draw();
}

// stats
function openStats(){
  const done=Object.keys(D.done).filter(k=>D.done[k]).length;
  let qa=0,qr=0;
  Object.keys(D.quiz).forEach(d=>Object.keys(D.quiz[d]).forEach(q=>{qa++;if(D.quiz[d][q]===L[d-1].quiz[q].a)qr++}));
  const tasks=Object.keys(D.checks).filter(k=>D.checks[k]).length;
  const qUnits=Object.keys(D.qaDone).filter(k=>D.qaDone[k]).length;
  let dTot=0,dOk=0;
  ALLU.forEach(u=>u.drills.forEach((dd,i)=>{
    dTot++;
    if(dd.type==='pick'){ if(D.qaPick[dkey(u,i)]===dd.a) dOk++ }
    else if((D.qaAns[dkey(u,i)]||{}).ok) dOk++;
  }));
  const notes=Object.keys(D.notes).filter(k=>(D.notes[k]||'').trim()).length;
  openModal(head('Tiến trình của bạn')+`
    <div class="grid2">
      <div class="stat"><b>${done}<span style="font-size:15px;color:var(--ink-3)">/30</span></b><span>Ngày hoàn thành</span></div>
      <div class="stat"><b>${streak()}</b><span>Chuỗi ngày liên tục</span></div>
      <div class="stat"><b>${qa?Math.round(qr/qa*100):0}%</b><span>Quiz đúng (${qr}/${qa})</span></div>
      <div class="stat"><b>${tasks}<span style="font-size:15px;color:var(--ink-3)">/60</span></b><span>Bài thực chiến</span></div>
      <div class="stat"><b>${qUnits}<span style="font-size:15px;color:var(--ink-3)">/${ALLU.length}</span></b><span>Đơn vị sổ tay</span></div>
      <div class="stat"><b>${dOk}<span style="font-size:15px;color:var(--ink-3)">/${dTot}</span></b><span>Bài tập sổ tay xong</span></div>
    </div>
    <p class="muted" style="margin-top:14px">Bạn đã viết ghi chú ở ${notes} ngày. ${store.ok?'Dữ liệu được lưu trong trình duyệt này.':'⚠ Trình duyệt đang chặn lưu trữ — dữ liệu sẽ mất khi đóng tab. Hãy tải file HTML về máy và mở trực tiếp.'}</p>
    <div class="rowbtn">
      <button class="nbtn" onclick="doExport()">Tải bản sao lưu .json</button>
      <button class="nbtn" onclick="document.getElementById('fileIn').click()">Nạp bản sao lưu</button>
      <button class="nbtn" onclick="wipe()">Xoá toàn bộ tiến trình</button>
    </div>`);
}
function wipe(){
  if(!confirm('Xoá toàn bộ tiến trình, ghi chú và kết quả quiz? Không thể hoàn tác.'))return;
  ['done','notes','quiz','checks','log','qaDone','qaAns','qaPick'].forEach(k=>D[k]={}); D.xp=0; D.cur=1; D.bu=1; D.bk=BK[0].id; D.view='day';
  save(); closeModal(); buildRail(); render();
}
function doExport(){
  const b=new Blob([JSON.stringify(D,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  const url=URL.createObjectURL(b);
  a.href=url; a.download='en30-progress-'+today()+'.json';
  a.rel='noopener'; document.body.appendChild(a); a.click();
  setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url) },4000);
}
document.getElementById('fileIn').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const o=JSON.parse(r.result);
      ['done','notes','quiz','checks','log','qaDone','qaAns','qaPick'].forEach(k=>{if(o[k])D[k]=o[k]});
      if(o.xp!=null)D.xp=o.xp; if(o.cur)D.cur=o.cur;
      if(o.bk&&BK.some(b=>b.id===o.bk)){D.bk=o.bk;D.bu=o.bu||1} else if(o.qaCur){D.bk='qa';D.bu=o.qaCur}
      save(); closeModal(); buildRail(); render(); alert('Đã nạp bản sao lưu.');
    }catch(err){ alert('File không hợp lệ.') }
  };
  r.readAsText(f);
};

/* ============================================================
   POMODORO
   ============================================================ */
let pLeft=25*60, pIv=null;
const pEl=document.getElementById('pomo'), dock=document.getElementById('dock');
function pDraw(){ pEl.textContent=Math.floor(pLeft/60)+':'+String(pLeft%60).padStart(2,'0') }
document.getElementById('pStart').onclick=e=>{
  if(pIv){clearInterval(pIv);pIv=null;dock.classList.remove('run');e.target.textContent='▶';return}
  dock.classList.add('run'); e.target.textContent='❙❙';
  pIv=setInterval(()=>{
    pLeft--; pDraw();
    if(pLeft<=0){clearInterval(pIv);pIv=null;dock.classList.remove('run');document.getElementById('pStart').textContent='▶';pLeft=25*60;pDraw();alert('25 phút xong. Đứng lên, nghỉ 5 phút, đừng mở điện thoại.')}
  },1000);
};
document.getElementById('pReset').onclick=()=>{clearInterval(pIv);pIv=null;dock.classList.remove('run');document.getElementById('pStart').textContent='▶';pLeft=25*60;pDraw()};

   WIRING
   ============================================================ */
document.getElementById('bTheme').onclick=()=>{
  D.theme=D.theme==='dark'?'light':'dark';
  document.documentElement.dataset.theme=D.theme; syncTheme(); save();
};
document.getElementById('bSearch').onclick=openSearch;
document.getElementById('bReview').onclick=openReview;
document.getElementById('mReview').onclick=openReview;
document.getElementById('bStats').onclick=openStats;
document.getElementById('bQA').onclick=openBooks;
document.getElementById('mQA').onclick=openBooks;
document.getElementById('bHideVi').onclick=toggleVi;
document.getElementById('mHideVi').onclick=toggleVi;
document.getElementById('bExport').onclick=doExport;
document.getElementById('bQA2').onclick=openBooks;
document.getElementById('bImport').onclick=()=>document.getElementById('fileIn').click();
document.addEventListener('keydown',e=>{
  if(/input|textarea/i.test(e.target.tagName))return;
  if(e.key==='Escape')closeModal();
  if(e.key==='ArrowLeft'){ D.view==='qa'?goU(D.bk,D.bu-1):go(D.cur-1) }
  if(e.key==='ArrowRight'){ D.view==='qa'?goU(D.bk,D.bu+1):go(D.cur+1) }
  if(e.key==='q'||e.key==='Q')openBooks();
  if(e.key==='v'||e.key==='V')toggleVi();
  if(e.key==='s'||e.key==='S')openSearch();
  if(e.key==='r'||e.key==='R')openReview();
});
function syncTheme(){
  const m=document.getElementById('tcolor');
  if(m) m.content = document.documentElement.dataset.theme==='dark' ? '#0C1719' : '#E6ECE9';
}
document.documentElement.dataset.theme=D.theme||'light'; syncTheme();
if(!store.ok){
  const w=document.getElementById('warn');
  w.innerHTML='<div class="storewarn">⚠ Trình duyệt đang chặn lưu trữ, nên tiến trình sẽ mất khi đóng tab. '
    +'Trên iPhone: mở file qua một địa chỉ https (ví dụ GitHub Pages) rồi bấm Chia sẻ → Thêm vào MH chính.</div>';
}
pDraw(); buildRail(); syncViBtn(); render();
