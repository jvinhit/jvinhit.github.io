<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" id="tcolor" content="#E6ECE9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EN/30">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>30 Ngày Tiếng Anh Thực Chiến — English for Work</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — "blueprint / lab notebook"
   ============================================================ */
:root{
  --paper:#E6ECE9;
  --surface:#F6F9F7;
  --surface-2:#DFE7E3;
  --ink:#122428;
  --ink-2:#3D555A;
  --ink-3:#6E858A;
  --rule:#C3D0CC;
  --rule-2:#D6DEDA;
  --brass:#9C6F14;
  --brass-soft:#F0E4C6;
  --steel:#215E7D;
  --steel-soft:#DCE8EE;
  --add:#1B6444;
  --add-soft:#DDEDE3;
  --del:#95352A;
  --del-soft:#F3E0DC;

  --mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --disp:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
  --body:"Source Serif 4",Georgia,"Times New Roman",serif;

  --r:3px;
  --shadow:0 1px 2px rgba(18,36,40,.06),0 6px 18px -10px rgba(18,36,40,.18);
  --maxw:760px;
}
[data-theme="dark"]{
  --paper:#0C1719;
  --surface:#121F22;
  --surface-2:#18292D;
  --ink:#DCE6E2;
  --ink-2:#A6BAB7;
  --ink-3:#748A8A;
  --rule:#26393D;
  --rule-2:#1D2E32;
  --brass:#D9A93F;
  --brass-soft:#2E2513;
  --steel:#69B4D8;
  --steel-soft:#122B36;
  --add:#5FC292;
  --add-soft:#122A20;
  --del:#E0796A;
  --del-soft:#2C1815;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--body);font-size:17px;line-height:1.62;
  font-feature-settings:"ss01";
}
/* subtle blueprint grid */
body::before{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.5;
  background-image:linear-gradient(var(--rule-2) 1px,transparent 1px),linear-gradient(90deg,var(--rule-2) 1px,transparent 1px);
  background-size:28px 28px;
  mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);
  -webkit-mask-image:radial-gradient(ellipse at 50% 0%,#000 0%,transparent 70%);
}
button{font-family:var(--disp);cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}

/* ============================================================ TOPBAR */
.topbar{
  position:sticky;top:0;z-index:40;
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--rule);
}
.topbar-in{max-width:1180px;margin:0 auto;padding:10px 18px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:baseline;gap:9px;font-family:var(--disp);font-weight:800;letter-spacing:-.02em;font-size:15px}
.brand .mk{font-family:var(--mono);font-weight:700;font-size:11px;color:var(--brass);border:1px solid var(--brass);padding:1px 5px;border-radius:2px;letter-spacing:.04em}
.brand span.t{white-space:nowrap}
.spacer{flex:1}
.metrics{display:flex;gap:16px;align-items:center;font-family:var(--mono);font-size:11px;color:var(--ink-2)}
.metric b{font-size:14px;color:var(--ink);font-weight:700}
.metric .lb{display:block;font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.iconbtn{
  background:transparent;border:1px solid var(--rule);color:var(--ink-2);
  width:32px;height:32px;border-radius:var(--r);display:grid;place-items:center;font-size:14px;
  transition:.15s;flex:none;
}
.iconbtn:hover{border-color:var(--brass);color:var(--brass)}
.pbar{height:2px;background:var(--rule-2);position:relative}
.pbar i{position:absolute;inset:0 auto 0 0;background:var(--brass);width:0;transition:width .5s cubic-bezier(.2,.7,.2,1)}

/* ============================================================ SHELL */
.shell{max-width:1180px;margin:0 auto;padding:26px 18px 90px;display:grid;grid-template-columns:236px 1fr;gap:34px;position:relative;z-index:1}
@media(max-width:900px){.shell{grid-template-columns:1fr;gap:0;padding-top:14px}}

/* ============================================================ RAIL */
.rail{position:sticky;top:70px;align-self:start;max-height:calc(100vh - 96px);overflow-y:auto;padding-right:6px}
.rail::-webkit-scrollbar{width:5px}
.rail::-webkit-scrollbar-thumb{background:var(--rule);border-radius:9px}
.rail h2{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin:0 0 10px;font-weight:500}
.phase{margin-bottom:16px}
.phase-h{display:flex;gap:7px;align-items:baseline;margin-bottom:6px}
.phase-h .n{font-family:var(--mono);font-size:10px;color:var(--brass);font-weight:700}
.phase-h .t{font-family:var(--disp);font-size:11.5px;font-weight:600;color:var(--ink-2);line-height:1.3}
.plates{display:flex;flex-wrap:wrap;gap:4px}
.plate{
  width:30px;height:30px;border:1px solid var(--rule);background:var(--surface);
  border-radius:var(--r);font-family:var(--mono);font-size:11px;font-weight:500;color:var(--ink-3);
  display:grid;place-items:center;transition:.15s;position:relative;
}
.plate:hover{border-color:var(--brass);color:var(--brass);transform:translateY(-1px)}
.plate.done{background:var(--brass);border-color:var(--brass);color:#fff;font-weight:700}
[data-theme="dark"] .plate.done{color:#12201C}
.plate.cur{box-shadow:0 0 0 2px var(--brass);border-color:var(--brass);color:var(--brass);font-weight:700}
.plate.cur.done{color:#fff}
[data-theme="dark"] .plate.cur.done{color:#12201C}
.rail-tools{border-top:1px solid var(--rule);padding-top:12px;margin-top:6px;display:flex;flex-direction:column;gap:6px}
.tbtn{
  background:transparent;border:1px solid var(--rule);color:var(--ink-2);text-align:left;
  padding:6px 9px;border-radius:var(--r);font-size:11.5px;font-weight:600;transition:.15s;
  display:flex;justify-content:space-between;align-items:center;gap:6px;
}
.tbtn:hover{border-color:var(--brass);color:var(--brass)}
.tbtn .k{font-family:var(--mono);font-size:9px;color:var(--ink-3)}

/* mobile day strip */
.mstrip{display:none}
@media(max-width:900px){
  .rail{display:none}
  .mstrip{display:block;position:sticky;top:53px;z-index:30;background:var(--paper);border-bottom:1px solid var(--rule);margin:0 -18px 16px;padding:8px 18px}
  .mstrip .row{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
  .mstrip .row::-webkit-scrollbar{display:none}
  .mstrip .plate{flex:none}
  .mtools{display:flex;gap:6px;margin-top:8px}
  .mtools .tbtn{flex:1;justify-content:center;font-size:11px;padding:5px 4px}
}

/* ============================================================ STAGE */
.stage{max-width:var(--maxw);min-width:0}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);display:flex;gap:8px;align-items:center;margin-bottom:10px}
.eyebrow .sep{width:22px;height:1px;background:var(--brass);opacity:.5}
h1.day-t{
  font-family:var(--disp);font-weight:800;letter-spacing:-.03em;line-height:1.06;
  font-size:clamp(30px,5.6vw,44px);margin:0 0 16px;
}
.goal{
  border-left:3px solid var(--brass);background:var(--brass-soft);
  padding:11px 15px;border-radius:0 var(--r) var(--r) 0;margin-bottom:14px;
}
.goal .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:2px}
.goal p{margin:0;font-weight:600;font-size:17px;line-height:1.45}
.why{color:var(--ink-2);margin:0 0 30px;font-size:16.5px}

section.blk{margin:0 0 34px}
.blk-h{display:flex;align-items:baseline;gap:10px;margin-bottom:14px;padding-bottom:7px;border-bottom:1px solid var(--rule)}
.blk-h .num{font-family:var(--mono);font-size:10px;color:var(--ink-3);font-weight:500;flex:none}
.blk-h h3{font-family:var(--disp);font-size:14.5px;font-weight:800;letter-spacing:-.01em;margin:0;text-transform:uppercase;letter-spacing:.02em}
.blk-h .aux{margin-left:auto;flex:none}
.mini{
  background:transparent;border:1px solid var(--rule);color:var(--ink-3);
  font-size:10px;font-weight:600;padding:3px 8px;border-radius:99px;transition:.15s;font-family:var(--mono);
}
.mini:hover{border-color:var(--brass);color:var(--brass)}
.mini.on{background:var(--brass);border-color:var(--brass);color:#fff}
[data-theme="dark"] .mini.on{color:#12201C}

/* dialogue */
.scene{font-size:15px;color:var(--ink-3);font-style:italic;margin:0 0 14px}
.dlg{display:flex;flex-direction:column;gap:2px}
.line{padding:9px 0;border-bottom:1px dashed var(--rule-2)}
.line:last-child{border-bottom:0}
.line .who{font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);display:block;margin-bottom:3px}
.line .en{font-family:var(--mono);font-size:14.5px;line-height:1.6;color:var(--ink);margin:0}
.line .vi{margin:4px 0 0;font-size:15px;color:var(--ink-2)}
.line.me .who{color:var(--brass)}
.line.me{border-left:2px solid var(--brass);padding-left:12px;margin-left:-14px}

/* chunks */
.chunk{padding:11px 0;border-bottom:1px solid var(--rule-2);display:grid;grid-template-columns:1fr;gap:3px}
.chunk:last-child{border-bottom:0}
.chunk .en{font-family:var(--mono);font-size:14.5px;font-weight:500;color:var(--ink)}
.chunk .vi{font-size:15px;color:var(--steel)}
.chunk .n{font-size:14.5px;color:var(--ink-3);line-height:1.5}
.hide-vi .vi{filter:blur(5px);cursor:pointer;transition:.2s;user-select:none}
.hide-vi .vi.show{filter:none}

/* grammar */
.gram-rule{background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.gram-rule h4{font-family:var(--disp);font-size:16px;margin:0 0 7px;font-weight:800;letter-spacing:-.01em}
.gram-rule p{margin:0;font-size:16px;color:var(--ink-2)}
.pairs{display:flex;flex-direction:column;gap:9px}
.pair{border:1px solid var(--rule-2);border-radius:var(--r);overflow:hidden}
.pair .side{padding:8px 12px;font-family:var(--mono);font-size:14px}
.pair .a{background:var(--steel-soft);border-bottom:1px solid var(--rule-2)}
.pair .b{background:var(--surface)}
.pair .n{padding:7px 12px;font-size:14.5px;color:var(--ink-3);border-top:1px dashed var(--rule-2)}
.gram-more{margin:14px 0 0;font-size:15.5px;color:var(--ink-2);border-left:2px solid var(--steel);padding-left:13px}

/* DIFF — signature element */
.diff{border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:11px;background:var(--surface)}
.drow{display:flex;align-items:flex-start;gap:9px;padding:8px 12px;font-family:var(--mono);font-size:14px;line-height:1.5}
.drow .sg{font-weight:700;flex:none;width:11px;text-align:center;opacity:.85}
.drow.del{background:var(--del-soft);color:var(--del)}
.drow.add{background:var(--add-soft);color:var(--add)}
.dwhy{padding:9px 12px;font-size:14.5px;color:var(--ink-2);border-top:1px solid var(--rule-2);background:var(--surface)}

/* pron */
.pron-tip{font-size:16px;color:var(--ink-2);margin:0 0 12px}
.pron-tip strong{color:var(--ink);font-family:var(--disp);font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:6px}
.word{
  font-family:var(--mono);font-size:13px;padding:5px 10px;border:1px solid var(--rule);
  border-radius:99px;background:var(--surface);color:var(--ink-2);
}

/* quiz */
.q{margin-bottom:20px}
.q .qt{font-family:var(--disp);font-weight:600;font-size:16px;margin:0 0 9px;display:flex;gap:9px}
.q .qt .i{font-family:var(--mono);font-size:12px;color:var(--brass);flex:none;padding-top:2px}
.opts{display:flex;flex-direction:column;gap:5px}
.opt{
  text-align:left;background:var(--surface);border:1px solid var(--rule);color:var(--ink);
  padding:9px 12px;border-radius:var(--r);font-family:var(--mono);font-size:13.5px;line-height:1.45;
  transition:.15s;display:flex;gap:9px;align-items:flex-start;
}
.opt:hover:not(:disabled){border-color:var(--brass)}
.opt .mk{font-weight:700;color:var(--ink-3);flex:none}
.opt:disabled{cursor:default}
.opt.right{border-color:var(--add);background:var(--add-soft);color:var(--add)}
.opt.right .mk{color:var(--add)}
.opt.wrong{border-color:var(--del);background:var(--del-soft);color:var(--del)}
.opt.wrong .mk{color:var(--del)}
.exp{margin:8px 0 0;font-size:14.5px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:11px;display:none}
.exp.on{display:block}

/* tasks */
.task{display:flex;gap:11px;align-items:flex-start;padding:12px 14px;border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);margin-bottom:9px}
.cb{
  flex:none;width:21px;height:21px;border:1.5px solid var(--rule);border-radius:var(--r);
  background:transparent;display:grid;place-items:center;color:transparent;font-size:12px;transition:.15s;margin-top:2px;
}
.cb:hover{border-color:var(--brass)}
.cb.on{background:var(--brass);border-color:var(--brass);color:#fff}
[data-theme="dark"] .cb.on{color:#12201C}
.task .bd{flex:1;min-width:0}
.task .lb{font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--brass);display:block;margin-bottom:3px}
.task p{margin:0;font-size:16px}
.task.done p{color:var(--ink-3);text-decoration:line-through;text-decoration-color:var(--rule)}
.saybar{display:flex;gap:8px;align-items:center;margin-top:9px}
.saybar button{
  background:var(--brass);border:0;color:#fff;font-size:11.5px;font-weight:700;
  padding:6px 12px;border-radius:99px;font-family:var(--mono);letter-spacing:.03em;
}
[data-theme="dark"] .saybar button{color:#12201C}
.saybar .clock{font-family:var(--mono);font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums}
.saybar .hint{font-size:13px;color:var(--ink-3)}

/* notes */
textarea.note{
  width:100%;min-height:150px;resize:vertical;background:var(--surface);
  border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;
  font-family:var(--mono);font-size:14px;line-height:1.7;color:var(--ink);
}
textarea.note:focus{outline:0;border-color:var(--brass)}
.saved{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:6px;height:14px}

/* zen */
.zen{
  border:1px solid var(--rule);border-left:3px solid var(--steel);border-radius:0 var(--r) var(--r) 0;
  padding:16px 18px;background:var(--surface);
}
.zen .lb{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--steel);display:block;margin-bottom:6px}
.zen p{margin:0;font-size:17px;line-height:1.6}

/* footer nav */
.fnav{display:flex;gap:10px;align-items:center;margin-top:38px;padding-top:20px;border-top:1px solid var(--rule);flex-wrap:wrap}
.nbtn{
  background:transparent;border:1px solid var(--rule);color:var(--ink-2);
  padding:9px 15px;border-radius:var(--r);font-size:13px;font-weight:600;transition:.15s;
}
.nbtn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.nbtn:disabled{opacity:.35;cursor:not-allowed}
.nbtn.main{background:var(--ink);border-color:var(--ink);color:var(--paper);flex:1;min-width:190px;text-align:center}
.nbtn.main:hover{background:var(--brass);border-color:var(--brass);color:#fff}
[data-theme="dark"] .nbtn.main:hover{color:#12201C}
.nbtn.main.done{background:var(--add-soft);border-color:var(--add);color:var(--add)}

/* ============================================================ MODAL */
.scrim{position:fixed;inset:0;background:rgba(10,20,22,.5);z-index:60;display:none;padding:20px;overflow-y:auto}
.scrim.on{display:block}
.modal{
  max-width:640px;margin:6vh auto;background:var(--paper);border:1px solid var(--rule);
  border-radius:var(--r);box-shadow:var(--shadow);padding:22px 24px;
}
.modal-h{display:flex;align-items:baseline;gap:10px;margin-bottom:16px}
.modal-h h3{font-family:var(--disp);font-weight:800;font-size:19px;margin:0;letter-spacing:-.02em}
.modal-h .x{margin-left:auto}
.searchin{
  width:100%;background:var(--surface);border:1px solid var(--rule);border-radius:var(--r);
  padding:10px 13px;font-family:var(--mono);font-size:14px;color:var(--ink);margin-bottom:14px;
}
.searchin:focus{outline:0;border-color:var(--brass)}
.res{max-height:52vh;overflow-y:auto}
.res-i{padding:9px 0;border-bottom:1px solid var(--rule-2);cursor:pointer}
.res-i:hover .en{color:var(--brass)}
.res-i .d{font-family:var(--mono);font-size:9.5px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.res-i .en{font-family:var(--mono);font-size:14px;transition:.15s}
.res-i .vi{font-size:14.5px;color:var(--ink-2)}

/* flashcard */
.fc{
  border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);
  padding:26px 22px;text-align:center;min-height:170px;display:grid;place-content:center;gap:12px;cursor:pointer;
}
.fc .en{font-family:var(--mono);font-size:19px;font-weight:500;line-height:1.4}
.fc .vi{font-size:17px;color:var(--steel)}
.fc .n{font-size:14.5px;color:var(--ink-3)}
.fc .tap{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em;text-transform:uppercase}
.fc-bar{display:flex;gap:9px;align-items:center;margin-top:14px}
.fc-bar .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-left:auto}

/* pomodoro dock */
.dock{
  position:fixed;right:18px;bottom:18px;z-index:50;display:flex;align-items:center;gap:9px;
  background:var(--surface);border:1px solid var(--rule);border-radius:99px;padding:7px 9px 7px 14px;box-shadow:var(--shadow);
}
.dock .t{font-family:var(--mono);font-size:16px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;min-width:52px}
.dock .lb{font-family:var(--mono);font-size:8.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3);display:block;line-height:1}
.dock.run .t{color:var(--brass)}
@media(max-width:600px){.dock{right:12px;bottom:12px;padding:6px 8px 6px 12px}.dock .t{font-size:14px;min-width:46px}}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:9px}
@media(max-width:560px){.grid2{grid-template-columns:1fr}}
.stat{border:1px solid var(--rule);border-radius:var(--r);padding:12px 14px;background:var(--surface)}
.stat b{font-family:var(--disp);font-size:26px;font-weight:800;display:block;line-height:1;letter-spacing:-.02em}
.stat span{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{font-size:14.5px;color:var(--ink-3)}
.rowbtn{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}

@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ============================================================
   Q&A MODULE
   ============================================================ */
.railsec{border-top:1px solid var(--rule);padding-top:12px;margin:14px 0 6px}
.railnote{font-size:10.5px;color:var(--ink-3);margin:7px 0 0;line-height:1.4}
.plate.qp{width:34px;font-size:10px}
.qa-lead{font-family:var(--disp);font-size:18px;font-weight:600;line-height:1.45;letter-spacing:-.01em;color:var(--ink);margin:0 0 16px;border-left:3px solid var(--brass);padding-left:14px}
.qa-frame{background:var(--steel-soft);border:1px solid var(--rule);border-left:3px solid var(--steel);border-radius:var(--r);padding:12px 14px;margin:0 0 14px}
.qa-frame .lb{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin-bottom:7px;font-weight:600}
.qa-frame p{margin:0;font-family:var(--mono);font-size:13px;line-height:1.7;color:var(--ink)}
.qa-note{font-size:16px;color:var(--ink-2);margin:0 0 4px}
.ex{position:relative;border:1px solid var(--rule-2);border-radius:var(--r);padding:10px 40px 10px 13px;margin-bottom:8px;background:var(--surface)}
.ex .en{font-family:var(--mono);font-size:14px;line-height:1.5;color:var(--ink)}
.ex .vi{font-size:15px;color:var(--ink-2);margin-top:4px}
.ex .n{font-size:14px;color:var(--ink-3);margin-top:6px;border-left:2px solid var(--rule);padding-left:9px}
.hide-vi .ex .vi{filter:blur(4px);cursor:pointer;transition:.2s}
.hide-vi .ex .vi.show{filter:none}
.spk{position:absolute;top:8px;right:8px;background:transparent;border:1px solid var(--rule);color:var(--ink-3);width:24px;height:24px;border-radius:99px;font-size:11px;display:grid;place-items:center;transition:.15s;padding:0}
.spk:hover{border-color:var(--steel);color:var(--steel)}
/* builder */
.qbuild{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);padding:13px;margin:0 0 16px}
.qbuild .bh{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px;font-weight:600}
.bcols{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:620px){.bcols{grid-template-columns:1fr}}
.bcol .cl{font-family:var(--mono);font-size:9px;color:var(--brass);letter-spacing:.1em;text-transform:uppercase;margin-bottom:5px;font-weight:700}
.bcol .cells{display:flex;flex-direction:column;gap:3px}
.bcell{text-align:left;background:transparent;border:1px solid var(--rule-2);color:var(--ink-2);padding:5px 8px;border-radius:var(--r);font-family:var(--mono);font-size:11.5px;transition:.12s}
.bcell:hover{border-color:var(--brass);color:var(--brass)}
.bcell.on{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:600}
.bout{margin-top:11px;border-top:1px solid var(--rule-2);padding-top:11px;position:relative;padding-right:34px}
.bout .s{font-family:var(--mono);font-size:15px;color:var(--ink);line-height:1.5;min-height:22px}
.bout .g{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:6px;letter-spacing:.04em}
/* drills */
.drill{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);padding:12px 14px;margin-bottom:10px}
.drill-h{display:flex;align-items:baseline;gap:9px;margin-bottom:9px}
.drill-h .i{font-family:var(--mono);font-size:11px;color:var(--brass);font-weight:700;flex:none}
.drill-h .k{font-family:var(--mono);font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.drill-h .st{margin-left:auto;font-family:var(--mono);font-size:11px;flex:none}
.drill.ok{border-color:var(--add)}
.drill.ok .drill-h .st{color:var(--add)}
.drill.no{border-color:var(--del)}
.drill.no .drill-h .st{color:var(--del)}
.dprompt{font-size:16px;color:var(--ink);margin:0 0 10px}
.dprompt .m{font-family:var(--mono);font-size:14px}
.dhint{font-size:14.5px;color:var(--ink-2);margin:0 0 9px}
.slotline{min-height:40px;border:1px dashed var(--rule);border-radius:var(--r);padding:6px;display:flex;flex-wrap:wrap;gap:4px;align-items:center;background:var(--paper);margin-bottom:8px}
.slotline .ph{font-size:13px;color:var(--ink-3);padding:0 4px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:9px}
.chip{font-family:var(--mono);font-size:13px;padding:5px 9px;border:1px solid var(--rule);background:var(--surface);color:var(--ink);border-radius:var(--r);transition:.12s}
.chip:hover{border-color:var(--brass);color:var(--brass)}
.chip.used{opacity:.28;pointer-events:none}
.chip.placed{background:var(--brass-soft);border-color:var(--brass);color:var(--brass);font-weight:600}
.din{width:100%;font-family:var(--mono);font-size:14px;padding:9px 11px;border:1px solid var(--rule);border-radius:var(--r);background:var(--paper);color:var(--ink);margin-bottom:8px}
.din:focus{outline:none;border-color:var(--brass)}
.drow2{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.dfb{margin-top:9px;font-size:14.5px;color:var(--ink-2);border-left:2px solid var(--rule);padding-left:11px;display:none}
.dfb.on{display:block}
.dfb .good{font-family:var(--mono);font-size:14px;color:var(--add);display:block;margin-bottom:5px}
.models{display:flex;flex-direction:column;gap:6px;margin-top:9px}
.models .m{position:relative;font-family:var(--mono);font-size:13.5px;line-height:1.5;padding:8px 38px 8px 11px;border:1px solid var(--rule-2);border-left:2px solid var(--add);border-radius:var(--r);background:var(--paper);color:var(--ink)}
/* reflex */
.rfx{border:1px solid var(--rule);border-radius:var(--r);background:var(--surface);padding:16px;text-align:center}
.rfx .modes{display:flex;gap:5px;justify-content:center;margin-bottom:14px;flex-wrap:wrap}
.rfx .card{min-height:130px;display:flex;flex-direction:column;justify-content:center;gap:9px;padding:14px 8px}
.rfx .cue{font-size:18px;color:var(--ink-2);font-family:var(--disp);font-weight:600;line-height:1.4}
.rfx .tgt{font-family:var(--mono);font-size:16px;color:var(--ink);line-height:1.5}
.rfx .ansl{font-family:var(--mono);font-size:14px;color:var(--add);line-height:1.5}
.rfx .clock{font-family:var(--mono);font-size:30px;font-weight:700;color:var(--brass);letter-spacing:-.02em}
.rfx .clock.hot{color:var(--del)}
.rfx .cnt{font-family:var(--mono);font-size:10px;color:var(--ink-3);letter-spacing:.1em}
.rfx .bar{display:flex;gap:6px;justify-content:center;margin-top:12px;flex-wrap:wrap}
/* books index */
.bkrow{border-top:1px solid var(--rule-2);padding:12px 0 4px}
.bkrow:first-of-type{border-top:none;padding-top:2px}
.bkh{display:flex;align-items:baseline;gap:9px;margin-bottom:7px}
.bkh b{font-family:var(--disp);font-size:14px;font-weight:700;letter-spacing:-.01em}
.bkh span{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-left:auto;flex:none}
.bkitem{display:flex;gap:10px;align-items:baseline;padding:6px 8px;border-radius:var(--r);cursor:pointer;transition:.12s}
.bkitem:hover{background:var(--surface-2)}
.bkitem .ab{font-family:var(--mono);font-size:10.5px;color:var(--brass);font-weight:700;flex:none;width:24px}
.bkitem .t{font-size:14.5px;color:var(--ink-2);line-height:1.4}
.bkitem.done .t{color:var(--ink-3)}
.bkitem.done .ab::after{content:" ✓"}
.word.tap{cursor:pointer}
.word.tap:hover{border-color:var(--steel);color:var(--steel)}

.storewarn{
  max-width:1080px;margin:0 auto 14px;padding:10px 14px;border:1px solid var(--del);
  background:var(--del-soft);color:var(--del);border-radius:var(--r);font-size:14px;line-height:1.5;
}
/* iOS: input dưới 16px làm Safari tự zoom khi focus */
@media (hover:none){
  .din,.searchin,textarea.note{font-size:16px}
  .word,.chip{padding:7px 11px}
  .bkitem{padding:9px 8px}
}
/* dock không đè lên vùng gesture bar của iPhone */
.dock{bottom:calc(18px + env(safe-area-inset-bottom,0px))}
@media(max-width:900px){
  .stage{padding-bottom:78px}
  .dock{right:12px}
}
@media print{.qbuild,.rfx,.chips{display:none}
.topbar,.rail,.dock,.mstrip,.fnav,.blk-h .aux{display:none}.shell{grid-template-columns:1fr;padding:0}}

<script id="lessonData" type="application/json">[{"d":1,"phase":1,"t":"Bộ 30 giây tự giới thiệu","goal":"Nói trôi 4 câu về bản thân ở môi trường làm việc, không cần nghĩ.","why":"30 giây tự giới thiệu là đoạn tiếng Anh bạn sẽ lặp lại nhiều nhất trong sự nghiệp: kickoff, onboarding, gặp client mới, phỏng vấn, hội thảo. Học thuộc 100 từ mới hôm nay không đổi được cảm giác tự tin bằng việc nói mượt 30 giây này. Hôm nay ta xây nó thành phản xạ.","scene":"Kickoff call với team khách hàng. PM đề nghị mỗi người tự giới thiệu ngắn.","dlg":[{"s":"PM (client)","en":"Let's do quick intros. Vinh, would you like to start?","vi":"Mình giới thiệu nhanh nhé. Vinh, bạn bắt đầu được không?"},{"s":"You","en":"Sure. Hi everyone, I'm Vinh. I'm a frontend developer on the admin portal team.","vi":"Được. Chào mọi người, tôi là Vinh. Tôi là frontend developer ở team admin portal."},{"s":"You","en":"I mainly work with React and TypeScript, and right now I'm working on the image upload flow.","vi":"Tôi làm chủ yếu với React và TypeScript, và hiện tại tôi đang làm luồng upload ảnh."},{"s":"You","en":"I've been with the team for about two years. Feel free to ping me on Slack anytime.","vi":"Tôi ở team này khoảng hai năm rồi. Cứ nhắn Slack cho tôi bất cứ lúc nào."},{"s":"PM (client)","en":"Great, thanks. And who should we talk to about the API side?","vi":"Tuyệt, cảm ơn. Vậy về phía API thì nên nói với ai?"},{"s":"You","en":"That would be Hoa. She owns the backend services. I'll loop her in after this call.","vi":"Đó là Hoa. Chị ấy phụ trách các service backend. Tôi sẽ kéo chị ấy vào sau call này."}],"chunks":[{"en":"I'm a frontend developer on the ~ team","vi":"Tôi là frontend dev ở team ~","n":"Luôn có a/an trước nghề. Bỏ mạo từ là lỗi số 1 của người Việt."},{"en":"I mainly work with ~","vi":"Tôi làm chủ yếu với ~","n":"work with + công cụ/công nghệ. work on + dự án/tính năng."},{"en":"Right now I'm working on ~","vi":"Hiện tại tôi đang làm ~","n":"Câu này báo hiệu: việc tạm thời, đang diễn ra."},{"en":"I've been with the team for about two years","vi":"Tôi ở team này khoảng hai năm rồi","n":"Bắt đầu quá khứ, còn đúng đến hiện tại → dùng have been."},{"en":"Before this, I was at ~","vi":"Trước đó tôi ở ~","n":"Cách chuyển sang kinh nghiệm cũ mà không dài dòng."},{"en":"Feel free to ping me on Slack","vi":"Cứ nhắn Slack cho tôi thoải mái","n":"ping = nhắn nhanh. Rất phổ biến trong tech."},{"en":"She owns the backend services","vi":"Chị ấy phụ trách các service backend","n":"own X = chịu trách nhiệm chính về X. Nghe pro hơn is responsible for."},{"en":"I'll loop her in","vi":"Tôi sẽ kéo chị ấy vào (cuộc trao đổi)","n":"loop someone in = thêm ai vào email/thread/cuộc họp."}],"gram":{"t":"work on vs. am working on — cái bạn LÀ và cái bạn ĐANG LÀM","rule":"Đừng học 12 thì. Hôm nay chỉ cần một cặp: hiện tại đơn = vai trò, thói quen, sự thật lâu dài. Hiện tại tiếp diễn = việc tạm thời, đang chạy, tuần này. Cặp này chiếm khoảng 80% câu bạn nói trong standup.","pairs":[{"a":"I work on the admin portal.","b":"I'm working on the upload bug.","n":"A = việc lâu dài của tôi. B = việc tôi đang xử lý lúc này."},{"a":"I use TypeScript every day.","b":"I'm using a beta version this sprint.","n":"A = thói quen. B = tạm thời, sẽ đổi."},{"a":"Our team releases every Friday.","b":"We're releasing on Monday this week.","n":"A = quy trình. B = ngoại lệ lần này."}],"more":"Mẹo: nếu trong đầu bạn có chữ 'tạm thời', 'tuần này', 'lúc này' → dùng am/is/are + V-ing. Nếu có chữ 'thường', 'nói chung', 'vai trò của tôi' → dùng động từ trần."},"fix":[{"bad":"I'm frontend developer.","good":"I'm a frontend developer.","why":"Danh từ nghề nghiệp đếm được, số ít → bắt buộc có a/an. Tiếng Việt không có mạo từ nên tai bạn không thấy thiếu, nhưng tai người nghe thì thấy ngay."},{"bad":"I'm working here since 2022.","good":"I've been working here since 2022.","why":"since + mốc thời gian đi với hiện tại hoàn thành, không đi với hiện tại tiếp diễn."},{"bad":"I very like React.","good":"I really like React. / I like React a lot.","why":"very không bổ nghĩa cho động từ. very + tính từ (very good), really + động từ (really like)."}],"pron":{"t":"Âm cuối — thứ khiến người ta phải hỏi lại bạn","tip":"Tiếng Việt gần như không bật âm cuối. Người nghe tiếng Anh lại dựa vào âm cuối để phân biệt từ. Bỏ âm cuối là nguyên nhân số 1 khiến bạn bị hỏi lại, chứ không phải vì bạn thiếu từ vựng. Đọc chậm, cố ý bật nhẹ phụ âm cuối 10 lần.","words":["front-end","stack","build","deployed","work","team","React","component"]},"quiz":[{"q":"Chọn câu đúng để giới thiệu vai trò của bạn:","o":["I'm frontend developer.","I'm a frontend developer.","I'm the frontend developer."],"a":1,"e":"a + nghề nghiệp số ít. Dùng 'the' chỉ khi cả team có duy nhất một người và cả hai bên đều biết điều đó."},{"q":"Bạn đang xử lý bug upload trong sprint này. Nói thế nào?","o":["I work on the upload bug.","I'm working on the upload bug.","I working on the upload bug."],"a":1,"e":"Việc tạm thời, đang diễn ra → am working on. Câu 3 thiếu động từ to be."},{"q":"Cách nói bạn đã ở công ty 2 năm và vẫn đang làm:","o":["I am here for two years.","I was here for two years.","I've been here for two years."],"a":2,"e":"Bắt đầu trong quá khứ + còn đúng đến giờ = hiện tại hoàn thành. 'I was here for two years' nghĩa là bạn đã rời đi rồi."},{"q":"Muốn thêm Hoa vào email này, bạn viết:","o":["I'll loop Hoa in.","I'll loop in Hoa's.","I'll join Hoa."],"a":0,"e":"loop somebody in. Với đại từ thì bắt buộc chen giữa: loop her in, không nói loop in her."}],"task":{"say":"Bấm nút bấm giờ và nói 30 giây tự giới thiệu, thành tiếng, không đọc chữ. Cấu trúc: (1) tên + vai trò, (2) tech chính, (3) việc đang làm, (4) một câu mời liên hệ. Nói lại 3 lần. Lần 3 phải mượt hơn lần 1.","write":"Viết 4 câu intro của riêng bạn vào ô ghi chú. Đây là tài sản, bạn sẽ dùng lại 30 lần trong đời."},"zen":"Ngày 1 luôn là ngày dễ nhất để bắt đầu và dễ nhất để bỏ. Đừng đặt mục tiêu 'giỏi tiếng Anh'. Đặt mục tiêu: mở trang này 30 lần. Não bạn không cần động lực, nó cần một chuỗi không muốn bị đứt."},{"d":2,"phase":1,"t":"Mô tả công việc và hệ thống của bạn","goal":"Giải thích được bạn đang xây cái gì, cho ai, bằng gì — trong 5 câu.","why":"Khi client hỏi 'so what does your part do?', câu trả lời lan man sẽ khiến họ nghĩ bạn không nắm rõ hệ thống. Nắm được cách mô tả sản phẩm bằng động từ đơn giản còn giá trị hơn biết 50 thuật ngữ.","scene":"Một dev mới ở phía khách hàng hỏi bạn về hệ thống bạn đang làm.","dlg":[{"s":"Dev (client)","en":"So what exactly does the admin portal do?","vi":"Vậy chính xác thì admin portal làm gì?"},{"s":"You","en":"It's an internal tool. Operators use it to review and approve user submissions.","vi":"Đó là một tool nội bộ. Nhân viên vận hành dùng nó để xem và duyệt các bài user gửi lên."},{"s":"Dev (client)","en":"Got it. And how does it talk to our services?","vi":"Hiểu rồi. Nó giao tiếp với service của bên chúng tôi thế nào?"},{"s":"You","en":"It calls your REST API through a proxy. The proxy handles auth, so the browser never sees the token.","vi":"Nó gọi REST API của bạn qua một proxy. Proxy xử lý auth, nên browser không bao giờ thấy token."},{"s":"Dev (client)","en":"Makes sense. Is there anything on your side we should know about?","vi":"Hợp lý. Có gì ở phía bạn mà chúng tôi nên biết không?"},{"s":"You","en":"One thing: we resize images before upload, so what you receive is already normalized.","vi":"Một điều: chúng tôi resize ảnh trước khi upload, nên cái bạn nhận đã được chuẩn hoá rồi."}],"chunks":[{"en":"It's an internal tool","vi":"Đó là một tool nội bộ","n":"internal / customer-facing / public-facing là 3 tính từ mô tả sản phẩm hay dùng nhất."},{"en":"Operators use it to ~","vi":"Nhân viên vận hành dùng nó để ~","n":"Công thức vàng: [ai] uses it to [làm gì]. Mô tả sản phẩm qua người dùng, không qua kiến trúc."},{"en":"It calls your API through a proxy","vi":"Nó gọi API của bạn qua proxy","n":"call an API / hit an endpoint. Đừng nói 'connect to API' cho mỗi trường hợp."},{"en":"The proxy handles auth","vi":"Proxy xử lý phần auth","n":"handle = lo, đảm nhiệm. Rất tiện khi bạn không muốn giải thích chi tiết."},{"en":"so the browser never sees the token","vi":"nên browser không bao giờ thấy token","n":"so + kết quả. Cách ghép hai ý nhanh nhất."},{"en":"Is there anything we should know about?","vi":"Có gì chúng tôi nên biết không?","n":"Câu hỏi mở cực hữu ích cuối mọi buổi trao đổi kỹ thuật."},{"en":"One thing: ~","vi":"Một điều là ~","n":"Cách mở đầu một cảnh báo nhẹ mà không làm không khí nặng."},{"en":"what you receive is already normalized","vi":"cái bạn nhận đã được chuẩn hoá rồi","n":"what + S + V = 'cái mà...'. Cấu trúc này làm câu bạn nghe tự nhiên hẳn lên."}],"gram":{"t":"a / the / không gì cả — quyết định trong 2 giây","rule":"Người Việt sai mạo từ nhiều nhất vì tiếng Việt không có. Đừng học 20 quy tắc, dùng 3 câu hỏi theo thứ tự: (1) Danh từ này đếm được không? Không đếm được (data, information, feedback, software) → thường không cần mạo từ. (2) Đếm được và người nghe đã biết ta đang nói cái nào chưa? Đã biết → the. (3) Chưa biết, lần đầu nhắc → a/an.","pairs":[{"a":"We built a proxy last month.","b":"The proxy handles auth.","n":"Lần đầu nhắc → a. Nhắc lại cái đó → the."},{"a":"I need feedback on this.","b":"I need the feedback from yesterday's review.","n":"feedback không đếm được → không a. Nhưng khi xác định rõ cái nào → the."},{"a":"She's a designer.","b":"She's the designer on this project.","n":"a = một trong nhiều. the = người duy nhất ở vị trí đó."}],"more":"Danh từ không đếm được hay bị người Việt thêm s: information, feedback, advice, software, research, equipment, progress, work. Không bao giờ có informations, feedbacks, advices."},"fix":[{"bad":"I will send you the informations tomorrow.","good":"I'll send you the information tomorrow.","why":"information không đếm được, không có dạng số nhiều. Muốn đếm: two pieces of information."},{"bad":"Please give me some feedbacks.","good":"Please give me some feedback. / a few comments.","why":"Cùng lỗi, và feedback là từ bạn sẽ dùng hàng tuần nên sửa một lần cho xong."},{"bad":"It's tool for internal use.","good":"It's a tool for internal use.","why":"tool đếm được, số ít, lần đầu nhắc → a."}],"pron":{"t":"Âm /s/ và /z/ cuối từ","tip":"handles, calls, services, operators — người Việt hay lướt mất phần s cuối. Nếu mất, người nghe không biết bạn nói số ít hay số nhiều, và họ phải đoán. Kéo dài âm s ra một chút khi luyện, sau đó rút lại tự nhiên.","words":["handles","calls","services","operators","endpoints","resizes","components","requests"]},"quiz":[{"q":"Chọn câu đúng:","o":["We need more informations.","We need more information.","We need more of information."],"a":1,"e":"information là danh từ không đếm được. Không bao giờ có s."},{"q":"Lần đầu nhắc đến một service mới, bạn nói:","o":["We added the new service.","We added a new service.","We added new service."],"a":1,"e":"Người nghe chưa biết service nào → a. Từ câu sau, khi họ đã biết, mới dùng the."},{"q":"Cách nói tự nhiên nhất về việc gọi API:","o":["It connects with your API.","It calls your API.","It makes connection to your API."],"a":1,"e":"call an API là cách nói mặc định của dev. Ngắn và chính xác."},{"q":"Điền: The proxy ___ authentication for all requests.","o":["handle","handles","handling"],"a":1,"e":"Chủ ngữ số ít (the proxy) → động từ thêm s. Đây là lỗi rất hay bị bỏ khi nói nhanh."}],"task":{"say":"Nói 60 giây mô tả hệ thống bạn đang làm, theo thứ tự: nó là gì → ai dùng → dùng để làm gì → nó nói chuyện với hệ thống nào → một điều đặc biệt cần lưu ý. Không dùng slide, không đọc.","write":"Viết 5 câu mô tả sản phẩm hiện tại của bạn. Bắt buộc mỗi câu dưới 15 từ. Câu dài là chỗ ẩn của sự thiếu rõ ràng."},"zen":"Bạn không cần từ vựng cao siêu. Người nghe đánh giá bạn qua độ rõ ràng, không qua độ khó của từ. Một câu 10 từ đúng nhịp thắng một câu 25 từ nhồi thuật ngữ."},{"d":3,"phase":1,"t":"Small talk 90 giây đầu cuộc gọi","goal":"Có 5 câu mở đầu và 3 câu hỏi tiếp nối, dùng được với bất kỳ ai.","why":"90 giây đầu quyết định người ta thấy bạn là 'đồng nghiệp' hay 'người cung cấp dịch vụ'. Đây cũng là phần dễ nhất để chuẩn bị trước — vì nó lặp lại y nguyên mỗi tuần.","scene":"Bạn vào call sớm 2 phút, chỉ có bạn và một dev phía khách.","dlg":[{"s":"You","en":"Hey Jun, good to see you. How's your week going so far?","vi":"Chào Jun, vui được gặp. Tuần này của bạn tới giờ thế nào?"},{"s":"Jun","en":"Pretty busy, honestly. We had a release yesterday. How about you?","vi":"Thật ra là khá bận. Hôm qua bọn mình có bản release. Còn bạn?"},{"s":"You","en":"Same here. It's been a long week, but things are calming down. How did the release go?","vi":"Bên mình cũng vậy. Tuần này dài thật, nhưng đang dịu lại rồi. Bản release thế nào?"},{"s":"Jun","en":"Smoother than expected. Only one rollback.","vi":"Êm hơn dự kiến. Chỉ phải rollback một lần."},{"s":"You","en":"That's not bad at all. Anything you'd want us to watch out for on our side?","vi":"Vậy là không tệ đâu. Có gì bên mình nên để ý không?"},{"s":"Jun","en":"Maybe the auth timeout. We'll see. Anyway, let's get started.","vi":"Có thể là cái auth timeout. Để xem sao. Thôi, mình bắt đầu nhé."}],"chunks":[{"en":"How's your week going so far?","vi":"Tuần này của bạn tới giờ thế nào?","n":"Tốt hơn 'How are you?' vì nó mời người ta nói cụ thể."},{"en":"Pretty busy, honestly.","vi":"Thật ra là khá bận.","n":"pretty = khá. honestly cuối câu tạo cảm giác thân mật, thật lòng."},{"en":"Same here.","vi":"Bên mình cũng vậy.","n":"Hai từ, cứu bạn khỏi phải lặp lại cả câu của người ta."},{"en":"Things are calming down.","vi":"Mọi thứ đang dịu lại.","n":"Cách nói tình hình đang tốt hơn mà không cần chi tiết."},{"en":"How did it go?","vi":"Việc đó thế nào?","n":"Câu hỏi tiếp nối mạnh nhất trong tiếng Anh công việc. Dùng cho release, meeting, interview, demo."},{"en":"Smoother than expected.","vi":"Êm hơn dự kiến.","n":"than expected là hậu tố tiện lợi: harder than expected, faster than expected."},{"en":"That's not bad at all.","vi":"Vậy là không tệ chút nào.","n":"Khen nhẹ, kiểu đồng nghiệp, không quá nồng."},{"en":"Anything we should watch out for?","vi":"Có gì bọn mình nên để ý không?","n":"watch out for = cảnh giác với. Câu này biến bạn thành người chủ động."}],"gram":{"t":"Câu hỏi tiếp nối — kỹ năng thật của giao tiếp","rule":"Giao tiếp không phải là nói nhiều, mà là giữ cho bóng còn lăn. Ba loại câu hỏi tiếp nối, học một lần dùng mãi: hỏi chi tiết (How did it go? / What happened?), hỏi cảm nhận (How was it? / How do you feel about it?), hỏi mở rộng (What's next for that? / Anything else on your plate?).","pairs":[{"a":"Did you have a good week?","b":"How's your week going?","n":"A đóng lại bằng yes/no. B mở ra một câu chuyện. Câu hỏi mở luôn thắng."},{"a":"The release was OK?","b":"How did the release go?","n":"A nghe như đang xác nhận. B nghe như đang quan tâm."},{"a":"You are busy?","b":"Are you slammed this week?","n":"Trật tự từ trong câu hỏi: trợ động từ lên trước. Nói A là dấu hiệu rõ của người mới."}],"more":"Cấu trúc câu hỏi cơ bản: (Từ hỏi) + trợ động từ + chủ ngữ + động từ. How did the release go? Trợ động từ did đứng trước chủ ngữ. Không nói 'How the release went?'"},"fix":[{"bad":"How was your weekend? — I'm fine, thank you, and you?","good":"It was good, thanks. I got some rest. How about yours?","why":"'I'm fine thank you and you' là câu học sinh, không trả lời đúng câu hỏi. Trả lời cụ thể một chi tiết nhỏ rồi hỏi lại."},{"bad":"How the meeting went?","good":"How did the meeting go?","why":"Câu hỏi cần trợ động từ did, và động từ trở về nguyên mẫu go."},{"bad":"I am boring today.","good":"I'm bored today.","why":"boring = làm người khác thấy nhàm. bored = bạn đang thấy nhàm. Cặp -ing / -ed này sai là hiểu ngược nghĩa."}],"pron":{"t":"Nối âm — bí mật khiến bạn nghe tự nhiên","tip":"Người bản xứ không nói từng từ rời. How did it go nghe như howdidit-go. Luyện nối âm quan trọng hơn luyện phát âm từng từ hoàn hảo, vì nó tạo ra nhịp. Đọc cả cụm như một từ dài.","words":["how-did-it-go","what-are-you-working-on","let-me-check","give-me-a-second","not-at-all"]},"quiz":[{"q":"Câu hỏi nào mở đầu call tốt nhất?","o":["Are you fine?","How's your week going?","You are busy?"],"a":1,"e":"Câu hỏi mở, cụ thể về thời gian, dễ trả lời. Hai câu còn lại đóng hoặc sai trật tự từ."},{"q":"Đồng nghiệp nói 'We had a rough sprint.' Bạn tiếp nối:","o":["OK.","That's bad.","What happened?"],"a":2,"e":"Câu hỏi tiếp nối giữ hội thoại sống. 'OK' làm nó chết ngay."},{"q":"Chọn dạng đúng: The bug was ___ than expected.","o":["more hard","harder","hardest"],"a":1,"e":"Tính từ một âm tiết → thêm -er. So sánh hai thứ → không dùng dạng nhất (hardest)."},{"q":"Bạn thấy buổi họp nhàm chán. Nói:","o":["I was boring in the meeting.","I was bored in the meeting.","The meeting was bored."],"a":1,"e":"Người cảm nhận → -ed (bored). Vật gây cảm nhận → -ing (the meeting was boring)."}],"task":{"say":"Tự dựng một đoạn small talk 60 giây, đóng cả hai vai. Bắt buộc dùng: một câu hỏi mở, một câu 'Same here', một câu hỏi tiếp nối 'How did it go?'","write":"Viết 3 câu trả lời có sẵn cho câu 'How's it going?' — một khi bạn bận, một khi bình thường, một khi tuần vừa tốt. Có sẵn nghĩa là không phải nghĩ khi bị hỏi."},"zen":"Sự tự tin không đến từ việc biết mọi thứ, mà từ việc không phải nghĩ về những thứ lặp lại. Chuẩn bị trước 10 câu, bạn giải phóng não cho phần khó thật."},{"d":4,"phase":1,"t":"Bộ dụng cụ sống sót khi không nghe rõ","goal":"Không bao giờ phải giả vờ đã hiểu nữa.","why":"Nỗi sợ lớn nhất không phải là nói sai, mà là bị hỏi một câu mình không nghe kịp rồi cười trừ. Người giao tiếp giỏi hỏi lại nhiều hơn người kém — họ chỉ hỏi lại một cách tự nhiên đến mức không ai để ý.","scene":"Client nói nhanh, có tiếng ồn, bạn mất một đoạn.","dlg":[{"s":"Client","en":"...so we'll need the payload restructured before the QA cycle kicks off.","vi":"...nên bọn mình cần payload được cấu trúc lại trước khi vòng QA bắt đầu."},{"s":"You","en":"Sorry, you cut out for a second. Could you say that again?","vi":"Xin lỗi, tín hiệu của bạn mất một lúc. Bạn nói lại được không?"},{"s":"Client","en":"Sure. The payload needs restructuring before QA starts.","vi":"Được. Payload cần được cấu trúc lại trước khi QA bắt đầu."},{"s":"You","en":"Got it. Just to make sure I understand — you mean the request body, not the response?","vi":"Rõ rồi. Để chắc là tôi hiểu đúng — bạn nói request body, không phải response?"},{"s":"Client","en":"Correct, the request body.","vi":"Đúng, request body."},{"s":"You","en":"Perfect. So the deadline is before QA kicks off, which is next Wednesday, right?","vi":"Tốt. Vậy deadline là trước khi QA bắt đầu, tức là thứ Tư tuần sau, đúng không?"}],"chunks":[{"en":"Sorry, you cut out for a second.","vi":"Xin lỗi, tín hiệu bạn bị mất một lúc.","n":"cut out = tín hiệu chập chờn. Đổ lỗi cho đường truyền, không cho tai bạn. Vô cùng hữu ích và hoàn toàn lịch sự."},{"en":"Could you say that again?","vi":"Bạn nói lại được không?","n":"Chuẩn hơn 'Can you repeat again?' vốn bị lặp nghĩa."},{"en":"Could you slow down a bit?","vi":"Bạn nói chậm lại một chút được không?","n":"Được phép yêu cầu điều này. Người chuyên nghiệp sẽ vui vẻ làm theo."},{"en":"Just to make sure I understand —","vi":"Để chắc là tôi hiểu đúng —","n":"Mở đầu vàng. Nó biến việc hỏi lại thành hành động cẩn thận, không phải yếu kém."},{"en":"You mean ~, not ~?","vi":"Bạn nói ~, không phải ~?","n":"Đưa ra hai lựa chọn cụ thể là cách xác nhận nhanh nhất."},{"en":"So, in other words, ~","vi":"Vậy nói cách khác là ~","n":"Diễn đạt lại bằng lời của bạn. Vừa kiểm tra hiểu, vừa cho bạn thời gian nghĩ."},{"en":"How do you spell that?","vi":"Cái đó viết thế nào?","n":"Dùng cho tên người, tên tool, tên biến. Không ai thấy kỳ."},{"en":"Sorry, what does ~ stand for?","vi":"Xin lỗi, ~ là viết tắt của gì?","n":"Cho mọi từ viết tắt. Thường thì nửa phòng cũng đang không biết."}],"gram":{"t":"Hỏi kiểu gián tiếp — cùng nội dung, khác cảm giác","rule":"Cùng một câu hỏi, thêm một lớp vỏ là thành lịch sự. Công thức: Could you tell me + (câu trần thuật). Chú ý trật tự từ đổi lại thành như câu bình thường, không đảo ngữ.","pairs":[{"a":"When is the deadline?","b":"Could you tell me when the deadline is?","n":"Ở B, is nhảy về sau. Không nói 'Could you tell me when is the deadline'."},{"a":"Where do I find the doc?","b":"Do you know where I can find the doc?","n":"B mềm hơn, dùng khi hỏi người bạn không thân."},{"a":"Repeat that.","b":"Would you mind repeating that?","n":"Sau would you mind luôn là V-ing."}],"more":"Thang lịch sự tăng dần: Say that again → Can you say that again? → Could you say that again? → Would you mind saying that again? Chọn theo mức thân thiết, không cần lúc nào cũng mức cao nhất."},"fix":[{"bad":"Can you repeat again?","good":"Could you say that again?","why":"repeat đã có nghĩa lặp lại, thêm again là dư. Dùng 'say that again' hoặc 'repeat that' — chọn một."},{"bad":"Please explain me this part.","good":"Could you explain this part to me?","why":"explain không đi trực tiếp với người. Luôn là explain something to somebody."},{"bad":"I don't catch you.","good":"Sorry, I didn't catch that.","why":"catch that (nội dung), không catch you (con người). Và dùng quá khứ vì việc nghe vừa xảy ra xong."}],"pron":{"t":"Ngữ điệu câu hỏi","tip":"Câu hỏi yes/no lên giọng ở cuối. Câu hỏi wh- xuống giọng ở cuối. Nói ngữ điệu phẳng làm câu hỏi của bạn nghe như một mệnh lệnh, kể cả khi từ ngữ rất lịch sự. Ngữ điệu quan trọng hơn từ vựng trong việc thể hiện thái độ.","words":["Could you say that again? ↗","What did you mean? ↘","Is that right? ↗","Where should I put it? ↘"]},"quiz":[{"q":"Chọn câu chuẩn:","o":["Can you repeat again?","Could you say that again?","Please repeat again."],"a":1,"e":"repeat + again bị lặp nghĩa. 'Say that again' là cách nói tự nhiên nhất."},{"q":"Chọn trật tự từ đúng:","o":["Could you tell me when is the demo?","Could you tell me when the demo is?","Could you tell me when does the demo?"],"a":1,"e":"Câu hỏi gián tiếp dùng trật tự câu trần thuật: when the demo is."},{"q":"Điền: Would you mind ___ the file?","o":["to send","sending","send"],"a":1,"e":"Sau would you mind luôn là V-ing."},{"q":"Bạn không nghe rõ vừa rồi. Nói:","o":["I don't catch you.","I didn't catch that.","I am not catching."],"a":1,"e":"Việc đã xảy ra xong → quá khứ đơn. Và catch that, không catch you."}],"task":{"say":"Nói to 6 câu hỏi lại này, mỗi câu 3 lần, có ngữ điệu: Sorry, you cut out. / Could you say that again? / Just to make sure I understand... / You mean X, not Y? / How do you spell that? / What does that stand for?","write":"Viết 3 tình huống trong tuần qua bạn đã cười trừ thay vì hỏi lại. Với mỗi tình huống, viết câu bạn nên nói. Lần sau bạn sẽ có sẵn."},"zen":"Người ta không nhớ bạn hỏi lại mấy lần. Người ta nhớ bạn làm sai vì đã không hỏi. Hỏi lại là dấu hiệu của người có trách nhiệm."},{"d":5,"phase":1,"t":"Thời gian, deadline và cam kết","goal":"Nói về thời hạn chính xác đến mức không ai hiểu sai được.","why":"Sai một giới từ thời gian có thể tốn cả một sprint. 'Send it until Friday' và 'Send it by Friday' là hai yêu cầu khác nhau. Đây là phần tiếng Anh có hậu quả thật.","scene":"Chốt thời hạn cuối buổi họp.","dlg":[{"s":"PM","en":"When can you have the upload flow ready?","vi":"Khi nào bạn có thể xong luồng upload?"},{"s":"You","en":"I can have a working version by Thursday, and the polished one by end of next week.","vi":"Tôi có thể có bản chạy được trước thứ Năm, và bản hoàn thiện trước cuối tuần sau."},{"s":"PM","en":"Can we pull that in? We're demoing on Wednesday.","vi":"Có thể đẩy sớm lên không? Bọn mình demo vào thứ Tư."},{"s":"You","en":"Then I'd have to drop the retry logic for now. Is that acceptable for the demo?","vi":"Vậy tôi phải tạm bỏ phần retry. Như vậy có ổn cho buổi demo không?"},{"s":"PM","en":"That works. Just flag it in the demo notes.","vi":"Được. Chỉ cần ghi chú lại trong demo notes."},{"s":"You","en":"Will do. I'll push it by Tuesday evening so you have time to check.","vi":"Sẽ làm. Tôi sẽ push trước tối thứ Ba để bạn có thời gian kiểm tra."}],"chunks":[{"en":"I can have it ready by ~","vi":"Tôi có thể xong nó trước ~","n":"have something ready = mẫu cam kết chuẩn nhất. by = không muộn hơn."},{"en":"a working version","vi":"một bản chạy được","n":"Phân biệt working version / polished version giúp bạn hứa an toàn."},{"en":"Can we pull that in?","vi":"Có thể đẩy sớm lên không?","n":"pull in = làm sớm hơn. push back = lùi lại. Hai cụm này bạn sẽ nghe hàng tuần."},{"en":"Then I'd have to drop ~","vi":"Vậy thì tôi phải bỏ ~","n":"Nêu cái giá phải trả, đừng chỉ nói không. Đây là kỹ năng thương lượng."},{"en":"Is that acceptable?","vi":"Như vậy có được không?","n":"Đẩy quyết định về phía người yêu cầu, một cách lịch sự."},{"en":"That works.","vi":"Vậy ổn.","n":"Hai từ để đồng ý, cực kỳ phổ biến trong công việc."},{"en":"Just flag it in the notes.","vi":"Chỉ cần ghi chú lại.","n":"flag = nêu ra để người khác biết. flag a risk, flag an issue."},{"en":"Will do.","vi":"Sẽ làm ngay.","n":"Ngắn, chắc chắn, chuyên nghiệp. Tốt hơn 'OK I will do it'."}],"gram":{"t":"by / until / in / on / at — bản đồ giới từ thời gian","rule":"by = không muộn hơn mốc đó (hạn chót). until = liên tục cho đến mốc đó (khoảng thời gian). in + tháng, năm, khoảng thời gian tính từ giờ. on + ngày cụ thể, thứ. at + giờ chính xác.","pairs":[{"a":"Send it by Friday.","b":"I'll be in meetings until Friday.","n":"A = hạn chót. B = trạng thái kéo dài. Nói 'send it until Friday' là sai nghĩa hoàn toàn."},{"a":"The demo is on Wednesday at 3.","b":"The release is in October.","n":"on ngày, at giờ, in tháng. Ba giới từ, học một lần."},{"a":"I'll finish it in two hours.","b":"I'll finish it within two hours.","n":"in two hours = sau hai tiếng nữa. within two hours = trong vòng hai tiếng. Khác nhau rõ, dùng within khi muốn nói tối đa."}],"more":"Với hôm nay, ngày mai, tuần sau — không dùng giới từ: I'll send it tomorrow (không 'in tomorrow'). Sở hữu cho thời gian: yesterday's meeting, next week's release."},"fix":[{"bad":"Please review it until Monday.","good":"Please review it by Monday.","why":"until nghĩa là làm liên tục cho tới thứ Hai. Bạn muốn nói hạn chót → by. Lỗi này gây hiểu sai deadline thật."},{"bad":"We'll discuss about it in the meeting.","good":"We'll discuss it in the meeting.","why":"discuss là động từ có tân ngữ trực tiếp, không cần about. talk about thì cần."},{"bad":"I will send you in tomorrow.","good":"I'll send it to you tomorrow.","why":"Hai lỗi: tomorrow không cần giới từ, và send cần tân ngữ (it). Người Việt hay bỏ 'it' vì tiếng Việt cho phép."}],"pron":{"t":"Đuôi -ed và ba cách đọc","tip":"Ba quy tắc: sau âm /t/ /d/ → đọc /ɪd/ (needed, updated). Sau âm vô thanh (p, k, f, s, sh, ch) → đọc /t/ (pushed, worked, fixed). Còn lại → đọc /d/ (merged, deployed, changed). Không đọc đuôi -ed là mất luôn thông tin thời gian.","words":["needed /ɪd/","updated /ɪd/","pushed /t/","worked /t/","fixed /t/","merged /d/","deployed /d/","reviewed /d/"]},"quiz":[{"q":"Bạn muốn nói hạn chót là thứ Sáu:","o":["Please send it until Friday.","Please send it by Friday.","Please send it in Friday."],"a":1,"e":"by = không muộn hơn. until = kéo dài đến. Đây là lỗi có hậu quả thật trong công việc."},{"q":"Chọn câu đúng:","o":["The demo is in Wednesday at 3pm.","The demo is on Wednesday at 3pm.","The demo is at Wednesday in 3pm."],"a":1,"e":"on + thứ/ngày, at + giờ."},{"q":"Chọn câu đúng:","o":["Let's discuss about the timeline.","Let's discuss the timeline.","Let's discuss on the timeline."],"a":1,"e":"discuss + tân ngữ trực tiếp. Không có about."},{"q":"'fixed' đọc đuôi thế nào?","o":["/ɪd/ như needed","/t/ như pushed","/d/ như merged"],"a":1,"e":"x là âm vô thanh /ks/ → đuôi đọc /t/: fikst."}],"task":{"say":"Nói 5 câu cam kết thật về công việc tuần này, mỗi câu dùng by + một mốc thời gian. Ví dụ: I'll have the review done by Thursday morning.","write":"Viết lại 3 tin nhắn deadline gần nhất bạn từng gửi, bằng tiếng Anh, dùng đúng by/until/on/at."},"zen":"Hết tuần 1. Bạn chưa giỏi hơn nhiều — điều đó bình thường. Nhưng bạn đã có khoảng 40 cụm dùng được, tức là nhiều hơn số cụm bạn thực sự cần cho 80% cuộc họp. Đừng đo bằng cảm giác, đo bằng chuỗi ngày."},{"d":6,"phase":2,"t":"Standup: cấu trúc ba phần","goal":"Nói standup 45 giây rõ ràng, không lan man, không im lặng giữa câu.","why":"Standup là bài thuyết trình ngắn nhất và thường xuyên nhất trong đời bạn — khoảng 250 lần một năm. Có một khuôn mẫu cố định, bạn chỉ cần thay nội dung. Người nói standup tốt được coi là người làm việc tốt, dù công việc y như nhau.","scene":"Daily standup, mỗi người 45 giây.","dlg":[{"s":"Scrum master","en":"Vinh, you're up.","vi":"Vinh, tới bạn."},{"s":"You","en":"Yesterday I finished the validation logic and opened a PR for review.","vi":"Hôm qua tôi làm xong phần validation và mở PR để review."},{"s":"You","en":"Today I'm picking up the resize step, and I should have it done before the demo.","vi":"Hôm nay tôi nhận phần resize, và tôi sẽ xong trước buổi demo."},{"s":"You","en":"One blocker: I'm still waiting on the new API contract from the backend team.","vi":"Một vướng mắc: tôi vẫn đang chờ API contract mới từ team backend."},{"s":"Scrum master","en":"How long have you been blocked?","vi":"Bạn bị chặn bao lâu rồi?"},{"s":"You","en":"Since Monday. I've worked around it with mock data, but I'd rather not ship that.","vi":"Từ thứ Hai. Tôi đã tạm lách bằng mock data, nhưng tôi không muốn ship như vậy."}],"chunks":[{"en":"You're up.","vi":"Tới lượt bạn.","n":"Nghe câu này là bạn nói. Đơn giản nhưng nhiều người không nhận ra."},{"en":"Yesterday I finished ~ and opened a PR","vi":"Hôm qua tôi xong ~ và mở PR","n":"Việc xong hẳn trong quá khứ, có mốc thời gian → quá khứ đơn."},{"en":"Today I'm picking up ~","vi":"Hôm nay tôi nhận ~","n":"pick up a task = bắt tay vào một task. Nghe chủ động hơn 'I will do'."},{"en":"I should have it done before ~","vi":"Tôi sẽ xong nó trước ~","n":"should = tự tin nhưng chưa cam kết chết. Rất hữu ích khi estimate."},{"en":"One blocker: ~","vi":"Một vướng mắc: ~","n":"Nói thẳng chữ blocker giúp team xử lý ngay. Đừng gói nó trong lời xin lỗi."},{"en":"I'm still waiting on ~","vi":"Tôi vẫn đang chờ ~","n":"wait on someone (chờ người/việc họ giao), wait for something. Trong tech, waiting on rất phổ biến."},{"en":"I've worked around it with ~","vi":"Tôi đã lách tạm bằng ~","n":"work around = tìm cách đi vòng. Danh từ: a workaround."},{"en":"I'd rather not ship that.","vi":"Tôi không muốn ship cái đó.","n":"would rather not = cách nói không muốn, mềm mà rõ."}],"gram":{"t":"Quá khứ đơn vs. hiện tại hoàn thành — cặp thì của standup","rule":"Chỉ cần một câu hỏi: có mốc thời gian cụ thể trong quá khứ không? Có (yesterday, last week, on Monday) → quá khứ đơn. Không có mốc, chỉ quan tâm kết quả tính đến giờ → hiện tại hoàn thành (have/has + V3).","pairs":[{"a":"I fixed it yesterday.","b":"I've fixed it.","n":"A trả lời khi nào. B trả lời việc đã xong chưa. Trong standup, B thường là câu người ta muốn nghe."},{"a":"We deployed on Friday.","b":"We've already deployed.","n":"Có yesterday/Friday thì không dùng have. Không nói 'I have fixed it yesterday'."},{"a":"I worked on it for two days.","b":"I've been working on it for two days.","n":"A = xong rồi, không làm nữa. B = vẫn đang làm. Khác biệt này rất quan trọng khi báo cáo."}],"more":"Quy tắc sắt: yesterday, last week, in 2023, on Monday KHÔNG bao giờ đi với have/has. Ngược lại: since, so far, already, yet, recently → đi với have/has."},"fix":[{"bad":"I have finished it yesterday.","good":"I finished it yesterday.","why":"yesterday là mốc quá khứ xác định → quá khứ đơn. Đây là lỗi hay gặp nhất khi người Việt học hiện tại hoàn thành."},{"bad":"I am waiting the API since Monday.","good":"I've been waiting for the API since Monday.","why":"Ba điểm: wait cần for, since đi với hoàn thành, và việc còn đang tiếp diễn → have been + V-ing."},{"bad":"Yesterday I go to the client office.","good":"Yesterday I went to the client office.","why":"Quá khứ đơn bất quy tắc. Người Việt hay quên chia thì vì tiếng Việt dùng 'hôm qua' là đủ."}],"pron":{"t":"Dạng rút gọn — bắt buộc phải dùng","tip":"I've, I'd, don't, didn't, it's. Người bản xứ hầu như không nói dạng đầy đủ trong hội thoại. Nếu bạn nói 'I have finished' đầy đủ mọi lúc, nghe rất trang trọng và chậm. Luyện I've /aɪv/ thành một âm duy nhất.","words":["I've /aɪv/","I'd /aɪd/","we've","haven't","didn't","it's done","that's it"]},"quiz":[{"q":"Chọn câu đúng:","o":["I have finished the PR yesterday.","I finished the PR yesterday.","I finish the PR yesterday."],"a":1,"e":"yesterday = mốc quá khứ cụ thể → quá khứ đơn, không dùng have."},{"q":"Bạn bị chặn từ thứ Hai và VẪN đang chờ:","o":["I wait for it since Monday.","I waited for it since Monday.","I've been waiting for it since Monday."],"a":2,"e":"since + còn tiếp diễn → have been + V-ing."},{"q":"Cách nói bạn sắp bắt tay vào một task:","o":["Today I'm picking up the resize step.","Today I pick up the resize step.","Today I picked up the resize step."],"a":0,"e":"Kế hoạch hôm nay, đang bắt đầu → hiện tại tiếp diễn."},{"q":"Điền: I ___ the docs already, so we can move on.","o":["read","have read","am reading"],"a":1,"e":"already + kết quả tính đến giờ → hiện tại hoàn thành."}],"task":{"say":"Nói standup thật của hôm nay bằng tiếng Anh, đúng 3 phần, dưới 45 giây. Bấm giờ. Nếu quá 60 giây, bạn đang lan man — cắt bớt và nói lại.","write":"Viết standup mẫu của bạn với 3 ô trống: Yesterday I ___. Today I'm ___. One blocker: ___. Dùng lại mỗi ngày, chỉ thay nội dung."},"zen":"Cấu trúc giải phóng bạn. Khi khuôn đã cố định, não bạn chỉ phải nghĩ về nội dung — không phải nghĩ về ngữ pháp và nội dung cùng lúc. Đó là lý do người nói tốt trông như không cần nỗ lực."},{"d":7,"phase":2,"t":"Đã xong, đang làm, chưa làm","goal":"Báo trạng thái công việc chính xác, không gây hiểu nhầm về mức độ hoàn thành.","why":"Câu 'it's done' hiểu sai khiến PM lên kế hoạch dựa trên thứ không tồn tại. Học được thang trạng thái từ 'not started' đến 'shipped' là học được ngôn ngữ của sự tin cậy.","scene":"PM rà lại từng mục trước khi chốt sprint.","dlg":[{"s":"PM","en":"Where are we on the upload feature?","vi":"Tính năng upload đang ở đâu rồi?"},{"s":"You","en":"The validation part is done and merged. The resize part is in progress — about halfway.","vi":"Phần validation xong và đã merge. Phần resize đang làm — khoảng nửa đường."},{"s":"PM","en":"And the HEIC conversion?","vi":"Còn phần chuyển đổi HEIC?"},{"s":"You","en":"I haven't started that yet. It's blocked until we decide client or server side.","vi":"Tôi chưa bắt đầu cái đó. Nó bị chặn cho tới khi chúng ta quyết là client hay server."},{"s":"PM","en":"Right. Anything you've already tried that didn't work?","vi":"Đúng rồi. Có gì bạn đã thử mà không được không?"},{"s":"You","en":"Yes — I've tested a WASM library, but it's too heavy. I've written up the numbers in the doc.","vi":"Có — tôi đã thử một thư viện WASM, nhưng nó quá nặng. Tôi đã ghi lại số liệu trong doc."}],"chunks":[{"en":"Where are we on ~?","vi":"~ đang ở đâu rồi?","n":"Câu hỏi trạng thái mà PM hay dùng nhất. Nghe được nó là hiểu ngay họ muốn gì."},{"en":"done and merged","vi":"xong và đã merge","n":"Luôn nói rõ mức độ xong. done có thể là chưa merge, chưa test, chưa deploy."},{"en":"in progress — about halfway","vi":"đang làm — khoảng nửa đường","n":"Thêm một con số ước lượng làm báo cáo của bạn đáng tin gấp đôi."},{"en":"I haven't started that yet.","vi":"Tôi chưa bắt đầu cái đó.","n":"yet đứng cuối câu phủ định. Nó ngụ ý bạn sẽ làm, chỉ chưa tới lúc."},{"en":"It's blocked until ~","vi":"Nó bị chặn cho tới khi ~","n":"Nêu điều kiện mở chặn, đừng chỉ nói bị chặn."},{"en":"Anything you've already tried?","vi":"Có gì bạn đã thử chưa?","n":"already đứng giữa have và động từ."},{"en":"I've written up the numbers","vi":"Tôi đã ghi lại số liệu","n":"write up = viết lại thành tài liệu tử tế. Rất hữu dụng."},{"en":"It's too heavy.","vi":"Nó quá nặng.","n":"too + tính từ = quá mức chấp nhận được. Khác very (chỉ là rất)."}],"gram":{"t":"already / yet / still / just — bốn từ nhỏ, bốn thông điệp","rule":"already = xong sớm hơn mong đợi, dùng trong câu khẳng định, đứng giữa have và V3. yet = chưa, dùng trong câu phủ định và câu hỏi, đứng cuối câu. still = vẫn còn (thường mang chút sốt ruột), đứng trước động từ chính. just = vừa mới xong.","pairs":[{"a":"I've already deployed it.","b":"I haven't deployed it yet.","n":"already trong khẳng định, yet trong phủ định. Đừng đổi chỗ."},{"a":"I'm still waiting for review.","b":"I've just gotten the review.","n":"still = việc kéo dài chưa xong. just = vừa xảy ra."},{"a":"Have you finished yet?","b":"Have you already finished?","n":"A là hỏi bình thường. B mang ý ngạc nhiên: xong rồi cơ à?"}],"more":"Thang trạng thái nên dùng thay vì chỉ done: not started → in progress → code complete → in review → merged → deployed → verified. Nói đúng bậc, không ai phải hỏi lại."},"fix":[{"bad":"I don't finish it yet.","good":"I haven't finished it yet.","why":"yet đi với hiện tại hoàn thành phủ định, không đi với hiện tại đơn."},{"bad":"It's done, but I need to test and merge.","good":"The code is complete, but it still needs testing and review.","why":"Không sai ngữ pháp, nhưng sai giao tiếp. Nói done khi chưa merge làm người khác lập kế hoạch sai. Chọn đúng bậc trạng thái."},{"bad":"I already send you the doc.","good":"I've already sent you the doc.","why":"already thường đi với hiện tại hoàn thành, và send phải thành sent."}],"pron":{"t":"Động từ bất quy tắc dạng V3 hay dùng nhất","tip":"Trong công việc, năm dạng V3 này chiếm phần lớn: written, sent, done, gotten/got, taken. Đọc to cả cụm 'I've sent it', 'I've written it up', 'I've taken care of it' cho đến khi không phải nghĩ.","words":["I've sent it","I've written it up","I've done that","I've taken care of it","I've got it working"]},"quiz":[{"q":"Chọn câu đúng:","o":["I don't finish it yet.","I haven't finished it yet.","I haven't finish it yet."],"a":1,"e":"haven't + V3 (finished), và yet đứng cuối."},{"q":"Vị trí đúng của already:","o":["I already have deployed it.","I've already deployed it.","I've deployed already it."],"a":1,"e":"already nằm giữa have và V3."},{"q":"Bạn vẫn đang chờ review và hơi sốt ruột:","o":["I'm already waiting for review.","I'm still waiting for review.","I'm yet waiting for review."],"a":1,"e":"still = vẫn còn đang, hàm ý lâu hơn mong đợi."},{"q":"Code viết xong nhưng chưa review, chưa merge. Câu chính xác nhất:","o":["It's done.","It's code complete but not reviewed yet.","It's finished and ready."],"a":1,"e":"Chính xác về trạng thái quan trọng hơn nghe cho gọn. Nói done quá sớm là cách nhanh nhất để mất tín nhiệm."}],"task":{"say":"Lấy 5 task thật trên board của bạn. Nói trạng thái từng cái, dùng đúng một trong: done and merged / in progress, about X percent / in review / blocked until / haven't started yet.","write":"Viết bản cập nhật trạng thái 5 dòng gửi PM. Mỗi dòng bắt buộc có một bậc trạng thái cụ thể, không dùng chữ done chung chung."},"zen":"Sự tin cậy được xây bằng độ chính xác của lời nói, không bằng tốc độ làm. Người luôn báo đúng trạng thái được giao việc lớn hơn người luôn nói xong rồi."},{"d":8,"phase":2,"t":"Nói về vướng mắc và phụ thuộc","goal":"Nêu blocker theo cách khiến người khác muốn giúp, không phải muốn phòng thủ.","why":"Cách bạn nói về vướng mắc quyết định người ta thấy bạn đang giải quyết vấn đề hay đang chỉ tay. Cùng một sự thật, hai cách nói, hai kết quả sự nghiệp khác nhau.","scene":"Bạn bị chặn bởi một team khác, cần nêu ra trong họp mà không gây căng thẳng.","dlg":[{"s":"You","en":"I want to flag a dependency. The upload work depends on the new schema.","vi":"Tôi muốn nêu một điểm phụ thuộc. Việc upload phụ thuộc vào schema mới."},{"s":"PM","en":"Whose side is that on?","vi":"Cái đó ở phía ai?"},{"s":"You","en":"The platform team. They're on it, but I haven't gotten an ETA yet.","vi":"Team platform. Họ đang làm, nhưng tôi chưa có mốc thời gian dự kiến."},{"s":"PM","en":"What's the impact if it slips to next week?","vi":"Nếu nó trễ sang tuần sau thì ảnh hưởng gì?"},{"s":"You","en":"Then I'd lose about two days, since I can't test end to end without it.","vi":"Thì tôi mất khoảng hai ngày, vì tôi không thể test end-to-end nếu không có nó."},{"s":"You","en":"In the meantime, I'll keep going on the UI so we don't lose the whole sprint.","vi":"Trong lúc chờ, tôi sẽ tiếp tục phần UI để không mất cả sprint."}],"chunks":[{"en":"I want to flag a dependency.","vi":"Tôi muốn nêu một điểm phụ thuộc.","n":"Mở đầu chuyên nghiệp. Nó báo trước rằng bạn sắp nói việc quan trọng."},{"en":"X depends on Y","vi":"X phụ thuộc vào Y","n":"depend ON, luôn là on. Và động từ có s: it depends."},{"en":"They're on it.","vi":"Họ đang xử lý.","n":"Ba từ, và nó thể hiện bạn không đổ lỗi cho ai."},{"en":"I haven't gotten an ETA yet.","vi":"Tôi chưa có mốc dự kiến.","n":"ETA = estimated time of arrival, dùng khắp nơi trong công việc."},{"en":"What's the impact if ~?","vi":"Nếu ~ thì ảnh hưởng gì?","n":"Câu hỏi này bạn nên tự hỏi trước khi bị hỏi."},{"en":"if it slips to next week","vi":"nếu nó trễ sang tuần sau","n":"slip = trễ hạn, dùng cho task và timeline. The deadline slipped."},{"en":"In the meantime, I'll ~","vi":"Trong lúc chờ, tôi sẽ ~","n":"Câu quan trọng nhất bài này. Nó chứng minh bạn không ngồi chờ."},{"en":"so we don't lose the whole sprint","vi":"để chúng ta không mất cả sprint","n":"so + mệnh đề = để mà. Nêu lý do bằng lợi ích của cả team."}],"gram":{"t":"Nêu nguyên nhân: because / since / due to / as a result","rule":"because + mệnh đề (có chủ ngữ + động từ). due to + danh từ. since dùng như because nhưng trang trọng hơn và thường đứng đầu câu. Lỗi phổ biến: dùng due to + mệnh đề.","pairs":[{"a":"It's late because the schema changed.","b":"It's late due to a schema change.","n":"because + mệnh đề, due to + danh từ. Đừng nói 'due to the schema changed'."},{"a":"Since we don't have the API, I'm using mocks.","b":"We don't have the API, so I'm using mocks.","n":"since đầu câu nêu nguyên nhân đã biết. so nêu kết quả."},{"a":"The test failed because of the config.","b":"The test failed because the config was wrong.","n":"because of + danh từ, because + mệnh đề. Cặp này sai rất nhiều."}],"more":"Khi báo tin không vui, thứ tự tốt nhất: nguyên nhân trước, kết luận sau. 'Since the schema is still changing, I'd move the date to Thursday' nghe hợp tác hơn 'I'd move the date to Thursday because the schema is still changing'."},"fix":[{"bad":"It's depend on the backend.","good":"It depends on the backend.","why":"Chủ ngữ số ít it → depends. Và không có to be trước động từ thường."},{"bad":"Due to the API was not ready, I used mocks.","good":"Because the API wasn't ready, I used mocks.","why":"due to phải đi với danh từ. Với mệnh đề dùng because/since."},{"bad":"The backend team is late, so I cannot do anything.","good":"I'm blocked on the backend schema. In the meantime, I'm moving ahead with the UI.","why":"Không sai ngữ pháp, sai chiến lược. Câu đầu chỉ tay và tự bó tay. Câu sau nêu vấn đề và giải pháp tạm."}],"pron":{"t":"Trọng âm câu — nhấn vào từ mang thông tin","tip":"Tiếng Anh có nhịp mạnh nhẹ. Nhấn vào danh từ, động từ chính, tính từ. Nói nhẹ các từ chức năng (the, on, to, is, a). Người Việt hay nói đều đều mọi âm tiết, làm câu khó nghe dù phát âm từng từ đúng. Thử: I'm BLOCKED on the SCHEMA, so I'm MOVING to the UI.","words":["I'm BLOCKED on the SCHEMA","it DEPENDS on THEM","we LOST TWO DAYS","in the MEANtime"]},"quiz":[{"q":"Chọn câu đúng:","o":["It's depend on the API.","It depend on the API.","It depends on the API."],"a":2,"e":"depend on, chủ ngừ số ít → depends, và không có is."},{"q":"Chọn câu đúng:","o":["Due to the schema changed, we are late.","Due to a schema change, we are late.","Due to schema changed late."],"a":1,"e":"due to + danh từ (a schema change)."},{"q":"Bạn bị chặn nhưng vẫn muốn thể hiện chủ động. Chọn:","o":["I can't do anything until they finish.","In the meantime, I'll work on the UI.","It's not my fault."],"a":1,"e":"Nêu việc bạn vẫn làm được là dấu hiệu của người sở hữu vấn đề."},{"q":"Điền: The release ___ to next Friday.","o":["slipped","slept","slip"],"a":0,"e":"slip = trễ hạn. Quá khứ: slipped."}],"task":{"say":"Nói 60 giây về một blocker thật, theo 4 bước: nêu điểm phụ thuộc → ai đang giữ nó → ảnh hưởng nếu trễ → việc bạn vẫn làm trong lúc chờ.","write":"Viết tin Slack nêu blocker, dưới 4 dòng, không có câu nào bắt đầu bằng tên một team khác."},"zen":"Có một khác biệt giữa báo cáo vấn đề và trút vấn đề. Khác biệt nằm ở câu cuối: bạn đã làm gì với nó. Câu 'In the meantime, I...' đáng giá hơn cả một tháng luyện phát âm."},{"d":9,"phase":2,"t":"Đọc số, ngày, phiên bản thành tiếng","goal":"Đọc mọi con số kỹ thuật ra miệng mà không phải dừng lại nghĩ.","why":"Bạn biết viết 2.3, 0.5s, 40%, 2026-03-15. Nhưng khi phải nói ra miệng trong họp thì tắc. Đây là lỗ hổng rất phổ biến ở dev Việt Nam giỏi đọc hiểu — và nó làm bạn trông kém tự tin hơn thực tế.","scene":"Báo cáo kết quả tối ưu hiệu năng.","dlg":[{"s":"You","en":"We cut the bundle from 2.4 megabytes down to 890 kilobytes.","vi":"Chúng tôi giảm bundle từ 2,4 MB xuống 890 KB."},{"s":"Lead","en":"Nice. What about load time?","vi":"Tốt. Còn thời gian tải?"},{"s":"You","en":"It went from about three point two seconds to one point one — roughly a sixty-five percent improvement.","vi":"Từ khoảng 3,2 giây xuống 1,1 — cải thiện khoảng 65%."},{"s":"Lead","en":"Which version is that on?","vi":"Cái đó ở version nào?"},{"s":"You","en":"Version two point four point one, released on March fifteenth.","vi":"Version 2.4.1, phát hành ngày 15 tháng 3."},{"s":"Lead","en":"And how many users are on that build?","vi":"Và bao nhiêu user đang dùng bản đó?"},{"s":"You","en":"Around two thirds — about twelve thousand out of eighteen thousand.","vi":"Khoảng hai phần ba — chừng 12.000 trên 18.000."}],"chunks":[{"en":"2.4 → two point four","vi":"Số thập phân đọc point","n":"Không đọc comma. Tiếng Anh dùng dấu chấm cho thập phân."},{"en":"v2.4.1 → version two point four point one","vi":"Version đọc từng số, cách nhau point","n":"Không đọc là two hundred forty one."},{"en":"65% → sixty-five percent","vi":"percent luôn số ít","n":"Không có percents. 'a 65 percent improvement' có mạo từ a."},{"en":"2/3 → two thirds","vi":"Phân số: tử số thường, mẫu số thứ tự + s","n":"1/2 a half, 1/3 a third, 3/4 three quarters."},{"en":"March 15 → March fifteenth","vi":"Ngày đọc dạng thứ tự","n":"Kiểu Mỹ: March fifteenth. Kiểu Anh: the fifteenth of March."},{"en":"12,000 → twelve thousand","vi":"Không có s sau thousand khi có số đếm","n":"Sai: twelve thousands. Đúng: thousands of users (khi không có số cụ thể)."},{"en":"0.5s → half a second / zero point five seconds","vi":"Cả hai đều dùng được","n":"Trong nói chuyện, half a second nghe tự nhiên hơn."},{"en":"It went from X down to Y","vi":"Nó giảm từ X xuống Y","n":"Mẫu câu vàng để báo cáo cải thiện. from ~ to ~, thêm up/down cho hướng."}],"gram":{"t":"Nói về thay đổi số liệu — cấu trúc so sánh","rule":"Ba mẫu câu bao trọn mọi báo cáo số liệu: (1) X went from A to B. (2) We cut/reduced X by 40 percent. (3) X is twice as fast as Y. Chú ý by + mức thay đổi, to + giá trị cuối.","pairs":[{"a":"We reduced it by 40 percent.","b":"We reduced it to 40 percent.","n":"by = giảm đi 40%. to = giảm còn 40%. Sai giới từ là sai số liệu."},{"a":"It's twice as fast.","b":"It's two times faster.","n":"Cả hai đều được. twice as + tính từ + as là mẫu chuẩn."},{"a":"There are fewer errors.","b":"There is less traffic.","n":"fewer + đếm được (errors, requests). less + không đếm được (traffic, memory, time)."}],"more":"Cụm mô tả xu hướng: went up / went down / stayed flat / spiked / dropped sharply / leveled off. Dùng chúng thay vì lặp lại increase mãi."},"fix":[{"bad":"We reduced the size 40 percent.","good":"We reduced the size by 40 percent.","why":"Mức thay đổi cần by. Thiếu nó, câu nghe lơ lửng."},{"bad":"There are 12 thousands users.","good":"There are 12 thousand users.","why":"Sau số đếm cụ thể, thousand/hundred/million không thêm s."},{"bad":"It is more fast than before.","good":"It's faster than before.","why":"Tính từ một âm tiết dùng -er, không dùng more."}],"pron":{"t":"Cặp số dễ nghe lẫn","tip":"13 và 30, 14 và 40, 15 và 50. Khác biệt nằm ở trọng âm: thirTEEN nhấn cuối, THIRty nhấn đầu. Trong họp, đọc sai một con số có thể tốn tiền thật. Khi cần chắc chắn, nói thêm: fifty, five zero.","words":["thirTEEN vs THIRty","fourTEEN vs FORty","fifTEEN vs FIFty","eighTEEN vs EIGHty"]},"quiz":[{"q":"v3.2.0 đọc thế nào?","o":["version three point twenty","version three point two point zero","version three hundred twenty"],"a":1,"e":"Version đọc từng số, ngăn bằng point."},{"q":"Chọn câu đúng:","o":["We cut it by 30 percent.","We cut it 30 percent.","We cut it in 30 percents."],"a":0,"e":"by + mức giảm, và percent không thêm s."},{"q":"Chọn câu đúng:","o":["There were 20 thousands requests.","There were 20 thousand requests.","There were 20 thousand of requests."],"a":1,"e":"Số đếm cụ thể + thousand (không s, không of)."},{"q":"Điền: There are ___ bugs than last sprint.","o":["less","fewer","lesser"],"a":1,"e":"bugs đếm được → fewer. less dùng cho không đếm được như time, memory."}],"task":{"say":"Đọc thành tiếng 10 con số từ công việc thật của bạn: 2 version, 2 phần trăm, 2 dung lượng, 2 thời lượng, 2 ngày. Đọc chậm, đúng, rồi nhanh dần.","write":"Viết 3 câu báo cáo cải thiện hiệu năng, mỗi câu dùng một mẫu khác nhau: went from A to B / reduced by X percent / twice as fast as."},"zen":"Những lỗ hổng nhỏ mới là thứ làm bạn mất tự tin, không phải những phần khó lớn. Bạn hiểu được cả tài liệu kỹ thuật nhưng tắc ở chỗ đọc số. Tìm và bịt các lỗ nhỏ này, cảm giác tự tin lên rất nhanh."},{"d":10,"phase":2,"t":"Chốt tuần 2: standup thật, không nhìn giấy","goal":"Kiểm tra xem 9 ngày qua đã thành phản xạ chưa.","why":"Học mà không kiểm tra là tự lừa mình. Hôm nay không có nội dung mới. Hôm nay bạn diễn lại tất cả, không nhìn chữ. Chỗ nào tắc là chỗ cần quay lại — và biết được điều đó có giá trị hơn học thêm 20 cụm mới.","scene":"Mô phỏng một buổi họp tiến độ đầy đủ: chào hỏi, standup, một câu hỏi khó, chốt deadline.","dlg":[{"s":"Lead","en":"Morning Vinh. How's it going?","vi":"Chào buổi sáng Vinh. Dạo này thế nào?"},{"s":"You","en":"Pretty busy, but things are moving. How about you?","vi":"Khá bận, nhưng mọi thứ đang tiến. Còn bạn?"},{"s":"Lead","en":"Same. Let's do your update.","vi":"Cũng vậy. Cập nhật của bạn nhé."},{"s":"You","en":"Yesterday I finished validation and opened a PR. Today I'm on the resize step. One blocker: I'm still waiting on the schema.","vi":"Hôm qua tôi xong validation và mở PR. Hôm nay tôi làm phần resize. Một vướng mắc: tôi vẫn đang chờ schema."},{"s":"Lead","en":"Sorry, could you repeat the last part? You cut out.","vi":"Xin lỗi, bạn nhắc lại phần cuối được không? Bạn bị mất tiếng."},{"s":"You","en":"Sure — I've been blocked on the schema since Monday. In the meantime I'm using mock data.","vi":"Được — tôi bị chặn ở schema từ thứ Hai. Trong lúc chờ tôi dùng mock data."},{"s":"Lead","en":"Can you still make Thursday?","vi":"Bạn vẫn kịp thứ Năm chứ?"},{"s":"You","en":"I can have a working version by Thursday, but not the retry logic. Is that acceptable?","vi":"Tôi có thể có bản chạy được trước thứ Năm, nhưng không có phần retry. Như vậy có ổn không?"}],"chunks":[{"en":"things are moving","vi":"mọi thứ đang tiến","n":"Cách nói tình hình ổn mà không phải liệt kê."},{"en":"Let's do your update.","vi":"Cập nhật của bạn nhé.","n":"Nghe câu này là tới lượt bạn nói standup."},{"en":"Can you still make Thursday?","vi":"Bạn vẫn kịp thứ Năm chứ?","n":"make + mốc thời gian = kịp hạn. make the deadline."},{"en":"I'm on the resize step.","vi":"Tôi đang làm phần resize.","n":"be on something = đang làm việc đó. Ngắn hơn I'm working on."},{"en":"I've been blocked since ~","vi":"Tôi bị chặn từ ~","n":"Ôn lại: since + hoàn thành tiếp diễn."},{"en":"but not ~","vi":"nhưng không có ~
