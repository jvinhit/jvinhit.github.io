","n":"Cách giới hạn cam kết trong một cụm ngắn. Rất hữu ích."},{"en":"Is that acceptable?","vi":"Như vậy có ổn không?","n":"Ôn lại từ ngày 5. Đẩy quyết định về người yêu cầu."},{"en":"I'll circle back on that.","vi":"Tôi sẽ quay lại chuyện đó sau.","n":"Câu mới hôm nay. Dùng khi bạn chưa có câu trả lời và cần thời gian."}],"gram":{"t":"Kiểm tra chéo: bốn quyết định ngữ pháp trong một buổi standup","rule":"Không có gì mới. Hôm nay chỉ xác nhận bạn quyết đúng bốn chỗ: (1) vai trò hay việc đang làm, (2) có mốc quá khứ hay không, (3) còn tiếp diễn hay đã dứt, (4) by hay until.","pairs":[{"a":"I work on the portal.","b":"I'm working on the upload bug.","n":"Ngày 1. Vai trò vs. việc tạm thời."},{"a":"I fixed it yesterday.","b":"I've fixed it.","n":"Ngày 6. Có mốc thời gian hay không."},{"a":"I waited two days.","b":"I've been waiting two days.","n":"Ngày 6. Đã dứt vs. còn đang chờ."}],"more":"Nếu bạn còn phải nghĩ quá 2 giây ở bất kỳ cặp nào, mở lại ngày tương ứng. Ôn lại có giá trị hơn học mới — bộ não chỉ giữ những gì được gọi lại nhiều lần."},"fix":[{"bad":"I have blocked since Monday.","good":"I've been blocked since Monday.","why":"Bạn bị chặn (bị động), không phải bạn chặn ai. have been + V3."},{"bad":"Can you make in Thursday?","good":"Can you make Thursday?","why":"make + mốc thời gian, không cần giới từ."},{"bad":"I will can finish it.","good":"I'll be able to finish it.","why":"Hai modal không đứng cạnh nhau. will + be able to."}],"pron":{"t":"Nhóm hơi — nói theo cụm, không theo từ","tip":"Chia câu thành các nhóm nghĩa, ngắt nhẹ giữa các nhóm: Yesterday I finished validation / and opened a PR. / Today I'm on the resize step. / One blocker: / I'm still waiting on the schema. Ngắt đúng chỗ làm bạn nghe điềm tĩnh, dù nói chậm.","words":["Yesterday I finished validation / and opened a PR","One blocker: / I'm still waiting on the schema","I can have it by Thursday / but not the retry logic"]},"quiz":[{"q":"Chọn câu đúng:","o":["I have blocked since Monday.","I've been blocked since Monday.","I am blocked since Monday."],"a":1,"e":"Bị động + kéo dài đến giờ: have been blocked."},{"q":"Chọn câu đúng:","o":["I will can finish it today.","I'll be able to finish it today.","I will could finish it today."],"a":1,"e":"Không dùng hai modal liền nhau. will be able to."},{"q":"Bạn chưa có câu trả lời và cần kiểm tra lại:","o":["I don't know.","I'll circle back on that.","Maybe yes maybe no."],"a":1,"e":"circle back = quay lại sau khi đã kiểm tra. Nghe chuyên nghiệp và giữ được thể diện."},{"q":"Chọn câu chuẩn nhất khi cam kết có giới hạn:","o":["I can do everything by Thursday maybe.","I can have a working version by Thursday, but not the retry logic.","Thursday is difficult for me."],"a":1,"e":"Cam kết rõ + giới hạn rõ. Đây là mẫu câu bạn nên dùng cả đời."}],"task":{"say":"Diễn lại toàn bộ hội thoại trên, đóng cả hai vai, KHÔNG nhìn chữ. Sau đó thay hết nội dung bằng công việc thật của bạn hôm nay. Bấm giờ 3 phút.","write":"Tự cho điểm: trong 5 kỹ năng (intro, mô tả hệ thống, small talk, hỏi lại, standup), cái nào bạn còn phải nghĩ? Viết ra và ghi ngày cần mở lại."},"zen":"Một phần ba đường rồi. Đây là đoạn nhiều người bỏ nhất: mới lạ đã hết, kết quả chưa thấy. Nhưng tiến bộ ngôn ngữ không tuyến tính — nó im lặng rất lâu rồi nhảy một bậc. Việc của bạn ở đoạn này chỉ là không đứt chuỗi."},{"d":11,"phase":3,"t":"Điều khiển một buổi họp","goal":"Mở họp, nêu mục tiêu, giữ đúng hướng, kết thúc gọn — bằng tiếng Anh.","why":"Người điều khiển họp được nghe nhiều nhất và ít bị hỏi khó nhất. Nghịch lý là: dẫn họp dễ hơn tham gia họp, vì bạn kiểm soát được thứ mình phải nói. Đây là mẹo lớn cho người chưa tự tin.","scene":"Bạn chủ trì buổi họp kỹ thuật 30 phút với team khách hàng.","dlg":[{"s":"You","en":"Alright, let's get started. Thanks everyone for joining.","vi":"Rồi, mình bắt đầu nhé. Cảm ơn mọi người đã tham gia."},{"s":"You","en":"We have thirty minutes, and there are two things I'd like to cover: the upload spec and the timeline.","vi":"Chúng ta có 30 phút, và có hai việc tôi muốn bàn: spec upload và timeline."},{"s":"You","en":"The goal today is to agree on who normalizes the images. Let's start there.","vi":"Mục tiêu hôm nay là thống nhất ai chuẩn hoá ảnh. Bắt đầu từ đó nhé."},{"s":"Client","en":"Before that — can we quickly talk about the caching issue?","vi":"Trước đó — mình bàn nhanh về vấn đề caching được không?"},{"s":"You","en":"Sure, but let's park that for the last five minutes so we don't run out of time.","vi":"Được, nhưng để dành nó cho 5 phút cuối để mình không bị thiếu thời gian."},{"s":"You","en":"So, on normalization — Jun, would you like to walk us through your side first?","vi":"Vậy, về chuẩn hoá — Jun, bạn trình bày phía bạn trước nhé?"}],"chunks":[{"en":"Alright, let's get started.","vi":"Rồi, mình bắt đầu nhé.","n":"Câu mở họp mặc định. Nói dứt khoát, đừng lí nhí."},{"en":"There are two things I'd like to cover:","vi":"Có hai việc tôi muốn bàn:","n":"Nêu số lượng trước tạo cảm giác bạn có kiểm soát. cover a topic = bàn một chủ đề."},{"en":"The goal today is to ~","vi":"Mục tiêu hôm nay là ~","n":"Câu này cứu mọi buổi họp lan man. Dùng cả khi bạn không chủ trì."},{"en":"Let's park that for later.","vi":"Để dành chuyện đó bàn sau.","n":"park = tạm gác. Cách từ chối chủ đề lệch hướng mà không làm ai mất mặt."},{"en":"so we don't run out of time","vi":"để mình không bị thiếu thời gian","n":"run out of = hết. run out of time, run out of budget."},{"en":"Would you like to walk us through ~?","vi":"Bạn trình bày ~ cho mọi người nhé?","n":"walk someone through = dẫn qua từng bước. Cụm cực kỳ hữu dụng."},{"en":"Let's circle back to that.","vi":"Mình quay lại chuyện đó sau.","n":"Đồng nghĩa park, dùng khi đã bàn dở."},{"en":"Let's keep this moving.","vi":"Mình tiếp tục nhé.","n":"Cách nhắc nhẹ khi có người nói quá dài."}],"gram":{"t":"Đề xuất: let's / shall we / why don't we / how about","rule":"Bốn mức đề xuất. let's + V nguyên mẫu = mạnh nhất, dùng khi bạn dẫn. why don't we + V = mềm hơn, gợi ý. how about + V-ing = nhẹ nhất, thăm dò. shall we? = kiểu Anh, lịch sự, hay dùng cuối câu.","pairs":[{"a":"Let's move on.","b":"How about moving on?","n":"A dứt khoát, B thăm dò. Sau how about luôn là V-ing hoặc danh từ."},{"a":"Why don't we split the task?","b":"Let's split the task.","n":"A mời thảo luận. B đã quyết. Chọn theo vai của bạn trong họp."},{"a":"Shall we start?","b":"Let's start.","n":"shall we là câu hỏi, let's là lời kêu gọi."}],"more":"Sau let's không bao giờ có to: let's start (không let's to start). Phủ định: let's not go down that path."},"fix":[{"bad":"Let's to start the meeting.","good":"Let's start the meeting.","why":"let's = let us, sau đó là động từ nguyên mẫu không to."},{"bad":"How about to discuss it tomorrow?","good":"How about discussing it tomorrow? / Why don't we discuss it tomorrow?","why":"how about + V-ing. Nếu muốn dùng nguyên mẫu thì chuyển sang why don't we."},{"bad":"I think we should to change the approach.","good":"I think we should change the approach.","why":"Sau modal (should, could, must, will) luôn là động từ nguyên mẫu không to."}],"pron":{"t":"Nói câu mở đầu dứt khoát","tip":"Câu mở họp cần âm lượng và tốc độ ổn định. Người thiếu tự tin thường nói câu đầu nhỏ rồi to dần. Hãy làm ngược lại: câu đầu rõ nhất. Luyện: Alright — let's get started. Ngắt sau alright, nhấn started.","words":["Alright, / let's get STARted","The GOAL toDAY is to...","Let's PARK that for LAter","Let's keep this MOVing"]},"quiz":[{"q":"Chọn câu đúng:","o":["Let's to review the PR.","Let's review the PR.","Let's reviewing the PR."],"a":1,"e":"Sau let's là động từ nguyên mẫu, không to, không -ing."},{"q":"Chọn câu đúng:","o":["How about to move it to Friday?","How about moving it to Friday?","How about we moving it?"],"a":1,"e":"how about + V-ing."},{"q":"Ai đó đang lệch chủ đề. Cách xử lý chuyên nghiệp nhất:","o":["That's not the topic.","Let's park that and come back at the end.","Please stop."],"a":1,"e":"park + hẹn thời điểm quay lại. Vừa giữ hướng họp vừa tôn trọng người nói."},{"q":"Điền: Could you ___ us through the architecture?","o":["walk","go","bring"],"a":0,"e":"walk somebody through something = dẫn qua từng bước."}],"task":{"say":"Tự mở một buổi họp giả trong 45 giây: chào → thời lượng → hai chủ đề → mục tiêu → mời người đầu tiên nói. Nói ba lần, mỗi lần đổi chủ đề khác.","write":"Viết agenda 3 dòng bằng tiếng Anh cho buổi họp gần nhất của bạn: Goal / Topics / Decisions needed."},"zen":"Nếu bạn sợ họp, hãy xin làm người chủ trì. Nghe ngược, nhưng người chủ trì biết trước 80% những gì mình phải nói. Kiểm soát khung là cách giảm lo lắng hiệu quả hơn học thêm từ vựng."},{"d":12,"phase":3,"t":"Xen vào và giữ lượt nói","goal":"Nói được điều mình muốn nói, dù cuộc họp đang chạy nhanh.","why":"Đây là vấn đề số một của người không phải bản xứ trong họp: có ý kiến nhưng không tìm được khe để nói, rồi cuộc họp đi qua. Vấn đề không phải là trình độ tiếng Anh — mà là bạn không có sẵn câu để chen vào.","scene":"Cuộc họp đang bàn giải pháp, bạn thấy một rủi ro quan trọng.","dlg":[{"s":"Client","en":"...so we could just resize everything on the client and be done with it.","vi":"...nên mình có thể resize hết ở client rồi xong chuyện."},{"s":"You","en":"Sorry to jump in — can I add one thing here?","vi":"Xin lỗi chen vào — tôi thêm một điểm được không?"},{"s":"Client","en":"Go ahead.","vi":"Bạn nói đi."},{"s":"You","en":"There's one risk with client-side resizing: the output isn't deterministic across browsers.","vi":"Có một rủi ro với resize ở client: kết quả không nhất quán giữa các browser."},{"s":"You","en":"Let me finish that thought — Safari and Chrome produce different JPEG output at the same quality setting.","vi":"Cho tôi nói hết ý — Safari và Chrome cho ra JPEG khác nhau ở cùng mức quality."},{"s":"Client","en":"Hmm. So what would you suggest?","vi":"Hmm. Vậy bạn đề xuất gì?"},{"s":"You","en":"A hybrid: the client pre-resizes to save bandwidth, and the server does the final normalization.","vi":"Kiểu hybrid: client resize trước để tiết kiệm băng thông, server làm chuẩn hoá cuối."}],"chunks":[{"en":"Sorry to jump in —","vi":"Xin lỗi chen vào —","n":"Câu chen vào an toàn nhất. Nói nhanh rồi đi thẳng vào ý, đừng xin lỗi dài."},{"en":"Can I add one thing here?","vi":"Tôi thêm một điểm được không?","n":"one thing giới hạn thời gian bạn xin, nên người ta dễ đồng ý."},{"en":"Go ahead.","vi":"Bạn nói đi.","n":"Nghe câu này là bạn được phép nói. Cũng dùng để mời người khác."},{"en":"There's one risk with ~","vi":"Có một rủi ro với ~","n":"Mở đầu cảnh báo mà không phủ định ý người khác."},{"en":"Let me finish that thought.","vi":"Cho tôi nói hết ý.","n":"Câu giữ lượt nói khi bị cắt. Lịch sự nhưng vững."},{"en":"the output isn't deterministic","vi":"kết quả không nhất quán","n":"Từ kỹ thuật dùng đúng chỗ có sức nặng hơn cả một đoạn giải thích dài."},{"en":"So what would you suggest?","vi":"Vậy bạn đề xuất gì?","n":"Khi bạn nêu vấn đề, hãy chuẩn bị sẵn câu trả lời cho câu hỏi này."},{"en":"Just one more point and I'll hand it back.","vi":"Một điểm nữa rồi tôi trả lượt.","n":"Cách xin thêm 20 giây mà không ai thấy bạn chiếm diễn đàn."}],"gram":{"t":"Làm mềm ý kiến mạnh bằng modal","rule":"Cùng một nội dung, thêm modal là thành đề xuất thay vì phán xét. Thang từ mạnh đến mềm: That's wrong → That might not work → I'm not sure that would work → I wonder if that would cause issues. Chọn mức theo quan hệ và mức độ rủi ro.","pairs":[{"a":"That won't work.","b":"That might not work in Safari.","n":"A đóng cửa. B mở thảo luận và cụ thể hơn. Cụ thể luôn thuyết phục hơn."},{"a":"You should use a server.","b":"It could be worth doing it on the server.","n":"A ra lệnh. B đề xuất. Với khách hàng, luôn chọn B."},{"a":"It's a bad idea.","b":"I have one concern about that.","n":"Đánh giá ý tưởng vs. nêu quan ngại cụ thể. Câu B mời người ta hỏi tiếp."}],"more":"Các từ làm mềm hay dùng: might, could, perhaps, I'd say, in my experience, it seems like, one concern is. Đừng làm mềm quá — nếu rủi ro nghiêm trọng, hãy nói thẳng: This will break in production."},"fix":[{"bad":"I'm agree with you.","good":"I agree with you.","why":"agree là động từ, không phải tính từ. Không có to be. Lỗi này rất phổ biến và rất dễ nhận ra."},{"bad":"Sorry, sorry, excuse me, I want to say something, sorry...","good":"Sorry to jump in — one quick thing.","why":"Xin lỗi dài làm bạn mất chính khe thời gian vừa mở. Xin lỗi một lần, ngắn, rồi nói ngay."},{"bad":"You are wrong about the browser.","good":"That might not hold in Safari — I ran into a difference there.","why":"Chuyển từ đánh giá người sang mô tả sự việc. Cùng nội dung, khác hoàn toàn về hệ quả."}],"pron":{"t":"Nói nhanh và rõ ở câu chen vào","tip":"Câu chen vào phải phát ra trong khoảng 1 giây, nếu không khe đã đóng. Luyện Sorry-to-jump-in như một từ duy nhất, nối liền, không ngắt. Sau đó ngắt một nhịp rồi mới vào ý chính — chỗ ngắt đó chính là lúc bạn giành được sự chú ý.","words":["sorry-to-jump-in","can-I-add-one-thing","quick-question","just-one-thing","if-I-may"]},"quiz":[{"q":"Chọn câu đúng:","o":["I'm agree with you.","I agree with you.","I'm agreeing with you."],"a":1,"e":"agree là động từ thường, không cần to be."},{"q":"Cách chen vào tốt nhất giữa cuộc họp:","o":["Excuse me, excuse me, sorry...","Sorry to jump in — can I add one thing?","I want to talk now."],"a":1,"e":"Ngắn, có xin phép, và giới hạn phạm vi (one thing) nên dễ được đồng ý."},{"q":"Bạn bị cắt lời giữa ý. Nói:","o":["Don't interrupt me.","Let me finish that thought.","I was talking."],"a":1,"e":"Giữ lượt nói mà không đối đầu. Đây là câu nên nhớ suốt đời."},{"q":"Câu nào giữ được quan hệ tốt nhất khi bạn thấy giải pháp có vấn đề?","o":["That's wrong.","That won't work.","That might not work in Safari — here's why."],"a":2,"e":"Làm mềm + cụ thể + có lý do. Cụ thể là thứ khiến người ta lắng nghe."}],"task":{"say":"Luyện 5 câu chen vào, mỗi câu 5 lần, tốc độ nhanh dần: Sorry to jump in. / Can I add one thing? / Quick question. / Let me finish that thought. / Just one more point and I'll hand it back.","write":"Nhớ lại một buổi họp bạn đã im lặng dù có ý kiến. Viết chính xác câu bạn đã muốn nói, bằng tiếng Anh, có làm mềm bằng modal."},"zen":"Sự im lặng của bạn trong họp không được hiểu là khiêm tốn — nó thường được hiểu là không có ý kiến. Bạn không cần nói nhiều. Nhưng mỗi buổi họp nên nói ít nhất một câu có nội dung. Một câu, mỗi lần."},{"d":13,"phase":3,"t":"Đồng ý và phản đối một cách chuyên nghiệp","goal":"Nói không đồng ý mà không làm hỏng quan hệ, và đồng ý mà không mất chính kiến.","why":"Trong môi trường đa văn hoá, cách bạn phản đối quan trọng hơn nội dung phản đối. Có một khuôn ba bước gần như luôn hiệu quả: ghi nhận → nêu quan ngại cụ thể → đề xuất thay thế.","scene":"Khách hàng muốn thêm tính năng vào sprint hiện tại. Bạn không đồng ý.","dlg":[{"s":"Client","en":"Can we squeeze the export feature into this sprint too?","vi":"Mình nhét thêm tính năng export vào sprint này được không?"},{"s":"You","en":"I see where you're coming from — export would help the ops team a lot.","vi":"Tôi hiểu ý bạn — export sẽ giúp team vận hành rất nhiều."},{"s":"You","en":"My concern is that we'd have to cut testing time, and upload is the riskier piece.","vi":"Điều tôi lo là chúng ta sẽ phải cắt thời gian test, mà upload mới là phần rủi ro hơn."},{"s":"Client","en":"Fair point. But the ops team keeps asking.","vi":"Ý hay. Nhưng team vận hành liên tục hỏi."},{"s":"You","en":"What if we ship a basic CSV export next sprint, and keep this one focused?","vi":"Hay là mình ship bản export CSV cơ bản sprint sau, và giữ sprint này tập trung?"},{"s":"Client","en":"That could work. Let's do that.","vi":"Cách đó được đấy. Làm vậy nhé."},{"s":"You","en":"Great. I'll write it up so we don't lose it.","vi":"Tốt. Tôi sẽ ghi lại để mình không quên."}],"chunks":[{"en":"I see where you're coming from","vi":"Tôi hiểu ý bạn xuất phát từ đâu","n":"Ghi nhận mà không đồng ý. Câu mở đầu tốt nhất cho một phản đối."},{"en":"My concern is that ~","vi":"Điều tôi lo là ~","n":"Đặt vấn đề vào chỗ khách quan. Tốt hơn nhiều so với I don't like."},{"en":"we'd have to cut ~","vi":"chúng ta sẽ phải cắt ~","n":"Nêu cái giá phải trả bằng would, nghe như phân tích chứ không phải đe dọa."},{"en":"Fair point.","vi":"Ý hay đấy.","n":"Hai từ ghi nhận. Học để nghe hiểu và để dùng."},{"en":"What if we ~?","vi":"Hay là chúng ta ~?","n":"Mở đầu đề xuất thay thế. Sau what if dùng hiện tại đơn hoặc quá khứ đơn."},{"en":"keep this one focused","vi":"giữ sprint này tập trung","n":"keep + tân ngữ + tính từ. keep it simple, keep it small."},{"en":"That could work.","vi":"Cách đó được đấy.","n":"Đồng ý có điều kiện, nghe cân nhắc hơn 'yes'."},{"en":"I'll write it up so we don't lose it.","vi":"Tôi sẽ ghi lại để không bị quên.","n":"Câu này biến một cuộc tranh luận thành một cam kết."}],"gram":{"t":"Khuôn ba bước: ghi nhận — quan ngại — thay thế","rule":"Đây là khuôn ngôn ngữ, không phải mẹo tâm lý. Bước 1: I see your point / That makes sense / I understand the pressure. Bước 2: My concern is that... / The risk I see is... / The trade-off would be... Bước 3: What if we... / Would it work if we... / One option would be to...","pairs":[{"a":"No, we can't do that.","b":"I see the need — my concern is testing time. What if we split it?","n":"A kết thúc trao đổi. B mở ra một quyết định chung. Cùng một câu trả lời cuối, khác nhau về quan hệ."},{"a":"I disagree.","b":"I'd push back on that a little.","n":"push back = phản đối nhẹ, rất phổ biến trong công việc và không gây căng."},{"a":"That's impossible.","b":"That would be tight. Here's what we'd have to drop.","n":"Đừng nói impossible. Nói cái giá, rồi để người ta tự quyết."}],"more":"Đồng ý cũng có nhiều mức: Absolutely (mạnh) → That makes sense (bình thường) → I can live with that (chấp nhận được) → I'm not thrilled, but let's try it (đồng ý mà giữ chính kiến). Biết mức nào giúp bạn nói thật mà vẫn hợp tác."},"fix":[{"bad":"No. It's impossible.","good":"That would be tight. To make it, we'd have to drop the retry logic — is that OK?","why":"Không sai ngữ pháp, sai chiến lược. Nêu điều kiện thay vì cánh cửa đóng. Người ta thường tự rút lại yêu cầu khi thấy giá."},{"bad":"I don't agree with your opinion.","good":"I'd push back on that a little. My concern is ~","why":"Câu đầu nghe như đối đầu cá nhân. Câu sau đưa vấn đề ra khỏi con người."},{"bad":"According to me, this is wrong.","good":"In my opinion / From what I've seen, this could cause issues.","why":"According to dùng cho nguồn khác (according to the docs), không dùng cho chính mình."}],"pron":{"t":"Ngữ điệu khi phản đối","tip":"Cùng một câu, ngữ điệu lên ở cuối nghe như đang cân nhắc, ngữ điệu xuống nghe như đã quyết. Khi phản đối, để giọng hơi lên ở cuối câu quan ngại — nó mời người ta phản hồi thay vì phòng thủ. Thử: My concern is testing time ↗","words":["My concern is ~ ↗","What if we ~ ↗","That could work ↘","Fair point ↘"]},"quiz":[{"q":"Bước đầu tiên của một phản đối chuyên nghiệp:","o":["Nêu ngay vấn đề","Ghi nhận ý của người kia","Đề xuất giải pháp khác"],"a":1,"e":"Ghi nhận trước làm người nghe hạ phòng thủ. Sau đó họ mới thực sự nghe quan ngại của bạn."},{"q":"Chọn câu đúng:","o":["According to me, it's risky.","In my opinion, it's risky.","Following me, it's risky."],"a":1,"e":"according to dùng cho nguồn bên ngoài, không dùng cho bản thân."},{"q":"Điền: ___ we moved it to next sprint?","o":["What if","What about","How if"],"a":0,"e":"What if + mệnh đề. What about + V-ing hoặc danh từ."},{"q":"Cách nói phản đối nhẹ, phổ biến nhất trong công việc:","o":["I object.","I'd push back on that.","You are incorrect."],"a":1,"e":"push back = phản đối có tính xây dựng. Nghe tự nhiên và không gây căng thẳng."}],"task":{"say":"Lấy một yêu cầu thật bạn từng muốn từ chối. Nói 60 giây theo đúng ba bước: ghi nhận → quan ngại cụ thể → đề xuất thay thế. Không được nói chữ no ở đầu.","write":"Viết ba câu ghi nhận, ba câu nêu quan ngại, ba câu đề xuất thay thế. Chín câu này là bộ công cụ thương lượng của bạn."},"zen":"Đồng ý với mọi thứ không làm bạn dễ hợp tác — nó làm bạn thành người không có phán đoán. Giá trị của bạn nằm ở chỗ bạn thấy được rủi ro mà người khác không thấy. Nhưng cách nói quyết định người ta nghe hay không."},{"d":14,"phase":3,"t":"Làm rõ và diễn đạt lại","goal":"Xác nhận lại điều vừa nghe bằng lời của mình, để không bao giờ làm sai yêu cầu.","why":"Đây là kỹ năng có ROI cao nhất trong toàn bộ 30 ngày. Nó vừa giúp bạn hiểu đúng, vừa cho bạn 5 giây để nghĩ, vừa làm bạn trông cẩn thận. Một kỹ thuật, ba lợi ích.","scene":"Khách hàng nêu một yêu cầu dài, nhiều điều kiện.","dlg":[{"s":"Client","en":"So for images over five megabytes, resize first, but if it's a HEIC file, convert it, and keep EXIF only for orientation.","vi":"Với ảnh trên 5MB thì resize trước, nhưng nếu là file HEIC thì convert, và chỉ giữ EXIF cho phần orientation."},{"s":"You","en":"Let me make sure I've got this right. Three rules, correct?","vi":"Để tôi chắc là hiểu đúng. Ba quy tắc, đúng không?"},{"s":"You","en":"One: anything over five megs gets resized. Two: HEIC gets converted. Three: we strip EXIF except orientation.","vi":"Một: mọi thứ trên 5MB thì resize. Hai: HEIC thì convert. Ba: xoá EXIF trừ orientation."},{"s":"Client","en":"Yes, exactly.","vi":"Đúng, chính xác."},{"s":"You","en":"One follow-up: what about a HEIC file that's under five megs? Convert only, no resize?","vi":"Một câu hỏi thêm: file HEIC dưới 5MB thì sao? Chỉ convert, không resize?"},{"s":"Client","en":"Good catch. Yes, convert only.","vi":"Bạn phát hiện tốt. Đúng, chỉ convert."},{"s":"You","en":"Got it. I'll put this in the spec and share it after the call so we have it in writing.","vi":"Rõ rồi. Tôi sẽ ghi vào spec và chia sẻ sau call để có bằng chữ."}],"chunks":[{"en":"Let me make sure I've got this right.","vi":"Để tôi chắc là hiểu đúng.","n":"Câu mở đầu diễn đạt lại. Học thuộc, dùng hàng ngày."},{"en":"Three rules, correct?","vi":"Ba quy tắc, đúng không?","n":"Đếm số lượng trước khi liệt kê giúp cả hai bên kiểm tra."},{"en":"anything over five megs gets resized","vi":"mọi thứ trên 5MB thì được resize","n":"get + V3 là cách nói bị động thân mật, rất phổ biến khi nói."},{"en":"we strip EXIF except orientation","vi":"chúng ta xoá EXIF trừ orientation","n":"strip = lược bỏ dữ liệu. except = trừ ra."},{"en":"One follow-up:","vi":"Một câu hỏi thêm:","n":"Báo trước rằng bạn sắp hỏi tiếp, giúp người ta chuẩn bị."},{"en":"Good catch.","vi":"Bạn phát hiện tốt.","n":"Khen khi ai đó tìm ra lỗ hổng. Dùng nhiều trong code review."},{"en":"so we have it in writing","vi":"để có bằng chữ","n":"in writing = bằng văn bản. Câu này bảo vệ bạn về sau."},{"en":"So, in other words, ~","vi":"Vậy nói cách khác là ~","n":"Cách diễn đạt lại thứ hai. Đổi qua đổi lại để không nghe lặp."}],"gram":{"t":"Tường thuật lại lời người khác","rule":"Khi thuật lại, thì thường lùi một bậc và đại từ thay đổi. Nhưng trong công việc, nếu điều đó còn đúng ở hiện tại, bạn được phép giữ nguyên thì. Cả hai đều chấp nhận được — đừng để quy tắc lùi thì làm bạn tắc.","pairs":[{"a":"He said the API is ready.","b":"He said the API was ready.","n":"A: vẫn còn đúng. B: lúc đó anh ấy nói vậy, giờ chưa chắc. Trong công việc, khác biệt này rất có ý nghĩa."},{"a":"She asked if we could ship on Friday.","b":"She asked: can we ship on Friday?","n":"Tường thuật câu hỏi: dùng if/whether, và bỏ dấu hỏi, trật tự như câu trần thuật."},{"a":"They told me to update the doc.","b":"They said I should update the doc.","n":"tell somebody to V. say + mệnh đề (không có tân ngữ người)."}],"more":"Lỗi cực phổ biến: say và tell. tell luôn cần người nghe (tell me, tell the team). say không đi trực tiếp với người (không nói 'he said me')."},"fix":[{"bad":"He said me the API is ready.","good":"He told me the API is ready. / He said the API is ready.","why":"say không đi với tân ngữ người. tell thì bắt buộc có."},{"bad":"She asked me what is the deadline.","good":"She asked me what the deadline was.","why":"Câu hỏi tường thuật dùng trật tự câu trần thuật: what the deadline was."},{"bad":"I understand. (khi thật ra chưa hiểu)","good":"Let me make sure I've got this right — you mean X, right?","why":"Nói hiểu khi chưa hiểu là rủi ro lớn nhất trong toàn bộ khoá này. Nó tạo ra công việc làm lại."}],"pron":{"t":"Đọc danh sách có nhịp","tip":"Khi liệt kê, mỗi mục lên giọng, mục cuối xuống giọng: One ↗, two ↗, and three ↘. Nhịp này giúp người nghe biết chính xác khi nào danh sách kết thúc. Nói phẳng cả ba làm người ta không biết bạn đã hết ý chưa.","words":["One ↗ ... two ↗ ... and three ↘","resize ↗, convert ↗, and strip EXIF ↘"]},"quiz":[{"q":"Chọn câu đúng:","o":["He said me it's ready.","He told me it's ready.","He told to me it's ready."],"a":1,"e":"tell + người (không cần to). say không đi trực tiếp với người."},{"q":"Chọn câu tường thuật đúng:","o":["She asked what is the status.","She asked what the status was.","She asked what was the status?"],"a":1,"e":"Câu hỏi tường thuật dùng trật tự câu trần thuật, không đảo ngữ, không dấu hỏi."},{"q":"Bạn chưa hiểu rõ yêu cầu nhiều điều kiện. Việc nên làm:","o":["Nói I understand rồi tự đoán","Diễn đạt lại bằng lời mình và hỏi xác nhận","Chờ đọc lại trong tài liệu"],"a":1,"e":"Diễn đạt lại tại chỗ là cách duy nhất phát hiện được lỗ hổng ngay khi còn có người trả lời."},{"q":"Điền: Anything over 5MB ___ resized.","o":["get","gets","getting"],"a":1,"e":"Anything là số ít → gets. Đây là bị động dạng nói: get + V3."}],"task":{"say":"Nhờ ai đó (hoặc nghe một video tiếng Anh) rồi diễn đạt lại 3 yêu cầu bằng lời của bạn, mỗi lần mở đầu bằng một câu khác nhau: Let me make sure I've got this right / So in other words / Just to confirm.","write":"Viết lại yêu cầu phức tạp gần nhất bạn nhận được, dạng danh sách có số. Nếu viết ra mà thấy có chỗ mơ hồ — đó chính là câu hỏi bạn cần gửi đi hôm nay."},"zen":"Sự mơ hồ không tự biến mất, nó chỉ chuyển thành công việc làm lại. Mười giây diễn đạt lại tiết kiệm mười giờ code sai. Đây là ngày quan trọng nhất trong tuần này."},{"d":15,"phase":3,"t":"Chốt việc: ai làm gì, khi nào","goal":"Kết thúc mọi buổi họp bằng một danh sách hành động rõ chủ và rõ hạn.","why":"Buổi họp không có action item là buổi họp sẽ phải lặp lại. Người nói được câu chốt cuối cùng thường được coi là người dẫn dắt, dù không phải người chủ trì.","scene":"Năm phút cuối buổi họp.","dlg":[{"s":"You","en":"We have five minutes left. Let me recap the action items.","vi":"Còn năm phút. Để tôi tóm lại các việc cần làm."},{"s":"You","en":"I'll update the spec with the three normalization rules by tomorrow noon.","vi":"Tôi sẽ cập nhật spec với ba quy tắc chuẩn hoá trước trưa mai."},{"s":"You","en":"Jun, you're going to confirm the server-side library with your infra team, right?","vi":"Jun, bạn sẽ xác nhận thư viện phía server với team infra của bạn, đúng không?"},{"s":"Jun","en":"Yes, I'll get back to you by Thursday.","vi":"Đúng, tôi sẽ trả lời bạn trước thứ Năm."},{"s":"You","en":"And we're meeting again next Tuesday at the same time to review the numbers.","vi":"Và chúng ta gặp lại thứ Ba tuần sau cùng giờ để xem lại số liệu."},{"s":"Client","en":"Sounds good. Thanks for keeping us on track.","vi":"Nghe ổn. Cảm ơn bạn đã giữ đúng hướng."},{"s":"You","en":"Thanks everyone. I'll send the notes right after this.","vi":"Cảm ơn mọi người. Tôi sẽ gửi biên bản ngay sau đây."}],"chunks":[{"en":"We have five minutes left.","vi":"Còn năm phút.","n":"Câu báo giờ. Nó cho bạn quyền chuyển sang phần chốt."},{"en":"Let me recap the action items.","vi":"Để tôi tóm lại các việc cần làm.","n":"recap = tóm lại. action item = việc cần làm có người phụ trách."},{"en":"I'll update ~ by tomorrow noon","vi":"Tôi sẽ cập nhật ~ trước trưa mai","n":"Cam kết của bạn: dùng I'll + động từ + by + mốc."},{"en":"you're going to ~, right?","vi":"bạn sẽ ~, đúng không?","n":"Xác nhận cam kết của người khác. Thêm right? để họ phải trả lời."},{"en":"I'll get back to you by ~","vi":"Tôi sẽ trả lời bạn trước ~","n":"get back to somebody = phản hồi lại. Cụm dùng hàng ngày."},{"en":"We're meeting again next Tuesday.","vi":"Chúng ta gặp lại thứ Ba tuần sau.","n":"Lịch đã cố định → hiện tại tiếp diễn, không cần will."},{"en":"Thanks for keeping us on track.","vi":"Cảm ơn bạn đã giữ đúng hướng.","n":"on track = đúng lộ trình. off track = lệch."},{"en":"I'll send the notes right after this.","vi":"Tôi sẽ gửi biên bản ngay sau đây.","n":"Người gửi biên bản là người định nghĩa những gì đã được thống nhất. Hãy là người đó."}],"gram":{"t":"will / going to / hiện tại tiếp diễn — ba cách nói tương lai","rule":"will = quyết định ngay lúc nói, lời hứa, đề nghị giúp. going to = kế hoạch đã định trước, hoặc dự đoán có bằng chứng. hiện tại tiếp diễn = lịch đã cố định, đã có trên calendar.","pairs":[{"a":"I'll send it after the call.","b":"I'm going to refactor that module this sprint.","n":"A: vừa quyết định lúc nói. B: đã có kế hoạch từ trước."},{"a":"We're meeting at 3 on Tuesday.","b":"We'll meet sometime next week.","n":"A đã có trên lịch. B còn chưa chắc. Dùng sai làm người ta hiểu sai mức độ chắc chắn."},{"a":"It's going to break.","b":"It will break.","n":"A: tôi đang thấy dấu hiệu. B: dự đoán chung. Với cảnh báo dựa trên bằng chứng, dùng going to."}],"more":"Trong công việc, cam kết cá nhân gần như luôn dùng I'll: I'll check, I'll follow up, I'll get back to you. Đừng dùng I will check trịnh trọng — rút gọn thành I'll."},"fix":[{"bad":"I will send you tomorrow.","good":"I'll send it to you tomorrow.","why":"send cần tân ngữ. Tiếng Việt cho phép bỏ 'nó', tiếng Anh không. Đây là lỗi rất hay gặp."},{"bad":"We will meet next Tuesday at 3 (lịch đã chốt).","good":"We're meeting next Tuesday at 3.","why":"Không sai ngữ pháp nhưng sai sắc thái: will nghe như chưa chắc. Lịch đã cố định thì dùng tiếp diễn."},{"bad":"I will revert to you.","good":"I'll get back to you.","why":"revert nghĩa là hoàn tác, không phải trả lời. Đây là lỗi phổ biến trong email tiếng Anh ở châu Á."}],"pron":{"t":"Rút gọn I'll và we'll","tip":"I'll đọc /aɪl/, một âm tiết, gần giống aisle. we'll đọc /wɪl/ hoặc /wil/. Nói đầy đủ I will trong mọi câu làm bạn nghe cứng và chậm hơn thực tế. Luyện: I'll check, I'll send it, I'll follow up, we'll see.","words":["I'll check","I'll send it over","I'll follow up","we'll see","I'll get back to you"]},"quiz":[{"q":"Chọn câu đúng:","o":["I will send you tomorrow.","I'll send it to you tomorrow.","I'll send to you tomorrow."],"a":1,"e":"send cần tân ngữ trực tiếp (it) và tân ngữ gián tiếp (to you)."},{"q":"Lịch họp đã cố định trên calendar. Nói:","o":["We will meet on Tuesday.","We're meeting on Tuesday.","We meet on Tuesday maybe."],"a":1,"e":"Lịch đã chốt → hiện tại tiếp diễn. Nó truyền tải sự chắc chắn."},{"q":"Chọn câu đúng khi hứa phản hồi:","o":["I'll revert to you by Thursday.","I'll get back to you by Thursday.","I'll return you by Thursday."],"a":1,"e":"get back to somebody là cách nói chuẩn. revert nghĩa là hoàn tác."},{"q":"Điền: Looking at the trend, it ___ miss the deadline.","o":["will","is going to","would"],"a":1,"e":"Dự đoán dựa trên bằng chứng đang thấy → going to."}],"task":{"say":"Kết thúc một buổi họp giả trong 45 giây: báo giờ còn lại → tóm 3 action item với tên người và hạn → xác nhận buổi họp tiếp theo → cảm ơn.","write":"Viết biên bản họp 6 dòng cho buổi họp gần nhất: Decisions (2), Action items (3, có tên và hạn), Next meeting (1). Gửi thật cho team nếu được."},"zen":"Nửa đường. Hãy để ý một điều: 15 ngày qua bạn học rất ít ngữ pháp mới, mà chủ yếu học cách dùng lại cùng một số cấu trúc trong nhiều tình huống. Đó không phải thiếu sót — đó là cách ngôn ngữ thực sự hoạt động. Người bản xứ cũng chỉ dùng vài trăm cấu trúc."},{"d":16,"phase":4,"t":"Slack: ngắn, đúng tone, không mơ hồ","goal":"Viết tin nhắn công việc mà người nhận trả lời được ngay, không phải hỏi lại.","why":"Bạn viết Slack nhiều hơn nói. Và văn bản không có ngữ điệu — một câu bạn thấy bình thường có thể đọc ra rất khô. Học vài cách làm mềm là đủ để tránh cả năm hiểu lầm.","scene":"Bạn cần một thứ từ đồng nghiệp, và cần nó hôm nay.","dlg":[{"s":"You (bad)","en":"Send me the schema.","vi":"Gửi tôi cái schema. (quá cụt, dễ bị đọc là ra lệnh)"},{"s":"You (good)","en":"Hey Jun — quick one: could you send over the new schema when you get a chance?","vi":"Chào Jun — nhanh thôi: bạn gửi schema mới khi nào rảnh nhé?"},{"s":"You (good)","en":"I'm blocked on the upload work without it, so today would be ideal. No rush if you're heads down.","vi":"Tôi bị chặn phần upload nếu chưa có nó, nên hôm nay là lý tưởng. Không gấp nếu bạn đang tập trung việc khác."},{"s":"Jun","en":"Sure, give me an hour.","vi":"Được, cho tôi một tiếng."},{"s":"You","en":"Perfect, thanks. I'll keep going on the UI in the meantime.","vi":"Tuyệt, cảm ơn. Trong lúc đó tôi tiếp tục phần UI."},{"s":"You (later)","en":"Got it, thanks! One thing I noticed: the field is called imageUrl here but image_url in the docs. Which one is right?","vi":"Nhận được rồi, cảm ơn! Một điều tôi thấy: field ở đây tên imageUrl nhưng trong docs là image_url. Cái nào đúng?"}],"chunks":[{"en":"Hey Jun — quick one:","vi":"Chào Jun — nhanh thôi:","n":"Báo trước đây là việc nhỏ, người nhận sẽ mở ngay."},{"en":"when you get a chance","vi":"khi nào bạn rảnh","n":"Cụm làm mềm mạnh nhất trong Slack. Dùng khi việc không quá gấp."},{"en":"could you send over ~","vi":"bạn gửi ~ nhé","n":"send over nghe thân thiện hơn send. Cùng nghĩa."},{"en":"so today would be ideal","vi":"nên hôm nay là lý tưởng","n":"Nêu mong muốn về thời gian mà không ra lệnh. would làm câu mềm hẳn."},{"en":"No rush if you're heads down.","vi":"Không gấp nếu bạn đang tập trung.","n":"heads down = đang tập trung sâu. Câu này thể hiện bạn tôn trọng thời gian người khác."},{"en":"Give me an hour.","vi":"Cho tôi một tiếng.","n":"Cách người ta hứa thời gian trong Slack. Ngắn là bình thường."},{"en":"One thing I noticed:","vi":"Một điều tôi để ý:","n":"Mở đầu nêu vấn đề mà không quy trách nhiệm."},{"en":"Which one is right?","vi":"Cái nào đúng?","n":"Kết bằng một câu hỏi cụ thể. Tin nhắn không có câu hỏi rõ thường không được trả lời."}],"gram":{"t":"Thang lịch sự trong văn bản","rule":"Cùng một yêu cầu, năm mức. Chọn theo mức thân thiết và mức gấp: Send me X (chỉ dùng với người rất thân hoặc trong nhóm nội bộ) → Can you send X? → Could you send X? → Would you be able to send X? → I was wondering if you could send X (rất trang trọng, dùng với người lạ hoặc cấp trên xa).","pairs":[{"a":"Send the file.","b":"Could you send the file over?","n":"A không sai, nhưng trong văn bản dễ đọc thành gắt vì thiếu ngữ điệu."},{"a":"I need it today.","b":"Today would be ideal, but let me know if that's tough.","n":"B nêu cùng nhu cầu mà mở đường cho người ta phản hồi."},{"a":"Why did you change this?","b":"Curious — what was the reason for this change?","n":"Why did you thường bị đọc là chất vấn. Curious làm nó thành tò mò."}],"more":"Ba từ làm mềm hiệu quả nhất trong Slack: just (just checking), quick (quick question), curious (curious why). Nhưng đừng lạm dụng — nếu việc thực sự gấp, hãy nói rõ: This is blocking the release."},"fix":[{"bad":"Please do it fast.","good":"Any chance you could get to this today? It's blocking the release.","why":"fast nghe như thúc ép. Nêu lý do khiến người ta ưu tiên tự nguyện."},{"bad":"Why you change the field name?","good":"Curious — why was the field name changed?","why":"Sai ngữ pháp (thiếu did) và sai tone. Bị động ở đây giúp tách vấn đề khỏi con người."},{"bad":"I need your help ASAP!!!","good":"I need a hand with something — do you have 10 minutes today?","why":"ASAP và nhiều dấu chấm than tạo áp lực và thường phản tác dụng. Nêu lượng thời gian cụ thể thì dễ được đồng ý."}],"pron":{"t":"Đọc lại tin nhắn thành tiếng trước khi gửi","tip":"Không phải luyện phát âm — đây là mẹo viết. Đọc tin nhắn thành tiếng với ngữ điệu bình thường. Nếu nghe khô hoặc gắt, thêm một từ làm mềm. Bộ não bắt tone qua tai tốt hơn qua mắt.","words":["Could you send that over?","when you get a chance","no rush","quick question","any chance you could"]},"quiz":[{"q":"Cách nhắn tin nhờ việc không gấp:","o":["Send me the schema.","Could you send the schema when you get a chance?","I need the schema now."],"a":1,"e":"Có xin phép + có cụm làm mềm về thời gian."},{"q":"Chọn câu đúng:","o":["Why you changed this?","Why did you change this?","Why you change this?"],"a":1,"e":"Câu hỏi quá khứ cần did + động từ nguyên mẫu."},{"q":"Việc thực sự đang chặn bản release. Nên viết:","o":["ASAP please!!!","It's blocking the release — any chance you could get to it today?","Hurry up please."],"a":1,"e":"Nêu lý do cụ thể tạo ưu tiên thật, còn ASAP chỉ tạo áp lực."},{"q":"Tin nhắn nào dễ được trả lời nhất?","o":["Có mô tả dài về hoàn cảnh","Kết thúc bằng một câu hỏi cụ thể","Có nhiều emoji thân thiện"],"a":1,"e":"Người nhận cần biết chính xác họ phải làm gì. Một câu hỏi rõ ràng là điều kiện tối thiểu."}],"task":{"say":"Đọc thành tiếng ba tin nhắn Slack gần nhất bạn đã gửi. Nghe xem có khô không. Viết lại một cái cho mềm hơn.","write":"Viết một tin Slack nhờ việc, đủ 4 phần: chào + báo độ dài, nội dung nhờ, lý do vì sao cần, câu hỏi kết. Dưới 5 dòng."},"zen":"Văn bản không có ngữ điệu, nên người đọc sẽ tự gán ngữ điệu — thường là tệ hơn bạn nghĩ. Thêm ba từ làm mềm mất hai giây và tiết kiệm cho bạn rất nhiều căng thẳng không cần thiết."},{"d":17,"phase":4,"t":"Email: yêu cầu, nhắc lại, leo thang","goal":"Viết ba loại email khó nhất mà vẫn giữ được quan hệ.","why":"Email là nơi tiếng Anh của bạn được lưu lại và đọc bởi những người bạn chưa gặp. Một email rõ ràng có thể mở ra cơ hội; một email mơ hồ tạo ra ba email nữa.","scene":"Ba email liên tiếp về cùng một việc: yêu cầu, nhắc lại, và leo thang.","dlg":[{"s":"Email 1 — Subject","en":"Request: API contract for image upload (needed by Thu)","vi":"Yêu cầu: API contract cho image upload (cần trước thứ Năm)"},{"s":"Email 1","en":"Hi Jun, We're starting the upload integration this week. Could you share the final API contract by Thursday? Without it we'll have to build against mocks, which adds rework later. Happy to jump on a quick call if that's easier. Thanks, Vinh","vi":"Chào Jun, Tuần này bọn mình bắt đầu tích hợp upload. Bạn chia sẻ API contract cuối trước thứ Năm được không? Nếu chưa có, bọn mình phải làm với mock, sẽ phát sinh làm lại. Rất sẵn lòng gọi nhanh nếu tiện hơn. Cảm ơn, Vinh"},{"s":"Email 2 — Subject","en":"Following up: API contract (from Monday)","vi":"Nhắc lại: API contract (từ thứ Hai)"},{"s":"Email 2","en":"Hi Jun, Just following up on this — I know it's a busy week. Is Thursday still realistic, or should we plan around a later date? Either is fine, I just want to set expectations with our PM. Thanks, Vinh","vi":"Chào Jun, Nhắc lại việc này — mình biết tuần này bạn bận. Thứ Năm còn khả thi không, hay bọn mình nên tính theo mốc muộn hơn? Cách nào cũng được, mình chỉ muốn thống nhất kỳ vọng với PM. Cảm ơn, Vinh"},{"s":"Email 3 — Subject","en":"Escalating: upload integration at risk","vi":"Leo thang: tích hợp upload đang có rủi ro"},{"s":"Email 3","en":"Hi Minsu, looping you in for visibility. We've been waiting on the API contract since Monday, and the integration is now at risk for the June 12 demo. Two options: (1) we get the contract by Friday and keep the date, or (2) we move the demo to June 19. Could you help us decide by tomorrow? Thanks, Vinh","vi":"Chào Minsu, kéo anh vào để nắm tình hình. Bọn em chờ API contract từ thứ Hai, và việc tích hợp đang có rủi ro cho buổi demo 12/6. Hai phương án: (1) có contract trước thứ Sáu và giữ ngày, hoặc (2) lùi demo sang 19/6. Anh giúp bọn em quyết trước ngày mai được không? Cảm ơn, Vinh"}],"chunks":[{"en":"Request: ~ (needed by Thu)","vi":"Tiêu đề nêu rõ loại và hạn","n":"Tiêu đề tốt = loại việc + nội dung + hạn. Người nhận biết ưu tiên ngay ở inbox."},{"en":"Could you share ~ by Thursday?","vi":"Bạn chia sẻ ~ trước thứ Năm được không?","n":"Một yêu cầu, một hạn, một câu. Đừng gói yêu cầu giữa đoạn văn."},{"en":"Without it we'll have to ~","vi":"Nếu chưa có, bọn mình phải ~","n":"Nêu hệ quả, không nêu cảm xúc. Đây là điều tạo ưu tiên."},{"en":"Happy to jump on a quick call.","vi":"Sẵn lòng gọi nhanh.","n":"Câu mời rất hữu dụng, thể hiện bạn linh hoạt."},{"en":"Just following up on this —","vi":"Nhắc lại việc này —","n":"Mẫu nhắc chuẩn. Không cần xin lỗi vì đã nhắc."},{"en":"Is Thursday still realistic?","vi":"Thứ Năm còn khả thi không?","n":"Cho người ta đường thoát danh dự thay vì hỏi tại sao chưa làm."},{"en":"I just want to set expectations with ~","vi":"Mình chỉ muốn thống nhất kỳ vọng với ~","n":"Lý do trung tính, không gây cảm giác bị thúc."},{"en":"looping you in for visibility","vi":"kéo anh vào để nắm tình hình","n":"Cách leo thang chuẩn mực: mời vào để biết, không để tố ai."}],"gram":{"t":"Cấu trúc email: bốn dòng, mỗi dòng một việc","rule":"Dòng 1: bối cảnh (một câu). Dòng 2: yêu cầu cụ thể + hạn. Dòng 3: hệ quả nếu không có. Dòng 4: lối thoát hoặc lựa chọn. Email quá 6 dòng thường có nghĩa bạn chưa rõ mình muốn gì.","pairs":[{"a":"Please send the contract soon.","b":"Could you share the contract by Thursday?","n":"soon không phải là hạn. Hạn phải là một mốc cụ thể."},{"a":"You didn't reply to my email.","b":"Just following up in case this got buried.","n":"in case this got buried = phòng trường hợp bị lấp. Cho người ta đường thoát."},{"a":"This is very urgent!","b":"This is blocking the June 12 demo.","n":"Nêu cái bị chặn cụ thể thay vì tính từ khẩn cấp."}],"more":"Khi đưa lựa chọn, luôn đưa đúng hai: (1) ... or (2) ... Ba lựa chọn làm người ta trì hoãn, một lựa chọn nghe như tối hậu thư."},"fix":[{"bad":"I am writing this email to inform you that...","good":"Quick update on the upload work:","why":"Mở đầu kiểu công văn làm chậm người đọc. Vào việc ngay từ dòng đầu."},{"bad":"Please revert back to me at your earliest convenience.","good":"Could you let me know by Thursday?","why":"revert back sai nghĩa và bị lặp. at your earliest convenience nghe khách sáo và không có hạn thật."},{"bad":"I look forward to hear from you.","good":"I look forward to hearing from you. / Looking forward to your reply.","why":"look forward to + V-ing. to ở đây là giới từ, không phải to nguyên mẫu."}],"pron":{"t":"Đọc email thành tiếng để kiểm tra độ dài câu","tip":"Nếu bạn phải hít hơi giữa câu, câu đó quá dài. Cắt làm hai. Câu ngắn trong email không phải thô — nó là tôn trọng thời gian người đọc.","words":["Could you share it by Thursday?","Just following up on this.","Two options: one, or two.","Happy to jump on a call."]},"quiz":[{"q":"Tiêu đề email nào tốt nhất?","o":["Question","API contract","Request: API contract for upload (needed by Thu)"],"a":2,"e":"Loại việc + nội dung + hạn. Người nhận biết ưu tiên ngay từ danh sách inbox."},{"q":"Chọn câu đúng:","o":["I look forward to hear from you.","I look forward to hearing from you.","I look forward hear from you."],"a":1,"e":"look forward to + V-ing. Đây là lỗi kinh điển trong email tiếng Anh."},{"q":"Chọn cách nhắc lại tốt nhất:","o":["You didn't answer my email.","Just following up in case this got buried.","Why no reply?"],"a":1,"e":"Cho người nhận đường thoát danh dự làm tăng khả năng được trả lời."},{"q":"Khi leo thang lên cấp trên, nên:","o":["Nêu ai đã sai","Nêu rủi ro và hai phương án cụ thể","Chỉ nêu là mình đang bị chặn"],"a":1,"e":"Cấp trên cần quyết định, không cần bản tường thuật. Đưa hai phương án là cách nhanh nhất có kết quả."}],"task":{"say":"Đọc thành tiếng ba email mẫu trên. Chú ý độ dài câu. Nghe được cảm giác 'gọn mà không thô' là bạn đã nắm được tone.","write":"Viết một email yêu cầu thật, đúng 4 dòng: bối cảnh, yêu cầu + hạn, hệ quả, lối thoát. Rồi viết luôn email nhắc lại cho nó."},"zen":"Email của bạn là bản ghi vĩnh viễn về cách bạn suy nghĩ. Người ta có thể quên bạn nói gì trong họp, nhưng email thì được forward. Đây là chỗ đáng đầu tư thời gian nhất."},{"d":18,"phase":4,"t":"Review code bằng tiếng Anh","goal":"Viết comment PR rõ ràng, không làm ai tự ái, và phân biệt được bắt buộc sửa với gợi ý.","why":"Code review là nơi tiếng Anh của bạn được đồng nghiệp đọc nhiều nhất. Một comment viết kém tạo ra tranh luận dài; một comment viết tốt được sửa trong hai phút.","scene":"Bạn review PR của một dev khác và cần nêu bốn mức độ khác nhau.","dlg":[{"s":"Blocking","en":"This will throw if items is empty — we need a guard here before merging.","vi":"Chỗ này sẽ throw nếu items rỗng — cần chặn trước khi merge."},{"s":"Suggestion","en":"Nit: this could be extracted into a hook to keep the component thinner. Not blocking.","vi":"Nhỏ: chỗ này có thể tách thành hook để component gọn hơn. Không chặn merge."},{"s":"Question","en":"Curious — is there a reason for the extra re-render here, or did I miss something?","vi":"Tò mò — có lý do gì cho lần re-render thêm này, hay mình bỏ sót gì?"},{"s":"Praise","en":"Nice — the error handling here is much cleaner than what we had.","vi":"Hay — phần xử lý lỗi ở đây gọn hơn nhiều so với trước."},{"s":"Author","en":"Good catch on the empty case. Fixed. For the hook, I'd rather do it in a follow-up if that's OK.","vi":"Bạn phát hiện tốt vụ mảng rỗng. Đã sửa. Về phần hook, tôi muốn làm ở PR sau nếu được."},{"s":"You","en":"Works for me. I'll open an issue so it doesn't get lost. Approving now.","vi":"Ổn với tôi. Tôi sẽ mở issue để không bị quên. Approve luôn."}],"chunks":[{"en":"This will throw if ~","vi":"Chỗ này sẽ throw nếu ~","n":"Nêu điều kiện lỗi cụ thể, không nói 'this is wrong'."},{"en":"we need a guard here before merging","vi":"cần chặn ở đây trước khi merge","n":"Nói rõ đây là điều kiện để merge. Người viết biết mức độ ngay."},{"en":"Nit: ~ Not blocking.","vi":"Nhỏ: ~ Không chặn merge.","n":"nit = nitpick, ý nhỏ. Ghi 'not blocking' là phép lịch sự quan trọng nhất trong review."},{"en":"this could be extracted into ~","vi":"chỗ này có thể tách thành ~","n":"Bị động + could = gợi ý về code, không phán xét người viết."},{"en":"Curious — is there a reason for ~?","vi":"Tò mò — có lý do gì cho ~?","n":"Câu hỏi thật, không phải chất vấn giả. Thường bạn sẽ học được gì đó."},{"en":"or did I miss something?","vi":"hay mình bỏ sót gì?","n":"Bốn từ này ngăn được rất nhiều tranh luận vô nghĩa."},{"en":"Works for me.","vi":"Ổn với tôi.","n":"Đồng ý ngắn gọn kiểu dev."},{"en":"I'll open an issue so it doesn't get lost.","vi":"Tôi mở issue để không bị quên.","n":"Cách nhượng bộ mà không mất điểm kỹ thuật."}],"gram":{"t":"Bị động và cách nói vô nhân xưng — tách code khỏi người","rule":"Trong review, chuyển chủ ngữ từ người sang code. You wrote this wrong → This could be simplified. Bị động: be + V3. Đây là một trong ít chỗ mà bị động tốt hơn chủ động rõ rệt.","pairs":[{"a":"You didn't handle the empty case.","b":"The empty case isn't handled here.","n":"Cùng thông tin, một câu chỉ vào người, một câu chỉ vào code."},{"a":"You should extract this.","b":"This could be extracted.","n":"Bỏ chủ ngữ 'you' làm gợi ý nghe khách quan hơn."},{"a":"Someone changed the config.","b":"The config was changed in this commit.","n":"Khi điều tra sự cố, bị động giúp tập trung vào việc, không vào người."}],"more":"Nhưng đừng lạm dụng bị động khi khen: nói 'Nice work on the error handling' thẳng vào người tốt hơn 'The error handling was done nicely'. Khen thì hướng người, phê thì hướng code."},"fix":[{"bad":"This code is bad.","good":"This could be simplified — right now it re-renders on every keystroke.","why":"Đánh giá chung không giúp ai sửa. Nêu vấn đề cụ thể và hệ quả kỹ thuật."},{"bad":"Why you did like this?","good":"Curious — what was the reasoning here?","why":"Sai ngữ pháp và tone. Câu sau mở ra một câu trả lời hữu ích."},{"bad":"You must change this.","good":"This one's blocking for me: it throws on an empty array.","why":"must nghe như quyền lực. Nêu mức độ (blocking) và lý do kỹ thuật thì không ai phản đối được."}],"pron":{"t":"Từ vựng review đọc thành tiếng","tip":"Bạn sẽ phải nói những từ này trong họp review, không chỉ viết. Chú ý trọng âm: NIT-pick, exTRACT (động từ) vs EX-tract (danh từ), reFACtor, dePREcated (nhấn âm 2), CONfig (nhấn âm 1).","words":["NIT-pick","reFACtor","exTRACT (v)","dePREcated","CONfig","reNAME","edge case"]},"quiz":[{"q":"Comment nào tốt nhất cho một vấn đề chặn merge?","o":["This is wrong.","This will throw on an empty array — blocking.","You made a mistake."],"a":1,"e":"Nêu điều kiện lỗi + mức độ. Người viết biết chính xác phải làm gì."},{"q":"Chọn cách nêu gợi ý nhỏ:","o":["You should refactor this.","Nit: this could be extracted. Not blocking.","This is messy."],"a":1,"e":"nit + not blocking là chuẩn mực trong văn hoá review. Nó tránh làm chậm PR vì ý kiến nhỏ."},{"q":"Chọn câu đúng:","o":["The empty case is not handle.","The empty case isn't handled.","The empty case not handled."],"a":1,"e":"Bị động: be + V3 (handled)."},{"q":"Khi bạn không hiểu tại sao code được viết như vậy:","o":["This makes no sense.","Curious — what was the reasoning here?","Rewrite this."],"a":1,"e":"Hỏi thật thường cho bạn thông tin, và giữ được quan hệ. Nhiều lần người viết có lý do bạn chưa biết."}],"task":{"say":"Đọc thành tiếng bốn comment mẫu (blocking, nit, question, praise). Chú ý cách bạn nói câu blocking mà vẫn bình thản.","write":"Lấy một PR thật. Viết bốn comment tiếng Anh: một blocking, một nit, một câu hỏi, một lời khen. Lời khen là phần nhiều người bỏ — đừng bỏ."},"zen":"Trong review, mục tiêu không phải chứng minh bạn giỏi hơn. Mục tiêu là code tốt hơn và người viết vẫn muốn làm việc với bạn lần sau. Ngôn ngữ là công cụ để giữ cả hai."},{"d":19,"phase":4,"t":"Viết bug report và các bước tái hiện","goal":"Mô tả một lỗi để người khác tái hiện được mà không phải hỏi thêm câu nào.","why":"Bug report tệ là thứ tốn thời gian nhiều nhất trong ngành. Viết được một bug report tốt bằng tiếng Anh là kỹ năng có thể nhìn thấy — ai đọc cũng biết bạn suy nghĩ có hệ thống.","scene":"Bạn tìm ra lỗi trong môi trường staging và viết báo cáo.","dlg":[{"s":"Title","en":"Upload fails silently for HEIC files over 5 MB on Safari","vi":"Upload thất bại âm thầm với file HEIC trên 5MB trên Safari"},{"s":"Environment","en":"Staging, build 2.4.1, Safari 17.4 on macOS 14.5. Reproduced 5 out of 5 times.","vi":"Staging, build 2.4.1, Safari 17.4 trên macOS 14.5. Tái hiện 5/5 lần."},{"s":"Steps","en":"1. Open the submissions page. 2. Click Upload. 3. Select a HEIC file larger than 5 MB. 4. Wait about ten seconds.","vi":"1. Mở trang submissions. 2. Bấm Upload. 3. Chọn file HEIC lớn hơn 5MB. 4. Chờ khoảng 10 giây."},{"s":"Expected","en":"The file should either upload or show a clear error message.","vi":"File phải hoặc upload được, hoặc hiện thông báo lỗi rõ ràng."},{"s":"Actual","en":"The progress bar reaches 100 percent, then the modal closes with no error. Nothing appears in the list.","vi":"Progress bar lên 100%, rồi modal đóng không báo lỗi. Không có gì xuất hiện trong danh sách."},{"s":"Notes","en":"The request returns 413 but the response isn't handled. Chrome shows the same 413 but displays the error correctly.","vi":"Request trả về 413 nhưng response không được xử lý. Chrome cũng trả 413 nhưng hiển thị lỗi đúng."}],"chunks":[{"en":"fails silently","vi":"thất bại âm thầm","n":"Cụm kỹ thuật quan trọng: lỗi xảy ra mà không báo. Rất nên biết."},{"en":"Reproduced 5 out of 5 times.","vi":"Tái hiện 5/5 lần.","n":"reproduce = tái hiện. Ghi tỉ lệ giúp người sửa biết đây là lỗi ổn định hay ngẫu nhiên."},{"en":"Expected / Actual","vi":"Kỳ vọng / Thực tế","n":"Hai từ này là xương sống của mọi bug report tốt trên thế giới."},{"en":"The file should either ~ or ~","vi":"File phải hoặc ~ hoặc ~","n":"either ~ or ~ = hoặc cái này hoặc cái kia. Dùng để nêu hành vi đúng có nhiều khả năng."},{"en":"reaches 100 percent, then ~","vi":"lên đến 100%, rồi ~","n":"then nối chuỗi sự việc. Trong bug report, thứ tự là thông tin."},{"en":"the response isn't handled","vi":"response không được xử lý","n":"Bị động, hướng vào hệ thống. Ôn lại ngày 18."},{"en":"intermittent / consistent","vi":"không ổn định / ổn định","n":"Hai tính từ mô tả tần suất lỗi. Người sửa hỏi câu này đầu tiên."},{"en":"a workaround for now is ~","vi":"cách lách tạm là ~","n":"Nếu có, luôn ghi vào. Nó giúp người khác làm việc trong lúc chờ sửa."}],"gram":{"t":"Câu mệnh lệnh cho các bước, và câu điều kiện loại 1","rule":"Các bước tái hiện luôn dùng câu mệnh lệnh: động từ nguyên mẫu ở đầu câu, không có chủ ngữ. Open the page. Click Upload. Select a file. Điều kiện loại 1 để mô tả quy luật lỗi: If the file is over 5 MB, the upload fails. Cả hai mệnh đề hiện tại đơn, không dùng will ở mệnh đề if.","pairs":[{"a":"You should open the page and then you click upload.","b":"Open the page. Click Upload.","n":"Mệnh lệnh ngắn hơn và không mơ hồ. Đây là chuẩn của tài liệu kỹ thuật."},{"a":"If the file will be over 5MB, it fails.","b":"If the file is over 5 MB, it fails.","n":"Không dùng will sau if trong điều kiện loại 1. Lỗi rất phổ biến."},{"a":"When you click, nothing happen.","b":"When you click, nothing happens.","n":"nothing là số ít → happens. Chủ ngữ vô định (nothing, everything, something) luôn số ít."}],"more":"Từ nối chuỗi cho các bước: first, then, after that, finally. Nhưng trong bug report, dùng số 1-2-3 tốt hơn từ nối — nó cho phép người ta trích dẫn 'step 3 fails'."},"fix":[{"bad":"The upload is not working.","good":"The upload fails silently for HEIC files over 5 MB on Safari 17.","why":"Câu đầu không thể sửa được vì không ai biết tái hiện thế nào. Bug report tốt = điều kiện + môi trường + hành vi."},{"bad":"If the file will be too big, it will fail.","good":"If the file is too big, it fails.","why":"Sau if không dùng will trong điều kiện loại 1. Và mô tả quy luật thì dùng hiện tại đơn."},{"bad":"Sometimes it happen.","good":"It happens intermittently — about one in three attempts.","why":"Sai chia động từ, và 'sometimes' quá mơ hồ. Ghi tần suất bằng số."}],"pron":{"t":"Đọc số và mã lỗi trong họp","tip":"413 đọc four-thirteen hoặc four-one-three (rõ hơn khi nghe khó). 404 đọc four-oh-four. 2.4.1 đọc two point four point one. Khi báo lỗi bằng miệng, đọc từng số là an toàn nhất.","words":["four-oh-four (404)","four-one-three (413)","five hundred (500)","two point four point one","five megs"]},"quiz":[{"q":"Tiêu đề bug nào tốt nhất?","o":["Upload broken","Upload not working on Safari","Upload fails silently for HEIC files over 5 MB on Safari 17"],"a":2,"e":"Điều kiện + môi trường + hành vi. Người đọc biết ngay có liên quan tới mình không."},{"q":"Chọn câu đúng:","o":["If the file will be over 5MB, it fails.","If the file is over 5 MB, it fails.","If the file over 5MB, it fail."],"a":1,"e":"Điều kiện loại 1: if + hiện tại đơn, mệnh đề chính hiện tại đơn (mô tả quy luật)."},{"q":"Chọn cách viết bước tái hiện chuẩn:","o":["You should click on the upload button.","Click Upload.","Clicking the upload button."],"a":1,"e":"Câu mệnh lệnh: động từ nguyên mẫu, ngắn, không mơ hồ."},{"q":"Điền: When you click, nothing ___.","o":["happen","happens","happening"],"a":1,"e":"nothing là chủ ngữ số ít → happens."}],"task":{"say":"Báo cáo một lỗi thật bằng miệng trong 45 giây, theo thứ tự: tiêu đề → môi trường → 3 bước → kỳ vọng → thực tế. Đây chính là cách bạn sẽ nói trong họp triage.","write":"Viết một bug report đầy đủ bằng tiếng Anh cho một lỗi bạn gặp tuần này. Đủ 6 phần: Title, Environment, Steps, Expected, Actual, Notes."},"zen":"Viết rõ ràng không phải là kỹ năng tiếng Anh — nó là kỹ năng suy nghĩ, chỉ thể hiện qua tiếng Anh. Khi bạn không viết được các bước tái hiện, thường là vì bạn chưa hiểu lỗi. Viết chính là cách kiểm tra hiểu."},{"d":20,"phase":4,"t":"Chốt tuần 4: viết một email và một PR review thật","goal":"Sản xuất hai văn bản thật, gửi đi thật.","why":"Hôm nay không học. Hôm nay xuất bản. Ranh giới giữa người học tiếng Anh mãi mãi và người dùng được tiếng Anh nằm ở chỗ có bấm nút gửi hay không.","scene":"Tổng hợp: một email leo thang và một chuỗi comment review, kèm bảng kiểm tra trước khi gửi.","dlg":[{"s":"Checklist 1","en":"Does the subject line say what I need and by when?","vi":"Tiêu đề đã nói rõ tôi cần gì và khi nào chưa?"},{"s":"Checklist 2","en":"Is there exactly one clear request in this message?","vi":"Trong tin này có đúng một yêu cầu rõ ràng chưa?"},{"s":"Checklist 3","en":"Did I give a real deadline instead of 'soon' or 'ASAP'?","vi":"Tôi đã đưa hạn thật thay vì 'soon' hay 'ASAP' chưa?"},{"s":"Checklist 4","en":"Would this read as rude if the reader is having a bad day?","vi":"Nếu người đọc đang có ngày tệ, câu này có bị đọc là thô không?"},{"s":"Checklist 5","en":"Did I mark my review comments as blocking or not blocking?","vi":"Tôi đã ghi rõ comment nào chặn merge, comment nào không chưa?"},{"s":"Checklist 6","en":"Is every sentence under twenty words?","vi":"Mọi câu đã dưới 20 từ chưa?"}],"chunks":[{"en":"Just to close the loop:","vi":"Để chốt lại vòng này:","n":"Dùng khi kết thúc một chuỗi trao đổi. Rất chuyên nghiệp."},{"en":"For visibility:","vi":"Để mọi người nắm:","n":"Mở đầu khi chia sẻ thông tin mà không yêu cầu ai làm gì."},{"en":"No action needed — just FYI.","vi":"Không cần làm gì — chỉ để biết.","n":"Câu này tiết kiệm thời gian cho tất cả mọi người. Dùng nhiều."},{"en":"Happy to be wrong here.","vi":"Nếu tôi sai thì càng tốt.","n":"Câu làm mềm cực mạnh khi bạn nêu quan ngại kỹ thuật."},{"en":"Let me know if I've missed anything.","vi":"Cho tôi biết nếu tôi bỏ sót gì.","n":"Câu kết an toàn cho mọi tài liệu và email tổng hợp."},{"en":"Thanks for the quick turnaround.","vi":"Cảm ơn bạn xử lý nhanh.","n":"turnaround = thời gian xử lý. Câu cảm ơn có nội dung, không sáo."},{"en":"I've addressed all the comments.","vi":"Tôi đã xử lý hết các comment.","n":"address a comment = xử lý một góp ý. Không dùng 'solve'."},{"en":"Ready for another look.","vi":"Sẵn sàng để xem lại.","n":"Câu chuẩn khi mời review lại sau khi đã sửa."}],"gram":{"t":"Bốn quyết định khi viết, kiểm tra chéo","rule":"Ôn tập. Mỗi lần viết, bạn quyết bốn chỗ: (1) chủ động hay bị động — hướng người hay hướng hệ thống, (2) mức lịch sự nào trên thang can/could/would, (3) đã có hạn cụ thể chưa, (4) độ dài câu.","pairs":[{"a":"You broke the build.","b":"The build is failing on main since commit a1b2c3.","n":"Ngày 18. Hướng hệ thống thay vì hướng người, thêm dữ liệu cụ thể."},{"a":"Please reply soon.","b":"Could you let me know by Thursday?","n":"Ngày 17. soon không phải hạn."},{"a":"I look forward to hear from you.","b":"Looking forward to hearing from you.","n":"Ngày 17. to + V-ing sau look forward."}],"more":"Nếu cả bốn quyết định trên đã thành phản xạ, phần viết của bạn đã đủ tốt cho hầu hết công việc quốc tế. Phần còn lại là luyện tay."},"fix":[{"bad":"I hope this email finds you well.","good":"Hi Jun — quick update on the upload work.","why":"Không sai, nhưng là câu rỗng. Người nhận muốn biết ngay email nói về gì."},{"bad":"I have solved your comments.","good":"I've addressed all your comments.","why":"address a comment là cách nói đúng. solve dùng cho problem, không dùng cho comment."},{"bad":"Kindly do the needful.","good":"Could you take a look when you get a chance?","why":"Cụm này cực kỳ mơ hồ và đã lỗi thời. Luôn nói rõ việc cần làm."}],"pron":{"t":"Tự kiểm tra bằng tai","tip":"Bài luyện hôm nay: đọc to email của bạn hai lần. Lần một nghe độ dài câu. Lần hai nghe tone. Đây là công cụ kiểm tra chất lượng duy nhất bạn cần và nó miễn phí.","words":["Just to close the loop","No action needed — just FYI","Ready for another look","Thanks for the quick turnaround"]},"quiz":[{"q":"Chọn câu đúng:","o":["I have solved your comments.","I've addressed your comments.","I've resolved your comments to solve."],"a":1,"e":"address a comment = xử lý góp ý. Đây là collocation chuẩn trong code review."},{"q":"Câu mở đầu email nào hiệu quả nhất?","o":["I hope this email finds you well.","I am writing to inform you that...","Quick update on the upload work:"],"a":2,"e":"Vào việc ngay. Người đọc quyết định trong 2 giây có đọc tiếp hay không."},{"q":"Bạn nêu một quan ngại kỹ thuật nhưng không chắc chắn. Thêm câu:","o":["Maybe I'm wrong, sorry.","Happy to be wrong here.","I don't know really."],"a":1,"e":"Làm mềm mà không hạ thấp bản thân. Câu này giữ được uy tín kỹ thuật của bạn."},{"q":"Comment review nào thiếu thông tin quan trọng nhất?","o":["Nit: could be extracted. Not blocking.","This throws on empty input — blocking.","This could be better."],"a":2,"e":"Không nêu vấn đề gì, không nêu mức độ. Người viết không biết phải làm gì."}],"task":{"say":"Đọc to bảng kiểm tra 6 câu trên. Ghi nhớ. Từ nay mỗi email quan trọng đều đi qua 6 câu này.","write":"Hôm nay bắt buộc: gửi thật một email tiếng Anh và viết thật 3 comment review tiếng Anh. Không phải nháp. Gửi đi."},"zen":"Hai phần ba đường. Đến đây bạn đã đi xa hơn phần lớn người bắt đầu. Đừng chờ cảm giác 'đủ giỏi' rồi mới dùng — cảm giác đó không bao giờ tự đến, nó là hệ quả của việc đã dùng nhiều lần."},{"d":21,"phase":5,"t":"Nói không và bảo vệ phạm vi công việc","goal":"Từ chối một yêu cầu mà vẫn được coi là người hợp tác.","why":"Người không biết nói không sẽ trở thành người luôn trễ hạn. Trong môi trường đa văn hoá, việc nói không càng khó hơn vì bạn sợ bị coi là khó tính. Có một cách nói giải quyết được cả hai: đừng từ chối yêu cầu, hãy nêu cái giá của nó.","scene":"Khách hàng thêm yêu cầu giữa sprint, lần thứ ba trong tháng.","dlg":[{"s":"Client","en":"One more thing — could you also add bulk delete? It should be quick.","vi":"Một việc nữa — bạn thêm cả bulk delete được không? Chắc nhanh thôi."},{"s":"You","en":"I can do that. To be transparent about the trade-off: it's about a day and a half with testing.","vi":"Tôi làm được. Nói rõ về sự đánh đổi: nó mất khoảng một ngày rưỡi kể cả test."},{"s":"You","en":"If we add it now, either the retry logic moves to next sprint, or the demo moves to Friday. Which would you prefer?","vi":"Nếu thêm bây giờ, hoặc phần retry lùi sang sprint sau, hoặc demo lùi sang thứ Sáu. Bạn muốn cách nào?"},{"s":"Client","en":"Hmm. I didn't realize it was that big.","vi":"Hmm. Tôi không nghĩ nó lớn vậy."},{"s":"You","en":"The delete itself is small. The confirmation flow and the undo are what take the time.","vi":"Phần delete thì nhỏ. Luồng xác nhận và undo mới là phần tốn thời gian."},{"s":"Client","en":"Let's leave it out for now and revisit next sprint.","vi":"Tạm để ngoài, sprint sau xem lại."},{"s":"You","en":"Sounds good. I'll add it to the backlog with the estimate so it's not forgotten.","vi":"Ổn. Tôi sẽ thêm vào backlog kèm estimate để không bị quên."}],"chunks":[{"en":"I can do that. To be transparent about the trade-off:","vi":"Tôi làm được. Nói rõ về sự đánh đổi:","n":"Bắt đầu bằng có thể, không bằng không. Rồi nêu giá. Đây là cả bài học hôm nay."},{"en":"It's about a day and a half with testing.","vi":"Khoảng một ngày rưỡi kể cả test.","n":"Luôn gộp test vào estimate. Đây là chỗ dev hay tự làm khó mình."},{"en":"If we add it now, either ~ or ~","vi":"Nếu thêm bây giờ, hoặc ~ hoặc ~","n":"Cấu trúc vàng của thương lượng: điều kiện + hai hệ quả."},{"en":"Which would you prefer?","vi":"Bạn muốn cách nào?","n":"Trả quyền quyết định cho người yêu cầu. Họ sẽ tự thấy cái giá."},{"en":"I didn't realize it was that big.","vi":"Tôi không nghĩ nó lớn vậy.","n":"Nghe câu này là bạn đã thành công. Người ta thường không biết cái giá."},{"en":"~ is what takes the time","vi":"~ mới là phần tốn thời gian","n":"Cấu trúc nhấn mạnh: what + mệnh đề. Nó làm câu bạn nghe rất tự nhiên."},{"en":"Let's leave it out for now.","vi":"Tạm để ngoài.","n":"leave out = bỏ ra ngoài phạm vi. Nghe nhẹ hơn cancel."},{"en":"revisit next sprint","vi":"sprint sau xem lại","n":"revisit = xem lại sau. Cách hoãn mà không bác bỏ."}],"gram":{"t":"Câu điều kiện loại 1 và 2 để thương lượng","rule":"Loại 1 (có thật, có thể xảy ra): If + hiện tại đơn, will/would + V. Dùng khi bàn phương án khả thi. Loại 2 (giả định, xa hơn): If + quá khứ đơn, would + V. Dùng khi muốn nghe nhẹ hơn, ít cam kết hơn.","pairs":[{"a":"If we add it, the demo will move to Friday.","b":"If we added it, the demo would move to Friday.","n":"A: khả năng thật, đang bàn. B: giả định, mềm hơn, giữ khoảng cách. Với khách hàng, B thường an toàn hơn."},{"a":"If you send it today, I can finish by Thursday.","b":"If you sent it today, I could finish by Thursday.","n":"A trực tiếp hơn, đặt điều kiện rõ. Cả hai đều dùng được, chọn theo tone."},{"a":"I would need two more days.","b":"I need two more days.","n":"would need nghe như đang tính toán. need nghe như đang yêu cầu. Chọn theo tình thế."}],"more":"Không bao giờ dùng will ngay sau if trong loại 1: sai 'if we will add it'. Đúng 'if we add it, we will need...'. Đây là lỗi rất phổ biến."},"fix":[{"bad":"No, I don't have time.","good":"I can do it, but it would push the demo to Friday. Is that OK?","why":"Câu đầu biến bạn thành rào cản. Câu sau biến bạn thành người cung cấp thông tin để họ quyết."},{"bad":"If we will add this feature, we will be late.","good":"If we add this feature, we'll be late.","why":"Sau if không dùng will trong điều kiện loại 1."},{"bad":"It's impossible in this sprint.","good":"It doesn't fit in this sprint without dropping something. Here are the options.","why":"impossible đóng cửa và thường không đúng sự thật. Nói rõ điều kiện thì không ai tranh luận được."}],"pron":{"t":"Giọng bình thản khi nói về cái giá","tip":"Khi nói estimate hoặc trade-off, giữ giọng đều và chậm, không lên cao ở cuối. Giọng lên cao làm câu nghe như xin phép hoặc như bạn không chắc. Nói con số như đọc dữ liệu: about a day and a half ↘","words":["about a day and a half ↘","either A or B ↘","which would you prefer ↗","I can do that ↘"]},"quiz":[{"q":"Chọn câu đúng:","o":["If we will add it, we will be late.","If we add it, we'll be late.","If we adding it, we late."],"a":1,"e":"Sau if dùng hiện tại đơn, mệnh đề chính dùng will."},{"q":"Cách từ chối tốt nhất một yêu cầu thêm việc:","o":["No, impossible.","I can do it, but here's the trade-off — which would you prefer?","I'll try my best."],"a":1,"e":"Nêu giá và trả quyền quyết định. Câu 'I'll try my best' là bẫy: nó nghe như đã đồng ý."},{"q":"Điền: If you ___ me the schema today, I could finish by Friday.","o":["will send","sent","sending"],"a":1,"e":"Điều kiện loại 2: if + quá khứ đơn, could + V. Nghe mềm và giữ khoảng cách."},{"q":"Câu nào nhấn mạnh đúng phần tốn thời gian?","o":["The undo takes time.","The undo is what takes the time.","Time is taken by the undo."],"a":1,"e":"Cấu trúc what + mệnh đề dùng để nhấn mạnh. Nó nghe rất tự nhiên và có sức nặng."}],"task":{"say":"Lấy một yêu cầu bạn đã nhận và không nên nhận. Nói 60 giây: tôi làm được → giá là gì → hai phương án → bạn chọn cái nào. Không được nói 'no' ở câu đầu.","write":"Viết ba câu mẫu nêu trade-off của riêng bạn, dùng cấu trúc: If we do X, either Y or Z. Which works better for you?"},"zen":"Nói có với mọi thứ là cách chắc chắn nhất để làm mọi thứ tệ đi. Bạn không bảo vệ deadline vì bạn cứng đầu — bạn bảo vệ nó vì đó là cam kết bạn đã đưa ra với người khác."},{"d":22,"phase":5,"t":"Estimate và nói về sự không chắc chắn","goal":"Đưa con số mà không tự bẫy mình, và nói rõ mức độ chắc chắn.","why":"Estimate là chỗ tiếng Anh và sự nghiệp gặp nhau. Nói 'two days' mà không nêu điều kiện là ký một hợp đồng bạn không kiểm soát được. Ngôn ngữ hedging tồn tại chính vì mục đích này.","scene":"PM cần một con số ngay trong họp, bạn chưa đọc kỹ yêu cầu.","dlg":[{"s":"PM","en":"Rough estimate for the export feature?","vi":"Estimate sơ bộ cho tính năng export?"},{"s":"You","en":"Off the top of my head, somewhere between three and five days — but that's a rough number.","vi":"Nghĩ nhanh thì khoảng ba đến năm ngày — nhưng đó là số ước lượng thô."},{"s":"PM","en":"What would make it three versus five?","vi":"Cái gì làm nó thành ba thay vì năm?"},{"s":"You","en":"It depends on whether we need Excel formatting. Plain CSV is three; formatted Excel is closer to five.","vi":"Tuỳ vào việc có cần format Excel không. CSV thường là ba; Excel có format thì gần năm."},{"s":"PM","en":"Let's say CSV for now. Can I put three days in the plan?","vi":"Tạm CSV nhé. Tôi ghi ba ngày vào kế hoạch được không?"},{"s":"You","en":"Put three and a half, so there's a bit of buffer. I'll confirm after I look at the data model tomorrow.","vi":"Ghi ba ngày rưỡi, để có chút đệm. Tôi sẽ xác nhận sau khi xem data model ngày mai."}],"chunks":[{"en":"Off the top of my head, ~","vi":"Nghĩ nhanh thì ~","n":"Cụm quan trọng nhất bài này. Nó báo trước rằng con số chưa phải cam kết."},{"en":"somewhere between three and five days","vi":"khoảng từ ba đến năm ngày","n":"Đưa khoảng, không đưa một số. Khoảng phản ánh thực tế trung thực hơn."},{"en":"that's a rough number","vi":"đó là số ước lượng thô","n":"rough = thô, sơ bộ. a rough estimate, a rough idea."},{"en":"It depends on whether ~","vi":"Tuỳ vào việc có ~ hay không","n":"depend on whether + mệnh đề. Nêu điều kiện làm thay đổi con số."},{"en":"Let's say ~ for now.","vi":"Tạm coi như ~ nhé.","n":"Cách chốt tạm để tiếp tục cuộc họp."},{"en":"so there's a bit of buffer","vi":"để có chút đệm","n":"buffer = thời gian đệm. Xin buffer một cách công khai là dấu hiệu của người có kinh nghiệm."},{"en":"I'll confirm after I look at ~","vi":"Tôi sẽ xác nhận sau khi xem ~","n":"Hẹn thời điểm cho con số chính thức. Câu này bảo vệ bạn."},{"en":"worst case / best case","vi":"trường hợp xấu nhất / tốt nhất","n":"Hai cụm giúp bạn nói về rủi ro mà không nghe bi quan."}],"gram":{"t":"Ngôn ngữ hedging — nói không chắc mà vẫn đáng tin","rule":"Hedging không phải là nói lấp lửng. Nó là công cụ để truyền tải chính xác mức độ chắc chắn. Bốn nhóm: ước lượng số (roughly, about, around, somewhere between), mức độ tự tin (I'd say, I think, most likely, probably), điều kiện (depending on, assuming, provided that), và phạm vi (in most cases, at least, up to).","pairs":[{"a":"It'll take three days.","b":"I'd say roughly three days, assuming the API is stable.","n":"A là cam kết. B là dự báo có điều kiện. Chọn A chỉ khi bạn thật sự chắc."},{"a":"It's done.","b":"It's essentially done — just needs a final review.","n":"essentially, basically, more or less: hữu ích khi gần xong nhưng chưa hẳn."},{"a":"I don't know.","b":"I'm not sure yet — let me check and get back to you within the hour.","n":"Không biết thì nói không biết, nhưng luôn kèm bước tiếp theo và mốc thời gian."}],"more":"Đừng hedging quá mức. 'Maybe possibly it might perhaps be around two days or so' làm bạn nghe không đáng tin. Một hoặc hai cụm hedging là đủ cho một câu."},"fix":[{"bad":"Maybe two days, I'm not sure, maybe more, it depends...","good":"I'd say two to three days, depending on the data model. I'll confirm tomorrow.","why":"Hedging chồng chất làm bạn nghe do dự. Một khoảng số + một điều kiện + một mốc xác nhận là đủ."},{"bad":"I will try my best to finish tomorrow.","good":"I can commit to Thursday. Tomorrow is unlikely, but I'll tell you by noon if it changes.","why":"'try my best' không phải cam kết cũng không phải từ chối, nên người nghe sẽ hiểu là có. Nó là nguồn gốc của rất nhiều xung đột."},{"bad":"It's depend of the API.","good":"It depends on the API.","why":"depend ON, không depend of. Và chủ ngữ số ít → depends."}],"pron":{"t":"Đọc khoảng số và đơn vị thời gian","tip":"Luyện các cụm số này thành phản xạ: two to three days, a day and a half, half a day, a couple of days, three to four hours, end of week. Đọc nối liền, đừng ngắt giữa số và đơn vị.","words":["two-to-three days","a day and a half","a couple of days","end of week","by mid-week"]},"quiz":[{"q":"Cách trả lời tốt nhất khi bị hỏi estimate mà chưa xem kỹ:","o":["Two days.","I don't know.","Off the top of my head, two to three days — I'll confirm tomorrow."],"a":2,"e":"Có con số để cuộc họp tiếp tục, có cảnh báo về độ chắc chắn, có mốc xác nhận."},{"q":"Chọn câu đúng:","o":["It depends of the API.","It depends on the API.","It's depend on the API."],"a":1,"e":"depend on, và chủ ngữ số ít nên có s."},{"q":"Câu nào là bẫy nguy hiểm nhất?","o":["I'll try my best.","I'd say three days.","I'm not sure yet."],"a":0,"e":"Nó nghe như đồng ý nhưng không cam kết gì. Người nghe sẽ lập kế hoạch như thể bạn đã đồng ý."},{"q":"Điền: It depends ___ we need Excel formatting.","o":["on whether","of if","in that"],"a":0,"e":"depend on whether + mệnh đề. Cấu trúc nêu điều kiện quyết định."}],"task":{"say":"Đưa estimate bằng miệng cho 3 task thật, mỗi cái theo mẫu: off the top of my head + khoảng số + điều kiện + mốc xác nhận. Bấm giờ 20 giây mỗi cái.","write":"Viết lại 3 estimate gần nhất bạn đã đưa, thêm điều kiện và mốc xác nhận vào. So sánh với bản gốc."},"zen":"Người ta không mất niềm tin vì bạn estimate sai. Họ mất niềm tin vì bạn nói chắc rồi sai. Nói rõ mức độ không chắc chắn ngay từ đầu là cách bảo vệ uy tín dài hạn."},{"d":23,"phase":5,"t":"Báo tin xấu và thông báo trễ hạn","goal":"Báo tin xấu sớm, gọn, kèm phương án — không để nó tự lộ ra.","why":"Cách bạn xử lý một lần trễ hạn ảnh hưởng đến uy tín nhiều hơn mười lần đúng hạn. Có một khuôn cố định: báo sớm, nêu sự thật, nhận phần của mình, đưa phương án. Trình tự quan trọng hơn từ ngữ.","scene":"Bạn biết chắc sẽ trễ hai ngày. Còn ba ngày nữa mới tới hạn.","dlg":[{"s":"You","en":"I want to flag this early: the upload work is going to slip by about two days.","vi":"Tôi muốn báo sớm: phần upload sẽ trễ khoảng hai ngày."},{"s":"PM","en":"What happened?","vi":"Có chuyện gì?"},{"s":"You","en":"Two things. The HEIC conversion turned out to be more complex than I estimated, and I underestimated the test coverage we'd need.","vi":"Hai việc. Phần convert HEIC phức tạp hơn tôi ước lượng, và tôi đã đánh giá thấp lượng test cần có."},{"s":"PM","en":"OK. What's the impact?","vi":"Được. Ảnh hưởng thế nào?"},{"s":"You","en":"The demo on Wednesday is still safe. What moves is the full release, from Friday to Tuesday.","vi":"Buổi demo thứ Tư vẫn an toàn. Cái bị lùi là bản release đầy đủ, từ thứ Sáu sang thứ Ba."},{"s":"You","en":"Two options: we ship without HEIC on Friday, or we take the extra two days and ship everything on Tuesday. I'd recommend the second.","vi":"Hai phương án: ship mà không có HEIC vào thứ Sáu, hoặc lấy thêm hai ngày và ship đủ vào thứ Ba. Tôi nghiêng phương án hai."},{"s":"PM","en":"Agreed. Thanks for the heads-up.","vi":"Đồng ý. Cảm ơn đã báo trước."}],"chunks":[{"en":"I want to flag this early:","vi":"Tôi muốn báo sớm:","n":"Bốn từ này mua cho bạn rất nhiều thiện chí. Báo sớm là toàn bộ trò chơi."},{"en":"~ is going to slip by about two days","vi":"~ sẽ trễ khoảng hai ngày","n":"slip by + khoảng thời gian. Dùng going to vì bạn đã thấy bằng chứng."},{"en":"~ turned out to be more complex than I estimated","vi":"~ hoá ra phức tạp hơn tôi ước lượng","n":"turn out to be = hoá ra là. Trung thực mà không tự hạ thấp."},{"en":"I underestimated ~","vi":"Tôi đã đánh giá thấp ~","n":"Nhận phần của mình bằng một câu, rồi đi tiếp. Đừng xin lỗi ba lần."},{"en":"What moves is ~","vi":"Cái bị lùi là ~","n":"Cấu trúc what nhấn mạnh. Nêu rõ cái gì bị ảnh hưởng và cái gì không."},{"en":"The demo is still safe.","vi":"Buổi demo vẫn an toàn.","n":"Luôn nêu cái KHÔNG bị ảnh hưởng. Nó ngăn người nghe tưởng tượng tệ hơn thực tế."},{"en":"I'd recommend the second.","vi":"Tôi nghiêng phương án hai.","n":"Đưa phương án thì phải có ý kiến. Nếu không, bạn chỉ đang chuyển việc sang người khác."},{"en":"Thanks for the heads-up.","vi":"Cảm ơn đã báo trước.","n":"heads-up = lời báo trước. Nghe câu này là bạn đã làm đúng."}],"gram":{"t":"Trật tự thông tin khi báo tin xấu","rule":"Năm bước, đúng thứ tự này: (1) báo trước bằng một câu ngắn, (2) nêu nguyên nhân bằng sự việc, không bằng cảm xúc, (3) nêu ảnh hưởng — cả cái bị và cái không bị, (4) đưa đúng hai phương án, (5) nêu khuyến nghị của bạn.","pairs":[{"a":"I'm so sorry, I'm really sorry about this...","b":"I want to flag this early: we're going to slip by two days.","n":"Xin lỗi nhiều làm người nghe lo hơn và làm chậm thông tin họ cần."},{"a":"The backend team was late so we're late.","b":"We're blocked on the schema, and I underestimated the test work.","n":"Nhận phần của mình làm bạn đáng tin. Chỉ tay làm bạn thành người khó làm việc chung."},{"a":"Everything is delayed.","b":"The demo is safe. The full release moves from Friday to Tuesday.","n":"Cụ thể luôn tốt hơn. 'Everything' làm người nghe tưởng tượng thảm hoạ."}],"more":"Với tin xấu, tránh bị động mơ hồ kiểu 'mistakes were made'. Chủ động và cụ thể: 'I underestimated the test coverage.' Một câu, rồi chuyển sang phương án."},"fix":[{"bad":"Sorry sorry, I'm very sorry, I couldn't finish, sorry again.","good":"I want to flag this early: I'll need two more days. Here's why, and here are two options.","why":"Xin lỗi lặp lại làm giảm uy tín và không cung cấp thông tin. Một câu nhận trách nhiệm là đủ."},{"bad":"It's not my fault, the backend was late.","good":"We were blocked on the schema for three days. I should have flagged it sooner.","why":"Nêu sự việc + nhận phần của mình. Đây là cách duy nhất giữ được uy tín dài hạn."},{"bad":"I think maybe it will be late, I'm not sure.","good":"It will be two days late. I'm confident about that number.","why":"Khi đã biết chắc, hedging làm người ta phải hỏi ba lần. Rõ ràng là một hình thức tôn trọng."}],"pron":{"t":"Giữ giọng ổn định khi nói tin xấu","tip":"Người nghe đọc mức độ nghiêm trọng qua giọng bạn nhiều hơn qua từ ngữ. Nói chậm hơn bình thường một chút, âm lượng đều, không lên cao cuối câu. Giọng bình tĩnh truyền tải rằng bạn đang kiểm soát tình hình.","words":["I want to flag this early ↘","about two days ↘","the demo is still safe ↘","I'd recommend the second ↘"]},"quiz":[{"q":"Khi nào nên báo tin trễ hạn?","o":["Ngay khi bạn biết chắc, dù còn xa deadline","Đúng ngày deadline","Khi được hỏi"],"a":0,"e":"Báo sớm cho người khác thời gian xử lý. Đây là yếu tố quan trọng nhất, hơn cả cách diễn đạt."},{"q":"Sau khi nêu nguyên nhân, việc tiếp theo là:","o":["Xin lỗi thêm lần nữa","Nêu ảnh hưởng và hai phương án","Chờ người ta quyết"],"a":1,"e":"Người nghe cần biết ảnh hưởng và lựa chọn. Không có phương án thì bạn chỉ đang chuyển vấn đề."},{"q":"Chọn câu tốt nhất:","o":["Everything is delayed.","The demo is still safe; the full release moves to Tuesday.","There are some problems."],"a":1,"e":"Nêu rõ cái không bị ảnh hưởng ngăn người nghe tưởng tượng tệ hơn thực tế."},{"q":"Điền: It ___ to be more complex than I thought.","o":["turned out","turned on","came out"],"a":0,"e":"turn out to be = hoá ra là. Collocation chuẩn."}],"task":{"say":"Nói 60 giây báo một tin xấu thật (hoặc giả định), đúng 5 bước. Quy tắc: chỉ được nói sorry tối đa một lần.","write":"Viết tin Slack báo trễ hạn, dưới 5 dòng, có đủ: báo sớm, nguyên nhân, cái không bị ảnh hưởng, hai phương án, khuyến nghị."},"zen":"Tin xấu không xấu đi khi bạn nói ra — nó xấu đi khi bạn im lặng. Người ta tha thứ cho sự chậm trễ, họ không tha thứ cho việc bị bất ngờ."},{"d":24,"phase":5,"t":"Xin giúp đỡ, xin và nhận feedback","goal":"Nhờ giúp đỡ mà không nghe như thiếu năng lực, và nhận góp ý mà không phòng thủ.","why":"Người không dám hỏi mất nhiều thời gian nhất. Nhưng cách hỏi quan trọng: hỏi chung chung khiến người ta phải làm việc thay bạn, hỏi cụ thể khiến người ta muốn giúp.","scene":"Bạn tắc kỹ thuật hai giờ, và sau đó nhận một góp ý khó nghe.","dlg":[{"s":"You","en":"Do you have ten minutes today? I'm stuck on something and I've run out of ideas.","vi":"Bạn có 10 phút hôm nay không? Tôi đang tắc và đã hết cách."},{"s":"Colleague","en":"Sure. What have you tried?","vi":"Được. Bạn đã thử gì rồi?"},{"s":"You","en":"I've tried three things: the polyfill, a worker, and a smaller canvas. Here's what each one gave me.","vi":"Tôi đã thử ba thứ: polyfill, worker, và canvas nhỏ hơn. Đây là kết quả từng cái."},{"s":"Colleague","en":"Honestly, I think you're solving the wrong problem. This should be on the server.","vi":"Nói thật, tôi nghĩ bạn đang giải sai vấn đề. Cái này nên làm ở server."},{"s":"You","en":"That's a fair point. Can you say more about why?","vi":"Đó là điểm hợp lý. Bạn nói rõ hơn vì sao không?"},{"s":"Colleague","en":"Because you can't control the output across browsers, no matter what you do on the client.",
