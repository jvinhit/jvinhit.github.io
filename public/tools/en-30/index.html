:"Maybe possibly it could perhaps be the database.","good":"My best guess is the database, but I'd want to check the logs first.","why":"Chồng bốn từ rào lên nhau khiến bạn nghe như không có ý kiến gì. Chọn một cách rào, rồi nói thẳng phỏng đoán của bạn."}],"drills":[{"type":"pick","q":"Khách hàng hỏi một con số bạn không nhớ. Câu nào tốt nhất?","o":["I don't know.","Sorry, I forgot.","I don't have that off the top of my head — I'll send it right after this call.","Maybe around one thousand, I think, not sure."],"a":2,"e":"Thừa nhận + cam kết cụ thể về thời gian. Đoán bừa một con số cho khách hàng là cách nhanh nhất để mất uy tín."},{"type":"pick","q":"Bạn nghe câu hỏi nhưng không chắc họ đang hỏi phần nào. Câu nào tốt nhất?","o":["Sorry, my English is bad.","Just so I understand — do you mean the admin side or the public site?","What?","Yes, yes, okay."],"a":1,"e":"Hỏi lại có định hướng thể hiện bạn đã nghe được phần lớn và chỉ cần thu hẹp phạm vi. Nó nghe chủ động chứ không phải bất lực."},{"type":"pick","q":"Bạn khá chắc nguyên nhân nhưng chưa xác nhận. Câu nào truyền tải đúng mức độ chắc chắn?","o":["It's definitely a cache issue.","It might maybe be a cache issue possibly.","I'm fairly confident it's a cache issue — I'll confirm once I see the logs.","I don't know what it is."],"a":2,"e":"Mức độ chắc chắn khớp với thực tế, và có bước xác nhận. Nói definitely khi chưa kiểm tra là tự đặt bẫy cho mình."},{"type":"pick","q":"Câu hỏi của khách dựa trên một giả định sai về hệ thống. Bạn nên làm gì trước?","o":["Trả lời câu hỏi đúng như họ hỏi.","Nói No và chuyển chủ đề.","Sửa giả định trước bằng Actually, it works a bit differently, rồi mới giải thích.","Chờ người khác trong team lên tiếng."],"a":2,"e":"Nếu bạn trả lời trên một giả định sai, cả cuộc họp sẽ đi sai hướng và bạn là người bị hỏi lại sau đó."},{"type":"reply","q":"Why is the page still slow after your fix?","models":["Good question. My fix helped the initial load, but the slowness you're seeing is probably the chart rendering — let me measure it today.","I'm not sure yet. Let me profile it this afternoon and I'll come back with numbers.","It should be faster on the list page. Where exactly are you seeing it?"],"why":"Cả ba đều tránh phòng thủ. Câu thứ ba là mạnh nhất: hỏi lại để thu hẹp vấn đề thay vì nhận lỗi chung chung."},{"type":"reply","q":"How much would it cost to add multi-language support?","models":["I'd need to scope it properly, but as a rough order of magnitude, it's weeks rather than days.","I can't give you a number today. Give me until Thursday and I'll come back with a breakdown.","That depends a lot on how many screens are in scope. Do you want the whole admin or just the customer-facing part?"],"why":"weeks rather than days là cách nói độ lớn mà không cam kết con số. Rất hữu dụng khi bị hỏi estimate tại chỗ."},{"type":"reply","q":"Do you think this architecture will scale?","models":["For the traffic we have now, yes. If we go ten times bigger, the database will be the first thing to break.","I think so, but I'd want to load-test it before I say that to the client.","Honestly, I'm not the right person for that call — could we bring in the backend lead?"],"why":"Câu thứ nhất trả lời có điều kiện và nêu điểm yếu trước khi người khác tìm ra. Câu thứ ba là cách chuyển câu hỏi đi mà vẫn chuyên nghiệp."},{"type":"order","ans":"Let me check and get back to you.","hint":"Để tôi kiểm tra rồi phản hồi lại bạn.","ansTokens":["let","me","check","and","get","back","to","you"],"chips":["to","back","check","get","and","me","let","you"]},{"type":"order","ans":"Could you rephrase that for me?","hint":"Bạn diễn đạt lại giúp tôi được không?","ansTokens":["could","you","rephrase","that","for","me"],"chips":["could","me","for","rephrase","that","you"]},{"type":"fix","bad":"I will try my best.","ans":"I can commit to Thursday. If anything changes, I'll tell you on Tuesday.","why":"I'll try my best là câu nguy hiểm nhất trong tiếng Anh công việc: bạn nghe như đã đồng ý, người kia nghe như đã có cam kết, nhưng thực tế không ai hứa gì. Hãy cho một mốc thời gian và một lời hứa sẽ báo sớm nếu trượt.","soft":true}]},{"id":"q8","n":8,"t":"Vòng phản xạ: 36 nhịp hỏi và đáp thật","one":"Ngữ pháp bạn đã có. Giờ là tốc độ. Mục tiêu: nghe ý trong đầu và bật ra câu hỏi tiếng Anh trong dưới ba giây, không dịch từng từ.","frame":"Ba chế độ luyện — Hỏi: thấy ý tiếng Việt, tự bật ra câu hỏi. · Đáp: thấy câu hỏi tiếng Anh, tự bật ra câu trả lời. · Hẹn giờ: câu hỏi hiện ra kèm đồng hồ 8 giây, bạn phải nói xong trước khi hết.","note":"Quy tắc duy nhất: NÓI THÀNH TIẾNG. Nghĩ trong đầu không tính, vì cái tắc của bạn không nằm ở kiến thức mà nằm ở cơ miệng và ở phản xạ. Mỗi ngày mười nhịp, làm liên tục hai tuần thì phần lớn những câu này sẽ tự bật ra khi họp thật.","ex":[{"en":"Do you have five minutes to talk?","vi":"Bạn có rảnh nói chuyện năm phút không?","n":"Câu mở đầu mọi cuộc trò chuyện ở công ty."},{"en":"What do you need from me to move forward?","vi":"Bạn cần gì từ tôi để làm tiếp?","n":"Câu hỏi làm bạn trông như người chủ động nhất trong phòng."},{"en":"Just to make sure I understand — you want two separate tables?","vi":"Tôi hiểu đúng chưa: bạn muốn hai bảng riêng?","n":"Câu chốt lại hiểu biết, dùng trước khi bắt tay vào làm."},{"en":"Who makes the final call on this?","vi":"Ai quyết định cuối cùng chuyện này?","n":"Tiết kiệm cho bạn hàng giờ tranh luận với người không có quyền quyết."}],"fix":[{"bad":"Nghĩ ra câu tiếng Việt trước, rồi dịch từng chữ sang tiếng Anh.","good":"Nhớ trọn cụm — Do you have five minutes… — và lấy nó ra nguyên khối.","why":"Dịch từng chữ luôn cho ra ngữ pháp Việt trong vỏ tiếng Anh: You have five minutes? Khi bạn lưu cả cụm như một khối, trật tự đúng đã nằm sẵn trong đó."},{"bad":"Luyện bằng cách đọc thầm trong đầu.","good":"Luyện bằng cách nói to, kể cả khi chỉ mình bạn trong phòng.","why":"Đọc thầm không huấn luyện được cơ miệng và không tạo được phản xạ. Chỗ tắc lúc họp thật luôn nằm ở khoảng cách giữa não và miệng."}],"pool":[{"vi":"Bạn có rảnh nói chuyện năm phút không?","en":"Do you have five minutes to talk?","ans":"Sure — now or after the standup?"},{"vi":"Ai đang phụ trách phần thanh toán?","en":"Who's handling the payment side?","ans":"Minh is. He picked it up last sprint."},{"vi":"Cái này khi nào cần xong?","en":"When do you need this by?","ans":"End of day Thursday, if that works."},{"vi":"Tôi nên hỏi ai về quyền truy cập?","en":"Who should I ask about access?","ans":"Talk to the infra team — Slack channel #infra-help."},{"vi":"Bạn xem PR của tôi giúp được không?","en":"Could you take a look at my PR?","ans":"Sure, send me the link. I'll get to it before lunch."},{"vi":"Bạn có biết API xong chưa không?","en":"Do you know if the API is ready?","ans":"Not yet — they said Wednesday."},{"vi":"Cái này ưu tiên cao hơn cái đang làm không?","en":"Does this take priority over what I'm working on?","ans":"Yes, please park the other one for now."},{"vi":"Deadline là thứ Sáu, đúng chứ?","en":"The deadline is Friday, right?","ans":"Friday end of day, yes."},{"vi":"Có lý do gì mình không dùng thư viện có sẵn không?","en":"Is there a reason we're not using an existing library?","ans":"Mostly licensing. We looked at two and both were GPL."},{"vi":"Bạn nhắc lại phần cuối giúp tôi được không?","en":"Could you repeat the last part?","ans":"Of course — I said we're moving the demo to Tuesday."},{"vi":"Ý bạn là mình bỏ tính năng đó luôn?","en":"Do you mean we're dropping that feature entirely?","ans":"Just for this release. It'll come back in v2."},{"vi":"Cái này sẽ mất bao lâu?","en":"How long will this take?","ans":"Two days for the happy path, maybe three with edge cases."},{"vi":"Bạn đã test trên mobile chưa?","en":"Have you tested it on mobile?","ans":"Not yet. I'll do that this afternoon."},{"vi":"Sao bản build lỗi?","en":"Why did the build fail?","ans":"A type error in the shared package. It's fixed now."},{"vi":"Mình dời buổi họp sang mai được không?","en":"Can we move the meeting to tomorrow?","ans":"Works for me. Same time?"},{"vi":"Bạn cần gì từ tôi để làm tiếp?","en":"What do you need from me to move forward?","ans":"Just the final copy for the empty states."},{"vi":"Cái này bên bạn tái hiện được không?","en":"Can you reproduce it on your side?","ans":"I can, but only in Safari."},{"vi":"Con số đó lấy từ đâu?","en":"Where is that number coming from?","ans":"From the analytics dashboard, last thirty days."},{"vi":"Việc này còn trong phạm vi sprint này không?","en":"Is this still in scope for this sprint?","ans":"It shouldn't be. Let's move it to next sprint."},{"vi":"Ai quyết định cuối cùng chuyện này?","en":"Who makes the final call on this?","ans":"The product owner — I'll loop her in."},{"vi":"Bạn có biết vì sao họ đổi yêu cầu không?","en":"Do you know why they changed the requirement?","ans":"Something about a new compliance rule. I'll forward the email."},{"vi":"Mình đã đồng ý bỏ phần đó rồi mà, đúng không?","en":"We agreed to cut that part, didn't we?","ans":"We did. It's in the notes from Monday."},{"vi":"Tôi gửi cho bạn qua Slack hay email?","en":"Should I send it over Slack or by email?","ans":"Slack is faster for me."},{"vi":"Bạn muốn tôi làm bản nháp trước không?","en":"Would you like me to do a rough version first?","ans":"Yes, please. A rough version is enough for Monday."},{"vi":"Có ai đang bị vướng gì không?","en":"Is anyone blocked on anything?","ans":"I am, actually — I still need the staging credentials."},{"vi":"Bạn ước lượng bao nhiêu điểm cho việc này?","en":"How many points would you put on this?","ans":"Three, assuming the design is final."},{"vi":"Mình có nên roll back không?","en":"Should we roll back?","ans":"Let's give it ten minutes. If the errors keep climbing, yes."},{"vi":"Bạn cho tôi biết file đó nằm ở đâu được không?","en":"Could you tell me where that file is?","ans":"It's under src/config — I'll paste the path."},{"vi":"Tôi hiểu đúng chưa: bạn muốn hai bảng riêng?","en":"Just to make sure I understand — you want two separate tables?","ans":"Exactly. One for drafts, one for published."},{"vi":"Bao lâu nữa bạn phản hồi được cho tôi?","en":"How soon can you get back to me?","ans":"By the end of today."},{"vi":"Cái gì làm trang này chậm?","en":"What's making this page slow?","ans":"Mostly the chart library. We load the whole bundle up front."},{"vi":"Bạn có phiên bản mới nhất của file design không?","en":"Do you have the latest version of the design file?","ans":"I do — I'll drop the Figma link in the channel."},{"vi":"Phần này ai review?","en":"Who's reviewing this part?","ans":"I'll take it if no one else has."},{"vi":"Mình có cần thông báo cho khách trước không?","en":"Do we need to tell the client beforehand?","ans":"Yes, and it should come from you, not from support."},{"vi":"Bạn thấy cách này ổn không?","en":"What do you think of this approach?","ans":"I like it overall. My only concern is the extra request on every page load."},{"vi":"Nếu API trễ thì mình làm gì?","en":"What do we do if the API is late?","ans":"We ship the UI with mock data and swap it in later."}],"drills":[{"type":"order","ans":"What do you need from me to move forward?","hint":"Bạn cần gì từ tôi để làm tiếp?","ansTokens":["what","do","you","need","from","me","to","move","forward"],"chips":["need","you","from","forward","what","move","do","to","me"]},{"type":"order","ans":"Who makes the final call on this?","hint":"Ai quyết định cuối cùng chuyện này?","ansTokens":["who","makes","the","final","call","on","this"],"chips":["this","call","the","final","who","makes","on"]},{"type":"order","ans":"Just to make sure I understand this correctly.","hint":"Chỉ để chắc là tôi hiểu đúng.","ansTokens":["just","to","make","sure","I","understand","this","correctly"],"chips":["understand","correctly","this","sure","to","just","make","I"]},{"type":"transform","prompt":"Where is the staging URL? → làm cho lịch sự bằng Do you know…","ans":"Do you know where the staging URL is?","alt":["do you know where the staging url is"],"why":"Ôn lại đơn vị 4: mệnh đề sau trở về trật tự câu kể, is về cuối."},{"type":"transform","prompt":"Someone changed the schema. → hỏi về chủ ngữ","ans":"Who changed the schema?","alt":["who changed the schema"],"why":"Ôn lại đơn vị 3: who là chủ ngữ nên không có did."},{"type":"pick","q":"Câu nào bạn nên dùng nhiều nhất trong cuộc họp tiếng Anh đầu tiên?","o":["Yes, yes, okay.","Sorry, my English is not good.","Just so I understand — do you mean X or Y?","I don't know."],"a":2,"e":"Nó vừa mua cho bạn thời gian, vừa thu hẹp câu hỏi, vừa cho thấy bạn đang theo dõi. Im lặng gật đầu là cách nhanh nhất để làm sai việc."}]}]},{"id":"noun","ab":"N","t":"Mạo từ & danh từ","sub":"a / the / để trống, và những từ không bao giờ có s.","units":[{"id":"n1","n":1,"t":"a / an / the / để trống — bốn lựa chọn, không có lựa chọn thứ năm","one":"Tiếng Việt không có mạo từ, nên bộ não bạn không có sẵn ô nào để điền. Phải cài thêm một bước kiểm tra: mỗi lần nói một danh từ đếm được số ít, tự hỏi trước nó có gì.","frame":"Danh từ đếm được SỐ ÍT không bao giờ đứng trần — luôn có a/an, the, hoặc this/my/our. · a/an = lần đầu nhắc, người nghe chưa biết cái nào · the = cả hai đã biết cái nào · để trống = số nhiều nói chung, hoặc danh từ không đếm được","note":"Quy tắc vận hành trong hội thoại: lần đầu dùng a, từ lần thứ hai trở đi dùng the. I opened a ticket. The ticket is in the backlog. Ngoài ra the còn dùng khi chỉ có một cái duy nhất trong ngữ cảnh (the login page, the database, the client), và khi có cụm bổ nghĩa phía sau (the file I sent you). Nghề nghiệp luôn cần a: I'm a developer, she's a designer.","ex":[{"en":"I'm a frontend developer.","vi":"Tôi là lập trình viên frontend.","n":"Nghề nghiệp số ít luôn cần a/an. Đây là câu bạn nói nhiều nhất, nên sửa nó trước tiên."},{"en":"There's a bug on the login page.","vi":"Có một lỗi trên trang đăng nhập.","n":"a bug vì lần đầu nhắc; the login page vì cả hai đều biết trang nào."},{"en":"I opened a ticket. The ticket is in this sprint.","vi":"Tôi đã mở một ticket. Ticket đó nằm trong sprint này.","n":"Nhịp a → the: nhắc lần đầu rồi nhắc lại."},{"en":"Could you send me the link?","vi":"Bạn gửi tôi cái link đó được không?","n":"the vì cả hai đang nói về đúng một link cụ thể. Nói a link nghĩa là link nào cũng được."},{"en":"We use TypeScript and React.","vi":"Bên mình dùng TypeScript và React.","n":"Tên công nghệ là danh từ riêng, để trống. Không bao giờ the TypeScript."},{"en":"Bugs like this are usually a caching problem.","vi":"Lỗi kiểu này thường là vấn đề cache.","n":"Bugs số nhiều nói chung nên để trống; a caching problem số ít nên cần a."}],"fix":[{"bad":"I'm frontend developer with 4 years experience.","good":"I'm a frontend developer with four years of experience.","why":"Hai lỗi kinh điển trong một câu tự giới thiệu: thiếu a trước nghề nghiệp, và thiếu of trong four years of experience. Đây là câu đầu tiên bạn nói trong mọi cuộc phỏng vấn — đáng để sửa cho sạch tuyệt đối."},{"bad":"I will send you link after meeting.","good":"I'll send you the link after the meeting.","why":"Cả link và meeting đều là danh từ đếm được số ít mà cả hai bên đều biết đang nói cái nào, nên cần the. Bỏ trắng là dấu hiệu rõ nhất của người mới học."},{"bad":"This is the problem with the performance in the mobile devices.","good":"This is a performance problem on mobile devices.","why":"Lạm dụng the theo hướng ngược lại. mobile devices là số nhiều nói chung nên để trống, và a performance problem vì đây là lần đầu nêu vấn đề."}],"drills":[{"type":"pick","q":"Điền vào chỗ trống: I'm ___ QA engineer on the payments team.","o":["a","an","the","(để trống)"],"a":0,"e":"Nghề nghiệp số ít cần a/an. Chọn a vì QA đọc là /kju:/ — bắt đầu bằng ÂM phụ âm, không phải chữ cái. Quy tắc a/an dựa vào âm, không dựa vào chữ."},{"type":"pick","q":"Điền vào chỗ trống: It takes about ___ hour to run the full suite.","o":["a","an","the","(để trống)"],"a":1,"e":"hour bắt đầu bằng âm nguyên âm vì chữ h câm, nên dùng an. Cùng logic: an API, an SQL query, an honest answer."},{"type":"pick","q":"Điền vào chỗ trống: I found ___ bug yesterday. ___ bug is still open.","o":["a … A","the … The","a … The","(để trống) … The"],"a":2,"e":"Nhịp chuẩn của hội thoại: lần đầu a, lần nhắc lại the. Đây là mẫu bạn sẽ dùng hàng ngày khi báo lỗi."},{"type":"pick","q":"Điền vào chỗ trống: We are migrating to ___ React 19 next month.","o":["a","an","the","(để trống)"],"a":3,"e":"Tên công nghệ và tên phiên bản là danh từ riêng, không bao giờ đi với mạo từ."},{"type":"pick","q":"Điền vào chỗ trống: ___ users are complaining about ___ checkout page.","o":["The … a","(để trống) … the","A … the","The … (để trống)"],"a":1,"e":"users số nhiều nói chung nên để trống; checkout page là trang duy nhất trong hệ thống nên the."},{"type":"pick","q":"Điền vào chỗ trống: Could you take ___ look at ___ file I just pushed?","o":["a … the","the … a","a … a","(để trống) … the"],"a":0,"e":"take a look là cụm cố định. file cần the vì có cụm bổ nghĩa I just pushed xác định rõ file nào."},{"type":"fix","bad":"He is best developer in team.","ans":"He is the best developer on the team.","why":"So sánh nhất luôn đi với the vì chỉ có một người đứng nhất. Và trong tiếng Anh công việc là on the team, không phải in the team."},{"type":"fix","bad":"Can you create ticket for this?","ans":"Can you create a ticket for this?","why":"ticket là danh từ đếm được số ít, lần đầu nhắc nên cần a."},{"type":"fix","bad":"I sent email to the client about the new feature.","ans":"I sent an email to the client about the new feature.","why":"an email vì lần đầu nhắc và bắt đầu bằng âm nguyên âm. Phần còn lại của câu đã dùng the rất đúng."},{"type":"order","ans":"I opened a ticket for the bug.","hint":"Tôi đã mở một ticket cho lỗi đó.","ansTokens":["I","opened","a","ticket","for","the","bug"],"chips":["ticket","I","the","opened","a","bug","for"]},{"type":"order","ans":"Could you send me the design file?","hint":"Bạn gửi tôi file design đó được không?","ansTokens":["could","you","send","me","the","design","file"],"chips":["could","send","you","file","the","design","me"]},{"type":"transform","prompt":"Sửa lại cho đúng mạo từ: I am developer and I work on admin portal.","ans":"I am a developer and I work on the admin portal.","alt":["i'm a developer and i work on the admin portal"],"why":"a trước nghề nghiệp, the trước admin portal vì đó là hệ thống duy nhất mà cả hai đang nói tới."}]},{"id":"n2","n":2,"t":"Danh từ không đếm được: đừng thêm s vào information","one":"Có một nhóm danh từ tiếng Anh không bao giờ có dạng số nhiều, và gần như tất cả đều là những từ bạn dùng mỗi ngày ở công ty.","frame":"KHÔNG BAO GIỜ có s: information · feedback · advice · research · software · hardware · progress · work · code · content · traffic · equipment · staff · news · knowledge · training · support · documentation","note":"Muốn đếm chúng thì mượn một đơn vị: a piece of feedback, a bit of information, two pieces of advice. Muốn nói nhiều thì dùng some, a lot of, much, plenty of — không dùng many. Riêng data về mặt kỹ thuật là số nhiều của datum, nhưng trong tiếng Anh công việc ngày nay nó được dùng như danh từ không đếm được: the data shows, chứ không phải the datas show.","ex":[{"en":"Do you have any feedback on the design?","vi":"Bạn có nhận xét gì về bản design không?","n":"feedback không bao giờ có s. any feedback thay cho any feedbacks."},{"en":"I need a bit more information before I can estimate.","vi":"Tôi cần thêm chút thông tin nữa mới ước lượng được.","n":"a bit more information — mượn a bit để đếm."},{"en":"That's a really useful piece of feedback.","vi":"Đó là một nhận xét rất hữu ích.","n":"Cách duy nhất để nói một nhận xét: a piece of feedback."},{"en":"We made good progress this week.","vi":"Tuần này bên mình tiến triển tốt.","n":"progress luôn không đếm được. Không có progresses."},{"en":"How much work is left on this ticket?","vi":"Ticket này còn bao nhiêu việc?","n":"how much cho danh từ không đếm được, how many cho đếm được."},{"en":"The data shows a drop after the release.","vi":"Dữ liệu cho thấy có sụt giảm sau bản release.","n":"the data shows với động từ số ít là dạng thông dụng nhất trong công việc hiện nay."}],"fix":[{"bad":"Thanks for your feedbacks, I will send you more informations.","good":"Thanks for your feedback. I'll send you more information.","why":"Đây là hai từ bị thêm s nhiều nhất bởi người Việt, và cũng là hai từ xuất hiện nhiều nhất trong email công việc. Sửa hai từ này thôi đã làm email của bạn khác hẳn."},{"bad":"He gave me many advices about the architecture.","good":"He gave me a lot of advice about the architecture.","why":"advice không đếm được nên không có s và không đi với many. Dùng a lot of, hoặc some, hoặc một số cụ thể qua đơn vị: two pieces of advice."},{"bad":"We have 3 softwares and 5 staffs in the team.","good":"We have three tools and five people on the team.","why":"software và staff đều không đếm được. Khi cần đếm, hãy đổi sang một từ đếm được: tools, people, team members. Câu five staff về mặt ngữ pháp cũng chấp nhận được, nhưng five people nghe tự nhiên hơn nhiều."}],"drills":[{"type":"pick","q":"Câu nào đúng?","o":["I have some informations for you.","I have some information for you.","I have an information for you.","I have informations for you."],"a":1,"e":"information không đếm được: không s, không a. Dùng some, a bit of, hoặc a piece of."},{"type":"pick","q":"Điền: ___ feedback did you get from the client?","o":["How many","How much","How many pieces","How's"],"a":1,"e":"how much cho danh từ không đếm được. Nếu muốn dùng how many thì phải thêm đơn vị: How many pieces of feedback…, nhưng nghe rất cứng."},{"type":"pick","q":"Câu nào đúng?","o":["The datas are wrong.","The data are wrong on two rows.","The data is wrong on two rows.","The datum is wrong."],"a":2,"e":"Trong tiếng Anh công việc, data được dùng như danh từ không đếm được với động từ số ít. Dạng data are chỉ còn gặp trong bài báo khoa học."},{"type":"pick","q":"Điền: We have made ___ on the migration.","o":["a progress","many progress","some progress","progresses"],"a":2,"e":"progress không đếm được nên không có a và không có s. some progress hoặc good progress là hai cách nói phổ biến nhất."},{"type":"pick","q":"Câu nào đúng?","o":["I need two advices.","I need some advice.","I need an advice.","I need many advices."],"a":1,"e":"advice không đếm được. Nếu thật sự cần đếm: two pieces of advice."},{"type":"fix","bad":"Can you give me more informations about the requirements?","ans":"Can you give me more information about the requirements?","why":"Bỏ s. requirements thì ngược lại, đếm được và ở đây là số nhiều nên hoàn toàn đúng."},{"type":"fix","bad":"We received a lot of feedbacks from the users.","ans":"We received a lot of feedback from the users.","why":"a lot of dùng được cho cả đếm được và không đếm được, nên chỉ cần bỏ s ở feedback."},{"type":"fix","bad":"The documentations are not updated.","ans":"The documentation is not up to date.","why":"documentation không đếm được nên động từ là is. Ngoài ra người bản ngữ nói up to date thay vì updated khi mô tả trạng thái."},{"type":"fix","bad":"How many works do you have this week?","ans":"How much work do you have this week?","why":"work theo nghĩa công việc thì không đếm được. Dạng works số nhiều tồn tại nhưng mang nghĩa khác: tác phẩm, hoặc nhà máy."},{"type":"order","ans":"Thanks for the feedback on my PR.","hint":"Cảm ơn nhận xét của bạn về PR của tôi.","ansTokens":["thanks","for","the","feedback","on","my","PR"],"chips":["for","the","my","on","PR","thanks","feedback"]},{"type":"order","ans":"I need a bit more information first.","hint":"Tôi cần thêm chút thông tin trước đã.","ansTokens":["I","need","a","bit","more","information","first"],"chips":["a","more","first","information","bit","need","I"]}]},{"id":"n3","n":3,"t":"Số nhiều, hoà hợp chủ ngữ và các bẫy đếm","one":"Tiếng Việt không chia động từ theo số, nên mắt bạn không tự động soi cặp chủ ngữ–động từ. Đây là lỗi mà người nghe bản ngữ phát hiện ngay lập tức.","frame":"there is + số ít / there are + số nhiều · the team / everyone / each + động từ SỐ ÍT · fewer + đếm được / less + không đếm được · a couple of things ARE","note":"Bẫy hay gặp nhất: những từ nghe như số nhiều nhưng ngữ pháp là số ít. everyone, everybody, each, nobody đều đi với động từ số ít: Everyone is on the call. Còn the team và the client thì trong tiếng Anh Mỹ dùng số ít (the team is), tiếng Anh Anh có thể dùng số nhiều (the team are) — chọn một và dùng nhất quán.","ex":[{"en":"There are three tickets left in this sprint.","vi":"Sprint này còn ba ticket.","n":"three tickets số nhiều nên there are."},{"en":"There's one thing I want to flag.","vi":"Có một việc tôi muốn nêu ra.","n":"one thing số ít nên there is, viết tắt là there's."},{"en":"Everyone is on the call already.","vi":"Mọi người đã vào cuộc gọi rồi.","n":"everyone luôn đi với is, dù nghĩa là nhiều người."},{"en":"The team is aligned on the approach.","vi":"Cả team đã thống nhất về cách làm.","n":"the team dùng như một khối, động từ số ít."},{"en":"We have fewer bugs than last sprint.","vi":"Bên mình có ít lỗi hơn sprint trước.","n":"bugs đếm được nên fewer. Nói less bugs là lỗi rất phổ biến, kể cả với người bản ngữ."},{"en":"A couple of things are still blocking me.","vi":"Vẫn còn vài việc đang chặn tôi.","n":"Chủ ngữ thật là things nên động từ số nhiều: are."}],"fix":[{"bad":"There is three bugs in the report.","good":"There are three bugs in the report.","why":"Động từ phải khớp với danh từ ĐỨNG SAU nó, không phải với there. three bugs số nhiều nên are. Đây là lỗi bạn sẽ nghe rõ nhất khi tự nghe lại bản ghi âm của mình."},{"bad":"Everyone are waiting for the API.","good":"Everyone is waiting for the API.","why":"everyone về ngữ pháp là số ít dù nghĩa là nhiều người. Cùng nhóm: everybody, somebody, nobody, each, either."},{"bad":"We have less tickets and more informations now.","good":"We have fewer tickets and more information now.","why":"tickets đếm được nên fewer; information không đếm được nên không có s. more thì dùng được cho cả hai loại."}],"drills":[{"type":"pick","q":"Điền: There ___ two things I need before I can start.","o":["is","are","was","has"],"a":1,"e":"two things là số nhiều nên are. Động từ khớp với danh từ sau there, không phải với there."},{"type":"pick","q":"Điền: Each of the services ___ its own database.","o":["have","has","are having","having"],"a":1,"e":"each luôn số ít, nên has. Cụm of the services chỉ là bổ nghĩa, không phải chủ ngữ."},{"type":"pick","q":"Điền: We should have ___ meetings and ___ documentation.","o":["less … fewer","fewer … less","less … less","fewer … fewer"],"a":1,"e":"meetings đếm được nên fewer; documentation không đếm được nên less."},{"type":"pick","q":"Điền: The list of open issues ___ getting longer.","o":["are","is","have","were"],"a":1,"e":"Chủ ngữ thật là the list (số ít), không phải issues. Mẹo: bỏ cụm of… đi rồi đọc lại — The list is getting longer."},{"type":"pick","q":"Câu nào đúng?","o":["A couple of things is blocking me.","A couple of things are blocking me.","A couple of thing are blocking me.","Couple of things is blocking me."],"a":1,"e":"Với a couple of và a number of, động từ khớp với danh từ số nhiều đứng sau."},{"type":"pick","q":"Điền: Nobody ___ told me about the change.","o":["have","has","are","were"],"a":1,"e":"nobody số ít nên has. Lưu ý câu này đã mang nghĩa phủ định, nên không thêm not nữa."},{"type":"fix","bad":"There is many things to discuss.","ans":"There are many things to discuss.","why":"many things số nhiều nên are. Bonus: discuss không có about theo sau."},{"type":"fix","bad":"The team have finished their part and everyone are happy.","ans":"The team has finished its part and everyone is happy.","why":"Trong tiếng Anh Mỹ, the team là khối số ít nên has và its. everyone luôn là is."},{"type":"fix","bad":"How much tickets are still open?","ans":"How many tickets are still open?","why":"tickets đếm được nên how many. Dùng how much cho work, information, feedback."},{"type":"order","ans":"There are still two blockers on my side.","hint":"Bên tôi vẫn còn hai vướng mắc.","ansTokens":["there","are","still","two","blockers","on","my","side"],"chips":["two","on","still","are","blockers","my","side","there"]},{"type":"order","ans":"Everyone is waiting for the design.","hint":"Mọi người đang chờ bản design.","ansTokens":["everyone","is","waiting","for","the","design"],"chips":["is","design","for","everyone","the","waiting"]}]}]},{"id":"prep","ab":"G","t":"Giới từ & collocation","sub":"by vs until, discuss ø, the same as. Lỗi dai dẳng nhất.","units":[{"id":"g1","n":1,"t":"Giới từ thời gian: by và until là hai thứ khác nhau","one":"Nếu bạn chỉ sửa một giới từ trong cả sự nghiệp, hãy sửa by và until. Nói sai hai từ này là nói sai deadline, và đó là loại lỗi có hậu quả thật.","frame":"at + giờ · on + thứ và ngày · in + tháng, năm, quý, khoảng thời gian · by = trước hoặc đúng mốc đó (deadline) · until = liên tục cho tới lúc đó rồi dừng · for + độ dài · since + điểm bắt đầu · within + khoảng tính từ bây giờ","note":"by Friday nghĩa là xong trước hết thứ Sáu. until Friday nghĩa là tôi còn làm nó cho tới thứ Sáu — hoàn toàn không cam kết là xong. Khi khách hỏi khi nào xong, họ muốn nghe by. Về for và since: for + độ dài (for three years), since + mốc bắt đầu (since 2023). Người Việt hay nói since three years vì tiếng Việt dùng cùng một chữ được ba năm.","ex":[{"en":"The call is at 3, right after standup.","vi":"Cuộc gọi lúc 3 giờ, ngay sau standup.","n":"at cho giờ chính xác."},{"en":"We ship on Friday, so the code freeze is on Thursday.","vi":"Bên mình release thứ Sáu, nên code freeze thứ Năm.","n":"on cho thứ và ngày."},{"en":"I'll have it done by end of day Thursday.","vi":"Tôi sẽ xong trước hết ngày thứ Năm.","n":"by là từ tạo ra cam kết. Đây là câu bạn nên dùng thay cho I'll try."},{"en":"I'm on this until Wednesday, then I switch to the reports.","vi":"Tôi làm việc này tới thứ Tư, sau đó chuyển sang phần báo cáo.","n":"until mô tả một khoảng làm việc liên tục, không phải deadline."},{"en":"I've been on this team for two years.","vi":"Tôi ở team này được hai năm rồi.","n":"for + độ dài. Không bao giờ since two years."},{"en":"I'll get back to you within the hour.","vi":"Tôi sẽ phản hồi trong vòng một tiếng.","n":"within nghe chuyên nghiệp và cụ thể hơn soon rất nhiều."}],"fix":[{"bad":"I will finish it until Friday.","good":"I'll finish it by Friday.","why":"until không phải deadline. Người nghe sẽ hiểu là bạn còn làm nó tới thứ Sáu và có thể vẫn chưa xong. Muốn cam kết thì luôn dùng by."},{"bad":"I have worked here since 3 years.","good":"I've worked here for three years.","why":"for đi với độ dài, since đi với mốc bắt đầu. Nếu muốn dùng since thì phải nói since 2023."},{"bad":"The demo is in Monday at the morning.","good":"The demo is on Monday morning.","why":"on cho thứ. Và khi đã có thứ thì bỏ luôn giới từ trước morning: on Monday morning, không phải on Monday in the morning."}],"drills":[{"type":"pick","q":"Khách hỏi khi nào xong. Bạn chắc chắn xong trước hết thứ Tư. Chọn câu đúng.","o":["I'll finish until Wednesday.","I'll finish by Wednesday.","I'll finish in Wednesday.","I'll finish since Wednesday."],"a":1,"e":"by = trước hoặc đúng mốc đó. Đây là từ duy nhất tạo ra một cam kết rõ ràng về deadline."},{"type":"pick","q":"Điền: The retro is ___ Thursday ___ 4pm.","o":["in … at","on … at","at … on","on … in"],"a":1,"e":"on cho thứ, at cho giờ. Thứ tự này gần như không bao giờ đổi."},{"type":"pick","q":"Điền: We've been debugging this ___ two hours.","o":["since","for","during","in"],"a":1,"e":"for + độ dài. since dùng khi bạn nêu mốc bắt đầu: since 9am."},{"type":"pick","q":"Điền: The new version goes live ___ Q4.","o":["on","at","in","by"],"a":2,"e":"in cho khoảng thời gian dài: tháng, quý, năm."},{"type":"pick","q":"Điền: I'm blocked ___ the API is ready.","o":["by","until","for","since"],"a":1,"e":"until mô tả một trạng thái kéo dài tới một thời điểm. Ở đây bạn bị chặn liên tục cho tới khi API xong."},{"type":"pick","q":"Điền: Can you review it ___ tomorrow morning?","o":["until","by","since","for"],"a":1,"e":"Bạn đang xin một deadline nên dùng by. Nói until tomorrow morning nghĩa là hãy review liên tục cho tới sáng mai."},{"type":"fix","bad":"Please send me the file until 5pm today.","ans":"Please send me the file by 5pm today.","why":"Deadline luôn là by. Đây là lỗi có thể làm bạn nhận file muộn thật, nên rất đáng sửa."},{"type":"fix","bad":"I am working on this project since January.","ans":"I've been working on this project since January.","why":"since đúng, nhưng một hành động bắt đầu trong quá khứ và còn tiếp tục thì cần hiện tại hoàn thành tiếp diễn, không phải hiện tại tiếp diễn."},{"type":"fix","bad":"The meeting is at Monday in 10 o'clock.","ans":"The meeting is on Monday at 10.","why":"on cho thứ, at cho giờ — bạn đã đảo ngược cả hai. Ngoài ra người bản ngữ thường bỏ o'clock khi nói giờ trong công việc."},{"type":"order","ans":"I will have it ready by Thursday.","hint":"Tôi sẽ chuẩn bị xong trước thứ Năm.","ansTokens":["I","will","have","it","ready","by","Thursday"],"chips":["I","by","Thursday","have","will","it","ready"]},{"type":"order","ans":"I have been on this team for two years.","hint":"Tôi ở team này được hai năm rồi.","ansTokens":["I","have","been","on","this","team","for","two","years"],"chips":["for","been","years","this","team","on","I","have","two"]}]},{"id":"g2","n":2,"t":"Động từ + giới từ, và những động từ tuyệt đối không có giới từ","one":"Có một nhóm động từ mà tiếng Việt buộc phải thêm từ nối, còn tiếng Anh thì cấm. discuss about là lỗi bạn sẽ nghe từ chín trên mười người Việt trong phòng họp.","frame":"KHÔNG có giới từ: discuss ø · contact ø · answer ø · join ø · reach ø · tell somebody ø · call ø — CÓ giới từ: depend on · focus on · work on · rely on · based on · look into · look forward to + V-ing · get back to · deal with · ask for · wait for · listen to · escalate to · report to","note":"Nhớ theo cặp đối lập: discuss the design nhưng talk about the design. answer my question nhưng reply to my question. tell me nhưng say to me. explain it to me — explain luôn cần to trước người, không bao giờ explain me. Và look forward to là bẫy ngữ pháp: to ở đây là giới từ, nên sau nó là V-ing, không phải nguyên mẫu.","ex":[{"en":"Can we discuss the timeline tomorrow?","vi":"Mai mình bàn về timeline được không?","n":"discuss không có about. Nếu muốn dùng about thì đổi động từ: talk about."},{"en":"It depends on how many screens are in scope.","vi":"Cái đó tuỳ vào có bao nhiêu màn hình trong phạm vi.","n":"depend on, không phải depend of. Và luôn là it depends, có s."},{"en":"Could you explain that to me one more time?","vi":"Bạn giải thích lại cho tôi một lần nữa được không?","n":"explain something to somebody. Không bao giờ explain me."},{"en":"I'll look into it and get back to you.","vi":"Tôi sẽ xem xét rồi phản hồi lại bạn.","n":"Hai cụm dùng được ngay, xuất hiện trong mọi cuộc họp."},{"en":"Looking forward to hearing from you.","vi":"Mong nhận được phản hồi từ bạn.","n":"Sau to là V-ing vì đây là giới từ. Đây là câu kết email phổ biến nhất, nên sai là sai ở chỗ ai cũng đọc."},{"en":"I'll contact the vendor and escalate to my manager if needed.","vi":"Tôi sẽ liên hệ nhà cung cấp và báo lên quản lý nếu cần.","n":"contact không có to; escalate thì có to."}],"fix":[{"bad":"Let's discuss about the new requirement.","good":"Let's discuss the new requirement.","why":"discuss đã bao hàm nghĩa về, nên thêm about là thừa. Nếu bạn quen nói about thì đổi sang Let's talk about — cả hai đều tự nhiên."},{"bad":"Please explain me why the build failed.","good":"Please explain to me why the build failed.","why":"explain luôn cần to trước người nhận. Cách gọn hơn và tự nhiên hơn: Could you explain why the build failed?"},{"bad":"I look forward to hear from you. I will revert back to you soon.","good":"I look forward to hearing from you. I'll get back to you soon.","why":"Hai lỗi trong một câu kết email: sau look forward to phải là V-ing, và revert back to you là cách dùng chỉ phổ biến ở một số vùng chứ không phải tiếng Anh chuẩn công việc — dùng get back to you."}],"drills":[{"type":"pick","q":"Câu nào đúng?","o":["Let's discuss about the API contract.","Let's discuss the API contract.","Let's discuss on the API contract.","Let's discuss for the API contract."],"a":1,"e":"discuss không bao giờ đi với giới từ. Nếu cần about thì dùng talk about."},{"type":"pick","q":"Điền: The estimate depends ___ the final scope.","o":["of","on","to","from"],"a":1,"e":"depend on. Đây là collocation cố định, không có lựa chọn khác."},{"type":"pick","q":"Điền: I'm looking forward to ___ with your team.","o":["work","working","have worked","the work"],"a":1,"e":"to trong look forward to là giới từ nên sau nó là V-ing."},{"type":"pick","q":"Câu nào đúng?","o":["I will contact to you tomorrow.","I will contact with you tomorrow.","I will contact you tomorrow.","I will contact for you tomorrow."],"a":2,"e":"contact somebody, không có giới từ. Cùng nhóm: call you, email you, join the call."},{"type":"pick","q":"Điền: Could you ___ the difference ___ me?","o":["explain … to","explain … for","explain … ø","describe … to"],"a":0,"e":"explain something to somebody. Không bao giờ explain me."},{"type":"pick","q":"Điền: I'll ___ it and let you know what I find.","o":["look at into","look into","look in","look for into"],"a":1,"e":"look into = xem xét, điều tra. Phân biệt với look at (xem nhanh) và look for (tìm kiếm)."},{"type":"fix","bad":"I am waiting your answer about my question.","ans":"I'm waiting for your answer to my question.","why":"wait luôn cần for. Và answer to a question, không phải answer about."},{"type":"fix","bad":"He asked to me about the deadline.","ans":"He asked me about the deadline.","why":"ask somebody, không có to. Nhưng ask FOR something khi bạn xin một thứ: He asked for more time."},{"type":"fix","bad":"It's depend of the client.","ans":"It depends on the client.","why":"Ba lỗi: bỏ 's, thêm s vào depends vì chủ ngữ it, và đổi of thành on. Câu đúng này bạn sẽ dùng mỗi tuần."},{"type":"fix","bad":"Please reply my email and answer to my question.","ans":"Please reply to my email and answer my question.","why":"Đúng là ngược lại với trực giác: reply CÓ to, answer KHÔNG có to."},{"type":"order","ans":"I will look into it and get back to you.","hint":"Tôi sẽ xem xét rồi phản hồi lại bạn.","ansTokens":["I","will","look","into","it","and","get","back","to","you"],"chips":["back","I","it","into","get","to","and","you","look","will"]},{"type":"order","ans":"It depends on the final scope.","hint":"Cái đó tuỳ vào phạm vi cuối cùng.","ansTokens":["it","depends","on","the","final","scope"],"chips":["scope","the","on","depends","it","final"]}]},{"id":"g3","n":3,"t":"Tính từ và danh từ + giới từ: same as, different from, responsible for","one":"Ba cụm này xuất hiện trong mọi cuộc thảo luận kỹ thuật, và cả ba đều bị người Việt dùng sai theo cùng một cách: mượn giới từ của tiếng Việt.","frame":"the same AS · different FROM · similar TO · responsible FOR · aware OF · familiar WITH · dependent ON · interested IN · good AT · compatible WITH · an impact ON · a reason FOR · access TO · a solution TO · an increase IN","note":"Người Việt hay nói same with và different with vì tiếng Việt dùng giống với và khác với. Tiếng Anh thì the same as và different from. Ngoài ra chú ý cặp responsible for (chịu trách nhiệm về việc gì) và report to (báo cáo cho ai) — hai cụm bạn cần trong mọi buổi giới thiệu bản thân.","ex":[{"en":"This behaviour is the same as on staging.","vi":"Hành vi này giống như trên staging.","n":"the same as, không bao giờ the same with."},{"en":"The mobile flow is different from the desktop one.","vi":"Luồng mobile khác với luồng desktop.","n":"different from. Dạng different than tồn tại trong tiếng Anh Mỹ nói, nhưng from là an toàn nhất trong văn viết."},{"en":"I'm responsible for the admin portal.","vi":"Tôi phụ trách phần admin portal.","n":"responsible for + việc. Nếu là người thì responsible for a team of five."},{"en":"Are you familiar with TanStack Query?","vi":"Bạn có quen với TanStack Query không?","n":"familiar with một công nghệ. Câu hỏi phỏng vấn cực kỳ phổ biến."},{"en":"This change has a big impact on load time.","vi":"Thay đổi này ảnh hưởng lớn tới thời gian tải.","n":"an impact on. Không phải impact to."},{"en":"We don't have access to the production database.","vi":"Bên mình không có quyền truy cập database production.","n":"access to. Đây là câu bạn sẽ nói rất nhiều khi bị chặn."}],"fix":[{"bad":"The result is same with the old version.","good":"The result is the same as the old version.","why":"Hai lỗi: thiếu the trước same, và with phải là as. Cụm đầy đủ luôn là the same as."},{"bad":"This API is different with the one in the docs.","good":"This API is different from the one in the docs.","why":"different from. Tiếng Việt nói khác với nên tay bạn tự gõ with — đây là loại lỗi chỉ sửa được bằng cách lặp lại cụm đúng nhiều lần."},{"bad":"Who is responsible of this module? I am not aware about the change.","good":"Who is responsible for this module? I wasn't aware of the change.","why":"responsible for và aware of. Hai cụm này bạn sẽ dùng trong mọi cuộc điều tra sự cố."}],"drills":[{"type":"pick","q":"Điền: The staging config is the same ___ production.","o":["with","as","to","like"],"a":1,"e":"the same as. Cụm cố định, không có biến thể trong văn viết công việc."},{"type":"pick","q":"Điền: Our approach is quite different ___ theirs.","o":["with","of","from","to"],"a":2,"e":"different from là dạng an toàn nhất. different to gặp trong tiếng Anh Anh, different than trong tiếng Anh Mỹ nói."},{"type":"pick","q":"Điền: I'm responsible ___ the frontend and I report ___ the tech lead.","o":["of … to","for … to","for … for","to … for"],"a":1,"e":"responsible for một phạm vi công việc, report to một người."},{"type":"pick","q":"Điền: Are you familiar ___ this codebase?","o":["to","with","about","of"],"a":1,"e":"familiar with. Dạng familiar to có tồn tại nhưng đảo vai: This name is familiar to me."},{"type":"pick","q":"Điền: This will have a real impact ___ performance.","o":["to","for","on","in"],"a":2,"e":"an impact on. Cùng nhóm: an effect on, an influence on."},{"type":"pick","q":"Điền: We still don't have access ___ the logs.","o":["on","to","for","of"],"a":1,"e":"access to. Câu này bạn sẽ dùng mỗi lần bị chặn vì quyền."},{"type":"fix","bad":"This bug is similar with the one we fixed last week.","ans":"This bug is similar to the one we fixed last week.","why":"similar to. Nhớ theo cặp: similar TO nhưng the same AS."},{"type":"fix","bad":"I was not aware about this requirement.","ans":"I wasn't aware of this requirement.","why":"aware of. Đây là câu rất hữu dụng khi bạn cần nói một cách lịch sự rằng chưa ai thông báo cho bạn."},{"type":"fix","bad":"What is the reason of the delay?","ans":"What's the reason for the delay?","why":"a reason for. Cách nói tự nhiên hơn nữa: What's causing the delay?"},{"type":"order","ans":"I am responsible for the admin portal.","hint":"Tôi phụ trách phần admin portal.","ansTokens":["I","am","responsible","for","the","admin","portal"],"chips":["for","portal","responsible","I","the","admin","am"]},{"type":"order","ans":"This is different from the old version.","hint":"Cái này khác với bản cũ.","ansTokens":["this","is","different","from","the","old","version"],"chips":["from","is","version","the","different","this","old"]}]}]},{"id":"time","ab":"T","t":"Thời gian & thì","sub":"Không phải 12 thì — chỉ ba quyết định thật sự dùng ở công ty.","units":[{"id":"t1","n":1,"t":"Hiện tại: vai trò, việc đang làm, và sự thật","one":"Bạn không cần 12 thì. Ở hiện tại bạn chỉ cần một quyết định duy nhất: đây là điều tôi luôn làm, hay điều tôi đang làm tuần này?","frame":"I work on X = vai trò lâu dài, mô tả bản thân · I'm working on X = việc tạm thời, tuần này, sprint này · Lịch cố định dùng hiện tại đơn: The demo starts at 10.","note":"Nhóm động từ trạng thái không dùng dạng đang: know, understand, need, want, mean, agree, remember, prefer, depend, own, seem. Nói I'm not understanding là dấu hiệu rõ nhất của người học tiếng Anh — phải là I don't understand. Ngoại lệ đã thành thói quen: I'm loving this và I'm thinking about it đều được chấp nhận.","ex":[{"en":"I work on the admin portal.","vi":"Tôi làm ở phần admin portal.","n":"Vai trò lâu dài. Đây là câu bạn dùng khi tự giới thiệu."},{"en":"This week I'm working on the reporting page.","vi":"Tuần này tôi đang làm trang báo cáo.","n":"Việc tạm thời. Đây là câu bạn dùng trong standup."},{"en":"The demo starts at 10 and runs for thirty minutes.","vi":"Buổi demo bắt đầu 10 giờ và kéo dài 30 phút.","n":"Lịch cố định dùng hiện tại đơn, dù nói về tương lai."},{"en":"I don't understand what the client wants here.","vi":"Tôi không hiểu ở đây khách muốn gì.","n":"understand là động từ trạng thái, không có dạng am understanding."},{"en":"The build takes about eight minutes.","vi":"Bản build mất khoảng tám phút.","n":"Sự thật ổn định về hệ thống dùng hiện tại đơn."},{"en":"We're using Tailwind on this project, but we usually use CSS modules.","vi":"Dự án này bên mình đang dùng Tailwind, nhưng thường thì dùng CSS modules.","n":"Một câu chứa cả hai thì, và đó là cách chúng thật sự làm việc cùng nhau."}],"fix":[{"bad":"I am working here since 2023.","good":"I've been working here since 2023.","why":"Một hành động bắt đầu trong quá khứ và còn tiếp tục tới bây giờ thì cần hiện tại hoàn thành tiếp diễn. Hiện tại tiếp diễn chỉ nói về lúc này hoặc giai đoạn ngắn hiện tại."},{"bad":"Sorry, I am not understanding your question.","good":"Sorry, I don't understand the question. Could you rephrase it?","why":"understand không dùng dạng tiếp diễn. Đây là lỗi rất dễ nhận ra và rất dễ sửa vĩnh viễn."},{"bad":"Every sprint I am fixing about ten bugs.","good":"Every sprint I fix about ten bugs.","why":"Có every sprint tức là việc lặp lại thường xuyên, nên dùng hiện tại đơn."}],"drills":[{"type":"pick","q":"Trong standup, bạn muốn nói việc mình đang làm hôm nay. Chọn câu đúng.","o":["Today I work on the search filter.","Today I'm working on the search filter.","Today I have worked on the search filter.","Today I working on the search filter."],"a":1,"e":"Việc của hôm nay là tạm thời nên dùng hiện tại tiếp diễn. Dạng I work on dành cho vai trò lâu dài."},{"type":"pick","q":"Trong phỏng vấn, bạn mô tả công việc chính của mình. Chọn câu đúng.","o":["I am working on admin portals in React.","I work on admin portals in React.","I have worked on admin portals in React right now.","I working on admin portals in React."],"a":1,"e":"Đây là vai trò lâu dài, đặc trưng của bạn, nên dùng hiện tại đơn."},{"type":"pick","q":"Điền: I ___ what you mean, but I ___ with the approach.","o":["am understanding … am not agreeing","understand … don't agree","understand … am not agreeing","am understanding … don't agree"],"a":1,"e":"Cả understand và agree đều là động từ trạng thái, không dùng dạng tiếp diễn."},{"type":"pick","q":"Điền: The retro ___ every second Friday.","o":["is happening","happens","happen","has happened"],"a":1,"e":"Lịch lặp lại đều đặn dùng hiện tại đơn."},{"type":"pick","q":"Điền: It ___ on how many users we expect.","o":["is depending","depends","depend","is depend"],"a":1,"e":"depend là động từ trạng thái nên không dùng tiếp diễn, và chủ ngữ it nên có s."},{"type":"fix","bad":"I am needing more information before I estimate.","ans":"I need more information before I estimate.","why":"need là động từ trạng thái. Cùng nhóm: want, know, mean, prefer, own."},{"type":"fix","bad":"Normally I am reviewing PRs in the morning.","ans":"Normally I review PRs in the morning.","why":"normally báo hiệu thói quen, nên dùng hiện tại đơn."},{"type":"fix","bad":"I work on this bug right now, it takes longer than I thought.","ans":"I'm working on this bug right now — it's taking longer than I thought.","why":"right now buộc phải dùng tiếp diễn. Và take ở đây mô tả tình trạng đang diễn ra nên cũng là it's taking.","soft":true},{"type":"order","ans":"This week I am working on the reporting page.","hint":"Tuần này tôi đang làm trang báo cáo.","ansTokens":["this","week","I","am","working","on","the","reporting","page"],"chips":["I","page","this","the","working","week","reporting","on","am"]},{"type":"order","ans":"I work on the admin portal.","hint":"Tôi làm ở phần admin portal.","ansTokens":["I","work","on","the","admin","portal"],"chips":["I","the","on","admin","work","portal"]},{"type":"transform","prompt":"Đổi sang câu nói về việc tạm thời tuần này: I fix bugs in the payment module.","ans":"I'm fixing bugs in the payment module this week.","alt":["i am fixing bugs in the payment module this week","i'm fixing bugs in the payment module"],"why":"Chuyển sang hiện tại tiếp diễn để báo hiệu đây là việc của giai đoạn hiện tại chứ không phải vai trò lâu dài."}]},{"id":"t2","n":2,"t":"Quá khứ đơn và hiện tại hoàn thành: quyết định quan trọng nhất trong standup","one":"Câu hỏi để chọn rất đơn giản: bạn có nêu mốc thời gian không? Có mốc thì quá khứ đơn. Không mốc, chỉ quan tâm kết quả bây giờ, thì hiện tại hoàn thành.","frame":"QUÁ KHỨ ĐƠN + mốc đã đóng: yesterday, last sprint, at 3pm, on Monday · HIỆN TẠI HOÀN THÀNH + không mốc, kết quả còn giá trị: already, just, yet, so far, this week (chưa hết) · HAVE BEEN V-ING = vẫn đang tiếp tục","note":"Luật sắt: đã nêu mốc quá khứ cụ thể thì KHÔNG được dùng hiện tại hoàn thành. I have finished it yesterday là sai, phải là I finished it yesterday. Ngược lại I have already finished it là đúng vì already không phải mốc. Trong standup, hiện tại hoàn thành là thì hữu dụng nhất vì bạn đang báo trạng thái hiện tại: I've pushed the fix, I haven't started the tests yet.","ex":[{"en":"I pushed the fix yesterday afternoon.","vi":"Tôi push bản sửa chiều hôm qua.","n":"Có mốc yesterday nên quá khứ đơn."},{"en":"I've already pushed the fix.","vi":"Tôi đã push bản sửa rồi.","n":"Không mốc, nhấn kết quả hiện tại nên hiện tại hoàn thành."},{"en":"I haven't started the tests yet.","vi":"Tôi chưa bắt đầu phần test.","n":"yet luôn đi với hiện tại hoàn thành. Đây là câu bạn dùng mỗi ngày trong standup."},{"en":"I've been looking into it since this morning.","vi":"Tôi xem xét nó từ sáng tới giờ.","n":"Vẫn đang tiếp tục, và nhấn vào khoảng thời gian đã bỏ ra."},{"en":"We've fixed three bugs so far this sprint.","vi":"Sprint này bên mình sửa được ba lỗi tính tới giờ.","n":"so far và this sprint (chưa kết thúc) đều gọi hiện tại hoàn thành."},{"en":"The client approved it last week, so we started on Monday.","vi":"Khách duyệt tuần trước, nên bên mình bắt đầu từ thứ Hai.","n":"Cả hai đều có mốc đã đóng nên cả hai đều là quá khứ đơn."}],"fix":[{"bad":"I have finished the migration yesterday.","good":"I finished the migration yesterday.","why":"Có mốc quá khứ cụ thể thì bắt buộc dùng quá khứ đơn. Đây là lỗi phổ biến nhất của người Việt với hai thì này, và nó xuất hiện ngay trong câu đầu tiên của standup."},{"bad":"I already push it, but the tests didn't pass yet.","good":"I've already pushed it, but the tests haven't passed yet.","why":"already và yet đều là tín hiệu của hiện tại hoàn thành. Ngoài ra push phải thành pushed — thiếu đuôi -ed là lỗi phát âm rồi thành lỗi ngữ pháp."},{"bad":"How long do you work on this ticket?","good":"How long have you been working on this ticket?","why":"Hỏi về khoảng thời gian từ quá khứ tới hiện tại thì cần hiện tại hoàn thành tiếp diễn. Câu sai kia mang nghĩa hoàn toàn khác: bạn làm ticket này bao lâu mỗi lần."}],"drills":[{"type":"pick","q":"Standup: bạn đã push bản sửa, không nói thời điểm. Chọn câu đúng.","o":["I push the fix.","I have pushed the fix.","I have pushed the fix yesterday.","I am pushing the fix yesterday."],"a":1,"e":"Không nêu mốc và nhấn kết quả hiện tại nên hiện tại hoàn thành."},{"type":"pick","q":"Điền: I ___ the bug on Monday, but it ___ back this morning.","o":["have fixed … has come","fixed … came","fixed … has come","have fixed … came"],"a":1,"e":"Cả hai đều có mốc đã đóng (on Monday, this morning trong ngữ cảnh đã qua) nên cả hai là quá khứ đơn."},{"type":"pick","q":"Điền: ___ you ___ the design yet?","o":["Did … see","Have … seen","Have … see","Did … seen"],"a":1,"e":"yet là tín hiệu của hiện tại hoàn thành, và sau have phải là dạng V3: seen."},{"type":"pick","q":"Điền: We ___ two releases so far this quarter.","o":["did","have done","are doing","do"],"a":1,"e":"so far và this quarter chưa kết thúc đều gọi hiện tại hoàn thành."},{"type":"pick","q":"Điền: I ___ on this for three hours and I still can't reproduce it.","o":["work","worked","have been working","am working"],"a":2,"e":"Khoảng thời gian kéo dài tới hiện tại và vẫn tiếp tục nên dùng hiện tại hoàn thành tiếp diễn."},{"type":"pick","q":"Điền: The API ___ last night, so I ___ start testing.","o":["has broken … can't","broke … couldn't","broke … can't","has broken … couldn't"],"a":1,"e":"last night là mốc đã đóng nên broke, và hệ quả trong quá khứ nên couldn't."},{"type":"fix","bad":"I have talked to the backend team on Tuesday.","ans":"I talked to the backend team on Tuesday.","why":"on Tuesday là mốc đã đóng nên phải dùng quá khứ đơn."},{"type":"fix","bad":"Did you finish it already? I don't receive the notification.","ans":"Have you finished it already? I haven't received the notification.","why":"already gọi hiện tại hoàn thành, và câu thứ hai đang nói về trạng thái hiện tại nên cũng dùng hiện tại hoàn thành phủ định.","soft":true},{"type":"fix","bad":"I am working on this since Monday and I not finish yet.","ans":"I've been working on this since Monday and I haven't finished yet.","why":"since + hiện tại hoàn thành tiếp diễn, và yet + hiện tại hoàn thành phủ định. Đây là hai mẫu bạn sẽ dùng nhiều nhất khi báo cáo tiến độ.","soft":true},{"type":"order","ans":"I have not started the tests yet.","hint":"Tôi chưa bắt đầu phần test.","ansTokens":["I","have","not","started","the","tests","yet"],"chips":["started","yet","have","the","I","tests","not"]},{"type":"order","ans":"I pushed the fix yesterday afternoon.","hint":"Tôi push bản sửa chiều hôm qua.","ansTokens":["I","pushed","the","fix","yesterday","afternoon"],"chips":["I","fix","yesterday","afternoon","pushed","the"]},{"type":"transform","prompt":"Bỏ mốc thời gian và chuyển sang thì phù hợp: I fixed it this morning. → nhấn kết quả hiện tại, không nêu lúc nào","ans":"I've fixed it.","alt":["i have fixed it","i've already fixed it","i have already fixed it"],"why":"Bỏ mốc đi thì hiện tại hoàn thành trở thành lựa chọn đúng, và nó nhấn vào điều người nghe quan tâm: bây giờ nó đã xong."}]},{"id":"t3","n":3,"t":"Tương lai và cam kết: will, going to, hay đang lên lịch","one":"Ba cách nói tương lai không thay thế được nhau, và người nghe đọc ra mức cam kết khác nhau từ mỗi cách. Chọn sai là hứa nhiều hơn hoặc ít hơn ý bạn.","frame":"will = quyết ngay lúc nói, một lời hứa · be going to = kế hoạch đã có từ trước · hiện tại tiếp diễn = lịch đã chốt với người khác · might / could = có thể, chưa chắc · be about to = sắp làm ngay bây giờ","note":"Trong công việc, will là từ của cam kết: I'll send it by 5. Nếu bạn chưa chắc, đừng dùng will — hãy dùng I should be able to hoặc I'll probably. Và luôn nhớ sau will là động từ nguyên mẫu, không bao giờ có hai trợ động từ: không có I will can, phải là I'll be able to.","ex":[{"en":"I'll send it to you by 5.","vi":"Tôi sẽ gửi cho bạn trước 5 giờ.","n":"Cam kết rõ ràng, quyết ngay lúc nói. Chú ý send it TO you, không phải send you it."},{"en":"We're going to refactor the whole module next sprint.","vi":"Sprint tới bên mình sẽ refactor cả module.","n":"Kế hoạch đã bàn từ trước, chưa bắt đầu."},{"en":"I'm meeting the client at 4, so I'll be offline.","vi":"4 giờ tôi họp với khách nên sẽ offline.","n":"Lịch đã chốt với người khác dùng hiện tại tiếp diễn; cam kết mới sinh ra dùng will."},{"en":"It might slip to Monday if the review takes long.","vi":"Có thể trễ sang thứ Hai nếu phần review lâu.","n":"might để báo trước rủi ro mà không cam kết. Rất hữu dụng và rất trung thực."},{"en":"I'll be able to look at it after lunch.","vi":"Sau bữa trưa tôi mới xem được.","n":"Không bao giờ nói will can. Dạng đúng là will be able to."},{"en":"I'm about to push — give me two minutes.","vi":"Tôi sắp push rồi — cho tôi hai phút.","n":"be about to cho việc xảy ra trong vài giây tới."}],"fix":[{"bad":"I will can finish it tomorrow.","good":"I'll be able to finish it tomorrow.","why":"Một câu chỉ có một trợ động từ. will và can không đứng cạnh nhau — thay can bằng be able to."},{"bad":"I will send you it tomorrow.","good":"I'll send it to you tomorrow.","why":"Khi cả hai tân ngữ đều là đại từ, tiếng Anh bắt buộc dạng send it to you. Không bao giờ send you it."},{"bad":"Maybe I will finish today, I will try my best.","good":"I should be able to finish today. If it slips, I'll tell you by 4.","why":"maybe + will là hai mức chắc chắn xung đột nhau, và I'll try my best không hứa gì cả. Bản sửa nêu một kỳ vọng rõ và một cam kết sẽ báo sớm nếu trượt."}],"drills":[{"type":"pick","q":"Khách hỏi khi nào có file. Bạn quyết định ngay lúc này là gửi trước 5 giờ. Chọn câu đúng.","o":["I'm going to send it by 5.","I'll send it by 5.","I send it by 5.","I will sending it by 5."],"a":1,"e":"Quyết định sinh ra ngay tại thời điểm nói thì dùng will. going to dành cho kế hoạch đã có từ trước."},{"type":"pick","q":"Điền: I ___ the client tomorrow at 3 — it's already in the calendar.","o":["will meet","am meeting","meet","would meet"],"a":1,"e":"Lịch đã chốt với người khác dùng hiện tại tiếp diễn. Đây là mẫu người bản ngữ dùng nhiều nhất khi nói về lịch."},{"type":"pick","q":"Điền: I ___ review it today, but I ___ tomorrow morning.","o":["won't can … will","can't … will be able to","will not can … can","don't can … will can"],"a":1,"e":"can't cho hiện tại, will be able to cho tương lai. Không bao giờ ghép will với can."},{"type":"pick","q":"Bạn không chắc chắn nhưng nghiêng về xong hôm nay. Chọn cách nói trung thực nhất.","o":["I will finish today.","I will try my best to finish today.","I should be able to finish today — I'll confirm by 3.","Maybe I finish today."],"a":2,"e":"should be able to truyền tải đúng mức chắc chắn, và câu cam kết thứ hai cho người nghe một mốc để trông đợi."},{"type":"pick","q":"Điền: We ___ migrate to React 19 next quarter — it's on the roadmap.","o":["will","are going to","are about to","might"],"a":1,"e":"Kế hoạch đã có sẵn trên roadmap nên going to. will nghe như bạn vừa nghĩ ra."},{"type":"pick","q":"Điền: Hold on, I ___ deploy right now.","o":["will","am going to","am about to","would"],"a":2,"e":"be about to cho việc xảy ra trong vài giây tới."},{"type":"fix","bad":"I will inform to you when it is ready.","ans":"I'll let you know when it's ready.","why":"inform không đi với to trước người, và trong công việc hằng ngày người ta nói let you know chứ ít dùng inform — nó nghe rất trang trọng."},{"type":"fix","bad":"If the API will be ready tomorrow, I will start testing.","ans":"If the API is ready tomorrow, I'll start testing.","why":"Sau if không dùng will, dù ý nghĩa là tương lai. Mệnh đề if dùng hiện tại đơn, mệnh đề chính dùng will."},{"type":"fix","bad":"I think it will be late maybe.","ans":"I think it might be late.","why":"Chọn một cách diễn đạt sự không chắc chắn. Chồng I think, will và maybe lên nhau khiến câu mất hết trọng lượng."},{"type":"order","ans":"I will send it to you by five.","hint":"Tôi sẽ gửi cho bạn trước 5 giờ.","ansTokens":["I","will","send","it","to","you","by","five"],"chips":["send","to","it","five","by","will","I","you"]},{"type":"order","ans":"It might slip to Monday.","hint":"Có thể trễ sang thứ Hai.","ansTokens":["it","might","slip","to","Monday"],"chips":["Monday","it","to","might","slip"]},{"type":"transform","prompt":"Làm cho trung thực hơn về mức chắc chắn: I will definitely finish by Thursday. → bạn khá chắc nhưng còn phụ thuộc phần review","ans":"I should be able to finish by Thursday, depending on the review.","alt":["i should be able to finish by thursday depending on the review","i should be able to finish by thursday, depending on the review"],"why":"should be able to nêu kỳ vọng, depending on nêu điều kiện. Cam kết vẫn rõ nhưng không tự đặt bẫy cho mình.","soft":true}]}]},{"id":"mod","ab":"M","t":"Modal & lịch sự","sub":"Thang lịch sự, phỏng đoán, và cách nói không.","units":[{"id":"m1","n":1,"t":"Thang lịch sự: cùng một yêu cầu, năm mức khác nhau","one":"Trong tiếng Việt bạn điều chỉnh mức lịch sự bằng ạ, nhé, giúp. Tiếng Anh điều chỉnh bằng động từ khuyết thiếu và bằng độ dài câu — càng dài càng lịch sự.","frame":"Send me the file. (ra lệnh) → Can you send me the file? (bình thường) → Could you send me the file? (lịch sự, mặc định ở công ty) → Would you mind sending me the file? (rất lịch sự) → I was wondering if you could send me the file. (trang trọng nhất)","note":"Mặc định an toàn ở công ty là could — nó lịch sự mà không nặng nề, dùng được với cả đồng nghiệp và cấp trên. Hai cái bẫy: sau would you mind luôn là V-ing, không phải nguyên mẫu; và please không tự làm câu lịch sự — Please send me the file vẫn là một câu ra lệnh, chỉ là ra lệnh có kèm chữ please.","ex":[{"en":"Could you take a look at this when you get a chance?","vi":"Khi nào rảnh bạn xem cái này giúp tôi nhé?","n":"Câu xin việc chuẩn mực nhất trong công việc. Cụm when you get a chance làm nó nhẹ thêm một bậc."},{"en":"Would you mind sending me the Figma link?","vi":"Bạn gửi tôi link Figma được không?","n":"Sau mind luôn là V-ing. Trả lời hơi ngược trực giác: Not at all nghĩa là đồng ý."},{"en":"I was wondering if you could review this before Friday.","vi":"Tôi muốn hỏi liệu bạn review giúp trước thứ Sáu được không.","n":"Dạng trang trọng nhất, dùng trong email với người bạn chưa quen."},{"en":"Would you like me to take that one?","vi":"Bạn có muốn tôi nhận việc đó không?","n":"Cách xung phong nhận việc nghe chuyên nghiệp. Không phải Do you want that I take it."},{"en":"Shall I set up a call with the backend team?","vi":"Tôi lập một cuộc gọi với team backend nhé?","n":"shall I dùng để đề nghị làm giúp. Nghe hơi trang trọng nhưng rất gọn."},{"en":"Feel free to ping me if anything breaks.","vi":"Có gì hỏng thì cứ nhắn tôi thoải mái.","n":"Cách mở cửa cho người khác liên hệ mà không nghe khách sáo."}],"fix":[{"bad":"Please you send me the report today.","good":"Could you send me the report today?","why":"Cấu trúc please you không tồn tại. Và please không tự làm câu lịch sự — could you mới làm được điều đó."},{"bad":"Would you mind to check this file?","good":"Would you mind checking this file?","why":"Sau mind luôn là V-ing. Đây là lỗi rất hay gặp vì tiếng Việt không có sự phân biệt này."},{"bad":"I want you to fix this before the demo.","good":"Could you fix this before the demo?","why":"I want you to nghe như một chỉ thị từ cấp trên. Với đồng nghiệp ngang hàng nó dễ gây khó chịu mà bạn không hề biết."}],"drills":[{"type":"pick","q":"Bạn nhắn cho một đồng nghiệp chưa từng làm việc cùng, xin họ review PR. Chọn câu phù hợp nhất.","o":["Review my PR please.","Can you review my PR?","Could you review my PR when you get a chance?","I want you to review my PR."],"a":2,"e":"could + when you get a chance vừa lịch sự vừa cho họ không gian về thời gian. Đây là mức mặc định nên dùng ở công ty."},{"type":"pick","q":"Điền: Would you mind ___ me the credentials?","o":["to send","sending","send","you send"],"a":1,"e":"Sau mind luôn là V-ing."},{"type":"pick","q":"Đồng nghiệp hỏi: Would you mind sharing your screen? Bạn đồng ý. Trả lời đúng là gì?","o":["Yes, I would mind.","Not at all.","Yes, of course I mind.","No, I don't want."],"a":1,"e":"Câu hỏi thật sự là bạn có thấy phiền không, nên đồng ý phải trả lời phủ định: Not at all hoặc No, not at all."},{"type":"pick","q":"Bạn muốn xung phong làm giúp một việc. Chọn câu tự nhiên nhất.","o":["Do you want that I do it?","Would you like me to take it?","You want I take it?","Should I to take it?"],"a":1,"e":"Would you like me to + nguyên mẫu là mẫu chuẩn. Hai câu kia là dịch từng chữ từ tiếng Việt."},{"type":"pick","q":"Điền: ___ I schedule the call for tomorrow?","o":["Shall","Will","Do","Am"],"a":0,"e":"shall I dùng khi đề nghị làm giúp. Cách khác cũng đúng: Should I schedule…?"},{"type":"fix","bad":"Can you please to send me the file?","ans":"Could you send me the file, please?","why":"Sau can/could là nguyên mẫu, không có to. Và please đặt cuối câu nghe tự nhiên hơn khi nói."},{"type":"fix","bad":"I need that you check this today.","ans":"Could you check this today? I need it before the demo.","why":"Cấu trúc I need that you không tồn tại trong tiếng Anh. Tách thành một câu xin và một câu nêu lý do sẽ tự nhiên và mạnh hơn."},{"type":"fix","bad":"Would you mind if I will leave early today?","ans":"Would you mind if I left early today?","why":"Sau would you mind if dùng quá khứ đơn dù nói về hiện tại hoặc tương lai. Đây là dạng lịch sự cố định."},{"type":"order","ans":"Could you take a look when you get a chance?","hint":"Khi nào rảnh bạn xem giúp nhé?","ansTokens":["could","you","take","a","look","when","you","get","a","chance"],"chips":["chance","look","take","a","could","a","you","you","when","get"]},{"type":"order","ans":"Would you like me to set up a call?","hint":"Bạn có muốn tôi lập một cuộc gọi không?","ansTokens":["would","you","like","me","to","set","up","a","call"],"chips":["up","you","to","would","call","set","me","like","a"]},{"type":"reply","q":"Could you take over the reporting page? I'm swamped this week.","models":["Sure, I can take it. Just send me whatever you have so far.","I could, but not before Wednesday — I'm finishing the login flow first.","I'd rather not take the whole thing, but I can review it if you keep the build."],"why":"Ba mức: nhận, nhận có điều kiện, và từ chối một phần bằng I'd rather not. Cả ba đều rõ ràng và không ai bị bỏ lửng."}]},{"id":"m2","n":2,"t":"Phỏng đoán: must, should, might, can't","one":"Khi debug, bạn liên tục phải nói mức độ chắc chắn của mình. Dùng sai modal là hoặc nghe quá tự tin rồi sai, hoặc nghe do dự khi bạn thật ra đã biết.","frame":"It must be X = tôi suy ra chắc chắn · It should be X = tôi kỳ vọng đúng theo lẽ thường · It might / could be X = có thể, chưa chắc · It can't be X = không thể nào, tôi đã loại trừ","note":"Chú ý must ở đây không mang nghĩa bắt buộc mà mang nghĩa suy luận: It must be a cache issue nghĩa là dựa vào bằng chứng tôi kết luận đó là cache. Và cặp đối lập của must be là can't be, không phải mustn't be — mustn't be mang nghĩa không được phép.","ex":[{"en":"It must be a caching issue — the response is identical every time.","vi":"Chắc chắn là vấn đề cache — response giống nhau y hệt mỗi lần.","n":"must + bằng chứng. Nêu bằng chứng ngay sau đó làm câu của bạn đáng tin."},{"en":"It should be fixed in the next release.","vi":"Chuyện đó lẽ ra sẽ được sửa ở bản release tới.","n":"should = kỳ vọng theo lẽ thường, không phải cam kết chắc chắn."},{"en":"That might be the root cause, but I'd want to check the logs.","vi":"Đó có thể là nguyên nhân gốc, nhưng tôi muốn xem log đã.","n":"might + một bước xác nhận là cách nói chuyên nghiệp nhất khi đang đoán."},{"en":"It can't be the API — the logs are completely clean.","vi":"Không thể là API — log hoàn toàn sạch.","n":"can't be để loại trừ một khả năng. Không dùng mustn't be ở đây."},{"en":"It may take longer than we estimated.","vi":"Có thể sẽ lâu hơn mình ước lượng.","n":"may và might gần như thay thế được nhau; may trang trọng hơn một chút."},{"en":"He must have pushed it to the wrong branch.","vi":"Chắc là anh ấy push sai nhánh rồi.","n":"must have + V3 để suy luận về một việc đã xảy ra."}],"fix":[{"bad":"Maybe it can be a problem with the cache.","good":"It might be a problem with the cache.","why":"maybe và can chồng nghĩa lên nhau, và can ở đây không mang nghĩa có thể xảy ra. Dùng might hoặc could."},{"bad":"It must to be the database.","good":"It must be the database.","why":"Sau mọi động từ khuyết thiếu là nguyên mẫu không có to: must be, should be, might be, can be."},{"bad":"It mustn't be the API, the logs are clean.","good":"It can't be the API — the logs are clean.","why":"mustn't nghĩa là không được phép, hoàn toàn khác. Để loại trừ một khả năng, dạng đúng là can't be."}],"drills":[{"type":"pick","q":"Bạn đã loại trừ hoàn toàn khả năng lỗi ở API. Chọn câu đúng.","o":["It mustn't be the API.","It can't be the API.","It shouldn't be the API.","It doesn't must be the API."],"a":1,"e":"can't be là dạng phủ định của suy luận chắc chắn. mustn't be nghĩa là không được phép."},{"type":"pick","q":"Bạn khá chắc dựa vào bằng chứng rõ ràng. Chọn câu đúng.","o":["It can be a race condition.","It might be a race condition.","It must be a race condition.","It should be a race condition."],"a":2,"e":"must be dùng khi bạn suy ra kết luận từ bằng chứng. might be dùng khi mới chỉ là một khả năng."},{"type":"pick","q":"Điền: The fix ___ be in production by now, but let me verify.","o":["must","should","can","might not"],"a":1,"e":"should be = theo lẽ thường thì đã xong, nhưng tôi chưa kiểm tra. Chính xác cho tình huống này."},{"type":"pick","q":"Điền: He ___ forgotten to run the migration.","o":["must have","must has","must had","must be"],"a":0,"e":"must have + V3 để suy luận về việc đã xảy ra trong quá khứ."},{"type":"pick","q":"Điền: This ___ take two days, or it ___ take a week — I need to scope it first.","o":["must … must","could … could","can … can","should … should"],"a":1,"e":"could dùng khi có nhiều khả năng ngang nhau. Đây là cách nói estimate trung thực khi bạn chưa scope."},{"type":"fix","bad":"Maybe the problem could be maybe in the config.","ans":"The problem might be in the config.","why":"Ba lớp phòng bị chồng lên nhau. Chọn một: might, could, hoặc maybe — không dùng cả ba."},{"type":"fix","bad":"It must to be a timezone issue.","ans":"It must be a timezone issue.","why":"Sau động từ khuyết thiếu không bao giờ có to."},{"type":"fix","bad":"I think it can be the cache, but I am not sure.","ans":"It could be the cache, but I'm not sure yet.","why":"can không dùng để nói về một khả năng cụ thể đang xảy ra. Dùng could hoặc might."},{"type":"order","ans":"It must be a caching issue.","hint":"Chắc chắn là vấn đề cache.","ansTokens":["it","must","be","a","caching","issue"],"chips":["must","caching","be","it","issue","a"]},{"type":"order","ans":"That might be the root cause.","hint":"Đó có thể là nguyên nhân gốc.","ansTokens":["that","might","be","the","root","cause"],"chips":["be","root","the","that","cause","might"]},{"type":"reply","q":"Any idea why the numbers on the dashboard don't match the database?","models":["It could be a timezone issue — the dashboard might be aggregating in UTC.","It must be the caching layer. The numbers are stale by exactly one hour.","I'm not sure yet. Give me an hour and I'll come back with a cause, not a guess."],"why":"Mỗi câu chọn một mức chắc chắn khác nhau và tất cả đều trung thực. Câu thứ ba là câu bạn nên dùng khi thật sự chưa biết."}]},{"id":"m3","n":3,"t":"Bắt buộc, khuyên, và nói không mà không nói chữ no","one":"Cách từ chối hiệu quả nhất trong công việc không phải là nói không, mà là nêu cái giá. Ngữ pháp cho việc đó là điều kiện và need to.","frame":"have to / need to = bắt buộc từ hoàn cảnh · must = bắt buộc mạnh, hiếm dùng khi nói · should = khuyên · had better = cảnh báo · don't have to = không cần · mustn't = không được phép","note":"Cặp dễ nhầm nhất: don't have to nghĩa là bạn không cần, còn mustn't nghĩa là bạn không được. Hai câu này gần như trái ngược nhau. Về từ chối: thay vì No, I can't, hãy dùng công thức I can do X, but then Y will move — nêu sự đánh đổi và để người kia chọn. Đó là cách bảo vệ phạm vi công việc mà không tạo xung đột.","ex":[{"en":"We need to freeze the code before we can test properly.","vi":"Mình cần dừng code lại mới test được đàng hoàng.","n":"need to nghe hợp tác hơn must rất nhiều, dù nghĩa gần như nhau."},{"en":"I can take this on, but then the reports will move to next sprint.","vi":"Tôi nhận việc này được, nhưng phần báo cáo sẽ dời sang sprint sau.","n":"Công thức nói không hiệu quả nhất: nhận việc kèm cái giá, để người kia quyết."},{"en":"You don't have to review the whole thing — just the API layer.","vi":"Bạn không cần review hết — chỉ phần API là được.","n":"don't have to = không cần thiết. Nghe rất nhẹ và tiết kiệm thời gian cho người khác."},{"en":"We shouldn't ship this on a Friday afternoon.","vi":"Mình không nên release vào chiều thứ Sáu.","n":"shouldn't để phản đối mà vẫn để cửa cho thảo luận."},{"en":"We'd better tell the client before they find out.","vi":"Mình nên nói với khách trước khi họ tự phát hiện.","n":"had better mang sắc thái cảnh báo, mạnh hơn should."},{"en":"For me to hit Thursday, I'd need the designs by tomorrow.","vi":"Để tôi kịp thứ Năm thì tôi cần design trước ngày mai.","n":"Đổi một lời từ chối thành một điều kiện. Đây là câu đáng học thuộc."}],"fix":[{"bad":"I must to finish this today.","good":"I have to finish this today.","why":"Sau must không có to, nhưng quan trọng hơn: trong tiếng Anh nói hằng ngày, have to và need to phổ biến hơn must rất nhiều. must nghe khá nặng và trang trọng."},{"bad":"You don't must change that file.","good":"You mustn't change that file — or better: you shouldn't need to change that file.","why":"Cấu trúc don't must không tồn tại. Và nếu ý bạn là không cần thì phải nói don't have to, vì mustn't nghĩa là không được phép."},{"bad":"No, I can't do it. I have too many tasks.","good":"I can do it, but the reports would have to move to next sprint. Which one matters more this week?","why":"Bản sửa không hề nói không, nhưng đạt cùng kết quả và đẩy quyết định về phía người có quyền ưu tiên. Đây là kỹ năng, không chỉ là ngữ pháp."}],"drills":[{"type":"pick","q":"Bạn muốn nói rằng đồng nghiệp KHÔNG CẦN làm phần test. Chọn câu đúng.","o":["You mustn't write the tests.","You don't have to write the tests.","You shouldn't write the tests.","You can't write the tests."],"a":1,"e":"don't have to = không cần thiết. mustn't = không được phép, nghĩa hoàn toàn khác."},{"type":"pick","q":"Bạn muốn nói rằng tuyệt đối KHÔNG ĐƯỢC chỉnh file production. Chọn câu đúng.","o":["You don't have to edit that file.","You mustn't edit that file.","You shouldn't have to edit that file.","You needn't edit that file."],"a":1,"e":"mustn't = cấm. Đây là một trong rất ít trường hợp must thật sự phù hợp trong công việc."},{"type":"pick","q":"Bạn bị giao thêm việc nhưng đã full. Chọn cách trả lời hiệu quả nhất.","o":["No, I can't. I'm too busy.","I'll try my best.","I can take it, but the reports would move to next sprint. Which is more important?","Maybe, I don't know."],"a":2,"e":"Nêu sự đánh đổi rồi đẩy quyết định về người có quyền ưu tiên. Bạn không nói không, nhưng cũng không nhận thêm việc mà không có gì đổi lại."},{"type":"pick","q":"Điền: We ___ tell the client today — they'll see the outage report tomorrow.","o":["had better","must to","don't have to","might"],"a":0,"e":"had better mang sắc thái cảnh báo về hậu quả nếu không làm. Rất phù hợp ở đây."},{"type":"pick","q":"Điền: To hit Thursday, I ___ the final copy by tomorrow.","o":["will need","would need","need to","must to"],"a":1,"e":"Dạng điều kiện would need biến lời từ chối thành một điều kiện, nghe hợp tác hơn nhiều."},{"type":"fix","bad":"I must to join the call at 3.","ans":"I have to join the call at 3.","why":"Sau must không có to, và have to là dạng tự nhiên hơn trong hội thoại hằng ngày."},{"type":"fix","bad":"You must not to worry about the tests, I did them.","ans":"You don't have to worry about the tests — I've done them.","why":"Ý bạn là không cần, nên dùng don't have to. Và vì kết quả còn giá trị bây giờ nên I've done them.","soft":true},{"type":"fix","bad":"I think we should to discuss about this with the client first.","ans":"I think we should discuss this with the client first.","why":"Ba lỗi trong một câu ngắn: should không có to, discuss không có about. Đây là câu bạn sẽ nói rất nhiều trong họp."},{"type":"order","ans":"You do not have to review the whole thing.","hint":"Bạn không cần review hết.","ansTokens":["you","do","not","have","to","review","the","whole","thing"],"chips":["have","the","you","to","do","thing","review","whole","not"]},{"type":"order","ans":"We need to freeze the code first.","hint":"Mình cần dừng code lại trước đã.","ansTokens":["we","need","to","freeze","the","code","first"],"chips":["to","the","freeze","need","we","code","first"]},{"type":"reply","q":"Can you also pick up the export feature this sprint?","models":["I can, but then the reporting page moves to next sprint. Which one do you want first?","Not this sprint — I'm already at capacity. I could start it Monday.","I could do a basic version this sprint and the full one next. Would that work?"],"why":"Không câu nào nói No một cách trần trụi, và cả ba đều bảo vệ được phạm vi công việc. Câu thứ ba là kỹ thuật cắt nhỏ phạm vi — hữu dụng nhất khi bạn không muốn từ chối hẳn."}]}]},{"id":"voc","ab":"W","t":"Từ vựng lõi","sub":"24 động từ, phrasal verb dễ nhầm, câu dẫn đường.","units":[{"id":"w1","n":1,"t":"Hai mươi bốn động từ làm tám mươi phần trăm công việc","one":"Người bản ngữ trong team kỹ thuật không dùng từ vựng rộng — họ dùng một bộ động từ nhỏ, rất chính xác, lặp lại mỗi ngày. Học đúng bộ này nghe tự nhiên hơn học một nghìn từ ngẫu nhiên.","frame":"ship · roll out · roll back · deploy · revert · spin up · scope · park · flag · loop in · circle back · follow up · sync · align · unblock · hand off · break down · pick up · take over · walk through · dig into · reach out · escalate · deprecate","note":"Chú ý bốn cặp dễ nhầm: roll out (tung ra dần dần) và roll back (quay lại bản trước); pick up (bắt đầu nhận một việc chưa ai làm) và take over (nhận lại việc từ tay người khác); flag (nêu ra để mọi người chú ý) và escalate (đẩy lên cấp cao hơn); walk through (dẫn ai đó đi qua từng bước) và dig into (tự mình đào sâu vào).","ex":[{"en":"We're shipping on Friday, so let's freeze the code Thursday.","vi":"Thứ Sáu bên mình release, nên thứ Năm chốt code.","n":"ship là động từ phổ biến nhất cho việc phát hành. Ngắn hơn và tự nhiên hơn release."},{"en":"Let's park that for now and circle back next week.","vi":"Tạm gác cái đó lại, tuần sau mình quay lại.","n":"Hai cụm cứu bạn khỏi một cuộc họp bị lạc đề. park = gác lại, circle back = quay lại sau."},{"en":"I'll loop in the backend team on this thread.","vi":"Tôi sẽ kéo team backend vào luồng này.","n":"loop in = thêm ai vào cuộc trao đổi. Nghe chuyên nghiệp hơn add."},{"en":"Can you walk me through how the auth flow works?","vi":"Bạn dẫn tôi đi qua luồng auth hoạt động thế nào được không?","n":"Câu xin giải thích tốt nhất: nó ngụ ý bạn muốn hiểu từng bước, không phải một câu trả lời ngắn."},{"en":"I want to flag a risk before we commit to Thursday.","vi":"Tôi muốn nêu một rủi ro trước khi mình chốt thứ Năm.","n":"flag a risk là cách nêu vấn đề mà không nghe như đang phàn nàn."},{"en":"Let's break this down into two tickets so we can pick them up in parallel.","vi":"Mình chia việc này thành hai ticket để làm song song.","n":"break down + pick up trong cùng một câu, mẫu rất hay gặp khi chia việc."}],"fix":[{"bad":"We will do the deploy to production tomorrow and if problem we will do back.","good":"We're deploying to production tomorrow, and if anything breaks we'll roll back.","why":"do the deploy nghe rất lạ vì deploy tự nó đã là động từ. Và cụm quay lại bản trước có một từ chuyên dụng: roll back."},{"bad":"I will take this task, nobody is doing it.","good":"I'll pick this one up — nobody's on it yet.","why":"take a task không sai nhưng pick up là cách người bản ngữ nói khi nhận một việc chưa ai làm. Dùng take over thì hàm ý bạn nhận lại từ tay người khác."},{"bad":"I want to say this problem to my manager.","good":"I'd like to escalate this to my manager.","why":"say a problem to somebody không phải cách nói tiếng Anh. escalate là động từ chuyên dụng ch
