<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>shadcn Dashboard — Capstone</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #09090b; --surface: #111113; --surface-2: #18181b; --border: #27272a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --text: #fafafa; --text-muted: #a1a1aa; --text-subtle: #52525b;
      --primary: #6366f1; --radius: 8px;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 15px; line-height: 1.5; }
    body { padding: 1rem; max-width: 960px; margin-inline: auto; }
    h1 { font-size: 1.1rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 1rem; max-width: 64ch; }

    .toolbar { display: flex; gap: 0.5rem; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; }
    .btn { font-family: inherit; font-weight: 500; font-size: 0.82rem; cursor: pointer; display: inline-flex; align-items: center; gap: 0.45rem; height: 34px; padding: 0 0.8rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface-2); color: var(--text); transition: all 0.14s; }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn-primary:hover { background: #4f46e5; border-color: #4f46e5; color: #fff; }
    .kbd { font-size: 0.7rem; color: var(--text-subtle); border: 1px solid var(--border); border-radius: 4px; padding: 0 0.3rem; }
    .search-inp { flex: 1; min-width: 160px; font-family: inherit; height: 34px; padding: 0 0.7rem; border-radius: var(--radius); border: 1px solid var(--border); background: var(--surface); color: var(--text); font-size: 0.82rem; outline: none; }
    .search-inp:focus { border-color: var(--accent); }

    /* stats cards */
    .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1rem; }
    @media (max-width: 560px) { .stats { grid-template-columns: 1fr; } }
    .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 0.9rem; }
    .stat .l { font-size: 0.72rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .stat .v { font-size: 1.3rem; font-weight: 600; margin-top: 0.2rem; }
    .stat .d { font-size: 0.72rem; color: var(--green); margin-top: 0.15rem; }

    /* table */
    .table-wrap { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
    table { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    th { text-align: left; padding: 0.6rem 0.8rem; color: var(--text-muted); font-weight: 500; background: var(--surface-2); cursor: pointer; user-select: none; white-space: nowrap; }
    th:hover { color: var(--accent); }
    th .arr { color: var(--accent); }
    td { padding: 0.6rem 0.8rem; border-top: 1px solid var(--border); }
    tr:hover td { background: var(--surface); }
    .badge { font-size: 0.68rem; font-weight: 600; padding: 0.1rem 0.5rem; border-radius: 9999px; }
    .b-active { background: color-mix(in srgb, var(--green) 18%, transparent); color: var(--green); }
    .b-pending { background: color-mix(in srgb, var(--amber) 18%, transparent); color: var(--amber); }
    .b-churned { background: color-mix(in srgb, var(--red) 18%, transparent); color: var(--red); }
    .row-action { cursor: pointer; color: var(--text-subtle); }
    .row-action:hover { color: var(--accent); }

    /* command palette */
    .cmd-overlay { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-start; justify-content: center; padding-top: 12vh; z-index: 50; }
    .cmd-overlay.open { display: flex; }
    .cmd { width: min(480px, calc(100vw - 2rem)); background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; box-shadow: 0 24px 60px rgba(0,0,0,.6); }
    .cmd input { width: 100%; font-family: inherit; font-size: 0.9rem; padding: 0.9rem 1rem; background: transparent; border: none; border-bottom: 1px solid var(--border); color: var(--text); outline: none; }
    .cmd-list { max-height: 280px; overflow: auto; padding: 0.4rem; }
    .cmd-item { display: flex; justify-content: space-between; align-items: center; padding: 0.6rem 0.7rem; border-radius: 6px; cursor: pointer; font-size: 0.84rem; }
    .cmd-item.hl, .cmd-item:hover { background: color-mix(in srgb, var(--accent) 14%, var(--surface)); color: var(--accent); }
    .cmd-empty { padding: 1rem; color: var(--text-subtle); font-size: 0.82rem; text-align: center; }

    /* toast */
    .toasts { position: fixed; bottom: 1rem; right: 1rem; display: flex; flex-direction: column; gap: 0.5rem; z-index: 60; }
    .toast { background: var(--surface-2); border: 1px solid var(--border); border-left: 3px solid var(--green); border-radius: 8px; padding: 0.7rem 0.9rem; font-size: 0.82rem; min-width: 220px; animation: slideIn 0.25s ease; }
    .toast b { display: block; margin-bottom: 0.1rem; }
    @keyframes slideIn { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <h1>shadcn Dashboard — Capstone</h1>
  <p class="subtitle">
    Everything together: a sortable/filterable data table, a command palette (press <span class="kbd">⌘K</span> / <span class="kbd">Ctrl K</span>),
    and toasts — the pro patterns from Part 12.
  </p>

  <div class="stats">
    <div class="stat"><div class="l">MRR</div><div class="v">$48.2k</div><div class="d">+12.4% MoM</div></div>
    <div class="stat"><div class="l">Active users</div><div class="v">2,481</div><div class="d">+4.1% WoW</div></div>
    <div class="stat"><div class="l">Churn</div><div class="v">1.9%</div><div class="d" style="color:var(--green)">−0.3%</div></div>
  </div>

  <div class="toolbar">
    <input class="search-inp" id="search" placeholder="Filter customers…" />
    <button class="btn" id="open-cmd">Command <span class="kbd">⌘K</span></button>
    <button class="btn btn-primary" id="add-btn">+ Add customer</button>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="name">Customer</th>
          <th data-sort="plan">Plan</th>
          <th data-sort="mrr">MRR</th>
          <th data-sort="status">Status</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <!-- command palette -->
  <div class="cmd-overlay" id="cmd-overlay">
    <div class="cmd">
      <input id="cmd-input" placeholder="Type a command or search…" />
      <div class="cmd-list" id="cmd-list"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    (function () {
      var DATA = [
        { name: "Acme Inc.", plan: "Enterprise", mrr: 1200, status: "active" },
        { name: "Globex", plan: "Pro", mrr: 290, status: "active" },
        { name: "Initech", plan: "Free", mrr: 0, status: "pending" },
        { name: "Umbrella", plan: "Pro", mrr: 290, status: "churned" },
        { name: "Soylent", plan: "Enterprise", mrr: 980, status: "active" },
        { name: "Hooli", plan: "Pro", mrr: 290, status: "pending" },
        { name: "Stark Co", plan: "Enterprise", mrr: 1500, status: "active" }
      ];
      var sortKey = "mrr", sortDir = -1, filter = "";
      var tbody = document.getElementById("tbody");

      function badge(s) { return '<span class="badge b-' + s + '">' + s + '</span>'; }

      function renderTable() {
        var rows = DATA.filter(function (d) { return d.name.toLowerCase().indexOf(filter.toLowerCase()) >= 0; });
        rows.sort(function (a, b) {
          var x = a[sortKey], y = b[sortKey];
          if (typeof x === "string") return x.localeCompare(y) * sortDir;
          return (x - y) * sortDir;
        });
        tbody.innerHTML = rows.map(function (d) {
          return '<tr><td>' + d.name + '</td><td>' + d.plan + '</td><td>$' + d.mrr +
            '</td><td>' + badge(d.status) + '</td><td><span class="row-action" data-name="' + d.name + '">⋯</span></td></tr>';
        }).join("") || '<tr><td colspan="5" style="color:var(--text-subtle);text-align:center;padding:1rem;">No results</td></tr>';

        document.querySelectorAll("th[data-sort]").forEach(function (th) {
          var k = th.getAttribute("data-sort");
          th.innerHTML = th.textContent.replace(/ [↑↓]$/, "") + (k === sortKey ? ' <span class="arr">' + (sortDir < 0 ? "↓" : "↑") + "</span>" : "");
        });
        document.querySelectorAll(".row-action").forEach(function (a) {
          a.addEventListener("click", function () { toast("Opened menu", a.getAttribute("data-name")); });
        });
      }

      document.querySelectorAll("th[data-sort]").forEach(function (th) {
        th.addEventListener("click", function () {
          var k = th.getAttribute("data-sort");
          if (k === sortKey) sortDir *= -1; else { sortKey = k; sortDir = 1; }
          renderTable();
        });
      });
      document.getElementById("search").addEventListener("input", function () { filter = this.value; renderTable(); });

      // toast
      function toast(title, desc) {
        var t = document.createElement("div");
        t.className = "toast";
        t.innerHTML = "<b>" + title + "</b>" + (desc ? '<span style="color:var(--text-muted)">' + desc + "</span>" : "");
        document.getElementById("toasts").appendChild(t);
        setTimeout(function () { t.style.transition = "opacity .3s"; t.style.opacity = "0"; setTimeout(function () { t.remove(); }, 300); }, 2600);
      }
      document.getElementById("add-btn").addEventListener("click", function () { toast("Customer added", "Draft saved"); });

      // command palette
      var CMDS = [
        { label: "Add customer", kbd: "A", run: function () { toast("Customer added", "via ⌘K"); } },
        { label: "Sort by MRR", kbd: "", run: function () { sortKey = "mrr"; sortDir = -1; renderTable(); toast("Sorted", "by MRR ↓"); } },
        { label: "Sort by name", kbd: "", run: function () { sortKey = "name"; sortDir = 1; renderTable(); toast("Sorted", "by name ↑"); } },
        { label: "Show only active", kbd: "", run: function () { filter = ""; document.getElementById("search").value = ""; toast("Filter", "all customers"); } },
        { label: "Export CSV", kbd: "E", run: function () { toast("Exporting…", "customers.csv"); } },
        { label: "Open settings", kbd: ",", run: function () { toast("Settings", "opened"); } }
      ];
      var overlay = document.getElementById("cmd-overlay");
      var cmdInput = document.getElementById("cmd-input");
      var cmdList = document.getElementById("cmd-list");
      var hl = 0;

      function openCmd() { overlay.classList.add("open"); cmdInput.value = ""; hl = 0; renderCmd(); cmdInput.focus(); }
      function closeCmd() { overlay.classList.remove("open"); }
      function renderCmd() {
        var q = cmdInput.value.toLowerCase();
        var matches = CMDS.filter(function (c) { return c.label.toLowerCase().indexOf(q) >= 0; });
        if (hl >= matches.length) hl = Math.max(0, matches.length - 1);
        cmdList.innerHTML = matches.length ? matches.map(function (c, i) {
          return '<div class="cmd-item ' + (i === hl ? "hl" : "") + '" data-i="' + i + '">' + c.label +
            (c.kbd ? '<span class="kbd">' + c.kbd + "</span>" : "") + "</div>";
        }).join("") : '<div class="cmd-empty">No commands found</div>';
        cmdList._matches = matches;
        cmdList.querySelectorAll(".cmd-item").forEach(function (el) {
          el.addEventListener("click", function () { run(parseInt(el.getAttribute("data-i"), 10)); });
        });
      }
      function run(i) { var m = cmdList._matches; if (m && m[i]) { closeCmd(); m[i].run(); } }

      cmdInput.addEventListener("input", function () { hl = 0; renderCmd(); });
      cmdInput.addEventListener("keydown", function (e) {
        var m = cmdList._matches || [];
        if (e.key === "ArrowDown") { e.preventDefault(); hl = (hl + 1) % m.length; renderCmd(); }
        else if (e.key === "ArrowUp") { e.preventDefault(); hl = (hl - 1 + m.length) % m.length; renderCmd(); }
        else if (e.key === "Enter") { e.preventDefault(); run(hl); }
        else if (e.key === "Escape") { closeCmd(); }
      });
      document.getElementById("open-cmd").addEventListener("click", openCmd);
      overlay.addEventListener("click", function (e) { if (e.target === overlay) closeCmd(); });
      document.addEventListener("keydown", function (e) {
        if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); overlay.classList.contains("open") ? closeCmd() : openCmd(); }
      });

      renderTable();
    })();
  </script>
</body>
</html>
