<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Bundle Analyzer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .treemap { display: flex; flex-wrap: wrap; gap: 4px; border: 1px solid var(--border); border-radius: 8px; padding: 6px; background: var(--bg); min-height: 220px; align-content: flex-start; }
    .tile { border-radius: 5px; padding: 0.4rem 0.5rem; font-size: 0.7rem; color: #000; cursor: pointer; overflow: hidden; display: flex; flex-direction: column; justify-content: center; transition: outline 0.12s; }
    .tile:hover { outline: 2px solid #fff; }
    .tile .nm { font-weight: 600; }
    .tile .sz { font-size: 0.62rem; opacity: 0.8; }

    .controls { display: flex; gap: 0.5rem; flex-wrap: wrap; margin-top: 1rem; }
    .controls button { font-family: inherit; font-size: 0.74rem; padding: 0.45rem 0.7rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); cursor: pointer; }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }

    .budget { margin-top: 1rem; }
    .bar { height: 16px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--border); overflow: hidden; position: relative; }
    .bar i { display: block; height: 100%; transition: width 0.4s, background 0.4s; }
    .bar .limit { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
    .blabel { font-size: 0.74rem; margin-top: 0.3rem; }

    .tips { margin-top: 1rem; }
    .tip { font-size: 0.76rem; padding: 0.45rem 0.6rem; border-radius: 6px; border: 1px solid var(--border); margin-bottom: 0.4rem; display: none; }
    .tip.show { display: block; }
    .tip.warn { border-color: var(--amber); color: var(--amber); }
    .tip.ok { border-color: var(--green); color: var(--green); }
  </style>
</head>
<body>
  <h1>Webpack Bundle Analyzer</h1>
  <p class="subtitle">
    <code>webpack-bundle-analyzer</code> renders your bundle as a treemap so you can spot bloat. Click a
    block to "fix" it and watch the size drop under the performance budget.
  </p>

  <section>
    <h2>1 · Bundle treemap (click a block to optimize)</h2>
    <div class="treemap" id="treemap"></div>

    <div class="budget">
      <div class="bar"><i id="bfill"></i><span class="limit" id="blimit"></span></div>
      <div class="blabel" id="blabel"></div>
    </div>

    <div class="controls">
      <button id="reset">↺ Reset bundle</button>
    </div>

    <div class="tips" id="tips"></div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    const BUDGET = 250; // kb
    const COLORS = { vendor: '#a78bfa', app: '#c8ff00', dup: '#ef4444', heavy: '#f59e0b', css: '#60a5fa' };
    let mods;
    function init() {
      mods = [
        { id: 'moment', label: 'moment + all locales', kb: 230, color: 'heavy', fixed: false, tip: 'moment bundles every locale. Switch to day.js (2kb) or use IgnorePlugin to drop locales.' },
        { id: 'lodash', label: 'lodash (full)', kb: 72, color: 'heavy', fixed: false, tip: 'You imported all of lodash. Use lodash-es + named imports so tree shaking keeps only what you use.' },
        { id: 'react', label: 'react + react-dom', kb: 130, color: 'vendor', fixed: false, tip: 'Core dependency — keep, but ensure it is in a cached vendors chunk (Part 8).' },
        { id: 'dup', label: 'duplicate: two semver of axios', kb: 45, color: 'dup', fixed: false, tip: 'Two versions of axios bundled. Dedupe with resolve.alias or npm dedupe.' },
        { id: 'app', label: 'your app code', kb: 60, color: 'app', fixed: false, tip: 'Your code — fine. Could lazy-load heavy routes (Part 6).' },
        { id: 'css', label: 'styles.css', kb: 20, color: 'css', fixed: false, tip: 'CSS — fine. Extracted via MiniCssExtractPlugin.' },
      ];
    }
    init();

    function curKb(m) {
      if (!m.fixed) return m.kb;
      if (m.id === 'moment') return 4;   // dayjs
      if (m.id === 'lodash') return 8;   // tree-shaken
      if (m.id === 'dup') return 22;     // deduped
      return m.kb;
    }

    function render() {
      const tm = $('#treemap'); tm.innerHTML = '';
      const total = mods.reduce((s, m) => s + curKb(m), 0);
      const maxArea = 100000; // arbitrary area scale
      mods.forEach((m) => {
        const kb = curKb(m);
        const el = document.createElement('div');
        el.className = 'tile'; el.dataset.id = m.id;
        const area = Math.max(60, (kb / total) * maxArea);
        const w = Math.max(70, Math.sqrt(area) * 3);
        el.style.flex = `1 1 ${w}px`;
        el.style.minHeight = Math.max(38, kb / 2.2) + 'px';
        el.style.background = COLORS[m.fixed ? 'app' : m.color];
        el.innerHTML = `<span class="nm">${m.label}</span><span class="sz">${kb} kb${m.fixed ? ' ✓' : ''}</span>`;
        tm.appendChild(el);
      });
      // budget bar
      const pct = Math.min(100, (total / (BUDGET * 1.8)) * 100);
      const fill = $('#bfill');
      fill.style.width = pct + '%';
      fill.style.background = total > BUDGET ? 'var(--red)' : total > BUDGET * 0.8 ? 'var(--amber)' : 'var(--green)';
      $('#blimit').style.left = (BUDGET / (BUDGET * 1.8) * 100) + '%';
      $('#blabel').innerHTML = `Bundle: <b style="color:${total > BUDGET ? 'var(--red)' : 'var(--green)'}">${total} kb</b> · budget (maxEntrypointSize): ${BUDGET} kb` +
        (total > BUDGET ? ' — <span style="color:var(--red)">over budget, Webpack warns at build</span>' : ' — <span style="color:var(--green)">within budget ✓</span>');
    }

    function showTip(m) {
      const tips = $('#tips');
      tips.innerHTML = `<div class="tip show ${m.fixed ? 'ok' : 'warn'}">${m.fixed ? '✓ Fixed: ' : '💡 '} ${m.tip}</div>`;
    }

    $('#treemap').addEventListener('click', (e) => {
      const t = e.target.closest('.tile'); if (!t) return;
      const m = mods.find((x) => x.id === t.dataset.id);
      if (['moment', 'lodash', 'dup'].includes(m.id) && !m.fixed) { m.fixed = true; }
      showTip(m); render();
    });
    $('#reset').addEventListener('click', () => { init(); $('#tips').innerHTML = ''; render(); });

    render();
  </script>
</body>
</html>
