<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Loader Pipeline</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 1rem; }
    .tabs button { flex: 1; font-family: inherit; font-size: 0.76rem; padding: 0.5rem 0.3rem; background: var(--bg); color: var(--text-muted); border: none; border-right: 1px solid var(--border); cursor: pointer; }
    .tabs button:last-child { border-right: none; }
    .tabs button.on { background: var(--accent); color: #000; font-weight: 600; }

    .chain { display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .loader { border: 1px solid var(--border); border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.76rem; background: var(--bg); transition: all 0.25s; text-align: center; }
    .loader .sub { font-size: 0.64rem; color: var(--text-subtle); }
    .loader.active { border-color: var(--accent); color: var(--accent); box-shadow: 0 0 14px color-mix(in srgb, var(--accent) 25%, transparent); }
    .loader.done { border-color: var(--green); }
    .arrow { color: var(--text-subtle); }
    .arrow.lit { color: var(--accent); }
    .src { border-color: var(--blue); color: var(--blue); }
    .out { border-color: var(--violet); color: var(--violet); }

    .order { font-size: 0.74rem; color: var(--amber); margin-bottom: 0.6rem; }
    pre.code { font-size: 0.74rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; overflow-x: auto; line-height: 1.6; white-space: pre-wrap; min-height: 120px; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .p { color: var(--violet); }
    .controls { display: flex; gap: 0.5rem; margin: 1rem 0 0.5rem; }
    .controls button { font-family: inherit; font-size: 0.78rem; padding: 0.5rem 0.9rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); cursor: pointer; }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .log { font-size: 0.76rem; color: var(--text-muted); min-height: 22px; margin-top: 0.4rem; }
    .log b { color: var(--accent); }
  </style>
</head>
<body>
  <h1>Webpack Loader Pipeline</h1>
  <p class="subtitle">
    Loaders transform non-JS files into modules Webpack understands. They run as a chain —
    <b>right to left</b> — so order matters. Pick a file type and run the pipeline.
  </p>

  <section>
    <h2>1 · Pick a file type</h2>
    <div class="tabs" id="tabs">
      <button data-t="css" class="on">styles.css</button>
      <button data-t="ts">app.ts</button>
      <button data-t="sass">theme.scss</button>
      <button data-t="img">logo.png</button>
    </div>

    <div class="order" id="order"></div>
    <div class="chain" id="chain"></div>

    <h2 style="margin-top:1rem;">2 · config rule</h2>
    <pre class="code" id="rule"></pre>

    <div class="controls">
      <button id="run">▶ Run the pipeline</button>
    </div>
    <div class="log" id="log">Pick a type and run.</div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    // each pipeline: src label, loaders in CONFIG order (left→right), descriptions, output, rule code
    const PIPES = {
      css: {
        src: 'styles.css',
        loaders: [
          { n: 'style-loader', d: 'injects <style> into DOM' },
          { n: 'css-loader', d: 'resolves @import/url(), → JS' },
        ],
        out: 'JS module',
        rule: `{\n  <span class="p">test</span>: /\\.css$/i,\n  <span class="p">use</span>: [<span class="s">"style-loader"</span>, <span class="s">"css-loader"</span>],\n}`,
      },
      ts: {
        src: 'app.ts',
        loaders: [ { n: 'babel-loader', d: 'TS/JSX → modern JS' } ],
        out: 'JS module',
        rule: `{\n  <span class="p">test</span>: /\\.tsx?$/,\n  <span class="p">use</span>: <span class="s">"babel-loader"</span>,\n  <span class="p">exclude</span>: /node_modules/,\n}`,
      },
      sass: {
        src: 'theme.scss',
        loaders: [
          { n: 'style-loader', d: 'injects <style>' },
          { n: 'css-loader', d: 'resolves imports → JS' },
          { n: 'sass-loader', d: 'Sass → CSS' },
        ],
        out: 'JS module',
        rule: `{\n  <span class="p">test</span>: /\\.scss$/i,\n  <span class="p">use</span>: [<span class="s">"style-loader"</span>, <span class="s">"css-loader"</span>, <span class="s">"sass-loader"</span>],\n}`,
      },
      img: {
        src: 'logo.png',
        loaders: [ { n: 'asset/resource', d: 'emits file, exports URL' } ],
        out: 'URL string',
        rule: `{\n  <span class="p">test</span>: /\\.(png|jpe?g|svg)$/i,\n  <span class="p">type</span>: <span class="s">"asset/resource"</span>, <span class="c">// built-in, no loader needed</span>\n}`,
      },
    };
    let cur = 'css';

    function renderChain() {
      const p = PIPES[cur];
      // execution order = reverse of config order (right→left), except single asset type
      $('#order').innerHTML = p.loaders.length > 1
        ? `⚠ Config lists them left→right, but they <b style="color:var(--amber)">execute right→left</b>: ${[...p.loaders].map(l=>l.n).reverse().join(' → ')}`
        : '';
      const chain = $('#chain'); chain.innerHTML = '';
      const src = document.createElement('div'); src.className = 'loader src'; src.innerHTML = p.src; chain.appendChild(src);
      // show in EXECUTION order (reverse config)
      const exec = [...p.loaders].reverse();
      exec.forEach((l) => {
        const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '→'; chain.appendChild(ar);
        const el = document.createElement('div'); el.className = 'loader'; el.dataset.n = l.n;
        el.innerHTML = `${l.n}<div class="sub">${l.d}</div>`; chain.appendChild(el);
      });
      const ar = document.createElement('span'); ar.className = 'arrow'; ar.textContent = '→'; chain.appendChild(ar);
      const out = document.createElement('div'); out.className = 'loader out'; out.textContent = p.out; chain.appendChild(out);
      $('#rule').innerHTML = p.rule;
      $('#log').textContent = 'Pick a type and run.';
    }

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let running = false;
    async function run() {
      if (running) return; running = true;
      const p = PIPES[cur];
      const exec = [...p.loaders].reverse();
      const arrows = $('#chain').querySelectorAll('.arrow');
      document.querySelectorAll('#chain .loader').forEach((l) => l.classList.remove('active', 'done'));
      $('#chain .src').classList.add('done');
      let txt = p.src;
      for (let i = 0; i < exec.length; i++) {
        arrows[i].classList.add('lit');
        const el = $(`#chain .loader[data-n="${CSS.escape(exec[i].n)}"]`);
        el.classList.add('active');
        $('#log').innerHTML = `<b>${exec[i].n}</b>: ${exec[i].d}`;
        await wait(800);
        el.classList.remove('active'); el.classList.add('done');
      }
      if (arrows[exec.length]) arrows[exec.length].classList.add('lit');
      $('#chain .out').classList.add('done');
      $('#log').innerHTML = `✓ <b>${p.src}</b> is now a <b>${p.out}</b> Webpack can put in the graph.`;
      running = false;
    }

    $('#tabs').addEventListener('click', (e) => {
      const b = e.target.closest('button'); if (!b) return;
      document.querySelectorAll('#tabs button').forEach((x) => x.classList.remove('on'));
      b.classList.add('on'); cur = b.dataset.t;
      document.querySelectorAll('.arrow').forEach((a) => a.classList.remove('lit'));
      renderChain();
    });
    $('#run').addEventListener('click', () => { document.querySelectorAll('.arrow').forEach((a) => a.classList.remove('lit')); run(); });

    renderChain();
  </script>
</body>
</html>
