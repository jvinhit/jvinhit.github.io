<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vite Build Output</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.82rem; color: var(--text-muted); margin-bottom: 0.9rem; }

    .opts { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1rem; }
    .check { display: flex; align-items: center; gap: 0.45rem; font-size: 0.78rem; cursor: pointer; }
    .check input { accent-color: var(--accent); }

    .layout { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }
    .tree { font-size: 0.74rem; line-height: 1.9; }
    .tree .f { display: flex; justify-content: space-between; padding: 0.1rem 0.4rem; border-radius: 4px; }
    .tree .f.js { color: var(--amber); }
    .tree .f.vendor { color: var(--violet); }
    .tree .f.css { color: var(--blue); }
    .tree .f.asset { color: var(--text-muted); }
    .tree .f.html { color: var(--green); }
    .tree .sz { color: var(--text-subtle); font-size: 0.68rem; }
    .tree .dir { color: var(--text-subtle); }

    .bars { display: flex; flex-direction: column; gap: 0.5rem; }
    .bar { font-size: 0.72rem; }
    .bar .lbl { display: flex; justify-content: space-between; margin-bottom: 0.15rem; }
    .bar .track { height: 12px; border-radius: 6px; background: var(--surface-2); overflow: hidden; border: 1px solid var(--border); }
    .bar .track > div { height: 100%; }
    .total { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.6rem; }
    .total b { color: var(--accent); }
    pre.code { font-size: 0.72rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.7rem; white-space: pre; line-height: 1.55; overflow-x: auto; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); }
  </style>
</head>
<body>
  <h1>Vite Build Output</h1>
  <p class="subtitle">
    <code>vite build</code> hands off to Rolldown to produce an optimized <code>dist/</code>. Toggle the options
    and watch the output structure and chunking change.
  </p>

  <section>
    <div class="opts">
      <label class="check"><input type="checkbox" id="vendor" checked /> split vendor chunk</label>
      <label class="check"><input type="checkbox" id="lazy" checked /> lazy-load /dashboard route</label>
      <label class="check"><input type="checkbox" id="sourcemap" /> emit source maps</label>
    </div>
    <div class="layout">
      <div>
        <h2>dist/</h2>
        <div class="tree" id="tree"></div>
        <div class="total">Initial JS the browser must load: <b id="initial">—</b></div>
      </div>
      <div>
        <h2>What loads when</h2>
        <div class="bars" id="bars"></div>
      </div>
    </div>
  </section>

  <section>
    <h2>Controlling chunks (Vite 8 / Rolldown)</h2>
    <pre class="code" id="cfg"></pre>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    ['vendor','lazy','sourcemap'].forEach((id) => $('#' + id).addEventListener('change', render));

    function render() {
      const vendor = $('#vendor').checked;
      const lazy = $('#lazy').checked;
      const sm = $('#sourcemap').checked;

      const files = [];
      files.push({ n: 'index.html', cls: 'html', kb: 1 });
      files.push({ n: 'assets/index-a1b2.js', cls: 'js', kb: vendor ? 38 : 180 });
      if (sm) files.push({ n: 'assets/index-a1b2.js.map', cls: 'asset', kb: 120 });
      files.push({ n: 'assets/index-c3d4.css', cls: 'css', kb: 12 });
      if (vendor) files.push({ n: 'assets/vendor-e5f6.js', cls: 'vendor', kb: 142 });
      if (lazy) {
        files.push({ n: 'assets/Dashboard-7890.js', cls: 'js', kb: 24 });
        files.push({ n: 'assets/Dashboard-7890.css', cls: 'css', kb: 4 });
      }
      files.push({ n: 'assets/logo-1234.svg', cls: 'asset', kb: 3 });

      $('#tree').innerHTML = files.map((f) => `<div class="f ${f.cls}"><span>${f.n}</span><span class="sz">${f.kb} KB</span></div>`).join('');

      // initial load = index.js + vendor + css (not lazy chunks)
      const initial = files.filter((f) => /index-.*\.js$|vendor-.*\.js$|index-.*\.css$/.test(f.n)).reduce((s, f) => s + f.kb, 0);
      $('#initial').textContent = initial + ' KB' + (vendor ? ' (vendor cached separately)' : '');

      const groups = [
        { label: 'Initial load', kb: initial, color: 'var(--accent)' },
        { label: lazy ? 'On /dashboard' : '(no lazy routes)', kb: lazy ? 28 : 0, color: 'var(--blue)' },
      ];
      const max = Math.max(...groups.map((g) => g.kb), 1);
      $('#bars').innerHTML = groups.map((g) => `
        <div class="bar">
          <div class="lbl"><span>${g.label}</span><span>${g.kb} KB</span></div>
          <div class="track"><div style="width:${(g.kb / max) * 100}%;background:${g.color};"></div></div>
        </div>`).join('');

      const L = [];
      L.push(`<span class="c">// vite.config.ts</span>`);
      L.push(`<span class="k">export default</span> defineConfig({`);
      L.push(`  build: {`);
      if (sm) L.push(`    sourcemap: <span class="k">true</span>,`);
      if (vendor) {
        L.push(`    rollupOptions: {`);
        L.push(`      output: {`);
        L.push(`        <span class="c">// classic manualChunks (still supported)</span>`);
        L.push(`        manualChunks: { vendor: [<span class="s">"react"</span>, <span class="s">"react-dom"</span>] },`);
        L.push(`      },`);
        L.push(`    },`);
      }
      L.push(`  },`);
      L.push(`});`);
      if (lazy) {
        L.push('');
        L.push(`<span class="c">// lazy route → its own chunk, fetched on navigation</span>`);
        L.push(`<span class="k">const</span> Dashboard = lazy(() => <span class="k">import</span>(<span class="s">"./routes/Dashboard"</span>));`);
      }
      $('#cfg').innerHTML = L.join('\n');
    }
    render();
  </script>
</body>
</html>
