<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Webpack Plugin Lifecycle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 940px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
    .desc { font-size: 0.84rem; color: var(--text-muted); margin-bottom: 0.9rem; max-width: 72ch; }

    .layout { display: grid; grid-template-columns: 1fr 1.1fr; gap: 1rem; }
    @media (max-width: 760px) { .layout { grid-template-columns: 1fr; } }

    .plugins { }
    .plugin { display: flex; align-items: center; gap: 0.5rem; padding: 0.5rem 0.6rem; border: 1px solid var(--border); border-radius: 6px; margin-bottom: 0.5rem; cursor: pointer; transition: all 0.14s; }
    .plugin:hover { border-color: var(--text-subtle); }
    .plugin.on { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 7%, transparent); }
    .plugin input { accent-color: var(--accent); }
    .plugin .nm { font-size: 0.78rem; }
    .plugin .nm small { display: block; color: var(--text-subtle); font-size: 0.66rem; }

    .timeline { position: relative; padding-left: 1rem; }
    .hook { position: relative; padding: 0.45rem 0 0.45rem 1rem; border-left: 2px solid var(--border); font-size: 0.76rem; }
    .hook::before { content: ""; position: absolute; left: -6px; top: 0.7rem; width: 10px; height: 10px; border-radius: 50%; background: var(--surface-2); border: 1px solid var(--border); }
    .hook.active::before { background: var(--accent); border-color: var(--accent); box-shadow: 0 0 10px var(--accent); }
    .hook .hn { color: var(--text); }
    .hook .taps { margin-top: 0.25rem; }
    .tap { display: inline-block; font-size: 0.66rem; padding: 0.1rem 0.4rem; border-radius: 4px; border: 1px solid var(--green); color: var(--green); margin: 0.1rem 0.2rem 0 0; opacity: 0; transform: translateX(-4px); transition: all 0.2s; }
    .tap.show { opacity: 1; transform: none; }

    .controls { display: flex; gap: 0.5rem; margin-top: 1rem; }
    .controls button { font-family: inherit; font-size: 0.78rem; padding: 0.5rem 0.9rem; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-2); color: var(--text); cursor: pointer; }
    .controls button:hover { border-color: var(--accent); color: var(--accent); }
    .out { margin-top: 1rem; font-size: 0.74rem; }
    .out .f { padding: 0.2rem 0; color: var(--text-muted); }
    .out .f.new { color: var(--green); }
  </style>
</head>
<body>
  <h1>Webpack Plugin Lifecycle</h1>
  <p class="subtitle">
    Plugins tap into <b>hooks</b> across the compilation. Toggle plugins, run the build, and watch each one
    fire at the right hook — then see the extra files they emit.
  </p>

  <section>
    <h2>1 · Plugins & the build timeline</h2>
    <div class="layout">
      <div class="plugins" id="plugins"></div>
      <div class="timeline" id="timeline"></div>
    </div>
    <div class="controls">
      <button id="run">▶ Run build</button>
    </div>
    <div class="out" id="out"></div>
  </section>

  <script>
    const $ = (s) => document.querySelector(s);
    // hooks in order
    const HOOKS = [
      { id: 'environment', n: 'environment / afterPlugins' },
      { id: 'compile', n: 'compile — compilation starts' },
      { id: 'make', n: 'make — build module graph' },
      { id: 'emit', n: 'emit — assets ready, before writing' },
      { id: 'afterEmit', n: 'afterEmit — files written to dist/' },
      { id: 'done', n: 'done — build complete' },
    ];
    // plugins, with the hook they primarily tap and files they add
    const PLUGINS = {
      html: { nm: 'HtmlWebpackPlugin', sub: 'generates index.html with <script> injected', hook: 'emit', files: ['index.html'], on: true },
      define: { nm: 'DefinePlugin', sub: 'replaces process.env.NODE_ENV at compile time', hook: 'compile', files: [], on: true },
      minicss: { nm: 'MiniCssExtractPlugin', sub: 'extracts CSS into a real .css file', hook: 'emit', files: ['main.css'], on: false },
      banner: { nm: 'BannerPlugin', sub: 'prepends a license comment to bundles', hook: 'emit', files: [], on: false },
      progress: { nm: 'ProgressPlugin', sub: 'reports build progress to the console', hook: 'make', files: [], on: false },
      copy: { nm: 'CopyWebpackPlugin', sub: 'copies static files (favicon, robots.txt)', hook: 'emit', files: ['favicon.ico', 'robots.txt'], on: false },
    };

    function renderPlugins() {
      const box = $('#plugins'); box.innerHTML = '';
      Object.entries(PLUGINS).forEach(([id, p]) => {
        const el = document.createElement('label');
        el.className = 'plugin' + (p.on ? ' on' : '');
        el.innerHTML = `<input type="checkbox" data-id="${id}" ${p.on ? 'checked' : ''}/><span class="nm">${p.nm}<small>${p.sub}</small></span>`;
        box.appendChild(el);
      });
    }
    function renderTimeline() {
      const tl = $('#timeline'); tl.innerHTML = '';
      HOOKS.forEach((h) => {
        const taps = Object.entries(PLUGINS).filter(([id, p]) => p.on && p.hook === h.id).map(([id, p]) => p.nm);
        const el = document.createElement('div');
        el.className = 'hook'; el.dataset.hook = h.id;
        el.innerHTML = `<span class="hn">${h.n}</span><div class="taps">${taps.map((t) => `<span class="tap">${t}</span>`).join('')}</div>`;
        tl.appendChild(el);
      });
    }

    $('#plugins').addEventListener('change', (e) => {
      const cb = e.target.closest('input'); if (!cb) return;
      PLUGINS[cb.dataset.id].on = cb.checked;
      cb.closest('.plugin').classList.toggle('on', cb.checked);
      renderTimeline();
      $('#out').innerHTML = '';
    });

    const wait = (ms) => new Promise((r) => setTimeout(r, ms));
    let running = false;
    async function run() {
      if (running) return; running = true;
      $('#out').innerHTML = '';
      document.querySelectorAll('.hook').forEach((h) => h.classList.remove('active'));
      document.querySelectorAll('.tap').forEach((t) => t.classList.remove('show'));
      for (const h of HOOKS) {
        const el = $(`.hook[data-hook="${h.id}"]`);
        el.classList.add('active');
        el.querySelectorAll('.tap').forEach((t, i) => setTimeout(() => t.classList.add('show'), 150 * (i + 1)));
        await wait(750);
        el.classList.remove('active');
      }
      // output files
      const files = ['main.js'];
      Object.values(PLUGINS).forEach((p) => { if (p.on) files.push(...p.files); });
      const out = $('#out');
      out.innerHTML = '<div style="color:var(--accent);margin-bottom:0.3rem;">dist/ output:</div>' +
        [...new Set(files)].map((f) => `<div class="f${f === 'main.js' ? '' : ' new'}">${f === 'main.js' ? '📦' : '✚'} ${f}</div>`).join('');
      running = false;
    }
    $('#run').addEventListener('click', run);

    renderPlugins();
    renderTimeline();
  </script>
</body>
</html>
