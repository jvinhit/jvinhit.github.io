<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js — Lights &amp; Shadows</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --blue: #60a5fa; --amber: #f59e0b;
      --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
    body { padding: 1rem; max-width: 960px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; max-width: 72ch; }
    .stage-wrap { position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #050505; }
    #scene { display: block; width: 100%; height: 380px; }
    .hud { position: absolute; top: 0.5rem; left: 0.5rem; font-size: 0.6875rem; color: var(--text-muted); background: color-mix(in srgb, var(--bg) 78%, transparent); border: 1px solid var(--border); border-radius: 5px; padding: 0.4rem 0.55rem; pointer-events: none; line-height: 1.6; white-space: pre; }
    .hud b { color: var(--accent); }
    .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0.875rem 1rem; margin-top: 1rem; }
    .panel h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    .group-label { font-size: 0.6875rem; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin: 0.75rem 0 0.4rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    button { font-family: inherit; font-size: 0.75rem; font-weight: 500; padding: 0.35rem 0.7rem; border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text); cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s; }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 0.6rem 1.5rem; margin-top: 0.875rem; }
    .slider-row { display: flex; align-items: center; gap: 0.75rem; font-size: 0.8125rem; color: var(--text-muted); }
    .slider-row label { flex-shrink: 0; min-width: 7rem; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .slider-row .num { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 3rem; text-align: right; }
    .note { font-size: 0.75rem; color: var(--text-subtle); margin-top: 0.875rem; max-width: 74ch; }
    .note code { color: var(--text-muted); }
  </style>
</head>
<body>
  <h1>Lights &amp; Shadows</h1>
  <p class="subtitle">Flat lighting screams "beginner". Pick a light type, drive its intensity and position, and switch real-time shadow maps on — then watch the cost in the draw-call readout.</p>

  <div class="stage-wrap">
    <canvas id="scene"></canvas>
    <div class="hud" id="hud">booting…</div>
  </div>

  <div class="panel">
    <h2>Light rig</h2>
    <p class="group-label">Primary light type</p>
    <div class="chips" id="lightChips"></div>

    <div class="controls">
      <div class="slider-row">
        <label for="intensity">Intensity</label>
        <input type="range" id="intensity" min="0" max="6" step="0.1" value="2.5" />
        <span class="num" id="intensityNum">2.5</span>
      </div>
      <div class="slider-row">
        <label for="ambient">Ambient fill</label>
        <input type="range" id="ambient" min="0" max="2" step="0.05" value="0.3" />
        <span class="num" id="ambientNum">0.30</span>
      </div>
      <div class="slider-row">
        <label for="angle">Light angle</label>
        <input type="range" id="angle" min="0" max="360" step="1" value="45" />
        <span class="num" id="angleNum">45°</span>
      </div>
      <div class="slider-row">
        <label for="height">Light height</label>
        <input type="range" id="height" min="1" max="10" step="0.1" value="6" />
        <span class="num" id="heightNum">6.0</span>
      </div>
    </div>

    <div class="chips" style="margin-top:0.875rem">
      <button type="button" id="shadows" aria-pressed="true">Shadows on</button>
      <button type="button" id="helper" aria-pressed="true">Light helper</button>
      <button type="button" id="spin" aria-pressed="true">Orbit lights</button>
    </div>

    <p class="note" id="lightNote"></p>
  </div>

  <script type="importmap">
  { "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.185.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.185.0/examples/jsm/"
  } }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const hud = document.getElementById('hud');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070707);
    const camera = new THREE.PerspectiveCamera(50, 2, 0.1, 100);
    camera.position.set(6, 5, 8);

    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFShadowMap;

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.target.set(0, 0.5, 0);

    // Ground that receives shadows.
    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(20, 20),
      new THREE.MeshStandardMaterial({ color: 0x1a1a1a, roughness: 0.9 })
    );
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = -0.01;
    ground.receiveShadow = true;
    scene.add(ground);

    // A few casters.
    const casters = [];
    const palette = [0xc8ff00, 0x60a5fa, 0xf59e0b];
    [[-2, 0.8, 0], [0, 1.1, -1.5], [2.2, 0.6, 1]].forEach((p, i) => {
      const m = new THREE.Mesh(
        i === 1 ? new THREE.IcosahedronGeometry(1.1, 0) : new THREE.SphereGeometry(0.8, 32, 24),
        new THREE.MeshStandardMaterial({ color: palette[i], roughness: 0.45, metalness: 0.1 })
      );
      m.position.set(p[0], p[1], p[2]);
      m.castShadow = true;
      m.receiveShadow = true;
      scene.add(m);
      casters.push(m);
    });

    const ambient = new THREE.AmbientLight(0xffffff, 0.3);
    scene.add(ambient);

    // ── Swappable primary light.
    let light = null;
    let helper = null;
    const state = { type: 'Directional', intensity: 2.5, angle: 45, height: 6, shadows: true, helper: true, spin: true };

    const notes = {
      Directional: 'DirectionalLight: parallel rays from one direction, like the sun. Shadows are crisp and use an orthographic shadow camera. The default key light.',
      Point: 'PointLight: radiates in all directions from a point, like a bulb. Intensity falls off with distance. Shadows use 6 cube faces — pricier.',
      Spot: 'SpotLight: a cone from a point toward a target — stage spotlight, flashlight. Has angle, penumbra, and falloff.',
      Hemisphere: 'HemisphereLight: sky color above, ground color below — cheap, soft outdoor ambient. Casts no shadows.',
    };

    function buildLight() {
      if (light) { scene.remove(light); if (light.target) scene.remove(light.target); }
      if (helper) { scene.remove(helper); helper = null; }

      switch (state.type) {
        case 'Point':
          light = new THREE.PointLight(0xffffff, state.intensity * 12, 60);
          break;
        case 'Spot':
          light = new THREE.SpotLight(0xffffff, state.intensity * 10, 60, Math.PI / 6, 0.3);
          scene.add(light.target);
          break;
        case 'Hemisphere':
          light = new THREE.HemisphereLight(0x88bbff, 0x332200, state.intensity);
          break;
        default:
          light = new THREE.DirectionalLight(0xffffff, state.intensity);
      }

      const canCastShadow = state.type === 'Directional' || state.type === 'Point' || state.type === 'Spot';
      if (canCastShadow) {
        light.castShadow = state.shadows;
        light.shadow.mapSize.set(1024, 1024);
        if (light.shadow.camera.isOrthographicCamera) {
          const c = light.shadow.camera;
          c.left = -8; c.right = 8; c.top = 8; c.bottom = -8; c.updateProjectionMatrix();
        }
      }
      positionLight();
      scene.add(light);
      buildHelper();
      document.getElementById('lightNote').textContent = notes[state.type];
    }

    function positionLight() {
      const a = THREE.MathUtils.degToRad(state.angle);
      const r = 6;
      const x = Math.cos(a) * r, z = Math.sin(a) * r;
      if (state.type === 'Hemisphere') { light.position.set(0, state.height, 0); return; }
      light.position.set(x, state.height, z);
    }

    function buildHelper() {
      if (helper) { scene.remove(helper); helper = null; }
      if (!state.helper) return;
      if (state.type === 'Directional') helper = new THREE.DirectionalLightHelper(light, 1, 0xffffff);
      else if (state.type === 'Point') helper = new THREE.PointLightHelper(light, 0.4, 0xffffff);
      else if (state.type === 'Spot') helper = new THREE.SpotLightHelper(light);
      else helper = new THREE.HemisphereLightHelper(light, 1);
      scene.add(helper);
    }

    let viewW = 0, viewH = 0, viewDpr = 0;
    function resize() {
      const w = Math.round(canvas.clientWidth), h = Math.round(canvas.clientHeight);
      const dpr = Math.min(devicePixelRatio || 1, 2);
      if (!w || !h || (w === viewW && h === viewH && dpr === viewDpr)) return;
      viewW = w; viewH = h; viewDpr = dpr;
      renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
      camera.aspect = w / h; camera.updateProjectionMatrix();
    }

    let t = 0;
    const timer = new THREE.Timer();
    timer.connect(document);
    function tick() {
      timer.update();
      const dt = timer.getDelta();
      if (state.spin) { t += dt * 0.5; }
      if (state.spin && state.type !== 'Hemisphere') {
        const r = 6;
        light.position.x = Math.cos(THREE.MathUtils.degToRad(state.angle) + t) * r;
        light.position.z = Math.sin(THREE.MathUtils.degToRad(state.angle) + t) * r;
      }
      casters.forEach((c, i) => { c.rotation.y += dt * (0.3 + i * 0.1); });
      if (helper && helper.update) helper.update();
      resize();
      controls.update();
      renderer.render(scene, camera);
      hud.textContent =
        'light: ' + state.type + '\n' +
        'shadows: ' + (state.shadows ? 'on' : 'off') + '\n' +
        'draw calls: ' + renderer.info.render.calls;
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // chips
    const box = document.getElementById('lightChips');
    ['Directional', 'Point', 'Spot', 'Hemisphere'].forEach((name) => {
      const btn = document.createElement('button');
      btn.type = 'button'; btn.textContent = name;
      btn.setAttribute('aria-pressed', String(state.type === name));
      btn.addEventListener('click', () => {
        state.type = name;
        box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
        buildLight();
      });
      box.appendChild(btn);
    });

    function bind(id, key, fmt, apply) {
      const el = document.getElementById(id), num = document.getElementById(id + 'Num');
      el.addEventListener('input', () => {
        state[key] = Number(el.value);
        num.textContent = fmt(state[key]);
        apply();
      });
    }
    bind('intensity', 'intensity', (v) => v.toFixed(1), () => {
      if (state.type === 'Point') light.intensity = state.intensity * 12;
      else if (state.type === 'Spot') light.intensity = state.intensity * 10;
      else light.intensity = state.intensity;
    });
    bind('ambient', 'ambientV', (v) => v.toFixed(2), () => { ambient.intensity = state.ambientV; });
    state.ambientV = 0.3;
    bind('angle', 'angle', (v) => v + '°', positionLight);
    bind('height', 'height', (v) => v.toFixed(1), positionLight);

    function toggle(id, fn) {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(next));
        fn(next);
      });
    }
    toggle('shadows', (on) => { state.shadows = on; buildLight(); });
    toggle('helper', (on) => { state.helper = on; buildHelper(); });
    toggle('spin', (on) => { state.spin = on; });

    buildLight();
  </script>
</body>
</html>
