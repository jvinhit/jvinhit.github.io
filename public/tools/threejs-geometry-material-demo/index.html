<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Three.js — Geometries &amp; Materials</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --blue: #60a5fa; --amber: #f59e0b;
      --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body {
      background: var(--bg); color: var(--text);
      font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    }
    body { padding: 1rem; max-width: 960px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); letter-spacing: 0.04em; text-transform: uppercase; margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1rem; max-width: 70ch; }
    .stage-wrap { position: relative; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #050505; }
    #scene { display: block; width: 100%; height: 380px; }
    .hud {
      position: absolute; top: 0.5rem; left: 0.5rem; font-size: 0.6875rem; color: var(--text-muted);
      background: color-mix(in srgb, var(--bg) 78%, transparent); border: 1px solid var(--border);
      border-radius: 5px; padding: 0.4rem 0.55rem; pointer-events: none; line-height: 1.7;
    }
    .hud b { color: var(--accent); font-weight: 600; }
    .panel { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 0.875rem 1rem; margin-top: 1rem; }
    .panel h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.5rem; }
    .group-label { font-size: 0.6875rem; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin: 0.75rem 0 0.4rem; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.4rem; }
    button {
      font-family: inherit; font-size: 0.75rem; font-weight: 500; padding: 0.35rem 0.7rem;
      border: 1px solid var(--border); border-radius: 5px; background: var(--bg); color: var(--text);
      cursor: pointer; transition: border-color 0.15s, color 0.15s, background 0.15s;
    }
    button:hover { border-color: var(--accent); color: var(--accent); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--bg)); }
    .controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.6rem 1.5rem; margin-top: 0.875rem; }
    .slider-row { display: flex; align-items: center; gap: 0.75rem; font-size: 0.8125rem; color: var(--text-muted); }
    .slider-row label { flex-shrink: 0; min-width: 6rem; }
    .slider-row input[type="range"] { flex: 1; accent-color: var(--accent); cursor: pointer; }
    .slider-row .num { color: var(--accent); font-variant-numeric: tabular-nums; min-width: 2.5rem; text-align: right; }
    .row { display: flex; flex-wrap: wrap; align-items: center; gap: 0.75rem; margin-top: 0.875rem; }
    .row label { font-size: 0.8125rem; color: var(--text-muted); }
    input[type="color"] { width: 38px; height: 26px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg); cursor: pointer; padding: 2px; }
    .note { font-size: 0.75rem; color: var(--text-subtle); margin-top: 0.875rem; max-width: 72ch; }
    .note code { color: var(--text-muted); }
    .lit-warning { color: var(--amber); }
  </style>
</head>
<body>
  <h1>Geometries &amp; Materials</h1>
  <p class="subtitle">A mesh is <b style="color:var(--blue)">geometry</b> (the shape) + <b style="color:var(--blue)">material</b> (the surface). Swap each independently and watch how light, metalness, and roughness change the look.</p>

  <div class="stage-wrap">
    <canvas id="scene"></canvas>
    <div class="hud" id="hud">booting…</div>
  </div>

  <div class="panel">
    <h2>Build a mesh</h2>

    <p class="group-label">Geometry</p>
    <div class="chips" id="geoChips"></div>

    <p class="group-label">Material</p>
    <div class="chips" id="matChips"></div>

    <div class="controls">
      <div class="slider-row">
        <label for="metal">Metalness</label>
        <input type="range" id="metal" min="0" max="1" step="0.01" value="0.1" />
        <span class="num" id="metalNum">0.10</span>
      </div>
      <div class="slider-row">
        <label for="rough">Roughness</label>
        <input type="range" id="rough" min="0" max="1" step="0.01" value="0.35" />
        <span class="num" id="roughNum">0.35</span>
      </div>
    </div>

    <div class="row">
      <label for="color">Color</label>
      <input type="color" id="color" value="#c8ff00" />
      <button type="button" id="wire" aria-pressed="false">Wireframe</button>
      <button type="button" id="light" aria-pressed="true">Lights on</button>
      <button type="button" id="spin" aria-pressed="true">Auto-rotate</button>
    </div>

    <p class="note" id="matNote"></p>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const canvas = document.getElementById('scene');
    const hud = document.getElementById('hud');

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050505);
    const camera = new THREE.PerspectiveCamera(55, 2, 0.1, 100);
    camera.position.set(2.5, 1.8, 3.5);
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    const key = new THREE.DirectionalLight(0xffffff, 2.4);
    key.position.set(4, 6, 3);
    const rim = new THREE.DirectionalLight(0x88aaff, 1.0);
    rim.position.set(-4, 2, -3);
    const ambient = new THREE.AmbientLight(0x404040, 1.2);
    scene.add(key, rim, ambient);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;

    // ── Geometry factory.
    const geometries = {
      Box: () => new THREE.BoxGeometry(1.6, 1.6, 1.6),
      Sphere: () => new THREE.SphereGeometry(1.1, 48, 32),
      Torus: () => new THREE.TorusGeometry(1, 0.4, 24, 64),
      'Torus Knot': () => new THREE.TorusKnotGeometry(0.85, 0.3, 128, 24),
      Cone: () => new THREE.ConeGeometry(1.1, 1.8, 48),
      Cylinder: () => new THREE.CylinderGeometry(0.9, 0.9, 1.8, 48),
      Icosahedron: () => new THREE.IcosahedronGeometry(1.2, 0),
    };

    // ── Material factory. Each takes the current color.
    const materials = {
      Basic: (c) => new THREE.MeshBasicMaterial({ color: c }),
      Lambert: (c) => new THREE.MeshLambertMaterial({ color: c }),
      Phong: (c) => new THREE.MeshPhongMaterial({ color: c, shininess: 80 }),
      Standard: (c) => new THREE.MeshStandardMaterial({ color: c, metalness: state.metal, roughness: state.rough }),
      Physical: (c) => new THREE.MeshPhysicalMaterial({ color: c, metalness: state.metal, roughness: state.rough, clearcoat: 1, clearcoatRoughness: 0.2 }),
      Normal: () => new THREE.MeshNormalMaterial(),
    };

    const matNotes = {
      Basic: 'MeshBasicMaterial ignores light entirely — flat color, always fully lit. Toggle lights off: it does not change.',
      Lambert: 'MeshLambertMaterial does cheap per-vertex diffuse lighting. Good for matte, non-shiny surfaces.',
      Phong: 'MeshPhongMaterial adds specular highlights (shininess) — the classic shiny plastic look.',
      Standard: 'MeshStandardMaterial is physically-based (PBR): drive it with metalness + roughness. The modern default.',
      Physical: 'MeshPhysicalMaterial extends Standard with clearcoat, transmission, sheen — for car paint, glass, fabric.',
      Normal: 'MeshNormalMaterial maps surface normals to RGB. A debugging tool — instantly shows geometry orientation.',
    };

    const state = {
      geo: 'Torus Knot', mat: 'Standard', color: '#c8ff00',
      metal: 0.1, rough: 0.35, wire: false, spin: true,
    };

    let mesh = null;
    function rebuild() {
      if (mesh) {
        mesh.geometry.dispose();
        mesh.material.dispose();
        scene.remove(mesh);
      }
      const geo = geometries[state.geo]();
      const mat = materials[state.mat](new THREE.Color(state.color));
      mat.wireframe = state.wire;
      mesh = new THREE.Mesh(geo, mat);
      scene.add(mesh);
      document.getElementById('matNote').textContent = matNotes[state.mat];
    }

    function resize() {
      const w = canvas.clientWidth, h = canvas.clientHeight;
      if (canvas.width !== w || canvas.height !== h) {
        renderer.setSize(w, h, false);
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
      }
    }

    const clock = new THREE.Clock();
    function tick() {
      const dt = clock.getDelta();
      if (state.spin && mesh) { mesh.rotation.y += dt * 0.6; mesh.rotation.x += dt * 0.25; }
      resize();
      controls.update();
      renderer.render(scene, camera);
      const vtx = mesh ? mesh.geometry.attributes.position.count : 0;
      hud.innerHTML = state.geo + ' · ' + state.mat + '<br>vertices: <b>' + vtx + '</b> · tris: <b>' +
        (mesh && mesh.geometry.index ? mesh.geometry.index.count / 3 : vtx / 3).toFixed(0) + '</b>';
      requestAnimationFrame(tick);
    }

    // ── Build chip buttons.
    function buildChips(containerId, names, key) {
      const box = document.getElementById(containerId);
      names.forEach((name) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = name;
        btn.setAttribute('aria-pressed', String(state[key] === name));
        btn.addEventListener('click', () => {
          state[key] = name;
          box.querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          rebuild();
        });
        box.appendChild(btn);
      });
    }
    buildChips('geoChips', Object.keys(geometries), 'geo');
    buildChips('matChips', Object.keys(materials), 'mat');

    const metal = document.getElementById('metal'), metalNum = document.getElementById('metalNum');
    metal.addEventListener('input', () => { state.metal = Number(metal.value); metalNum.textContent = state.metal.toFixed(2); if (mesh && 'metalness' in mesh.material) mesh.material.metalness = state.metal; });
    const rough = document.getElementById('rough'), roughNum = document.getElementById('roughNum');
    rough.addEventListener('input', () => { state.rough = Number(rough.value); roughNum.textContent = state.rough.toFixed(2); if (mesh && 'roughness' in mesh.material) mesh.material.roughness = state.rough; });

    document.getElementById('color').addEventListener('input', (e) => {
      state.color = e.target.value;
      if (mesh && mesh.material.color) mesh.material.color.set(state.color);
    });

    function toggle(id, fn) {
      const btn = document.getElementById(id);
      btn.addEventListener('click', () => {
        const next = btn.getAttribute('aria-pressed') !== 'true';
        btn.setAttribute('aria-pressed', String(next));
        fn(next);
      });
    }
    toggle('wire', (on) => { state.wire = on; if (mesh) mesh.material.wireframe = on; });
    toggle('light', (on) => { key.visible = on; rim.visible = on; ambient.visible = on; });
    toggle('spin', (on) => { state.spin = on; });

    rebuild();
    requestAnimationFrame(tick);
  </script>
</body>
</html>
