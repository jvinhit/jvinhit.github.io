<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>vite.config.ts Builder</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0a0a0a; --surface: #111; --surface-2: #161616; --border: #2a2a2a;
      --accent: #c8ff00; --green: #34d399; --red: #ef4444; --blue: #60a5fa;
      --amber: #f59e0b; --violet: #a78bfa; --text: #e5e5e5; --text-muted: #888; --text-subtle: #555;
    }
    html, body { background: var(--bg); color: var(--text); font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 16px; line-height: 1.5; }
    body { padding: 1rem; max-width: 980px; margin-inline: auto; }
    h1 { font-size: 1.125rem; font-weight: 600; color: var(--accent); margin-bottom: 0.25rem; }
    .subtitle { font-size: 1rem; color: var(--text-muted); margin-bottom: 1.25rem; max-width: 64ch; }
    section { border: 1px solid var(--border); border-radius: 8px; background: var(--surface); padding: 1rem; margin-bottom: 1rem; }
    h2 { font-size: 0.8125rem; font-weight: 600; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.6rem; }

    .layout { display: grid; grid-template-columns: 1fr 1.15fr; gap: 1rem; }
    @media (max-width: 820px) { .layout { grid-template-columns: 1fr; } }

    .grp { margin-bottom: 0.9rem; }
    .grp h3 { font-size: 0.7rem; color: var(--text-subtle); text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.4rem; }
    .row { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; font-size: 0.78rem; }
    .row label { display: flex; align-items: center; gap: 0.45rem; cursor: pointer; flex: 1; }
    .row input[type=checkbox] { accent-color: var(--accent); }
    .row input[type=text], .row input[type=number], .row select { font-family: inherit; font-size: 0.74rem; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 5px; padding: 0.25rem 0.45rem; width: 120px; }
    .row input:focus, .row select:focus { outline: none; border-color: var(--accent); }
    .hint { font-size: 0.66rem; color: var(--text-subtle); }

    pre.code { font-size: 0.74rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.8rem; overflow-x: auto; line-height: 1.6; white-space: pre; max-height: 560px; overflow-y: auto; }
    pre.code .k { color: var(--blue); } pre.code .s { color: var(--green); } pre.code .c { color: var(--text-subtle); } pre.code .p { color: var(--violet); }
    .copy { float: right; font-size: 0.68rem; padding: 0.2rem 0.6rem; background: var(--surface-2); color: var(--text-muted); border: 1px solid var(--border); border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>vite.config.ts Builder</h1>
  <p class="subtitle">
    Toggle the options you actually reach for and watch a real, idiomatic <code>vite.config.ts</code> assemble
    itself — each field labelled with what it does.
  </p>

  <div class="layout">
    <section>
      <h2>Options</h2>

      <div class="grp">
        <h3>Framework plugin</h3>
        <div class="row"><label><input type="radio" name="fw" value="none" /> none (vanilla)</label></div>
        <div class="row"><label><input type="radio" name="fw" value="react" checked /> @vitejs/plugin-react</label></div>
        <div class="row"><label><input type="radio" name="fw" value="vue" /> @vitejs/plugin-vue</label></div>
      </div>

      <div class="grp">
        <h3>Project</h3>
        <div class="row"><label><input type="checkbox" id="base" /> base (deploy sub-path)</label><input type="text" id="baseVal" value="/app/" /></div>
        <div class="row"><label><input type="checkbox" id="alias" checked /> resolve.alias @ → /src</label></div>
      </div>

      <div class="grp">
        <h3>Dev server</h3>
        <div class="row"><label><input type="checkbox" id="port" checked /> server.port</label><input type="number" id="portVal" value="3000" /></div>
        <div class="row"><label><input type="checkbox" id="open" /> server.open (launch browser)</label></div>
        <div class="row"><label><input type="checkbox" id="proxy" /> server.proxy /api → backend</label></div>
      </div>

      <div class="grp">
        <h3>Build</h3>
        <div class="row"><label><input type="checkbox" id="sourcemap" /> build.sourcemap</label></div>
        <div class="row"><label><input type="checkbox" id="outDir" /> build.outDir</label><input type="text" id="outDirVal" value="build" /></div>
        <div class="row"><label><input type="checkbox" id="chunks" /> manual vendor chunk</label></div>
      </div>

      <div class="grp">
        <h3>Other</h3>
        <div class="row"><label><input type="checkbox" id="define" /> define global constant</label></div>
        <div class="row"><label><input type="checkbox" id="css" /> css.modules camelCase</label></div>
      </div>
    </section>

    <section>
      <h2>vite.config.ts <button class="copy" id="copy">copy</button></h2>
      <pre class="code" id="out"></pre>
    </section>
  </div>

  <script>
    const $ = (s) => document.querySelector(s);
    const all = ['base','baseVal','alias','port','portVal','open','proxy','sourcemap','outDir','outDirVal','chunks','define','css'];
    all.forEach((id) => $('#' + id).addEventListener('input', render));
    document.querySelectorAll('input[name=fw]').forEach((r) => r.addEventListener('change', render));

    function render() {
      const fw = document.querySelector('input[name=fw]:checked').value;
      const c = (id) => $('#' + id).checked;
      const v = (id) => $('#' + id).value;
      const L = [];
      const imports = [`<span class="k">import</span> { defineConfig } <span class="k">from</span> <span class="s">"vite"</span>;`];
      if (fw === 'react') imports.push(`<span class="k">import</span> react <span class="k">from</span> <span class="s">"@vitejs/plugin-react"</span>;`);
      if (fw === 'vue') imports.push(`<span class="k">import</span> vue <span class="k">from</span> <span class="s">"@vitejs/plugin-vue"</span>;`);
      if (c('alias')) imports.push(`<span class="k">import</span> { fileURLToPath, URL } <span class="k">from</span> <span class="s">"node:url"</span>;`);
      L.push(imports.join('\n'));
      L.push('');
      L.push(`<span class="k">export default</span> defineConfig({`);

      const plugins = [];
      if (fw === 'react') plugins.push('react()');
      if (fw === 'vue') plugins.push('vue()');
      L.push(`  plugins: [${plugins.join(', ')}],`);

      if (c('base')) L.push(`  base: <span class="s">"${v('baseVal')}"</span>, <span class="c">// served under a sub-path</span>`);

      if (c('alias')) {
        L.push(`  resolve: {`);
        L.push(`    alias: { <span class="s">"@"</span>: fileURLToPath(<span class="k">new</span> URL(<span class="s">"./src"</span>, import.meta.url)) },`);
        L.push(`  },`);
      }

      if (c('define')) L.push(`  define: { __APP_VERSION__: <span class="p">JSON</span>.stringify(<span class="s">"1.0.0"</span>) },`);

      if (c('css')) {
        L.push(`  css: {`);
        L.push(`    modules: { localsConvention: <span class="s">"camelCase"</span> },`);
        L.push(`  },`);
      }

      const server = [];
      if (c('port')) server.push(`    port: ${v('portVal')},`);
      if (c('open')) server.push(`    open: <span class="k">true</span>,`);
      if (c('proxy')) {
        server.push(`    proxy: {`);
        server.push(`      <span class="s">"/api"</span>: { target: <span class="s">"http://localhost:8080"</span>, changeOrigin: <span class="k">true</span> },`);
        server.push(`    },`);
      }
      if (server.length) { L.push(`  server: {`); server.forEach((s) => L.push(s)); L.push(`  },`); }

      const build = [];
      if (c('sourcemap')) build.push(`    sourcemap: <span class="k">true</span>,`);
      if (c('outDir')) build.push(`    outDir: <span class="s">"${v('outDirVal')}"</span>,`);
      if (c('chunks')) {
        build.push(`    rollupOptions: {`);
        build.push(`      output: { manualChunks: { vendor: [<span class="s">"react"</span>, <span class="s">"react-dom"</span>] } },`);
        build.push(`    },`);
      }
      if (build.length) { L.push(`  build: {`); build.forEach((b) => L.push(b)); L.push(`  },`); }

      L.push(`});`);
      $('#out').innerHTML = L.join('\n');
    }

    $('#copy').addEventListener('click', () => {
      const txt = $('#out').textContent;
      navigator.clipboard?.writeText(txt);
      $('#copy').textContent = 'copied!';
      setTimeout(() => ($('#copy').textContent = 'copy'), 1200);
    });

    render();
  </script>
</body>
</html>
